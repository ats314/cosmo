name: check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Allow one deploy at a time; let an in-flight run finish rather than
# cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/check.mjs
      # Loads the game in a stubbed DOM, plays several simulated minutes of
      # input, death and retry — catches the runtime errors a parse cannot.
      - run: node tools/smoke.mjs

  deploy:
    # Only main publishes; pull requests get the check alone.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      # A permissions block replaces the defaults rather than adding to them,
      # so contents:read has to be spelled out — without it checkout cannot
      # clone a private repo and fails with "Repository not found".
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # enablement turns Pages on via the API if it is not already, so a
      # fresh clone of this repo deploys without anyone visiting Settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4

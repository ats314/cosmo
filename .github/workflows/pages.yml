name: check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SEED: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Keep explicit harness steps: tools/all.mjs reads this list.
      - run: node tools/check.mjs
      - run: node tools/smoke.mjs
      - run: node tools/dropcheck.mjs
      - run: node tools/curriculum.mjs
      - run: node tools/musiccheck.mjs
      - run: node tools/fxcheck.mjs
      - run: node tools/drawcheck.mjs
      - run: node tools/rendercheck.mjs
      - run: node tools/enginecheck.mjs
      - run: node tools/flightcheck.mjs
      # Ship the exact bundle that passed every check. Do not rebuild in deploy.
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deploy
        uses: actions/deploy-pages@v4

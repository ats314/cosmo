name: check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Allow one deploy at a time; let an in-flight run finish rather than
# cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/check.mjs
      # Loads the game in a stubbed DOM, plays several simulated minutes of
      # input, death and retry — catches the runtime errors a parse cannot.
      - run: node tools/smoke.mjs
      # Same harness with a stubbed AudioContext: asserts the build meter
      # actually delivers drops at a playable cadence.
      - run: node tools/dropcheck.mjs
      # Plays the whole run headlessly and fails if level 3 ever opens with
      # a mechanic left untaught — the curriculum rule, enforced.
      - run: node tools/curriculum.mjs
      # The only harness that runs the arrangement. smoke.mjs removes WebAudio
      # on purpose and dropcheck.mjs never drives past level 2, so before this
      # existed the per-level songs had no coverage at all: deleting level 4's
      # riff and solo rows left all four checks green and crashed the browser.
      - run: node tools/musiccheck.mjs
      # The only harness that runs the RENDER path. The other five stub the
      # canvas and WebGL away, so the whole draw layer is uncovered by
      # construction — which is how thirteen black hole features shipped with
      # one of them visible. This stubs WebGL as a recording fake instead:
      # shaders compile, framebuffers complete, and it asserts on what was
      # actually issued. It catches the class of bug nothing else can — a
      # mistyped uniform name, where getUniformLocation returns null and every
      # write through it is a silent no-op that removes an effect from the game.
      - run: node tools/fxcheck.mjs

  deploy:
    # Only main publishes; pull requests get the check alone.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      # A permissions block replaces the defaults rather than adding to them,
      # so contents:read has to be spelled out — without it checkout cannot
      # clone a private repo and fails with "Repository not found".
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Stamp the deployed page with the commit it was built from. The source
      # says 'dev'; only the published artifact carries the sha, so the game
      # itself stays a single hand-written file with no build step — this is
      # a label on the box, not a compiler. The stamp is drawn faintly on the
      # title screen and readable as window.COSMO_BUILD, which ends the
      # unanswerable argument about which version a screenshot came from.
      - run: sed -i "s/const BUILD='dev'/const BUILD='${GITHUB_SHA:0:7}'/" index.html
      # THE SITE IS AN ALLOWLIST, NOT THE REPOSITORY. This used to be `path: .`,
      # which handed the whole checkout to Pages: CLAUDE.md, README.md,
      # MECHANICS.md and all six harnesses were served at the site root, so the
      # operating doc and the design record were public documents whether or not
      # anyone meant them to be. Repository visibility never covered this —
      # turning the repo private would have left every one of those files
      # readable at its Pages URL, because Pages serves the artifact, not the
      # repo. index.html is the distributed artifact and always was; this makes
      # the deploy say so.
      #
      # The list below is guarded: check.mjs fails the build if a tracked file
      # at the repository root is in neither this list nor its internal list, so
      # a new asset cannot silently 404 on the live site and a new internal
      # document cannot silently become public. Adding a file is a decision
      # somebody is asked about, which is the only version of this that holds.
      - name: Stage the published site
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest og.png \
             apple-touch-icon.png icon-192.png icon-512.png \
             LICENSE _site/
      # enablement turns Pages on via the API if it is not already, so a
      # fresh clone of this repo deploys without anyone visiting Settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

name: Android debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      # API 36 comes from android/variables.gradle. AGP 8.13 uses Build Tools 35.
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run build
      - run: node node_modules/@capacitor/cli/bin/capacitor sync android
      # bash also works when a Windows checkout committed the wrapper as 0644.
      - name: Assemble installable debug APK
        working-directory: android
        run: bash ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Upload Android test app
        uses: actions/upload-artifact@v4
        with:
          name: cosmo-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

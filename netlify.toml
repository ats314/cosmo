# Vite's built game is public. The bearer account-code service is optional.
# Its exact CORS allowlist also admits GitHub Pages and bundled Capacitor origins.
[build]
  command = "node netlify/build.mjs"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

# Revalidate the entry page; Vite's hashed modules can be cached indefinitely.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

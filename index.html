  updateSpikes(sdt,true);
}

/* ---------- draw helpers ---------- */
function drawShardOutline(x,y,r,al,dash,core){
  ctx.save();ctx.translate(x,y);ctx.rotate(Math.PI/4);
  ctx.globalAlpha=al;
  ctx.strokeStyle=COL.shard;ctx.lineWidth=2.5;
  if(dash)ctx.setLineDash([4*u,3.5*u]);
  ctx.strokeRect(-r*0.7,-r*0.7,r*1.4,r*1.4);
  ctx.setLineDash([]);
  /* core grows with `core` (0..1): a dormant blinker is a watchable countdown */
  if(dash){const cs=(1.6+3.6*(core||0))*u;
    ctx.fillStyle=COL.shard;ctx.fillRect(-cs,-cs,cs*2,cs*2);}
  ctx.globalAlpha=1;ctx.restore();
}
/* The orbs blit their baked sprites — the glow was paid for in buildSprites,
   so this is the same layered finish the embers and shards get, at a fraction
   of what the live shadowBlur cost. Pulse and rotation ride blit()'s args;
   the cores are plain fills, kept out of the pulse so the centre holds still. */
/* One lamp, at the hub, and everything on the board takes its highlight from
   it. Falloff is written as a DISTANCE against the outermost radius, never as
   a ring ordinal: index 0 is the OUTERMOST orbit, so `1-ring/nRings` would
   light the board backwards and read as plausible in review. */
function rimLight(x,y,scale,al){
  if(!SPR.rim||!(al>0.004))return;
  const dx=x-cx,dy=y-cy,d=Math.sqrt(dx*dx+dy*dy);
  if(d<1)return;
  const R0=radiusOf(0)||1;
  const k=Math.max(0,Math.min(1,1.18-0.86*(d/R0)));
  if(k<=0.01)return;
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  blit(SPR.rim,x,y,scale,Math.atan2(dy,dx),al*k);
  ctx.restore();
}
function drawPow(x,y,s,al){
  /* orbs breathe on the LANDED beat, not their own clock */
  const pulse=1+(RM?0.10:0.15*G.beat);
  if(s.type==='shield'){
    blit(SPR.powShield,x,y,pulse,0,al);
    ctx.save();ctx.globalAlpha=al;ctx.fillStyle=COL.shield;
    ctx.beginPath();ctx.arc(x,y,3.5*u,0,TAU);ctx.fill();ctx.restore();
  }else if(s.type==='warp'){
    blit(SPR.powWarpO,x,y,pulse,s.t*2,al);
    blit(SPR.powWarpI,x,y,1,-s.t*2+Math.PI/4,al);
  }else if(s.type==='spot'){
    /* a stage light: four rays sweeping round a bright bulb */
    ctx.save();ctx.strokeStyle='#eaf1ff';ctx.lineWidth=1.8*u;
    const ra=RM?0.6:s.t*1.6;
    for(let ri=0;ri<4;ri++){
      const aa2=ra+ri*Math.PI/2;
      ctx.globalAlpha=al*0.7;
      ctx.beginPath();
      ctx.moveTo(x+Math.cos(aa2)*3.4*u,y+Math.sin(aa2)*3.4*u);
      ctx.lineTo(x+Math.cos(aa2)*(7.5*pulse)*u,y+Math.sin(aa2)*(7.5*pulse)*u);
      ctx.stroke();
    }
    ctx.globalAlpha=al;ctx.fillStyle='#eaf1ff';
    ctx.beginPath();ctx.arc(x,y,2.9*u*pulse,0,TAU);ctx.fill();
    ctx.fillStyle=COL.warp;
    ctx.beginPath();ctx.arc(x,y,1.6*u,0,TAU);ctx.fill();
    ctx.restore();
  }else if(s.type==='mirror'){
    /* TWO OF THE SAME THING, facing each other across a seam. Drawn as two
       half-discs with a gap down the middle rather than as one shape, because
       the orb has to say "a second you" before any sentence does. */
    ctx.save();ctx.globalAlpha=al;
    ctx.rotate?0:0;
    ctx.fillStyle=COL.mirror;
    for(const d of [-1,1]){
      ctx.beginPath();
      ctx.arc(x+d*1.5*u*pulse,y,4.6*u*pulse,d>0?-Math.PI/2:Math.PI/2,d>0?Math.PI/2:Math.PI*1.5);
      ctx.fill();
    }
    ctx.globalAlpha=al*0.85;ctx.strokeStyle='#dbe9ff';ctx.lineWidth=1.5*u;
    ctx.beginPath();ctx.arc(x,y,7.6*u*pulse,0,TAU);ctx.stroke();
    ctx.restore();
  }else if(s.type==='scorch'){
    /* a wake, not a flame: three tapering strokes trailing one bright head,
       which is the shape the effect actually makes on the ring */
    ctx.save();ctx.globalAlpha=al;
    ctx.strokeStyle=COL.scorch;ctx.lineCap='round';
    for(let q=0;q<3;q++){
      ctx.globalAlpha=al*(0.75-q*0.2);
      ctx.lineWidth=(3.0-q*0.7)*u;
      const off=(q+1)*2.2*u, ph2=RM?0:Math.sin(s.t*3+q)*0.6*u;
      ctx.beginPath();
      ctx.moveTo(x-off-3.4*u,y+ph2);ctx.lineTo(x-off+1.2*u,y+ph2);
      ctx.stroke();
    }
    ctx.globalAlpha=al;ctx.fillStyle='#fff0dc';
    ctx.beginPath();ctx.arc(x+3.0*u,y,3.4*u*pulse,0,TAU);ctx.fill();
    ctx.restore();
  }else if(s.type==='blackhole'){
    /* THE ONLY DARK OBJECT IN THE GAME. Everything else on the board emits;
       this one takes. Drawn as a hole rather than a ball: a flat black disc
       with a violet accretion ring leaning around it and a lensing halo that
       bends the wrong way — light going IN instead of out. It is the one orb
       a player should be able to identify before they can name it, because
       taking it is a decision and the pitch says it is optional. */
    ctx.save();
    const wob=RM?0:Math.sin(s.t*1.7)*0.25;
    ctx.globalAlpha=al;
    /* the lensing halo: drawn as a soft violet ring OUTSIDE the disc */
    if(!RM){
      const gl=ctx.createRadialGradient(x,y,2*u,x,y,12*u);
      gl.addColorStop(0,'rgba(143,92,255,0)');
      gl.addColorStop(0.55,'rgba(143,92,255,0.42)');
      gl.addColorStop(1,'rgba(143,92,255,0)');
      ctx.fillStyle=gl;ctx.beginPath();ctx.arc(x,y,12*u,0,TAU);ctx.fill();
    }
    /* the accretion ring, seen almost edge-on so it reads as a disc in space */
    ctx.translate(x,y);ctx.rotate(0.5+wob);
    ctx.strokeStyle=COL.bh;ctx.lineWidth=2.1*u;
    ctx.globalAlpha=al*0.95;
    ctx.beginPath();ctx.ellipse(0,0,8.4*u*pulse,2.9*u*pulse,0,0,TAU);ctx.stroke();
    ctx.globalAlpha=al*0.5;
    ctx.beginPath();ctx.ellipse(0,0,10.6*u*pulse,3.7*u*pulse,0,0,TAU);ctx.stroke();
    ctx.rotate(-(0.5+wob));
    /* the event horizon itself — nothing, and nothing is the point */
    ctx.globalAlpha=al;
    ctx.fillStyle='#05060d';
    ctx.beginPath();ctx.arc(0,0,4.4*u,0,TAU);ctx.fill();
    ctx.restore();
  }else if(s.type==='hyper'){
    /* upright with a wobble — a star that spins reads as a shard of light,
       a star that stands reads as THE star */
    blit(SPR.powHyper,x,y,pulse*(1+0.06*Math.sin(s.t*6)),Math.sin(s.t*2.2)*0.28,al);
  }else{
    blit(SPR.powNova,x,y,1+0.10*Math.sin(s.t*5),s.t*1.2,al);
    ctx.save();ctx.globalAlpha=al;ctx.fillStyle=COL.nova;
    ctx.beginPath();ctx.arc(x,y,2.5*u,0,TAU);ctx.fill();ctx.restore();
  }
  /* every orb takes the lamp EXCEPT the black hole, which is the one object
     in the game that does not emit — giving it a highlight would light the
     one thing whose whole read is that light goes in and does not come out */
  if(s.type!=='blackhole')rimLight(x,y,pulse*1.05,al*0.55);
}
/* The old stack led with -apple-system, so on the device this actually ships
   to every word was San Francisco: the system UI face, which reads as a
   settings screen rather than a game. This leads with geometric sans instead —
   Avenir Next on iOS and macOS, Century Gothic or Trebuchet on Windows,
   Roboto on Android. Circular bowls and a high x-height suit a game made
   entirely of circles, and it costs nothing: every one of these ships with the
   OS, so there is still no font to download and no network call. */
const F='"Avenir Next","Avenir",Futura,"Century Gothic","Trebuchet MS",'+
        '"Segoe UI",Roboto,system-ui,sans-serif';
function text(str,x,y,size,weight,col,ls){
  ctx.fillStyle=col;
  ctx.font=weight+' '+Math.round(size)+'px '+F;
  try{ctx.letterSpacing=(ls||0)+'px';}catch(e){}
  ctx.fillText(str,x,y);
  try{ctx.letterSpacing='0px';}catch(e){}
}
/* NO LINE EVER RUNS OFF THE SCREEN (playtest: it did). Measure at the
   intended size and shrink to fit the given width — announcements, banner
   subs and card rows all pass through here, so a long sentence on a narrow
   phone gets smaller instead of getting cut. */
function fitSz(str,size,weight,maxW,ls){
  ctx.font=weight+' '+Math.round(size)+'px '+F;
  /* letterSpacing is a fixed per-character amount the draw adds AFTER this
     measurement (measureText sees none of it) — reserve it, and shrink only
     the glyph width, or a tracked line still overflows exactly as before */
  const sp=(ls||0)*str.length;
  const w=ctx.measureText(str).width+sp;
  if(w<=maxW)return size;
  return Math.max(8*u,size*Math.max(20,maxW-sp)/Math.max(1,w-sp));
}
/* THE GAME'S OWN VOICE (playtest: "plain and boring — make the text fit the
   theme"). Headline and guidance text draws in starlight now: a soft glow
   underlay made of four offset passes (shadowBlur stays banned per-frame;
   offsets are free) under a vertical two-colour gradient, cached per
   style+size so no gradient is built twice. Persistent HUD lines stay
   lean — this voice is for the moments, not the furniture. */
const TFX={};
function textFx(str,x,y,size,weight,c1,c2,glow,ls){
  const ga=ctx.globalAlpha;
  ctx.font=weight+' '+Math.round(size)+'px '+F;
  try{ctx.letterSpacing=(ls||0)+'px';}catch(e){}
  ctx.save();ctx.translate(x,y);
  if(glow){
    const o=Math.max(1.3,size*0.055);
    ctx.globalAlpha=ga*0.30;ctx.fillStyle=glow;
    ctx.fillText(str,-o,0);ctx.fillText(str,o,0);
    ctx.fillText(str,0,-o);ctx.fillText(str,0,o);
    ctx.globalAlpha=ga*0.55;
    ctx.fillText(str,0,1.2);
  }
  const key=c1+'|'+c2+'|'+(size|0);
  let g=TFX[key];
  if(!g){
    g=ctx.createLinearGradient(0,-size*0.9,0,size*0.18);
    g.addColorStop(0,c1);g.addColorStop(1,c2);
    TFX[key]=g;
  }
  ctx.globalAlpha=ga;ctx.fillStyle=g;
  ctx.fillText(str,0,0);
  ctx.restore();
  try{ctx.letterSpacing='0px';}catch(e){}
}

/* ---------- bloom ----------
   Screen-space bloom without ever reading back the main canvas. The obvious
   route — drawImage(cv) into a small buffer — measures ~16ms a frame, because
   pulling 1.3M pixels back out stalls the pipeline; having budget spare does
   not help when the single operation eats all of it.
   So the bright objects are re-drawn as crude blobs into a quarter-size
   buffer instead. Precision is pointless there: the upscale blurs it past
   recognition, and bilinear filtering on the way back up IS the blur.

   ONE BUFFER CAN ONLY CARRY ONE RADIUS. How far a pass blurs is fixed by how
   far it is upscaled, so the quarter-res buffer put the same tight collar on
   the hub lamp as on a spark: an ember's light was gone 15px out, the comet's
   at 22px, barely past the blob itself. Every other layer of light here is
   several passes at different weights — the trail is three, the gate bar two,
   the nova front three — and the bloom was the one that was a single flat
   blit. Light with no range reads as paint.
   THE HALO IS DRAWN, NOT DOWNSAMPLED, and that is the whole design. The
   obvious cheap route is a mip cascade: downsample the quarter-res buffer
   twice more and blit each level back. It was built that way first and
   measured, and it fails twice over. A box downsample preserves the peak of
   any feature bigger than a buffer pixel, so a solid blob keeps full
   brightness at every level and the passes simply SUM — the core came out 61%
   hotter while the halo barely moved, which is a brightness bug wearing a
   glow's clothes. Worse, a tiny buffer blown up 40x spreads through bilinear,
   and bilinear is a separable tent: the footprint is a cross, not a disc, and
   its shape depends on where the object happens to fall on the coarse grid.
   Sliding one ember across a single coarse pixel swung its halo by 80%. Every
   object in this game is in orbit, permanently crossing that grid, so that is
   a halo that crawls and breathes on nothing musical at all.
   Drawing the halo as REAL CIRCLES into a coarse buffer costs one more pair
   of arc+fills per dot and is round by construction — measured 0.97 to 1.09
   across the halo, and 17% ripple against the cascade's 80%. Two stacked
   discs, at 2x and 4x the dot's radius, give a falloff one flat disc has
   not. */
const BLOOM_DIV=4,BLOOM_ALPHA=0.28;
/* THE DIAL. Every number here was chosen against four measurements at once,
   and they pull against each other: reach, the core (embers must stay GOLD —
   washing them toward white spends the one colour that means "collect me"),
   roundness, and how much the whole thing hazes a dense late-game board,
   which is the contrast the calm pool exists to buy back. As set: ember core
   +4.8%, reach x3.6, median lift across a full board 0.026.
   REACH IS MEASURED TO 1/255 — the outermost radius whose light can still tint
   an 8-bit pixel — as the maximum over a full circle, in sub-pixel steps. The
   threshold has to be quoted or the number is not checkable, and stepping in
   whole pixels off one ray is how the first cut of this comment ended up
   claiming a before-gap of 4px between the ember and the comet when their
   discs differ by 7u: two objects through the same filter chain cannot differ
   in reach by less than their radii do. On a 390x844 phone: ember 15px -> 54px,
   comet 22px -> 78px, and the ratio holds 3.44 to 3.74 across viewports.
   Mutable at runtime, so `HALO_A=0.14` in the console re-weights it on the next
   frame — the last word on how much glow is too much belongs to eyes on a real
   screen, not to this table. */
const HALO_DIV=12,HALO_WDIV=32;      /* the halo buffer, and its wide sibling */
const HALO_K1=2.0,HALO_W1=0.50;      /* inner disc: radius multiple, weight */
const HALO_K2=4.0,HALO_W2=0.20;      /* outer disc */
let HALO_A=0.09,HALO_WA=0.06;        /* composite alphas */
let bloomC=null,bloomG=null,haloC=null,haloG=null,haloWC=null,haloWG=null;
/* One call site, three discs: the tight blob every caller already asked for,
   and the two that build its halo. Guarded on haloG so the tight pass still
   stands alone if the halo buffers never came up. */
/* set once per frame by drawBloom, BEFORE the dot loop: false means the GPU
   is building the halo out of the tight buffer and the two discs per light
   are dead weight. Decided once rather than per dot so a mid-frame GL
   failure can never leave half the lights haloed and half not. */
let bloomHalo=true;
function bloomDot(g,x,y,r,col){
  g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,TAU);g.fill();
  if(!haloG||!bloomHalo)return;
  haloG.fillStyle=col;
  haloG.globalAlpha=HALO_W1;
  haloG.beginPath();haloG.arc(x,y,r*HALO_K1,0,TAU);haloG.fill();
  haloG.globalAlpha=HALO_W2;
  haloG.beginPath();haloG.arc(x,y,r*HALO_K2,0,TAU);haloG.fill();
}
function drawBloom(){
  if(!bloomC){bloomC=document.createElement('canvas');bloomG=bloomC.getContext('2d');}
  if(!haloC){
    haloC=document.createElement('canvas');haloG=haloC.getContext('2d');
    haloWC=document.createElement('canvas');haloWG=haloWC.getContext('2d');
  }
  bloomHalo=!FX.on;
  const bw=Math.max(1,Math.ceil(W/BLOOM_DIV)),bh=Math.max(1,Math.ceil(H/BLOOM_DIV));
  if(bloomC.width!==bw||bloomC.height!==bh){bloomC.width=bw;bloomC.height=bh;}
  /* the halo buffer has to be cleared and put in world coordinates BEFORE the
     dot loop below, because bloomDot writes into it as it goes */
  const hw=Math.max(1,Math.ceil(W/HALO_DIV)),hh=Math.max(1,Math.ceil(H/HALO_DIV));
  if(bloomHalo){
    if(haloC.width!==hw||haloC.height!==hh){haloC.width=hw;haloC.height=hh;}
    haloG.setTransform(1,0,0,1,0,0);
    haloG.clearRect(0,0,hw,hh);
    haloG.setTransform(1/HALO_DIV,0,0,1/HALO_DIV,0,0);
    haloG.globalCompositeOperation='lighter';
  }
  const g=bloomG,s=1/BLOOM_DIV;
  g.setTransform(1,0,0,1,0,0);
  g.clearRect(0,0,bw,bh);
  g.setTransform(s,0,0,s,0,0);
  g.globalCompositeOperation='lighter';
  for(const st of G.stars){
    const p=posAt(st.a,radiusOf(st.ring));
    bloomDot(g,p[0],p[1],10*u,COL.ember);
  }
  for(const sp of G.spikes){
    if(sp.phase!==1||!armed(sp))continue;
    const p=posAt(sp.a,radiusOf(sp.ring));
    bloomDot(g,p[0],p[1],11*u,COL.shard);
  }
  if(FIN.on)for(const ts of FIN.trail){
    if(ts.got)continue;
    const p=posAt(ts.a,radiusOf(ts.ring));
    bloomDot(g,p[0],p[1],12*u,COL.ember);
  }
  for(const pw of G.pows){
    const p=posAt(pw.a,radiusOf(pw.ring));
    bloomDot(g,p[0],p[1],10*u,
      pw.type==='shield'?COL.shield:
      pw.type==='warp'||pw.type==='spot'?COL.warp:
      pw.type==='mirror'?COL.mirror:
      pw.type==='scorch'?COL.scorch:COL.nova);
  }
  for(const pt of G.parts){
    if(pt.life<=0)continue;
    bloomDot(g,pt.x,pt.y,pt.size*pt.life*1.6,pt.col);
  }
  if(G.state!=='dead'){
    const p=posPlayer();
    bloomDot(g,p[0],p[1],17*u,'#7ce9ff');
    bloomDot(g,p[0],p[1],8*u,'#ffffff');
  }
  /* the hub lamp blooms too, harder while the drop is landing — and NOT AT
     ALL inside a black hole. Gating the lamp's own draw was not enough: this
     is a second, independent light at dead centre, and it is the one the
     screenshot after that fix was still showing burning in the middle of the
     shadow. The singularity is the one object in the game whose entire read is
     that light goes in and does not come out; two separate passes had to be
     told. Rides BH.warp so it leaves and returns with the orbits. */
  const hubLamp=1-Math.min(1,BH.warp);
  if(hubLamp>0.004)bloomDot(g,cx,cy,(9+9*G.dropFx)*u*hubLamp,'#9db9ff');
  g.setTransform(1,0,0,1,0,0);
  /* THE GPU PATH, when it is up: two gaussian levels and the lens, off the
     buffer that was just filled. It can fail on this very frame (a lost
     context, a driver refusing a framebuffer), and then this frame has no
     halo at all — because bloomHalo was decided before the dot loop and the
     discs were never drawn. One frame of a slightly thinner glow on the way
     into a permanent fallback is the right trade for never drawing both. */
  const fxOK=bloomHalo?false:fxRender(bloomC,bw,bh);
  if(bloomHalo){
    /* The widest reach comes free: one downsample of the halo buffer that is
       already drawn. Smoothing has to be asserted every frame, because assigning
       width RESETS the context and a downscale with it off is a point sample
       that discards fifteen pixels in sixteen. */
    haloG.setTransform(1,0,0,1,0,0);
    haloG.globalAlpha=1;
    const ww=Math.max(1,Math.ceil(W/HALO_WDIV)),wh=Math.max(1,Math.ceil(H/HALO_WDIV));
    if(haloWC.width!==ww||haloWC.height!==wh){haloWC.width=ww;haloWC.height=wh;}
    haloWG.imageSmoothingEnabled=true;
    haloWG.clearRect(0,0,ww,wh);
    haloWG.drawImage(haloC,0,0,ww,wh);
  }
  ctx.save();
  /* THE GLOW WAS COMPOSITED IN A DIFFERENT COORDINATE SPACE FROM ITS SOURCE.
     The bright pass above draws every light with `setTransform(s,0,0,s,0,0)`
     — a pure scale, no camera dolly. This composite runs inside the world
     pass, which is wrapped in `ctx.translate(camX,camY)`. So the whole glow
     layer landed offset from the lights it was made of by exactly the dolly,
     every frame, oscillating on a sine (`camX=sin(amb*0.16)*3*u`).
     Two visible defects out of that one mismatch, and both were reported:
       - every halo drifts a few pixels off its own light and back, forever,
         which reads as the scene never quite settling. Field report: "it's
         like you put a layer over the screen ... everything just kind of
         wobbles around."
       - the full-screen layer is shifted past the frame boundary, so the
         drawImage upscale clamps and smears the outermost texel into a
         hairline rim. Measured on the 2D layer alone, left device columns
         0/1/2 against an interior of 3.6: 5.0/4.4/3.5 before.
     This is the detached-glow failure class the invariants already record
     once, in a worse form: there the halo's bound was wrong, here the halo
     is in the wrong space entirely. Resetting to the base transform puts the
     composite exactly where the bright pass put its source. The halo
     fallback below is drawn the same way for the same reason — `haloG` also
     sets a pure scale with no dolly. */
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.globalCompositeOperation='lighter';
  /* the bloom breathes with the payoff kick — the visual half of the pump */
  const bp=1+((G.pay>0&&!RM)?0.45*G.beat:0);
  /* Additive, so the order buys nothing mathematically; widest first because
     that is the order the light is built in and the one a reader expects. */
  if(fxOK){
    ctx.globalAlpha=FX_A*bp;
    ctx.drawImage(FX.cv,0,0,W,H);
  }else if(bloomHalo){
    ctx.globalAlpha=HALO_WA*bp;
    ctx.drawImage(haloWC,0,0,W,H);
    ctx.globalAlpha=HALO_A*bp;
    ctx.drawImage(haloC,0,0,W,H);
  }
  ctx.globalAlpha=BLOOM_ALPHA*bp;
  ctx.drawImage(bloomC,0,0,W,H);
  ctx.restore();
}

/* The comet lights the track it is riding: a short arc centred on it, falling
   off both ways. Decorative, but it also makes "which ring am I on" readable
   at a glance without looking away from the comet. */
const RING_LIT=[[0.62,0.030,7],[0.40,0.048,4.5],[0.22,0.078,2.6],[0.10,0.105,1.6]];
function drawRingGlow(){
  const rr=curR();
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  /* the lit track takes its own colour, so the light under the comet says
     which ring you are on as plainly as the arrangement does */
  ctx.strokeStyle='rgb('+RINGS[Math.min(RINGS.length-1,effRing())].tint+')';
  for(const L of RING_LIT){
    /* the light under the comet breathes with the landed beat */
    ctx.globalAlpha=L[1]*(RM?1:1+0.30*G.beat);
    ctx.lineWidth=L[2]*u;
    ctx.beginPath();ctx.ellipse(ecx(rr),ecy(rr),rr,rr*AY,0,G.angle-L[0],G.angle+L[0]);ctx.stroke();
  }
  ctx.restore();
}
/* THE AFTER-IMAGE. Slow motion reaches the whole visible world now — the
   sky, the dolly, the debris, the ribbon all ride G.vt — and the result is
   correct and strangely undersold, because everything slowing down together
   looks a great deal like nothing happening. What reads as slow motion, in
   every medium that has ever had to sell it, is one thing SMEARING against
   another: a second image of the moving object, lagging where it has been.
   So the ribbon is drawn twice while time is dilated. The ghost is the same
   ribbon minus its most recent samples, so its head sits where the comet was
   a moment ago, wider and dimmer and in warp violet — the mode's own colour,
   the one the slow-mo vignette is already tinted with. It is drawn FIRST, so
   the live cyan ribbon lies on top of its own past.
   Costs nothing when time is running: the whole pass is behind the same
   G.tsCur test the vignette uses, and never runs under reduced motion. */
function tailRibbon(n,am,ghost){
  if(n<4)return;
  const nx=new Array(n),ny=new Array(n),bw=new Array(n);
  for(let i=0;i<n;i++){
    const p=G.trail[i];
    const a=G.trail[i+1<n?i+1:n-1],b=G.trail[i>0?i-1:0];
    let tx=a.x-b.x,ty=a.y-b.y;
    const L=Math.sqrt(tx*tx+ty*ty);
    if(L<1e-4){tx=1;ty=0;}else{tx/=L;ty/=L;}
    nx[i]=-ty;ny[i]=tx;
    /* width tapers by both age and position, so the head stays fat.
       THE STAR WIDENS THE WHOLE RIBBON. G.hyperGlow rather than G.hyper, so
       it arrives and leaves on the same envelope the corona does instead of
       snapping on with the timer. */
    bw[i]=8*u*Math.pow(Math.max(p.life,0),0.7)*(0.16+0.84*i/(n-1))
      *(1+(RM?0:0.85*G.hyperGlow));
  }
  /* Width, alpha, colour. The narrow pass runs near-white so the ribbon goes
     hot at its centre and cools outward, the way anything incandescent does.
     THE TRAIL IS THE GROOVE'S SCOREBOARD: as the chain climbs, the ribbon
     tints from comet-cyan toward warp-violet, and during the payoff it runs
     white-hot — the player's own wake reports how in-time they are. */
  /* the pocket completes it: 0.7 was the chain's ceiling, and the last 0.3
     — payoff-grade — belongs to actually holding the top */
  const gm=G.pay>0?1:Math.min(1,G.groove/8*0.7+0.3*G.pocket);
  const mix=function(a,b){
    return 'rgb('+Math.round(a[0]+(b[0]-a[0])*gm)+','+
      Math.round(a[1]+(b[1]-a[1])*gm)+','+Math.round(a[2]+(b[2]-a[2])*gm)+')';
  };
  /* the ghost is two passes, not three: it is an after-image, and giving it
     the hot white core the live ribbon has would make it read as a second
     comet rather than as the first one's past */
  /* THE STAR'S TAIL. "A comet flying through orbit with a brilliant tail" —
     so during a hypernova the ribbon stops being the groove's scoreboard and
     becomes the thing itself: five passes instead of three, a wide magenta
     bloom outside a hot gold body inside a white core, running the length of
     a ribbon that is also longer and nearly twice as wide. The colours are
     COL.hyper's magenta and the ember gold, which is what the orb and its
     popup already are — the tail is the same object as the pickup, not a new
     palette. Crossfaded on hyperGlow so it arrives and leaves with the
     corona; at hyperGlow 0 the arithmetic reduces to the ordinary passes. */
  const hg=RM?0:G.hyperGlow;
  const hmix=function(base,star){
    return 'rgb('+Math.round(base[0]+(star[0]-base[0])*hg)+','+
      Math.round(base[1]+(star[1]-base[1])*hg)+','+
      Math.round(base[2]+(star[2]-base[2])*hg)+')';
  };
  const passes=ghost?[
    [3.0,0.055,'rgb(150,110,240)'],
    [1.5,0.10,'rgb(196,166,255)']]:hg>0.02?[
    /* outermost first, the order light is built in */
    [4.2,0.055*hg,'rgb(255,79,216)'],
    [2.5,0.075+0.06*hg,hmix([93,240,255],[255,120,225])],
    [1.35,0.16+0.10*hg,hmix([142,242,255],[255,200,120])],
    [0.6,0.34+0.30*hg,hmix([230,253,255],[255,255,255])],
    [0.26,0.30*hg,'#ffffff']]:[
    [2.5,0.075,mix([93,240,255],[180,139,255])],
    [1.35,0.16,mix([142,242,255],[214,190,255])],
    [0.6,0.34,G.pay>0?'#ffffff':'#e6fdff']];
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  for(let k=0;k<passes.length;k++){
    const m=passes[k][0];
    ctx.globalAlpha=passes[k][1]*am;
    ctx.fillStyle=passes[k][2];
    ctx.beginPath();
    for(let i=0;i<n;i++){
      const p=G.trail[i],w=bw[i]*m;
      const X=p.x+nx[i]*w,Y=p.y+ny[i]*w;
      if(i===0)ctx.moveTo(X,Y);else ctx.lineTo(X,Y);
    }
    for(let i=n-1;i>=0;i--){
      const p=G.trail[i],w=bw[i]*m;
      ctx.lineTo(p.x-nx[i]*w,p.y-ny[i]*w);
    }
    ctx.closePath();ctx.fill();
  }
  ctx.restore();
}
function drawTail(){
  const n=G.trail.length;
  if(n<4)return;
  if(!RM&&G.tsCur<0.98){
    /* how far behind the ghost sits scales with how deep the dilation is:
       barely at 0.98, about nine samples at the 0.42 floor. Clamped so the
       ghost always keeps enough of the ribbon to still be one. */
    const lag=Math.max(2,Math.min(n-4,Math.round(9*(1-G.tsCur)/0.58)));
    tailRibbon(n-lag,Math.min(1,(1-G.tsCur)/0.30),true);
  }
  tailRibbon(n,1,false);
}

/* ---------- the visible beat ----------
   The old pulse breathed the RINGS, at peak alpha 0.05 against static strokes
   on the same path summing to ~0.265 — and it PEAKED ON THE BEAT. You cannot
   synchronise to a flash that arrives at the same moment as the thing it is
   announcing; human reaction is ~250ms and an eighth here is 288ms. It was also
   4.5x brighter at groove x8 than at x0, so the game showed you the beat most
   clearly exactly when you least needed it and dimmest while you were trying
   to find it.

   What people actually synchronise to is continuous motion with a predictable
   arrival, and it has to land where the eye already is. So: a ring that
   contracts onto the comet over the half-beat BEFORE each beat, and lands. */
function beatPhase(){
  if(!AC||!MU||!MU.next||AC.state!=='running'||G.state!=='playing')return -1;
  /* MU.next is the next UNSCHEDULED eighth and sits ahead of now by the
     lookahead, so the quarter boundary is derived from it, not subtracted. */
  const q=MU.next+((MU.step%2)?SPB/2:0);
  let d=(q-AC.currentTime)%SPB;if(d<0)d+=SPB;
  return 1-d/SPB;
}
function drawBeat(p){
  const ph=beatPhase();if(ph<0)return;
  /* fades back for a veteran who has clearly found it, and stays for everyone
     else. It is a teaching aid first and an ornament second. */
  let vis=(G.runs>6&&G.bestGroove>=5)?0.45:1;
  /* THE COUNT-IN. Through the final bar before the drop lands, this same
     ring — at the comet, where the eyes already are — turns white-hot and
     swells beat by beat. The landing is read where you play, never at a
     target. */
  let cd=-1;
  if(MU&&MU.landT&&!MU.landDone&&AC)cd=MU.landT-(AC.currentTime-PLAY.bias);
  const cin=(cd>-LAND_WIN&&cd<SPB*4)?1-Math.max(0,cd)/(SPB*4):0;
  if(cin>0)vis=1+1.4*cin;
  ctx.save();ctx.globalCompositeOperation='lighter';
  /* in the pocket the ring runs white-hot like the count-in: same vocabulary,
     same place — "you are exactly where the count-in asks you to be" */
  ctx.strokeStyle=(cin>0||G.pocket>0.9)?'#ffffff':
    ((G.groove>=3||G.pay>0)?COL.warp:'rgba(200,225,255,1)');
  if(RM){
    /* one opacity step per beat is 1.73Hz — far below any flash threshold,
       and it still carries the anticipation */
    ctx.globalAlpha=(ph>0.62?0.28:0.09)*vis;ctx.lineWidth=2*u;
    ctx.beginPath();ctx.arc(p[0],p[1],32*u,0,TAU);ctx.stroke();
  }else{
    const a=Math.max(0,(ph-0.5)*2);        /* 288ms of visible approach */
    if(a>0){
      ctx.globalAlpha=(0.05+0.24*a*a)*vis;ctx.lineWidth=(1.2+1.3*a)*u;
      ctx.beginPath();ctx.arc(p[0],p[1],(32+18*(1-a))*u,0,TAU);ctx.stroke();
    }
    if(G.beat>0.02){                       /* the landing, at a level you see */
      /* THE CATCH: a climb throws its weight into the next landing — the tap
         that raised the chain is answered by the ring it was aimed at, which
         is the contingency the old system never showed */
      ctx.globalAlpha=G.beat*(0.30+0.045*G.groove+0.10*G.payOpen+0.30*G.grooveFx)*vis;
      ctx.lineWidth=(1.6+3.2*G.beat+1.4*G.grooveFx)*u;
      ctx.beginPath();ctx.arc(p[0],p[1],(32+6*(1-G.beat))*u,0,TAU);ctx.stroke();
    }
  }
  /* THE MISS SAYS WHICH WAY: a dim arc beside the ring, leading side for
     early, trailing side for late. No text, no penalty — just the answer to
     the question the contracting ring asks. Drawn under RM too: it is a
     static fading arc, not motion. */
  if(G.missFx){
    ctx.globalAlpha=0.22*G.missFx.t*vis;
    ctx.strokeStyle='rgba(165,185,215,1)';ctx.lineWidth=2*u;
    const a0=-Math.PI/2+(G.missFx.s>0?0.35:-1.15);
    ctx.beginPath();ctx.arc(p[0],p[1],32*u,a0,a0+0.8);ctx.stroke();
  }
  ctx.restore();
}
/* ---------- draw ---------- */
/* WHERE THE MUSIC IS, CONTINUOUSLY. Returns the position inside the four-bar
   phrase in eighths (0..STEPS) as a float that advances smoothly, so the sky
   can be driven by musical PHASE instead of by beat impulses.
   The audio clock schedules ahead of the speaker, so MU.step is the next step
   to be queued and MU.next is when it fires: the sound a player is hearing
   right now is that far behind. Subtracting the lead-in gives the audible
   position, and it stays continuous across a step boundary because MU.step
   gains 1 at the same instant the lead-in does.
   With no audio clock — muted tab, no WebAudio, the menu — it free-runs on
   wall time at the same tempo. That is deliberate and load-bearing: a large
   share of web players play with the sound off, and they should still see a
   world that breathes in time rather than a dead one. */
function musPos(){
  const sd=SPB/2;
  if(A&&AC&&MU&&MU.next&&AC.state==='running'&&G.state==='playing'){
    const lead=(MU.next-AC.currentTime)/sd;
    return ((MU.step-lead)%STEPS+STEPS)%STEPS;
  }
  return (G.t/sd)%STEPS;
}

/* ================= THE BACKDROP RUNS ON THE GPU =================
   A second canvas under the game canvas, running one fragment shader. The 2D
   backdrop (baked gradients, galaxy, planet, nebulae, rays, fog, grade) is a
   COMPLETE fallback: if WebGL is missing, refused, or fails to compile, GL.on
   stays false and every one of those layers paints exactly as before. Nothing
   about the simulation changes either way.
   Why a shader at all: the old sky was radial-gradient sprites, which cannot
   express filaments, dust lanes or flow no matter how they are animated. This
   is two-level domain-warped fBm — the structure IS the maths. */
/* RENDER SCALE, AND IT STARTS AT FULL NOW. This was 0.60 — the backdrop drew
   at 36% of the screen's pixels and was upscaled 1.67x to fill it, on every
   device, every run — under a comment calling it "a compromise struck between
   a phone that might not cope and a desktop that could render this four times
   over". THE PHONE THAT MIGHT NOT COPE IS NOT IN THE PLAYER BASE. The owner's
   target is iPhone 12 and up, which was never written down anywhere in this
   repository, so every session inherited a compromise struck for a device
   nobody plays on.
   It is not a free compromise either, and the previous comment was wrong that
   it costs "almost nothing visually". The field is smooth at low frequencies
   and the sky is NOT only low frequencies: the ridged filament network, the
   dust lanes and the three star layers all carry detail at the pixel scale,
   and a 1.67x upscale is exactly where that detail goes. The first read of
   these worlds rendered at 0.60 was "soft and blurry, low-frequency mush, no
   fine detail", and that was blamed on the noise field.
   The ladder below is unchanged and is now what it should always have been:
   a safety net that catches a device in trouble, rather than the default
   everyone lives in. */
const GL_SCALE=1.0;
const GL_COV=0.36, GL_EXP=1.45;   /* void threshold and exposure — see notes */
/* HOW FAST THE SKY MOVES. One master dial over every drifting term — flow
   advection, palette walk, star twinkle — now multiplied by the world's own
   `motion`, so this is the centre of a range rather than the whole answer.
   THE HISTORY MATTERS HERE, because this number went down for a good reason
   and is going back up for a different one. 1.0 was the first pass and read
   as distracting in play: the backdrop was competing for attention with an
   arena the player has to watch, and 0.42 was the retreat. But the motion
   that was competing was UNDIRECTED — a uniform drift of the whole field,
   everywhere, meaning nothing. What is being sped up now is a sky that has
   somewhere to be: it turns because you are orbiting, it surges because a lap
   closed, and things cross it and leave. The owner's call, against the stated
   readability risk, was to loosen this globally.
   0.72 against the world range 0.60-1.30 puts the effective dial between 0.43
   and 0.94 — DUSTLANE still broods slower than the old constant and VEIL runs
   at more than twice it. THE SKY'S TEMPERAMENT IS NOW PART OF WHERE YOU ARE,
   which is half of what "they are too similar" was about: four skies that all
   drift at one rate are four skies with one mood. */
const GL_MOTION=0.72;
const GL={on:false,g:null,pr:null,u:{},cv:null,vw:0,vh:0,
  r:[[0,0,-1],[0,0,-1]],slot:0,shear:0,
  flow:0,flowVt:null,   /* the integrated advection clock — see uFlow */
  tw:0,                 /* the integrated world clock — see uTime */
};
const GL_FS=`
precision highp float;
uniform vec2 uRes,uCtr; uniform float uTime,uEnergy,uPal,uCov,uExp,uCombo,uBeat,uShr,uMotion,uBH,uPock,uFlow;
uniform vec3 uR1,uR2;
/* THE WORLD, AS NUMBERS. Every one of these is lerped between two rows of
   WORLDS on the CPU, so the shader has no idea worlds exist and never pays
   for the one it is not in. See the table for what each weight means.
   uWA  (bill, broad, cont, fil)      which structures this world is made of
   uWB  (contF, contY, contK, filK)   how the contour and filament terms bite
   uWC  (lane, cov, star, motion)     dust depth, void, star gain, temperament
   uWE  (flow, web, horiz, plx)       grain, void KIND, edge, depth
   uWF  (grid, gal, -, -)             the two worlds that are not nebulae
   uMus (rise, sect, pulse, -)        drop approach, chorus, pulsar phase
   uPow (slow, star, scorch, mirror)  what the orbs do to the sky
   uWD  (covF, covX, covY, fldF)      WHERE the void opens, and how BIG
                                      the structures are, per world
   uPA..uPD                           the cosine palette's four coefficients */
uniform vec4 uWA,uWB,uWC,uWD,uWE,uWF,uMus,uPow;
uniform vec3 uPA,uPB,uPC,uPD;
/* THE ORBIT, AS NUMBERS.
   uOrb  (charge, spin, wake, wind)
     charge 0..1  the lap streak, eased — how hard the sky is wound up
     spin         the APPARENT rotation of the sky, radians, in uv space.
                  Sampling negates it; see the note at the rotation itself.
     wake   -1..1 the closing ring's phase; <0 is idle
     wind   0..1  how much of this lap is done — the swept sector
   uOrb2 (head, dirSign, wakeAmt, arenaCalm)
     head         the comet's angle in UV SPACE (y-up), which is -G.angle
     dirSign      travel direction in uv space, which is -G.dir
     wakeAmt      how big the closing ring is, from the streak it closed on
     arenaCalm    SKY_ARENA_CALM — contrast moderation over the orbit band */
uniform vec4 uOrb,uOrb2;
/* THINGS THAT ARRIVE, CROSS AND LEAVE. Nothing in the backdrop ever used to
   happen — every layer was a continuous field being multiplied by a gain, and
   a gain is not an event. Each of these is idle at a negative life.
   uMetA/uMetB (x0,y0,angle,life)  meteors
   uFlare      (x,y,life,strength) a distant star flaring
   uBody       (x,y,radius,lightAngle) the passing body — an OBJECT, with a
               silhouette that occludes the nebula rather than veiling it */
uniform vec4 uMetA,uMetB,uFlare,uBody;
float hash21(vec2 p){ p=fract(p*vec2(123.34,345.45)); p+=dot(p,p+34.345); return fract(p.x*p.y); }
float vnoise(vec2 p){ vec2 i=floor(p),f=fract(p); vec2 u=f*f*(3.0-2.0*f);
  return mix(mix(hash21(i),hash21(i+vec2(1,0)),u.x),mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),u.x),u.y); }
const mat2 M=mat2(1.62,1.18,-1.18,1.62);
float fbm(vec2 p){ float v=0.,a=.5; for(int i=0;i<6;i++){ v+=a*vnoise(p); p=M*p; a*=.5;} return v; }
float fbm4(vec2 p){ float v=0.,a=.5; for(int i=0;i<4;i++){ v+=a*vnoise(p); p=M*p; a*=.5;} return v; }
float ridged(vec2 p){ float v=0.,a=.5; for(int i=0;i<5;i++){ float n=1.-abs(vnoise(p)*2.-1.); v+=a*n*n; p=M*p; a*=.5;} return v; }
vec3 pcos(float t,vec3 a,vec3 b,vec3 c,vec3 d){ return a+b*cos(6.28318*(c*t+d)); }
/* THE PALETTE IS DATA NOW. It was four hardcoded branches on uPal, which is
   why a "new sky" could only ever be one of four and why interpolating
   between two of them was impossible. The generator is unchanged — the four
   original branches are rows 0-3 of WORLDS, to the digit — but the
   coefficients arrive as uniforms, so the CPU can hand down any point on the
   line between two worlds and the shader cannot tell the difference between
   an arrival and a journey. EVENT HORIZON stays hardcoded at its own site in
   the black hole block: it belongs to the mode, not to the journey. */
vec3 palette(float t){ return pcos(t,uPA,uPB,uPC,uPD); }
/* A METEOR. A head, a tail that only exists behind it, and a life that fades
   in and out at both ends so nothing ever pops. Analytic — no noise, no
   texture, and it costs about what one star layer costs. */
float meteor(vec2 uvv,vec4 m){
  if(m.w<0.0) return 0.0;
  vec2 d=vec2(cos(m.z),sin(m.z));
  vec2 head=m.xy+d*(m.w*2.30);
  vec2 rel=uvv-head;
  float along=dot(rel,-d);
  float perp=dot(rel,vec2(-d.y,d.x));
  /* the tail is one-sided: max(along,0) is 0 ahead of the head, so nothing
     is ever drawn in front of a meteor */
  float tail=exp(-max(along,0.0)*7.0);
  float core=exp(-perp*perp*2200.0)*tail;
  float glow=exp(-dot(rel,rel)*260.0);
  return (core+glow*0.55)*sin(m.w*3.14159);
}
vec3 starLayer(vec2 frag,float dens,float thr,float t,float sizek,float spikek){
  vec2 su=frag/uRes.y*dens; vec2 sc=floor(su),sf=fract(su)-0.5;
  float sh=hash21(sc+vec2(dens*3.1,dens*7.7));
  if(sh<thr) return vec3(0.0);
  float br=(sh-thr)/(1.0-thr);
  vec2 off=vec2(hash21(sc+1.7),hash21(sc+4.3))-0.5; vec2 d=sf-off*0.78;
  float tw=0.78+0.22*sin(t*(0.55+br*1.25)+sh*44.0);
  float core=exp(-dot(d,d)*sizek)*tw*(0.35+br);
  float sp=(exp(-abs(d.x)*110.0-abs(d.y)*1250.0)+exp(-abs(d.y)*110.0-abs(d.x)*1250.0))*spikek*br*br*tw;
  return vec3(0.82,0.89,1.0)*(core+sp);
}
void main(){
  vec2 frag=gl_FragCoord.xy; vec2 uv=(frag-0.5*uRes)/uRes.y;
  float t=uTime*uMotion;   /* every drifting term reads this, not raw time */
  uv += vec2(uv.y,uv.x)*uShr*0.35;                       /* swipe shear */
  vec2 disp=vec2(0.0);                                   /* two sources -> they interfere */
  for(int i=0;i<2;i++){
    vec3 R=(i==0)?uR1:uR2; if(R.z<0.0) continue;
    vec2 dv=uv-R.xy; float d=length(dv)+1e-5;
    disp += (dv/d)*sin(d*26.0-R.z*9.0)*exp(-d*2.4)*exp(-R.z*1.6)*0.030;
  }
  uv+=disp; float rd=length(uv);
  /* ---- BLACK HOLE: gravitational lensing — pull UVs toward centre ----
     THE LENS USED TO INVERT THE FIELD. lens = 0.18/(brd+0.15) exceeds brd for
     every brd below 0.356 uv — 300 CSS px, which is the entire middle of the
     screen including the whole arena — so the subtraction overshot the
     origin and flipped the vector through it. Everything downstream then read
     the wrong radius: the gravity well measured exactly 1.000 (no darkening at
     all) across the middle of the screen, and the photon ring and accretion
     disc were pushed out to 249-358 px, drawing as arcs pinned behind the HUD
     at the top and bottom edges instead of a hole in the middle. Clamping the
     displacement to a fraction of the radius keeps the pull monotonic, so the
     field compresses toward the centre instead of turning inside out. */
  if(uBH>0.0){
    vec2 dv2=uv-uCtr;
    float brd=length(dv2)+1e-5;
    float lens=min(brd*0.72,uBH*0.18/(brd+0.15));
    uv-=dv2/brd*lens;
    rd=length(uv);                         /* re-measure after distortion */
  }
  /* THE FLOW RIDES ITS OWN CLOCK. uFlow is integrated on the CPU so the
     pocket can accelerate the advection smoothly — scaling uTime by a
     time-varying factor would teleport the whole field by (session length ×
     the factor's change) the moment the factor moved. At uPock 0 it advances
     at exactly the old uTime*uMotion rate. */
  /* THE DRIFT IS AN ORBIT, NOT A ROAD OUT OF TOWN. dr used to walk a straight
     line forever (uFlow*0.013, uFlow*0.009) through a noise field nobody had
     surveyed past the first few minutes — and the field has barren stretches.
     Measured with a line-for-line port of this chain: whole-screen nebula
     blackouts lasting 10+ minutes. A phone left on the game all morning
     parked in one and the sky read as broken.
     THE ORBIT'S TERRITORY IS CHOSEN TO MATCH THE ORIGINAL LOOK, and the
     first one was not: centred on the origin at radius 6 with a 0.42 gate
     floor it swept lush regions and lifted every void, and the sky came out
     ~3x brighter than every screenshot the game had ever produced — which
     read as a glowing frame around the arena, since the arena's dark pool
     owns the middle of the screen. Fixing "never black" by flooding the sky
     with light is failing in the opposite direction, and the harness only
     had a floor, so nothing caught it. This orbit was found by SEARCHING the
     field for a lap whose statistics match the historical healthy look:
     mean 0.149 vs 0.142, peaks 0.241 vs 0.268, dips 0.038 vs 0.028 — the
     look playtesting loved, minus only the blackouts. One lap is ~24
     minutes; fxcheck.mjs sweeps all of it and now pins BOTH directions. */
  /* ---- THE ORBIT SPINS THE SKY ------------------------------------------
     The reward the owner asked for, and the reason it is a rotation rather
     than a brightness: consecutive orbits had to accumulate into something
     the player can SEE accumulating, and a gain has no memory. uOrb.y is an
     angle integrated on the CPU at a rate set by the lap streak, so the sky
     is wound up by clean laps and — because a reverse zeroes the streak —
     visibly stalls and unwinds when you turn around. The cost of turning
     back, which used to be a number, is now the whole backdrop slowing down.

     THE SIGN. This is inverse sampling — the fragment asks which part of the
     source to read — so a sample rotated by +a makes the image appear to
     rotate by -a. uOrb.y carries the APPARENT rotation the sky should have,
     already in uv space (y-up, so it is -G.dir's direction), and the sample
     is rotated by its negative. Stated as the invariant demands, in terms of
     where a thing ends up: a feature drawn at uv angle A appears at angle
     A + uOrb.y. fxcheck.mjs asserts exactly that sentence, because this
     precise inversion has shipped backwards three times on the black hole. */
  vec2 sv=uv-uCtr;
  /* ---- THE CLOSING LAP RIPPLES THE SKY ----
     The wake used to only ADD light, which reads as a flash rather than as
     something passing through. Displacing the sample radially as the front
     crosses makes the whole field bulge and settle behind it — the sky is
     physically disturbed by closing an orbit. uOrb2.z is the wake amount and
     is already on the books; this reads it one line earlier than the additive
     term does. */
  if(uOrb2.z>0.0){
    float wr=length(sv);
    float wf2=exp(-pow((wr-uOrb2.z*0.62)*7.0,2.0));
    sv*=1.0-wf2*uOrb2.z*0.10;
  }
  float spinC=cos(-uOrb.y),spinS=sin(-uOrb.y);
  vec2 nuv=uCtr+vec2(sv.x*spinC-sv.y*spinS,sv.x*spinS+sv.y*spinC);
  /* polar about the ARENA, unspun: the lap sector and the closing ring are
     events in the player's frame, not in the drifting field's */
  float ar=length(sv);
  float fa=atan(sv.y,sv.x);
  /* uWD.w IS THE WORLD'S FIELD SCALE, and it is the deepest of the three
     de-correlators. covF/covX/covY move where the void opens; this moves how
     BIG the structures are — GLASS at 0.72 states a few large forms, VEIL at
     1.70 breaks into many small ones — because f, f2 and rg were all sampled
     at one frequency for every world, so six worlds shared not only their
     silhouette but the size of everything in them. DRIFT is 1.00 and is
     therefore bit-identical, which is what keeps it usable as fxcheck's
     historical anchor. */
  vec2 p=nuv*1.35*uWD.w; float drA=uFlow*0.0105;
  vec2 dr=vec2(2.0+sin(drA)*1.5,6.0+cos(drA)*1.035);
  vec2 q=vec2(fbm(p+dr),fbm(p+vec2(5.2,1.3)-dr));
  vec2 r=vec2(fbm(p+3.2*q+vec2(1.7,9.2)+dr*1.7),fbm(p+3.2*q+vec2(8.3,2.8)-dr*1.3));
  /* ---- FLOW: the field grows a GRAIN ----
     Every world was isotropic — structure the same in all directions, which is
     why they all read as "clouds" whatever their weights. r is already a 2D
     warp vector, so it is free to use as a FLOW DIRECTION and compress the
     sample along it: compressing along a direction stretches features along
     it. r varies per fragment, so the direction curls rather than combing
     straight, which is what makes it read as prominences following field lines
     instead of a motion blur. */
  vec2 pf=p+3.0*r+dr*0.6;
  float flowAmt=uWE.x+0.55*uPow.y;   /* the star streaks the grain */
  if(flowAmt>0.0){
    vec2 fdir=normalize(r-0.5+vec2(1e-5,0.0));
    pf-=fdir*dot(pf,fdir)*flowAmt*0.62;
  }
  float f=fbm(pf);
  /* ---- PARALLAX: the far layer slides against the near one ----
     f2 is already sampled at a different scale from f; what it never had was a
     different SPEED, so the two moved in lockstep and the sky was one flat
     plane however much structure it carried. dr2 slows the far field by up to
     65%, which is the whole of the effect: two layers at different rates read
     as depth, and depth is the thing a single fBm can never fake. Costs
     nothing — dr is already computed and this is a second scaling of it. */
  vec2 dr2=dr*(1.0-min(0.92,(uWE.w+0.45*uPow.x)*0.65));   /* slow-mo deepens it */
  vec2 p2=nuv*0.62*uWD.w+vec2(3.7,1.1);
  vec2 q2=vec2(fbm4(p2-dr2*0.5),fbm4(p2+vec2(2.1,7.4)+dr2*0.4));
  float f2=fbm4(p2+2.4*q2);
  float rg=ridged(p*1.6+r*1.2+dr);
  float dust=pow(rg,2.2);
  /* ---- THE FOUR STRUCTURES, AND THE WORLD IS WHICH ONES IT IS MADE OF ----
     Not one of these costs a noise evaluation. f, f2 and rg are already on
     the books; cont is a LEVEL SET of the first two, which is the whole
     reason a world can be curtains instead of clouds for free. See WORLDS. */
  float bill=smoothstep(0.32,0.68,f)*0.82+smoothstep(0.26,0.97,f)*0.18;
  float broad=smoothstep(0.36,0.76,f2);
  float cont=pow(abs(sin((f*2.4+f2*1.1)*3.14159*uWB.x+nuv.y*uWB.y)),uWB.z);
  float fil=pow(rg,uWB.w);
  /* the weights sum to 1 in every row of WORLDS and a lerp of two such rows
     still sums to 1, so this is a blend and never a gain — check.mjs pins it */
  float band=bill*uWA.x+broad*uWA.y+cont*uWA.z+fil*uWA.w;
  band*=uWC.w;
  band*=(1.0-uWC.x*dust*(1.0-0.80*uPock));
  /* THE VOID MOVES WITH THE WORLD. These two fields were sampled at a fixed
     0.75 and 1.9 with fixed offsets for every world in the table, and uWC.y
     scaled only HOW MUCH gate — never WHERE it opened. So all six worlds wore
     the same holes in the same places and could change their surface without
     changing their outline. Measured off the shader's own readPixels, the
     luminance fields correlated at r=0.97 between DRIFT and DUSTLANE and 0.94
     between EMBERFALL and DUSTLANE: one composition in six textures, which is
     the old "one picture, four palettes" bug moved up a level.
     The frequency and the offset are per-world now (uWD), so GLASS opens a few
     large voids at 0.50 and VEIL breaks up into many small ones at 1.42, and
     the second field keeps its old 2.53x relationship to the first so the
     interference between them stays the same KIND of structure. */
  float covA=fbm4(nuv*uWD.x+vec2(uWD.y,uWD.z)+dr*0.35);
  /* covB STAYS FIXED, and that is what keeps DRIFT the anchor. Deriving its
     offsets from the world's too moved DRIFT's fine-detail field — (2.7,8.8)
     became (2.7,5.6) — so the world fxcheck pins to the historical look was
     quietly no longer the historical look. It was invisible for a whole commit
     because the PORT had not caught up either, so nothing was comparing the
     two. covB is only an 18% modulator inside the gate (covA-0.18*(covB-0.5));
     the silhouette is covA's job, and covA is per-world. */
  float covB=fbm4(nuv*1.9+vec2(2.7,8.8)-dr*0.5);
  /* ---- WEB: the void changes KIND, not just place ----
     The coverage field was always smooth fBm, so a void was always a blob —
     six worlds with six different blob layouts is still one vocabulary. rg is
     the ridged field and is already computed for the fil term; read as coverage it
     gives filamentary void with sharp walls, which is the cosmic-web look and
     is structurally the opposite of a blob. Mixed rather than switched, so a
     world can sit anywhere between the two. */
  covA=mix(covA,rg,uWE.y);
  /* ---- HORIZON: a world with an ORIENTATION ----
     Every sky here is rotationally symmetric in its statistics: no world has a
     top or a side. A linear term across the coverage field gives one — dense on
     one side of a line, void on the other, with the gate's own smoothstep
     making the boundary a soft glowing edge. Costs no noise at all. */
  covA+=uWE.z*dot(nuv-uCtr,vec2(0.60,0.80))*0.60;
  /* THE GATE IS FLOORED: it sculpts the clouds, it no longer owns their
     existence. The coverage field is sampled at uv*0.75, so a phone screen
     spans about a QUARTER of one noise cell — the whole sky rides a single
     sample of covA, and when that sample sat under the threshold the entire
     nebula multiplied to zero at once. With the floor, a barren stretch of
     the orbit reads as a quieter sky, never a black one. 0.10, not more:
     under the m^1.45 exposure a floored void renders near-black, which is
     what the beloved screenshots actually contain — real darkness is part of
     the composition, and a floor high enough to abolish it (the first cut
     used 0.42) trades the blackout bug for a milky sky that never rests.
     THE WORLD SCALES THE GATE, IT CANNOT REMOVE IT. uWC.y is how much void
     a world is allowed — GLASS opens wide at 0.58, DUSTLANE keeps its mass
     at 1.00 — and it enters through a mix TOWARD the gate from 1.0, so a
     lower weight makes the sky fuller and can only ever raise the floor
     above 0.10. There is no value of any world weight that reintroduces the
     blackout, which is the property the ellipse and this floor were bought
     to guarantee. check.mjs pins uWC.y to 0..1 so that stays true. */
  float gate=(0.10+0.90*smoothstep(uCov,uCov+0.20,covA-0.18*(covB-0.5)));
  band*=mix(1.0,gate,uWC.y);
  /* THE DROP'S APPROACH EMPTIES THE SKY, and the chorus opens it. Both are
     zero at rest, so the swept luminance band is unchanged by their presence
     — the guard measures a sky with no drop in flight and no section lifted. */
  band*=(1.0-0.75*uWF.x);        /* the lattice stands in front of the weather */
  band*=(1.0-0.52*uMus.x);
  band*=(1.0+0.16*uMus.y);
  float m=clamp(band,0.0,1.0);
  /* ---- THE LAP CLOSES AND A WAVE GOES OUT ----
     Fired the instant an orbit completes, and deliberately a surge in the
     NEBULA's own mass rather than a drawn ring: the sky swells as the wave
     passes and settles behind it. Frequent — every few seconds of clean play
     — so it is wide, slow and low-contrast by construction. uOrb2.z carries
     the streak it closed on, so the tenth consecutive lap sends a bigger
     wave than the first without any of them being startling. */
  float wake=0.0;
  if(uOrb.z>=0.0){
    float wq=(ar-(0.04+uOrb.z*1.05))/(0.05+0.13*uOrb.z);
    wake=exp(-wq*wq)*(1.0-uOrb.z)*uOrb2.z;
    m=clamp(m*(1.0+wake*1.35),0.0,1.0);
  }
  /* THE POCKET CRYSTALLIZES THE SKY. The same ridged field that carves the
     dust lanes re-enters as LIGHT: its creases become a sharp filament
     network laid through the clouds — and through the coverage voids, which
     the band term can never cross — widening on each landed beat
     (7.0 -> 4.4 in the exponent) and gone entirely at uPock 0. A state
     change in the geometry, not a gain change: same field, opposite sign.
     Costs nothing — the ridged() eval was already paid for by the dust. */
  m=clamp(max(m,pow(rg,7.0-2.6*uBeat)*0.85*uPock),0.0,1.0);
  /* uPal — the ladder band — survives as a HUE BIAS rather than as the whole
     palette. The run's depth still recolours the sky, but it now recolours
     whichever world you are in instead of being the only thing that changes.
     It is still the value that flavours the drum kit, and musiccheck still
     owns that end of it: nothing here touches skyI's meaning. */
  float ph=dot(r,vec2(0.9,0.7))+f*0.55+f2*0.30+t*0.010+uCombo*0.42+0.16*uPock*uBeat+uPal*0.085;
  m=pow(m,mix(1.0,0.72,uCombo));
  float ca=0.022+0.05*rd;
  /* ---- BLACK HOLE: chromatic aberration — gravity disperses light ---- */
  if(uBH>0.0) ca+=uBH*0.12*(0.5+rd);
  vec3 col=vec3(palette(ph-ca).r,palette(ph).g,palette(ph+ca).b);
  col*=pow(m,uExp);
  /* THE HIGHLIGHTS CARRY THE WORLD'S COLOUR NOW, and this is what was making
     six worlds look like two. These two terms were fixed near-whites —
     vec3(0.92,0.86,1.00) and vec3(1.0,0.97,0.92) — added on top of the
     palette wherever m is high. m is high in the bright cloud regions, which
     are precisely the parts of the frame the eye reads, so every world's
     highlights were the same cream no matter what its palette said. Rendered
     side by side, DUSTLANE and VEIL were the same picture while carrying
     completely different palettes (amber against violet): the palette only
     survived in the dim regions nobody looks at.
     A white core is still right for the very hottest pixels — that is what
     makes a bright thing read as bright rather than as saturated — so the
     constant term stays and the palette is added to it. The mid highlight
     leans mostly world, the hot core mostly white. */
  col+=pow(m,3.2)*(vec3(0.26)+1.05*palette(ph+0.10))*0.62;
  col+=pow(m,7.5)*(vec3(0.62)+0.72*palette(ph+0.18))*0.85;
  /* ---- THE LAP IN PROGRESS, PAINTED ACROSS THE SKY ----
     THE FIX FOR "many people have complained they didnt even know they were
     supposed to do orbits". The arena has carried a lap arc on the ring for a
     long time and it did not teach: it is three pixels of stroke inside the
     busiest part of the screen, at the exact radius the player is scanning
     for shards. So the lap is drawn where there is nothing else to look at.
     The sector of sky BEHIND the comet — everything swept since the lap began
     — lifts, with a soft bright seam riding at the comet's own angle, and the
     wedge closes as the orbit completes. The far term holds it off the arena:
     it starts outside the orbit band and grows toward the rim, so it can
     teach without ever adding light to the annulus a shard is read against. */
  if(uOrb.w>0.0){
    float rel=mod((uOrb2.x-fa)*uOrb2.y,6.28318);
    float inArc=smoothstep(0.0,0.30,uOrb.w*6.28318-rel);
    float far=smoothstep(0.17,0.55,ar);
    float seam=exp(-rel*rel*42.0)*far;
    float lit=inArc*far*(0.34+0.42*uOrb.x);
    col+=col*lit+palette(ph+0.30)*(lit*0.035+seam*0.055);
  }
  if(wake>0.0) col+=palette(ph+0.35)*wake*0.30;
  /* the streak's other half. Small on purpose: the ROTATION is what carries
     the reward, and light is the thing the luminance band polices. */
  col*=(0.74+0.52*uEnergy)*(1.0+0.30*uCombo)*(1.0+0.12*uOrb.x);
  col*=(1.0+0.06*uBeat);
  /* ---- FRAME DRAGGING: the whole sky turns into the hole ----
     The star layers sample screen space, so they were the one part of the
     backdrop the lensing never touched — the nebula bent and the stars sat
     still on top of it, which is exactly the tell that nothing is really being
     pulled anywhere. They now rotate about the arena centre and compress
     toward it, both falling off with distance so the rim is nearly untouched
     and the middle visibly winds in. The rotation grows with the mode's own
     clock, so over seventeen seconds the inner sky turns about half a
     revolution. Purely a sampling transform: no star moves in any coordinate
     the game reads, and nothing outside this shader knows it happened. */

     photon ring. It fades with BH.warp, so the whole thing arrives and
     leaves with the orbits rather than cutting.

     THIS WAS GATED ON `BG` — that is, on WebGL having FAILED. The arena-space
     black hole, the only one drawn at the scale of the player's own orbits,
     rendered exclusively on the devices where the shader had given up. Every
     device with a working GPU got the shader's version instead: a backdrop
     term behind the game canvas, under the fog and the vignette, whose
     strongest component is a 0.35 palette cross-fade. That is the whole
     explanation for "nothing but some purple color" — the good art was
     switched off precisely where it would have been seen. It draws
     unconditionally now, and the shader's well composites underneath it
     rather than instead of it. */
  if(bhActive()){
    const k=BH.warp,rr=radiusOf(0);
    ctx.save();
    ctx.globalAlpha=Math.min(1,k);
    /* the well: everything toward the centre goes to nothing */
    const wg=ctx.createRadialGradient(cx,cy,0,cx,cy,rr*1.15);
    wg.addColorStop(0,'rgba(2,2,6,1)');
    wg.addColorStop(0.42,'rgba(4,3,12,0.92)');
    wg.addColorStop(0.78,'rgba(10,6,26,0.55)');
    wg.addColorStop(1,'rgba(10,6,26,0)');
    ctx.fillStyle=wg;
    ctx.beginPath();ctx.ellipse(cx,cy,rr*1.15,rr*1.15*AY,0,0,TAU);ctx.fill();
    if(!RM){
      /* ig runs 1 -> 0 across the horizon display; lit stays up for the rest
         of the mode once the fourth ring has been claimed, so the hole is
         visibly FEEDING afterwards rather than snapping back to idle */
      const ig=BH.igT>0?BH.igT/BH_IGNITE:0,ig2=ig*ig,lit=BH.lit?1:0;
      ctx.globalCompositeOperation='lighter';
      /* ---- THE WARPED GRID: spacetime as a funnel ----
         Only during the display, and underneath everything else. Concentric
         ellipses whose centres sag toward the hole as they shrink, plus
         spokes — the standard picture of a gravity well, which is the one
         image that says "this is what the fourth ring is INSIDE of". */
      if(ig>0.004){
        ctx.globalAlpha=k*ig2*0.42;
        ctx.strokeStyle='rgba(150,190,255,0.85)';
        ctx.lineWidth=1*u;
        for(let i=0;i<9;i++){
          const R=rr*(0.30+0.19*i),dip=rr*0.46*Math.exp(-R/(rr*0.62));
          ctx.beginPath();
          ctx.ellipse(cx,cy+dip,R,R*0.34*AY,0,0,TAU);
          ctx.stroke();
        }
        ctx.globalAlpha=k*ig2*0.26;
        for(let s=0;s<16;s++){
          const a2=s/16*TAU;
          ctx.beginPath();
          ctx.moveTo(cx+Math.cos(a2)*rr*0.30,cy+Math.sin(a2)*rr*0.30*0.34*AY+rr*0.30);
          ctx.lineTo(cx+Math.cos(a2)*rr*2.0,cy+Math.sin(a2)*rr*2.0*0.34*AY);
          ctx.stroke();
        }
      }
      /* ---- RELATIVISTIC JETS: the axis fires ----
         Two tapering beams out of the poles, brightest at ignition and held at
         a third of that once the horizon is claimed. Drawn before the disc so
         the disc's near edge crosses in front of them, which is what sells the
         jet as coming OUT of something rather than sitting on top of it. */
      /* the grid loop above leaves globalAlpha at its own faint value; the jet
         gradients carry their own alpha, so the context has to be handed back
         at full first or the beams inherit ~0.23 and vanish (they did) */
      ctx.globalAlpha=Math.min(1,k);
      /* A STANDING JET, not one that only exists after the horizon is claimed.
         This read 0.34*lit + 0.9*ig, and `lit` is zero until the player reaches
         the fourth ring while `ig` is a 1.9s flash — so for most of a black
         hole, and for ALL of one the player never dives into, the axis fired
         nothing. The jets are half the silhouette of the thing; they are what
         makes the shape read as a black hole from the first frame. There is a
         floor under them now, and claiming the horizon still doubles it. */
      const jet=Math.min(1,0.15+0.34*lit+0.9*ig);
      if(jet>0.01){
        /* A JET IS A CONE, NOT A LINE. The first pass drew a 0.045R base with a
           1.6px core and it read on screen as a hairline scratch through the
           middle of the arena — the one element of the reference images that
           carries the whole silhouette, rendered as a scratch. Three times the
           base width, a wider flare at the tip, a soft outer sheath under a
           tighter inner beam, and the core is now a gradient-filled wedge
           rather than a stroked line. */
        const L=rr*2.2;
        const flick=0.88+0.12*Math.sin(G.vt*9+BH.t*3);
        for(let d=-1;d<=1;d+=2){
          /* outer sheath, then the hot inner beam inside it */
          for(let s=0;s<2;s++){
            const w0=s?rr*0.018:rr*0.05,w1=s?rr*0.17:rr*0.44;
            const g2=ctx.createLinearGradient(cx,cy,cx,cy+d*L);
            const a0=(s?0.62:0.24)*jet*flick,a1=(s?0.34:0.12)*jet*flick;
            g2.addColorStop(0,'rgba(240,234,255,'+a0.toFixed(3)+')');
            g2.addColorStop(0.30,'rgba(168,132,255,'+a1.toFixed(3)+')');
            g2.addColorStop(0.72,'rgba(120,170,255,'+(a1*0.35).toFixed(3)+')');
            g2.addColorStop(1,'rgba(110,180,255,0)');
            ctx.fillStyle=g2;
            ctx.beginPath();
            ctx.moveTo(cx-w0,cy);ctx.lineTo(cx+w0,cy);
            ctx.lineTo(cx+w1,cy+d*L);ctx.lineTo(cx-w1,cy+d*L);
            ctx.closePath();ctx.fill();
          }
        }
      }
      /* ---- THE ACCRETION DISC, REBUILT AS LIGHT RATHER THAN AS WIREFRAME ----
         It was two STROKED ellipses, 9u and 5u wide, at 0.62R and 0.78R, spun
         at different rates and rotated against each other. Screenshotted on a
         390x844 phone at full mode, that is not a disc: it is two big thin
         purple loops crossing in the middle of the arena, and it reads as a
         scribble over the board — which is most of what "the effects don't
         look good" was pointing at. An accretion disc is a BAND OF LIGHT with
         a hot inner edge, not an outline of where a band would be.
         So it is filled now: a radial gradient from the photon ring outward,
         squashed to the viewing angle, white-gold where the gas is hottest at
         the inner edge and falling through the mode's violet to nothing. One
         disc rather than two, because the second was only ever there to make
         the first look less like a line.
         THE DOPPLER SIDE IS THE DETAIL THAT SELLS THE SPIN. Real discs are
         brightly asymmetric — the side rotating toward you is beamed — so a
         second pass runs a linear gradient across the same shape, hot on the
         approaching limb and gone by the far one. That, not the rotation
         rate, is what makes it read as turning. */
      const blaze=1+2.1*ig+0.35*lit;
      const tilt=Math.sin(G.vt*0.16)*0.22;         /* the disc leans, slowly */
      const flat=0.30;                              /* how near edge-on it sits */
      const dA=Math.min(1,k*1.0*blaze);
      ctx.save();
      ctx.translate(cx,cy);ctx.rotate(tilt);ctx.scale(1,flat*AY);
      const dg=ctx.createRadialGradient(0,0,rr*0.30,0,0,rr*0.98);
      dg.addColorStop(0,'rgba(255,244,222,'+(0.95*dA).toFixed(3)+')');
      dg.addColorStop(0.14,'rgba(255,206,150,'+(0.72*dA).toFixed(3)+')');
      dg.addColorStop(0.42,'rgba(186,150,255,'+(0.52*dA).toFixed(3)+')');
      dg.addColorStop(0.76,'rgba(122,132,255,'+(0.24*dA).toFixed(3)+')');
      dg.addColorStop(1,'rgba(110,140,255,0)');
      ctx.fillStyle=dg;
      ctx.beginPath();ctx.arc(0,0,rr*0.98,0,TAU);ctx.fill();
      /* THE BEAMED LIMB IS A CRESCENT, NOT A WASH. The first cut filled the
         whole disc ellipse a second time under a left-to-right gradient, and
         on screen that is a grey wedge the width of the arena — it read as a
         smear over the board rather than as one side of a ring being brighter
         than the other. A Doppler limb is ANNULAR: it belongs to the band, so
         it is stroked along the band's own ellipse, thick, over the ~140
         degrees facing the viewer, with the colour fading out across x so it
         dies before it reaches the receding side. */
      const bg2=ctx.createLinearGradient(-rr*0.9,0,rr*0.2,0);
      bg2.addColorStop(0,'rgba(255,246,228,'+(0.50*dA).toFixed(3)+')');
      bg2.addColorStop(0.55,'rgba(226,196,255,'+(0.20*dA).toFixed(3)+')');
      bg2.addColorStop(1,'rgba(150,160,255,0)');
      ctx.strokeStyle=bg2;ctx.lineWidth=rr*0.34;ctx.lineCap='butt';
      ctx.beginPath();ctx.arc(0,0,rr*0.60,Math.PI*0.62,Math.PI*1.38);ctx.stroke();
      ctx.restore();
      /* ---- THE SHADOW OCCLUDES THE DISC, which is the whole silhouette ----
         Drawn AFTER the disc on purpose. The well at the top of this block
         goes down first so the arena darkens behind everything; this second,
         much harder disc is what the far side of the ring passes behind, and
         without it the band simply crosses the middle and the hole stops being
         a hole. Measured before this change: the arena's inner band sat at
         0.0704 mean luminance against 0.0784 outside it — the shadow was one
         percent darker than the sky and read as nothing at all. */
      ctx.globalCompositeOperation='source-over';
      const sh=ctx.createRadialGradient(cx,cy,rr*0.16,cx,cy,rr*0.335);
      sh.addColorStop(0,'rgba(0,0,0,1)');
      sh.addColorStop(0.72,'rgba(0,0,0,0.98)');
      sh.addColorStop(1,'rgba(0,0,0,0)');
      ctx.globalAlpha=Math.min(1,k);
      ctx.fillStyle=sh;
      ctx.beginPath();ctx.ellipse(cx,cy,rr*0.335,rr*0.335*AY,0,0,TAU);ctx.fill();
      ctx.globalCompositeOperation='lighter';
      /* the photon ring — thin, bright, exactly circular, and sitting ON the
         shadow's edge now rather than floating inside it, because that edge is
         what it physically is: the last orbit light can take and still escape */
      ctx.globalAlpha=Math.min(1,k*0.72*(1+1.4*ig));
      ctx.strokeStyle='#f4ecff';ctx.lineWidth=(2.0+2.4*ig)*u;
      ctx.beginPath();ctx.ellipse(cx,cy,rr*0.318,rr*0.318*AY,0,0,TAU);ctx.stroke();
      /* ---- THE LENSED HALO: the far side of the disc, bent up over the poles.
         This is the Interstellar silhouette and the thing that makes the shape
         read as a black hole and not as a ringed planet — light from BEHIND
         the hole arriving over the top and under the bottom. It wraps the
         SHADOW rather than the disc, so it has to sit just outside the photon
         ring; at 0.40R it was drawing out in the middle of the disc band where
         nothing could tell what it was. */
      const halo=Math.min(1,k*(0.50+0.5*ig+0.14*lit));
      ctx.globalAlpha=halo;
      ctx.strokeStyle='#ffeede';ctx.lineWidth=(2.6+3*ig)*u;ctx.lineCap='round';
      ctx.beginPath();ctx.ellipse(cx,cy,rr*0.345,rr*0.345*AY,tilt,Math.PI*1.10,Math.PI*1.90);ctx.stroke();
      ctx.beginPath();ctx.ellipse(cx,cy,rr*0.345,rr*0.345*AY,tilt,Math.PI*0.10,Math.PI*0.90);ctx.stroke();
      /* ---- EVERY LIGHT ON THE BOARD BLEEDS TOWARD THE MIDDLE ----
         A tapered smear from each star and each power-up orb toward the
         singularity, brightest at the object and gone a third of the way in.
         This is what sells "all the light is being pulled in" better than any
         backdrop effect can, because it happens to the things the player is
         actually looking at rather than behind them.
         Strictly a draw: it reads s.a and s.ring through the same posAt() every
         other pass uses and writes nothing. The objects do not move, their
         collision is untouched, and turning this off changes no number. */
      ctx.globalAlpha=Math.min(1,k*(0.30+0.30*ig+0.10*lit));
      ctx.lineCap='round';
      for(let q=0;q<2;q++){
        const list=q?G.pows:G.stars;
        for(let i=0;i<list.length;i++){
          const o=list[i],op=posAt(o.a,radiusOf(o.ring));
          const dx=cx-op[0],dy=cy-op[1],dd=Math.hypot(dx,dy)||1;
          const len=Math.min(dd*0.34,rr*0.42);
          const sg=ctx.createLinearGradient(op[0],op[1],op[0]+dx/dd*len,op[1]+dy/dd*len);
          sg.addColorStop(0,q?'rgba(190,150,255,0.75)':'rgba(255,225,150,0.80)');
          sg.addColorStop(1,'rgba(180,160,255,0)');
          ctx.strokeStyle=sg;ctx.lineWidth=(q?2.6:1.9)*u;
          ctx.beginPath();
          ctx.moveTo(op[0],op[1]);
          ctx.lineTo(op[0]+dx/dd*len,op[1]+dy/dd*len);
          ctx.stroke();
        }
      }
      ctx.globalAlpha=1;
      /* the ignition flash, over everything, brief */
      if(ig>0.02){
        const fg=ctx.createRadialGradient(cx,cy,0,cx,cy,rr*1.5);
        fg.addColorStop(0,'rgba(240,232,255,'+(0.50*ig2).toFixed(3)+')');
        fg.addColorStop(0.5,'rgba(160,120,255,'+(0.22*ig2).toFixed(3)+')');
        fg.addColorStop(1,'rgba(160,120,255,0)');
        ctx.globalAlpha=1;ctx.fillStyle=fg;
        ctx.beginPath();ctx.ellipse(cx,cy,rr*1.5,rr*1.5*AY,0,0,TAU);ctx.fill();
      }
    }
    ctx.restore();
    ctx.globalCompositeOperation='source-over';
  }
  /* the drum break drops the room dark — the spotlight moves to the kit —
     and the crash snaps the light back (musicStep flashes on the crash) */
  if(G.brkGlow>0.01){
    ctx.fillStyle='rgba(3,5,14,'+(0.30*G.brkGlow).toFixed(3)+')';
    ctx.fillRect(0,0,W,H);
  }
  /* the star dive gilds the room — the reward reads at a glance */
  if(G.finGlow>0.01){
    ctx.save();ctx.globalCompositeOperation='lighter';
    ctx.fillStyle='rgba(255,200,87,'+
      ((RM?0.025:0.018+0.028*G.beat)*G.finGlow).toFixed(3)+')';
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }
  /* hypernova floods the room magenta-white — the biggest wash in the game,
     because nothing bigger ever happens to you */
  if(G.hyperGlow>0.01){
    ctx.save();ctx.globalCompositeOperation='lighter';
    ctx.fillStyle='rgba(255,120,224,'+
      (RM?0.06*G.hyperGlow:(0.05+0.07*G.beat)*G.hyperGlow).toFixed(3)+')';
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }
  /* overdrive runs the room warm, throbbing on the landed beat */
  if(G.odGlow>0.01){
    ctx.save();ctx.globalCompositeOperation='lighter';
    ctx.fillStyle='rgba(255,170,60,'+
      (RM?0.030*G.odGlow:(0.028+0.045*G.beat)*G.odGlow).toFixed(3)+')';
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }
  /* THE SPOTLIGHT DARKENS THE HOUSE — the drum break's own gesture (above),
     reused at 0.22 against its 0.30, held for the whole four bars instead of
     a fill. The beam and the pool draw inside the world pass so they land
     under the comet; this veil sits with the washes so every gameplay
     object — shards, telegraphs, rings, orbs — draws ABOVE it at full
     brightness. Dimming the board itself would be a difficulty change (the
     pause rule: a hidden board is balance); dimming the sky behind it is
     staging. */
  if(G.spotGlow>0.01){
    ctx.fillStyle='rgba(3,5,14,'+(0.22*G.spotGlow).toFixed(3)+')';
    ctx.fillRect(0,0,W,H);
  }
  ctx.globalAlpha=1;
  /* ---- THE CALM POOL IS GONE, AND IT WAS BUYING THE SAME CONTRAST TWICE ----
     It was a 52%-black feathered wash over the entire play space, and it sat
     on top of SKY_ARENA_CALM, which already compresses local contrast in
     exactly the annulus the orbits occupy. Two independent systems subtracting
     light from the same band for the same reason, neither measured against the
     other, plus `evOut` forbidding every sky event from existing inside
     r=0.15. Measured off the shader's own output before this change, the sky
     was 2.76x brighter outside r=0.40 than inside r=0.20 — and all three
     orbits live inside 0.28. Everything good in the sky was happening where
     the player was not looking, which is most of what "the backgrounds are
     repetitive and boring" was pointing at: they were not boring at the rim,
     they were absent in the middle.
     SKY_ARENA_CALM keeps the job on its own. It is the better of the two
     because it compresses CONTRAST rather than subtracting BRIGHTNESS, so a
     shard still wins its edge against the band without the band being black.
     The owner's call was to go all the way; the dial is one constant and this
     is the first thing to move back if a playtest reports mistaking backdrop
     for hazard.
     IT SURVIVES ON THE NO-GPU PATH, and that is not a hedge. SKY_ARENA_CALM
     lives in the fragment shader, so a device that falls back to the 2D sky
     gets none of it — there the pool was not a second helping of contrast, it
     was the only helping. Deleting it outright would have removed the sole
     thing keeping a shard readable on exactly the hardware least able to
     spare the contrast. Half strength, because the 2D sky is dimmer than the
     shader's to begin with. */
  /* GATED ON !GL.on AT FIRST, AND THAT WAS THE WRONG CONDITION. The 2D
     backdrop draws into this same canvas whether or not the shader is up, and
     rendercheck's two glow paths differ in how much of it reaches the frame —
     so keying the pool on GL.on left the disc path carrying 26.3 mean
     luminance against the GPU path's 7.3, a ratio the harness fails because
     the degrade ladder swaps between them mid-run and a player would watch the
     scene change brightness. It draws on both paths, at 0.40 of its old
     weight: 52% black becomes about 21%. That is still most of the way to the
     owner's "go all the way" — the measured edge/middle ratio lands at 1.30x
     against the 2.76x this pass started from — while leaving the no-GPU path,
     which has no SKY_ARENA_CALM at all, with the only contrast protection it
     has ever had.
     AND THE NO-GPU PATH IS NOT AN OLD-PHONE PATH. An earlier draft of this
     note called it "the hardware least able to spare the contrast", which is
     wrong and worth correcting in place: WebGL 1.0 has shipped on iOS since
     Safari 8 and on Android Chrome since 2013, so essentially every phone
     that can load this page supports it. The fallback exists for MOMENTS, not
     for devices — a context that fails to create under memory pressure, a
     lost context after a GPU reset or a long backgrounding, a driver on
     Chrome's blocklist, an in-app webview or a hardened browser with WebGL
     switched off. Those happen on current hardware, mid-session, to players
     who were seeing the shader a second earlier, which is exactly why the two
     paths have to carry comparable light. */
  if(SPR.pool){
    const pw=SPR.pool.w,ph=pw*AY;
    ctx.globalAlpha=0.40;
    ctx.drawImage(SPR.pool.c,cx-pw/2,cy-ph/2,pw,ph);
    ctx.globalAlpha=1;
  }

  ctx.save();
  ctx.translate(camX,camY);   /* the world rides the dolly; HUD stays pinned */
  if(G.shake>0)ctx.translate(rand(-G.shake,G.shake)*0.5,rand(-G.shake,G.shake)*0.5);

  /* THE FOLLOWSPOT ITSELF. A beam from above the frame down to the comet and
     a pool of light flattened onto the orbital plane, both riding the same
     glow envelope as the veil so they arrive and leave together. Drawn first
     inside the world pass: light on the stage floor, actors on top. Additive,
     so it brightens whatever the level's sky left here without repainting it.
     Peak numbers, measured not guessed: beam alpha at the comet 0.09 flat
     (0.15 at beat peak), pool centre 0.14 flat (0.22 at beat peak), against
     a house veil of 0.22 — the state is legible with the sound off, where
     G.beat never moves and every flat term still draws. */
  if(G.spotGlow>0.01){
    const sp2=posPlayer(),sx=sp2[0],sy=sp2[1];
    const bA=(RM?0.11:0.09+0.06*G.beat)*G.spotGlow;
    ctx.save();ctx.globalCompositeOperation='lighter';
    const by0=-40*u;
    const bg=ctx.createLinearGradient(0,by0,0,sy);
    bg.addColorStop(0,'rgba(234,241,255,0)');
    bg.addColorStop(0.35,'rgba(234,241,255,'+(bA*0.45).toFixed(3)+')');
    bg.addColorStop(1,'rgba(234,241,255,'+bA.toFixed(3)+')');
    ctx.fillStyle=bg;
    ctx.beginPath();
    ctx.moveTo(sx-9*u,by0);ctx.lineTo(sx+9*u,by0);
    ctx.lineTo(sx+30*u,sy);ctx.lineTo(sx-30*u,sy);
    ctx.closePath();ctx.fill();
    const pg=ctx.createRadialGradient(0,0,2*u,0,0,26*u);
    pg.addColorStop(0,'rgba(234,241,255,'+((RM?0.16:0.14+0.08*G.beat)*G.spotGlow).toFixed(3)+')');
    pg.addColorStop(1,'rgba(234,241,255,0)');
    ctx.save();ctx.translate(sx,sy);ctx.scale(1,AY);
    ctx.fillStyle=pg;
    ctx.beginPath();ctx.arc(0,0,26*u,0,TAU);ctx.fill();
    ctx.restore();
    ctx.restore();
  }

  /* ORBIT RINGS AS CONDUITS: the baked cross-section (dark channel walls, a
     hot core, a halo) replaces the two wide strokes; current visibly flows
     along each track, fastest and brightest under the player; node pips
     breathe on the landed beat. The crisp 1.3px stroke and the payoff
     recolour still draw over the top. */
  for(let i=0;i<G.nRings;i++){
    const rr=radiusOf(i),on=(G.hopP>=1&&G.ringI===i);
    const tn=RINGS[Math.min(RINGS.length-1,i)].tint;
    /* THE CONDUIT IS BAKED, SO IT CANNOT FOLLOW AY THE WAY A PATH CAN.
       Every orbit PATH became an ellipse with the arena, but this ring is a
       pre-rendered circular cross-section blitted at the hub — it stayed
       perfectly round underneath its own elliptical track, which is exactly
       what a playtester photographed. Stretching it at draw time puts the
       geometry right. The channel walls do thicken toward the top and bottom
       of the loop as a consequence; on a soft gradient band that reads as the
       track leaning away rather than as an error, and it is the only way to
       keep a baked cross-section on an elliptical path. */
    if(SPR.ringCh&&SPR.ringCh[i]){
      const sp=SPR.ringCh[i];
      /* the halo follows the live radius by scaling the bake, so a warping
         arena costs one multiply instead of a gradient rebuild */
      const d=sp.s*(RAD_BAKE[i]?RADII[i]/RAD_BAKE[i]:1);
      ctx.save();
      ctx.globalAlpha=(on?1.0:0.6)*(i===3?Math.min(1,RADII[3]/RAD_BH[3]):1);
      /* the channel is this orbit's own art, so it rides this orbit's depth —
         translate BEFORE the y-scale, or the offset gets stretched with it */
      ctx.translate(ecx(rr),ecy(rr));ctx.scale(1,AY);
      ctx.drawImage(sp.c,-d/2,-d/2,d,d);
      ctx.restore();
    }
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    const mine=effRing()===i;
    ctx.setLineDash([3*u,17*u]);

     player, or anyone handed the phone, got no reminder of the controls at
     all. Each clears the instant the thing is done, so a veteran sees each for
     well under a second. */
  G.didDodge=false;G.sawDrop=false;G.taught=0;G.gotWarp=false;G.gotNova=false;
  G.didReverse=false;G.didHop=false;G.didLap=false;
  G.stars=[];G.spikes=[];G.pows=[];G.trail=[];G.rings=[];G.pops=[];G.arcs=[];G.laps=[];G.novas=[];
  G.stop=0;
  /* powT 4, not 6: paired with the dl()>=6 gate below it puts the first
     shield on the board around 10s instead of 17s, which leaves room for all
     three of the intro power-ups inside a short run. */
  G.starT=0.5;G.spikeT=1.2;G.powT=4;G.powN=0;G.started=G.t;G.tier=0;G.banner=null;
  beep(440,0.12,'sine',0.05,880);
}
function die(){
  if(G.state!=='playing')return;
  G.state='dead';G.deadT=G.t;G.revPend=0;
  G.newBest=G.score>G.best&&G.score>0;
  if(G.score>G.best){G.best=G.score;savePref('cometloop:best',G.best);}
  /* Checked before the score, and reported instead of it when both land: a
     player who just got further than they ever have should be told THAT, not
     handed a number. Level 1 is where every run starts, so it is never news. */
  G.newLevel=levelNum()>G.bestLevel&&levelNum()>1;
  if(levelNum()>G.bestLevel){G.bestLevel=levelNum();savePref('cometloop:level',G.bestLevel);}
  if(!RM){G.shake=16;G.flash=0.9;}
  const p=posPlayer();
  burst(p[0],p[1],COL.shard,26,240);
  burst(p[0],p[1],COL.comet,16,170);
  G.rings.push({x:p[0],y:p[1],r:6*u,life:1,col:'#ffffff'});
  G.rings.push({x:p[0],y:p[1],r:16*u,life:0.85,col:COL.shard});
  G.rings.push({x:p[0],y:p[1],r:30*u,life:0.6,col:COL.comet});
  /* one wide, fast, slow-fading front that outruns the rest — the moment
     needs a beat that carries past the edge of the ring system */
  if(!RM)G.rings.push({x:p[0],y:p[1],r:8*u,life:1,col:'#ffffff',sp:560,dec:1.15});
  /* landed at 50Hz — inaudible on a phone, so the most important moment in
     the game ended by simply vanishing. Now it lands somewhere you can hear. */
  /* order matters: hand A.hole back first, then let the death duck take the
     bed. The death hit itself is unaffected either way — beep() goes to
     A.world and never touches either node. */
  endSection();
  duckBed(0.05,0.9);
  beep(220,0.5,'sawtooth',0.085,110);
  beep(110,0.55,'triangle',0.06,66);
  beep(1318,0.5,'sine',0.03,196,0.02);
  try{if(navigator.vibrate)navigator.vibrate(90);}catch(e){}
  const gest=GEST.tap+GEST.swipe+GEST.lateSwipe+GEST.unresolved;
  track('run_ended',{
    score:G.score,best:G.best,new_best:G.newBest,
    run_index:G.runs,                 /* lifetime run count — this is retention */
    seconds:Math.round(G.deadT-G.started),
    orbits:G.orbits,best_streak:G.bestStreak,embers:G.embers,
    scored:G.embers>0,                /* did they ever get going at all */
    tier:G.tier,tier_name:tierLabel(),rings:G.nRings,
    /* the ordinal the player actually sees, so the funnel is readable without
       anyone having to remember that tier is zero-based */
    level:levelNum(),best_level:G.bestLevel,
    /* did the curriculum land: three placements is the whole intro set */
    pows_placed:G.powN,saw_warp:G.gotWarp,saw_nova:G.gotNova,
    death_cause:G.lastHit,
    blocks:G.blocks,                  /* shields that saved a run */
    /* the input question: what fraction of swipes produced nothing */
    gestures:gest,
    gest_tap:GEST.tap,gest_swipe:GEST.swipe,
    gest_late:GEST.lateSwipe,gest_unresolved:GEST.unresolved,
    misread_rate:gest?+(GEST.unresolved/gest).toFixed(4):0
  });
}
function reverseFX(){
  const p=posPlayer();
  ripple(p[0],p[1]);
  burst(p[0],p[1],COL.comet,6,90);
  beep(300,0.07,'square',0.045,540);
  performerHit('rev',0,effRing());
}
function reverse(silent){
  G.dir*=-1;G.didReverse=true;
  /* You lose the lap and the streak multiplier, but the embers you already
     gathered stay banked — otherwise gates, which exist to force reversals,
     would systematically delete the score you turned around to protect. */
  G.lapAcc=0;G.lapStreak=0;
  if(silent)G.revPend=G.t+REV_FX;
  else reverseFX();
}
function commitReverseFX(){
  if(G.revPend>0){G.revPend=0;reverseFX();}
}
function bump(){
  const p=posPlayer();
  burst(p[0],p[1],'rgba(170,195,255,0.85)',4,55);
  /* was 150->110Hz: under the phone-speaker rolloff, so the one cue that
     fires when a swipe was misread could not be heard at all */
  beep(560,0.07,'triangle',0.035,430,0,panAt(p[0]),0.3);
}
/* step -1 = outward (toward ring 0), +1 = inward */
function hop(step){
  if(G.hopP<1)return;
  const t=G.ringI+step,p=posPlayer();
  if(t<0||t>=G.nRings){
    bump(); /* nowhere to go — acknowledge the input rather than swallowing it */
    /* THE FREE INSTRUMENT. A flick into a wall is the only input in the game
       with no survival consequence at all: it costs no streak (reverse zeroes
       lapStreak, worth up to 28), no shield, no position. So it is the one
       you can play purely for the music. The one-note-per-sixteenth guard
       caps it, and the angle keeps advancing with shards inbound, so there is
       nothing to farm here — only something to play. */
    performerHit('rev',0,effRing());
    return;
  }
  G.didHop=true;
  G.hopFrom=radiusOf(G.ringI);
  G.hopFromI=G.ringI;
  G.ringI=t;
  G.hopP=0;
  ripple(p[0],p[1]);
  /* The cue used to contradict the gesture in both directions AND sit under
     the phone rolloff at both endpoints. Outward now falls, inward rises. */
  const out=step<0;
  beep(out?940:620,0.09,'sine',0.05,out?620:940,0,panAt(p[0]),0.35);
  build(0.042,'hop');           /* navigating by ring change is a style, not a fallback */
  performerHit('hop',step,t);   /* the ring being ARRIVED at, not the one left */
}

/* The phase move is gone. It asked the player to spend a shield PRE-EMPTIVELY,
   which meant reading a threat, deciding it was unsurvivable, and hitting a
   second button — all inside the reaction window they were already using to
   dodge. Shields are now exactly what they look like: one hit each, spent
   automatically, costing nothing else. The bottom bar is a readout, not a
   control, and the whole strip is a normal tap target again. */

/* ---------- run summary / share ----------
   The artifact travels further than the link does, so it is plain text: it
   survives every messaging app, can be quoted, and invites a reply. The
   filled/hollow bar reports how far the run got without spoiling what is in
   the tiers you have not reached. */
function runTime(){
  const s=Math.max(0,Math.round(G.deadT-G.started));
  return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
}
function tierLabel(){
  for(let i=G.tier;i>=0;i--)if(TIERS[i].name)return TIERS[i].name;
  return 'FIRST ORBIT';
}
/* THE ORDINAL. The ladder has been computed on every run since the tiers went
   in — G.tier ratchets in update(), tierLabel() names it, and runSummary()
   renders a ten-position bar of it — but the only places it ever surfaced were
   the clipboard and an analytics endpoint that ships switched off. The player
   climbing it was never told the number.
   A tester put the reason better than the design did: "reaching level XYZ
   seems more memorable and rewarding than just a highest score. Levels are
   more distinct." A score is a cardinal you cannot repeat from memory; a level
   is an ordinal you can say out loud, compare, and come back for. This costs
   one function and some text — the simulation underneath is untouched. */
const LEVEL_MAX=TIERS.length;
function levelNum(){return G.tier+1;}
function runSummary(){
  let bar='';
  for(let i=0;i<TIERS.length;i++)bar+=(i<=G.tier?'◆':'◇');
  /* The level leads and the score moves down a line. A shared score is a
     number nobody can place; a shared level is a claim that invites one back
     — "level 6" is answerable in a way "4300" is not. */
  return 'Comet Loop · LEVEL '+levelNum()+'/'+LEVEL_MAX+'\n'+
    bar+' '+tierLabel()+'\n'+
    G.score+' points · '+G.orbits+' orbits · ×'+G.bestStreak+' streak · '+runTime()+'\n'+
    (G.bestGroove>=2?'groove ×'+G.bestGroove+'\n':'')+
    /* a deep link to index.html shares worse than the directory it lives in */
    (location.origin+location.pathname).replace(/index\.html$/,'');
}
function doShare(){
  const txt=runSummary();
  beep(660,0.09,'sine',0.05,990);
  track('share_tapped',{score:G.score,tier:G.tier,run_index:G.runs});
  try{
    if(navigator.share){navigator.share({text:txt}).catch(function(){});return;}
  }catch(e){}
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){
        G.shareFx=G.t+1.8;
      }).catch(function(){});
    }
  }catch(e){}
}

/* ---------- input ---------- */
function muteRect(){const s=24*u;return{x:W-s-16*u,y:safeTop+14*u,w:s,h:s};}
/* Pinned to the bottom of the safe area — it is a one-thumb game, and this is
   the only part of the screen the thumb rests on anyway. */
function shieldRect(){
  const w=116*u,h=46*u;
  return{x:cx-w/2,y:H-safeBot-h-16*u,w:w,h:h};
}
function inMute(x,y){
  const r=muteRect(),pad=14;
  return x>=r.x-pad&&x<=r.x+r.w+pad&&y>=r.y-pad&&y<=r.y+r.h+pad;
}
/* Sits above TAP TO RETRY, and shares the same 0.6s lockout so a frantic
   retry tap right after dying can never land on it by accident. */
function shareRect(){
  const w=132*u,h=42*u;
  /* cy+76u collided with the best-groove line at cy+78u once that was added.
     Positioned against the LAST element above it, not against the score. */
  return{x:cx-w/2,y:cy+92*u,w:w,h:h};
}
function inShare(x,y){
  if(G.state!=='dead'||G.t-G.deadT<=0.6)return false;
  const r=shareRect(),pad=8*u;
  return x>=r.x-pad&&x<=r.x+r.w+pad&&y>=r.y-pad&&y<=r.y+r.h+pad;
}
let pd=null;
cv.addEventListener('pointerdown',function(e){
  e.preventDefault();ensureAudio();
  if(inMute(e.clientX,e.clientY)){toggleMute();return;}
  if(inShare(e.clientX,e.clientY)){doShare();return;} /* must precede the retry tap */
  if(G.state==='menu'){startGame();return;}
  if(G.state==='dead'){if(G.t-G.deadT>0.6)startGame();return;}
  if(pd)return; /* one gesture at a time: a second finger can't double-reverse */
  const saved={lap:G.lapAcc,streak:G.lapStreak,emb:G.lapEmbers};
  reverse(true); /* direction flips instantly; sound and sparks wait */
  pd={id:e.pointerId,x:e.clientX,y:e.clientY,saved:saved,ang:G.angle,far:0,radial:0,swiped:false};
});
/* RADIAL SWIPE. Direction is read against the line from the centre through
   the comet, so "away from the middle" always means out and "toward the
   middle" always means in, wherever the comet happens to be on the circle.
   The reference angle is where the comet was when the gesture started, which
   is what the player was actually looking at when they committed. */
const RADIAL_MIN=0.34; /* ~20 degrees off tangential before we call it */
cv.addEventListener('pointermove',function(e){
  if(!pd||pd.id!==e.pointerId||G.state!=='playing')return;
  const dx=e.clientX-pd.x,dy=e.clientY-pd.y;
  const len=Math.sqrt(dx*dx+dy*dy);
  pd.far=len;
  if(len<32)return;
  if(!pd.swiped){
    /* it was a swipe: roll back the speculative reverse, effects never fired */
    pd.swiped=true;
    G.revPend=0;
    G.dir*=-1;
    G.lapAcc=pd.saved.lap;
    G.lapStreak=pd.saved.streak;
    G.lapEmbers=pd.saved.emb;
  }
  pd.radial=dx*Math.cos(pd.ang)+dy*Math.sin(pd.ang);
  /* A flick almost exactly along the ring is genuinely ambiguous — keep
     watching rather than guessing; it resolves as the finger travels. */
  if(Math.abs(pd.radial)>=len*RADIAL_MIN){
    const out=pd.radial>0;
    pd=null;
    GEST.swipe++;          /* resolved mid-drag: the clean case */
    hop(out?-1:1);
  }
});
function pdEnd(e){
  if(pd&&e&&pd.id!==e.pointerId)return;
  if(pd){
    if(pd.swiped){
      /* Still ambiguous at lift. A clear lean commits; a flick essentially
         along the ring has no radial answer, so bump rather than coin-flip. */
      if(Math.abs(pd.radial)>pd.far*0.12){GEST.lateSwipe++;hop(pd.radial>0?-1:1);}
      /* Swiped and got nothing. This is the misread rate worth watching. */
      else{GEST.unresolved++;bump();}
    }else{
      GEST.tap++;
      commitReverseFX();
    }
  }
  pd=null;
}
cv.addEventListener('pointerup',pdEnd);
cv.addEventListener('pointercancel',pdEnd);
cv.addEventListener('contextmenu',function(e){e.preventDefault();});
window.addEventListener('keydown',function(e){
  if(e.code==='Space'||e.code==='Enter'){
    e.preventDefault();ensureAudio();
    if(G.state==='menu')startGame();
    else if(G.state==='dead'){if(G.t-G.deadT>0.6)startGame();}
    else reverse(false);
  }else if(e.code==='ArrowUp'||e.code==='KeyW'||e.code==='ArrowLeft'||e.code==='KeyA'){
    e.preventDefault();
    if(G.state==='playing')hop(-1);
  }else if(e.code==='ArrowDown'||e.code==='KeyS'||e.code==='ArrowRight'||e.code==='KeyD'){
    e.preventDefault();
    if(G.state==='playing')hop(1);
  }else if(e.code==='KeyM'){
    toggleMute();
  }
});

/* ---------- update ---------- */
function pushTrail(){
  const p=posPlayer();
  G.trail.push({x:p[0],y:p[1],life:1});
  if(G.trail.length>50)G.trail.shift();
}
const BLINK=1.15; /* dormant for the back 45% of each cycle */
/* bt restarts at 0 the moment a shard arms, so a pair cannot be staggered by
   seeding bt — bo shifts where in the cycle it starts instead. */
function blinkPhase(s){return (s.bt+(s.bo||0))%BLINK;}
function armed(s){return s.blink?(blinkPhase(s)<BLINK*0.55):true;}
function updateSpikes(sdt,lethal){
  const er=effRing(),pr=radiusOf(er);
  for(let i=G.spikes.length-1;i>=0;i--){
    const s=G.spikes[i];s.t+=sdt;
    if(s.va)s.a=(s.a+s.va*sdt)%TAU;
    if(s.blink)s.bt+=sdt;
    if(s.phase===0&&s.t>=(s.warn||WARN)){s.phase=1;s.t=0;s.bt=0;}
    else if(s.phase===1&&s.t>=s.life){s.phase=2;s.t=0;}
    /* survived one: the "red is lethal" prompt has done its job */
    else if(s.phase===2&&s.t>=FADE){G.spikes.splice(i,1);G.didDodge=true;continue;}
    /* a moving shard's hitbox is widened by however far it travelled this frame */
    const tol=(18.5*u)/pr+Math.abs(s.va)*sdt;
    if(lethal&&s.phase===1&&armed(s)&&s.ring===er&&G.t>=G.invuln&&sweptHit(s.a,tol)){
      if(G.shields>0){
        /* A SHIELD MEANS YOU LIVE. That is the whole of it. It used to also
           zero lapAcc and lapStreak, so being saved still cost you the orbit
           you were most of the way through and broke the run's flow at the
           exact moment the shield was supposed to protect it. The shield
           itself is the price. */
        G.shields--;G.invuln=G.t+0.9;G.blocks++;
        s.phase=2;s.t=0;
        const p=posPlayer();
        burst(p[0],p[1],COL.shield,18,180);
        ripple(p[0],p[1],COL.shield);
        popup(p[0],p[1]-24*u,'SHIELD USED',COL.shield);
        G.didShield=true;G.didDodge=true;
        /* a save that sounded like a punishment: square falling to 90Hz sat
           in the death register and below what a phone reproduces */
        beep(392,0.16,'triangle',0.075,588);
        beep(784,0.20,'sine',0.055,1046,0.05);
      }else{
        /* flags, not a stored type: twin and blinktwin are two independent
           shards, so a single one cannot report which pairing it came from */
        G.lastHit=s.gate?(s.va?'driftgate':'gate'):(s.blink?'blink':(s.va?'drift':'single'));
        die();
      }
    }
  }
}
function update(dt){
  G.t+=dt;
  G.shake=Math.max(0,G.shake-dt*45);
  G.flash=Math.max(0,G.flash-dt*1.6);
  G.scorePop=Math.max(0,G.scorePop-dt*3.5);
  G.beat=Math.max(0,G.beat-dt*4.5);
  G.grooveFx=Math.max(0,G.grooveFx-dt*2.2);
  G.dropFx=Math.max(0,G.dropFx-dt*1.1);
  G.payOpen=Math.max(0,G.payOpen-dt*1.4);
  if(G.armFx){G.armFx.t+=dt;if(G.armFx.t>2.6)G.armFx=null;}
  if(MU&&MU.pay<=0)G.build=Math.max(0,G.build-dt*0.011);
  if(G.sayFx){G.sayFx.t+=dt;if(G.sayFx.t>1.8)G.sayFx=null;}
  /* stop playing and the groove lets go, so it always reflects what you are
     doing now rather than something you did a minute ago */
  if(G.groove>0&&G.t>G.grooveT){G.groove--;G.grooveT=G.t+0.7;}
  if(G.groove>G.bestGroove)G.bestGroove=G.groove;
  G.slow=Math.max(0,G.slow-dt);
  G.stop=Math.max(0,G.stop-dt);
  bedTick(dt);
  const tsT=G.slow>0?0.55:1;
  G.tsCur+=(tsT-G.tsCur)*Math.min(1,dt*8);
  if(G.hopP<1)G.hopP=Math.min(1,G.hopP+dt/HOP);
  if(G.revPend>0&&G.t>=G.revPend){G.revPend=0;reverseFX();}
  for(let i=G.parts.length-1;i>=0;i--){
    const p=G.parts[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    p.vx*=Math.pow(0.15,dt);p.vy*=Math.pow(0.15,dt);
    p.life-=p.dec*dt;
    if(p.life<=0)G.parts.splice(i,1);
  }
  for(let i=G.rings.length-1;i>=0;i--){
    /* per-ripple speed and decay, so a death shockwave can outrun a pickup pop */
    const r=G.rings[i];r.r+=(r.sp||170)*u*dt;r.life-=(r.dec||2.8)*dt;
    if(r.life<=0)G.rings.splice(i,1);
  }
  for(let i=G.arcs.length-1;i>=0;i--){
    const a=G.arcs[i];a.life-=2.6*dt;
    if(a.life<=0)G.arcs.splice(i,1);
  }
  for(let i=G.laps.length-1;i>=0;i--){
    const L=G.laps[i];L.life-=1.35*dt;
    if(L.life<=0)G.laps.splice(i,1);
  }
  /* dt, not sdt: the blast keeps expanding through the hitstop it caused */
  for(let i=G.novas.length-1;i>=0;i--){
    const n=G.novas[i];
    /* Paced to the RING SYSTEM, not to the screen. The farthest shard is 2R
       from a blast centred on the comet, which the 560 front crosses in about
       0.65s, so 0.8 (1.25s of life) leaves the sweep comfortably inside the
       window with room for a wide screen — and still expires long before it
       could eat shards that spawn well after the blast. */
    n.r+=NOVA_SP*u*dt; n.life-=0.8*dt;
    for(let j=G.spikes.length-1;j>=0;j--){
      const q=posAt(G.spikes[j].a,radiusOf(G.spikes[j].ring));
      if(Math.hypot(q[0]-n.x,q[1]-n.y)<=n.r)novaConvert(G.spikes.splice(j,1)[0]);
    }
    if(n.life<=0){
      /* safety net: nothing survives a nova just because the front timed out */
      while(G.spikes.length)novaConvert(G.spikes.pop());
      G.novas.splice(i,1);
    }
  }
  for(let i=G.pops.length-1;i>=0;i--){
    const p=G.pops[i];p.y-=34*u*dt;p.life-=1.1*dt;
    if(p.life<=0)G.pops.splice(i,1);
  }
  for(let i=G.trail.length-1;i>=0;i--){
    const tr=G.trail[i];tr.life-=dt*2.1;
    if(tr.life<=0)G.trail.splice(i,1);
  }

  if(G.state==='menu'){G.sweep=0;G.angle+=0.8*dt;pushTrail();return;}
  if(G.state==='dead'){G.sweep=0;updateSpikes(dt,false);return;}

  /* playing */
  /* Effects run on dt, gameplay on sdt — so during hitstop the comet holds
     still while the ignition keeps playing. That contrast is the impact. */
  const sdt=dt*G.tsCur*(G.stop>0?0.10:1);
  /* a slow floor ramp so the game can never be stalled by refusing to score */
  G.speed=speedAt();
  /* announce each new mechanic so it registers as something to learn */
  const ti=tierIndex();
  if(ti>G.tier){
    G.tier=ti;
    const T=TIERS[ti];
    if(T.rings&&T.rings>G.nRings){
      G.nRings=T.rings;
      const nr=radiusOf(G.nRings-1);
      G.rings.push({x:cx,y:cy,r:nr*0.3,life:1,col:COL.comet});
      G.rings.push({x:cx,y:cy,r:nr,life:1,col:COL.comet});
      beep(330,0.2,'sine',0.05,660);
      beep(660,0.25,'sine',0.05,990,0.16);
    }
    if(T.name){
      G.banner={str:T.name,sub:T.sub,t:0};
      fireLift();      /* ceremony, not a chorus — see fireLift */
      ripple(cx,cy,COL.ember);   /* earned, so gold — see the banner draw */
      beep(300,0.16,'triangle',0.05,220);
      beep(240,0.22,'triangle',0.05,180,0.14);
    }
  }
  if(G.banner){G.banner.t+=dt;if(G.banner.t>3.2)G.banner=null;}
  G.prevAngle=G.angle;
  G.sweep=G.speed*sdt;
  G.angle=(G.angle+G.dir*G.speed*sdt)%TAU;
  pushTrail();

  /* full orbit: 360 degrees of travel without reversing (hops allowed).
     Payout scales with the embers gathered during it, so a bare orbit is
     worth almost nothing and the two scoring systems feed each other. */
  G.lapAcc+=G.speed*sdt;
  if(G.lapAcc>=TAU){
    G.lapAcc-=TAU;
    const fed=G.lapEmbers>0;
    if(fed)G.lapStreak++;else G.lapStreak=0;
    G.orbits++;G.bestStreak=Math.max(G.bestStreak,G.lapStreak);
    const base=6+13*Math.min(G.lapEmbers,LAP_EMB_MAX);
    const streakBonus=fed?Math.min(7*(G.lapStreak-1),28):0;
    const bonus=base+streakBonus;
    G.score+=bonus;G.scorePop=1;
    G.diff+=1;
    const lp=posPlayer();
    const label=(G.lapStreak>1?'ORBIT \u00d7'+G.lapStreak+' +':'ORBIT +')+bonus;
    if(fed){
      const st=G.lapStreak;
      /* everything below scales with the streak, so the payoff grows with
         the difficulty of having earned it */
      const k=Math.min(1,(st-1)/4);
      popup(lp[0],lp[1]-28*u,label,COL.ember,1+0.45*k);
      ignite(G.ringI,G.angle,G.dir,st);
      ripple(lp[0],lp[1],COL.ember);
      /* a wide slow front off the ring itself, not just off the comet */
      G.rings.push(RM?{x:cx,y:cy,r:radiusOf(G.ringI),life:1,col:COL.ember}
        :{x:cx,y:cy,r:radiusOf(G.ringI),life:1,col:COL.ember,sp:150+120*k,dec:1.6});
      burst(lp[0],lp[1],COL.ember,18+Math.round(14*k),190+90*k);
      duckBed(0.45,0.35);
      beep(523,0.12,'triangle',0.07,784);
      beep(784,0.12,'triangle',0.07,1046,0.1);
      beep(1046,0.16,'triangle',0.07,1568,0.2);
      /* thresholds, not a floor: `st>=5` fired on every fed orbit past the
         fifth, which at mid-run speed is roughly every three seconds */
      /* was `st===5||st===9||st===14` — exact values, so past 14 it could
         never fire again; a player on a streak of 99 earned nothing from
         orbits after the first minute. The requirement now ESCALATES instead:
         5 laps, then 15, then 25. Laps are the passive route — you get them
         by not dying — so making each one dearer is what keeps the section
         special now that the cooldown no longer throws earnings away. */
      /* The gap GROWS each time. A fed orbit lands about every nine seconds,
         so a flat step meant a drop roughly every fourth orbit for the whole
         run and half the run turned into payoff. Growing the requirement is
         what keeps the section rare without the cooldown throwing earnings
         away: 4 orbits, then 9, then 16, then 25. */
      build(0.085,'orbit');
      if(st>=3){
        /* Earned tier: the comet stops dead for a beat while the ring burns
           round. Short enough not to break the rhythm of a 2.5s orbit. */
        if(!RM)G.stop=Math.max(G.stop,0.075);
        if(!RM)G.flash=Math.max(G.flash,0.16+0.10*k);
        beep(1568,0.18,'triangle',0.05,2093,0.3);
        try{if(navigator.vibrate)navigator.vibrate(18);}catch(e){}
      }
    }else{
      popup(lp[0],lp[1]-26*u,label,'rgba(200,215,255,0.7)');
      beep(392,0.1,'triangle',0.04,440);
    }
    G.lapEmbers=0;G.didLap=true;
    checkMile();
  }
  G.comboT=Math.max(0,G.comboT-sdt);
  if(G.comboT<=0)G.combo=0;

  G.starT-=sdt;
  if(G.starT<=0&&G.stars.length<emberCap()){spawnStar();G.starT=emberGap()*rand(0.75,1.4);}
  G.spikeT-=sdt;
  if(G.spikeT<=0&&age()>=firstShardAt()&&G.spikes.length<shardCap()){
    spawnSpike();
    G.spikeT=spawnGap()*rand(0.85,1.15);
  }
  G.powT-=sdt;
  if(G.powT<=0&&G.pows.length===0&&dl()>=6){
    G.powT=spawnPow()?Math.max(6,rand(10,15)-dl()*0.02):0.5;
  }

  const er=effRing();
  /* embers */
  for(let i=G.stars.length-1;i>=0;i--){
    const s=G.stars[i];s.t+=sdt;
    if(s.t>s.life){G.stars.splice(i,1);continue;}
    if(s.ring===er&&sweptHit(s.a,(22*u)/radiusOf(er))){
      G.stars.splice(i,1);
      G.combo=Math.min(G.combo+1,6);G.comboT=CW;
      G.score+=G.combo;G.diff+=1;G.scorePop=1;
      G.lapEmbers++;G.embers++;
      const p=posAt(s.a,radiusOf(s.ring));
      burst(p[0],p[1],COL.ember,14,150);
      ripple(p[0],p[1],COL.ember);
      arcFlash(s.a,s.ring,COL.ember);
      popup(p[0],p[1]-20*u,'+'+G.combo,COL.ember);
      /* THE EMBER RUN. Was 700Hz gliding to 1400 — the most repeated sound in
         the game, 104 cents sharp of E5 and smeared across an octave by the
         slide. Now the chain walks the pentatonic and RESOLVES on the octave:
         G5 A5 C6 D6 E6 G6. The thing the player was already doing for score
         produces a phrase with a cadence, at no timing cost whatsoever. */
      beep(PENT[Math.min(9,3+G.combo)],0.09,'sine',0.06,0,0,panAt(p[0]),0.35);
      beep(PENT[Math.min(13,5+G.combo)],0.10,'sine',0.05,0,0.045,panAt(p[0]),0.35);
      build(0.016,'ember');
      checkMile();
    }
  }
  /* power-ups */
  for(let i=G.pows.length-1;i>=0;i--){
    const s=G.pows[i];s.t+=sdt;
    if(s.t>s.life){G.pows.splice(i,1);continue;}
    if(s.ring===er&&sweptHit(s.a,(22*u)/radiusOf(er))){
      const p=posAt(s.a,radiusOf(s.ring));
      G.pows.splice(i,1);
      arcFlash(s.a,s.ring,s.type==='shield'?COL.shield:(s.type==='warp'?COL.warp:COL.nova));
      if(s.type==='shield'){
        if(G.shields>=shieldMax()){G.score+=2;popup(p[0],p[1]-20*u,'+2',COL.shield);
          beep(659,0.09,'sine',0.04,880,0,panAt(p[0]),0.3);}
        else{G.shields++;popup(p[0],p[1]-20*u,'SHIELD \u00d7'+G.shields,COL.shield);}
        burst(p[0],p[1],COL.shield,14,150);
        ripple(p[0],p[1],COL.shield);
        beep(520,0.12,'triangle',0.06,780);
      }else if(s.type==='warp'){
        G.slow=4;G.gotWarp=true;
        popup(p[0],p[1]-20*u,'SLOW-MO',COL.warp);
        burst(p[0],p[1],COL.warp,14,150);
        ripple(p[0],p[1],COL.warp);
        beep(400,0.3,'sine',0.07,150);
      }else{
        /* The front does the converting — see novaBlast/novaConvert. */
        G.gotNova=true;
        novaBlast(p[0],p[1]);
        /* You are standing inside your own blast, so nothing may kill you
           while it sweeps. Dying mid-nova was always the wrong ending.
           Sized to the sweep: 0.7 covered the old 0.22s front with room to
           spare, but the front now takes ~0.65s to reach the far side of the
           ring system and the guarantee has to outlast it. */
        G.invuln=Math.max(G.invuln,G.t+0.95);
        popup(p[0],p[1]-24*u,'NOVA!',COL.nova,1.7);
        ripple(p[0],p[1],COL.nova);
        burst(p[0],p[1],COL.nova,34,320);
        burst(p[0],p[1],'#ffffff',14,190);
        if(!RM){
          /* longer than the orbit's 75ms — this is the rarest thing here and
             should outrank the routine celebration, not sit beneath it */
          G.stop=Math.max(G.stop,0.11);
          G.flash=Math.max(G.flash,0.55);
          G.shake=Math.max(G.shake,11);
        }
        duckBed(0.10,0.6);
        beep(180,0.5,'sawtooth',0.07,1500);
        beep(90,0.55,'sine',0.06,45);
        beep(1250,0.15,'sine',0.05,1900,0.13);
        try{if(navigator.vibrate)navigator.vibrate([26,40,60]);}catch(e){}
      }
    }
  }
  updateSpikes(sdt,true);
}

/* ---------- draw helpers ---------- */
function drawShardOutline(x,y,r,al,dash){
  ctx.save();ctx.translate(x,y);ctx.rotate(Math.PI/4);
  ctx.globalAlpha=al;
  ctx.strokeStyle=COL.shard;ctx.lineWidth=2.5;
  if(dash)ctx.setLineDash([4*u,3.5*u]);
  ctx.strokeRect(-r*0.7,-r*0.7,r*1.4,r*1.4);
  ctx.setLineDash([]);
  if(dash){ctx.fillStyle=COL.shard;ctx.fillRect(-1.6*u,-1.6*u,3.2*u,3.2*u);}
  ctx.globalAlpha=1;ctx.restore();
}
function drawPow(x,y,s,al){
  ctx.save();ctx.translate(x,y);ctx.globalAlpha=al;
  const pulse=1+0.15*Math.sin(s.t*5);
  if(s.type==='shield'){
    ctx.shadowColor=COL.shield;ctx.shadowBlur=12;
    ctx.strokeStyle=COL.shield;ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(0,0,10*u*pulse,0,TAU);ctx.stroke();
    ctx.fillStyle=COL.shield;
    ctx.beginPath();ctx.arc(0,0,3.5*u,0,TAU);ctx.fill();
  }else if(s.type==='warp'){
    ctx.shadowColor=COL.warp;ctx.shadowBlur=12;
    ctx.strokeStyle=COL.warp;ctx.lineWidth=2.5;
    ctx.save();ctx.rotate(s.t*2);
    ctx.strokeRect(-7*u*pulse,-7*u*pulse,14*u*pulse,14*u*pulse);
    ctx.restore();
    ctx.save();ctx.rotate(-s.t*2+Math.PI/4);
    ctx.strokeRect(-4*u,-4*u,8*u,8*u);
    ctx.restore();
  }else{
    ctx.shadowColor='#ffb36b';ctx.shadowBlur=14;
    ctx.strokeStyle=COL.nova;ctx.lineWidth=2;
    ctx.save();ctx.rotate(s.t*1.2);
    ctx.beginPath();
    for(let i=0;i<16;i++){
      const sr=(i%2===0)?11*u*pulse:4*u,aa=i*Math.PI/8;
      if(i===0)ctx.moveTo(Math.cos(aa)*sr,Math.sin(aa)*sr);
      else ctx.lineTo(Math.cos(aa)*sr,Math.sin(aa)*sr);
    }
    ctx.closePath();ctx.stroke();
    ctx.restore();
    ctx.fillStyle=COL.nova;
    ctx.beginPath();ctx.arc(0,0,2.5*u,0,TAU);ctx.fill();
  }
  ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.restore();
}
/* The old stack led with -apple-system, so on the device this actually ships
   to every word was San Francisco: the system UI face, which reads as a
   settings screen rather than a game. This leads with geometric sans instead —
   Avenir Next on iOS and macOS, Century Gothic or Trebuchet on Windows,
   Roboto on Android. Circular bowls and a high x-height suit a game made
   entirely of circles, and it costs nothing: every one of these ships with the
   OS, so there is still no font to download and no network call. */
const F='"Avenir Next","Avenir",Futura,"Century Gothic","Trebuchet MS",'+
        '"Segoe UI",Roboto,system-ui,sans-serif';
function text(str,x,y,size,weight,col,ls){
  ctx.fillStyle=col;
  ctx.font=weight+' '+Math.round(size)+'px '+F;
  try{ctx.letterSpacing=(ls||0)+'px';}catch(e){}
  ctx.fillText(str,x,y);
  try{ctx.letterSpacing='0px';}catch(e){}
}

/* ---------- bloom ----------
   Screen-space bloom without ever reading back the main canvas. The obvious
   route — drawImage(cv) into a small buffer — measures ~16ms a frame, because
   pulling 1.3M pixels back out stalls the pipeline; having budget spare does
   not help when the single operation eats all of it.
   So the bright objects are re-drawn as crude blobs into a quarter-size
   buffer instead. Precision is pointless there: the upscale blurs it past
   recognition, and bilinear filtering on the way back up IS the blur. */
const BLOOM_DIV=4,BLOOM_ALPHA=0.34;
let bloomC=null,bloomG=null;
function bloomDot(g,x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,TAU);g.fill();}
function drawBloom(){
  if(!bloomC){bloomC=document.createElement('canvas');bloomG=bloomC.getContext('2d');}
  const bw=Math.max(1,Math.ceil(W/BLOOM_DIV)),bh=Math.max(1,Math.ceil(H/BLOOM_DIV));
  if(bloomC.width!==bw||bloomC.height!==bh){bloomC.width=bw;bloomC.height=bh;}
  const g=bloomG,s=1/BLOOM_DIV;
  g.setTransform(1,0,0,1,0,0);
  g.clearRect(0,0,bw,bh);
  g.setTransform(s,0,0,s,0,0);
  g.globalCompositeOperation='lighter';
  for(const st of G.stars){
    const p=posAt(st.a,radiusOf(st.ring));
    bloomDot(g,p[0],p[1],10*u,COL.ember);
  }
  for(const sp of G.spikes){
    if(sp.phase!==1||!armed(sp))continue;
    const p=posAt(sp.a,radiusOf(sp.ring));
    bloomDot(g,p[0],p[1],11*u,COL.shard);
  }
  for(const pw of G.pows){
    const p=posAt(pw.a,radiusOf(pw.ring));
    bloomDot(g,p[0],p[1],10*u,pw.type==='shield'?COL.shield:(pw.type==='warp'?COL.warp:COL.nova));
  }
  for(const pt of G.parts){
    if(pt.life<=0)continue;
    bloomDot(g,pt.x,pt.y,pt.size*pt.life*1.6,pt.col);
  }
  if(G.state!=='dead'){
    const p=posPlayer();
    bloomDot(g,p[0],p[1],17*u,'#7ce9ff');
    bloomDot(g,p[0],p[1],8*u,'#ffffff');
  }
  g.setTransform(1,0,0,1,0,0);
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=BLOOM_ALPHA;
  ctx.drawImage(bloomC,0,0,W,H);
  ctx.restore();
}

/* The comet lights the track it is riding: a short arc centred on it, falling
   off both ways. Decorative, but it also makes "which ring am I on" readable
   at a glance without looking away from the comet. */
const RING_LIT=[[0.62,0.030,7],[0.40,0.048,4.5],[0.22,0.078,2.6],[0.10,0.105,1.6]];
function drawRingGlow(){
  const rr=curR();
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  /* the lit track takes its own colour, so the light under the comet says
     which ring you are on as plainly as the arrangement does */
  ctx.strokeStyle='rgb('+RINGS[Math.min(RINGS.length-1,effRing())].tint+')';
  for(const L of RING_LIT){
    ctx.globalAlpha=L[1];
    ctx.lineWidth=L[2]*u;
    ctx.beginPath();ctx.arc(cx,cy,rr,G.angle-L[0],G.angle+L[0]);ctx.stroke();
  }
  ctx.restore();
}
function drawTail(){
  const n=G.trail.length;
  if(n<4)return;
  const nx=new Array(n),ny=new Array(n),bw=new Array(n);
  for(let i=0;i<n;i++){
    const p=G.trail[i];
    const a=G.trail[i+1<n?i+1:n-1],b=G.trail[i>0?i-1:0];
    let tx=a.x-b.x,ty=a.y-b.y;
    const L=Math.sqrt(tx*tx+ty*ty);
    if(L<1e-4){tx=1;ty=0;}else{tx/=L;ty/=L;}
    nx[i]=-ty;ny[i]=tx;
    /* width tapers by both age and position, so the head stays fat */
    bw[i]=8*u*Math.pow(Math.max(p.life,0),0.7)*(0.16+0.84*i/(n-1));
  }
  /* Width, alpha, colour. The narrow pass runs near-white so the ribbon goes
     hot at its centre and cools outward, the way anything incandescent does —
     one flat cyan read as paint rather than as burning. */
  const passes=[[2.5,0.075,COL.comet],[1.35,0.16,'#8ef2ff'],[0.6,0.34,'#e6fdff']];
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  for(let k=0;k<passes.length;k++){
    const m=passes[k][0];
    ctx.globalAlpha=passes[k][1];
    ctx.fillStyle=passes[k][2];
    ctx.beginPath();
    for(let i=0;i<n;i++){
      const p=G.trail[i],w=bw[i]*m;
      const X=p.x+nx[i]*w,Y=p.y+ny[i]*w;
      if(i===0)ctx.moveTo(X,Y);else ctx.lineTo(X,Y);
    }
    for(let i=n-1;i>=0;i--){
      const p=G.trail[i],w=bw[i]*m;
      ctx.lineTo(p.x-nx[i]*w,p.y-ny[i]*w);
    }
    ctx.closePath();ctx.fill();
  }
  ctx.restore();
}

/* ---------- the visible beat ----------
   The old pulse breathed the RINGS, at peak alpha 0.05 against static strokes
   on the same path summing to ~0.265 — and it PEAKED ON THE BEAT. You cannot
   synchronise to a flash that arrives at the same moment as the thing it is
   announcing; human reaction is ~250ms and an eighth here is 288ms. It was also
   4.5x brighter at groove x8 than at x0, so the game showed you the beat most
   clearly exactly when you least needed it and dimmest while you were trying
   to find it.

   What people actually synchronise to is continuous motion with a predictable
   arrival, and it has to land where the eye already is. So: a ring that
   contracts onto the comet over the half-beat BEFORE each beat, and lands. */
function beatPhase(){
  if(!AC||!MU||!MU.next||AC.state!=='running'||G.state!=='playing')return -1;
  /* MU.next is the next UNSCHEDULED eighth and sits ahead of now by the
     lookahead, so the quarter boundary is derived from it, not subtracted. */
  const q=MU.next+((MU.step%2)?SPB/2:0);
  let d=(q-AC.currentTime)%SPB;if(d<0)d+=SPB;
  return 1-d/SPB;
}
function drawBeat(p){
  const ph=beatPhase();if(ph<0)return;
  /* fades back for a veteran who has clearly found it, and stays for everyone
     else. It is a teaching aid first and an ornament second. */
  const vis=(G.runs>6&&G.bestGroove>=5)?0.45:1;
  ctx.save();ctx.globalCompositeOperation='lighter';
  ctx.strokeStyle=(G.groove>=3||G.pay>0)?COL.warp:'rgba(200,225,255,1)';
  if(RM){
    /* one opacity step per beat is 1.73Hz — far below any flash threshold,
       and it still carries the anticipation */
    ctx.globalAlpha=(ph>0.62?0.28:0.09)*vis;ctx.lineWidth=2*u;
    ctx.beginPath();ctx.arc(p[0],p[1],32*u,0,TAU);ctx.stroke();
  }else{
    const a=Math.max(0,(ph-0.5)*2);        /* 288ms of visible approach */
    if(a>0){
      ctx.globalAlpha=(0.05+0.24*a*a)*vis;ctx.lineWidth=(1.2+1.3*a)*u;
      ctx.beginPath();ctx.arc(p[0],p[1],(32+18*(1-a))*u,0,TAU);ctx.stroke();
    }
    if(G.beat>0.02){                       /* the landing, at a level you see */
      ctx.globalAlpha=G.beat*(0.30+0.045*G.groove+0.10*G.payOpen)*vis;
      ctx.lineWidth=(1.6+3.2*G.beat)*u;
      ctx.beginPath();ctx.arc(p[0],p[1],(32+6*(1-G.beat))*u,0,TAU);ctx.stroke();
    }
  }
  ctx.restore();
}
/* ---------- draw ---------- */
function draw(){
  const amb=RM?0:G.t;
  if(SPR.bg)ctx.drawImage(SPR.bg.c,0,0,W,H);
  if(SPR.neb)for(let i=0;i<nebulas.length;i++){
    const n=nebulas[i],sp=SPR.neb[i];
    const nr=n.r*Math.max(W,H)*0.5;
    const nx=(n.x+0.02*Math.sin(amb*0.07+n.ph))*W;
    const ny=(n.y+0.02*Math.cos(amb*0.05+n.ph))*H;
    ctx.drawImage(sp.c,nx-nr,ny-nr,nr*2,nr*2);
  }
  /* Slow parallax on the baked sky, with a handful of live twinklers on top. */
  const sdx=RM?0:Math.sin(amb*0.030)*17,sdy=RM?0:Math.cos(amb*0.023)*17;
  if(SPR.stars)ctx.drawImage(SPR.stars.c,-28+sdx,-28+sdy,SPR.stars.w,SPR.stars.h);
  ctx.globalCompositeOperation='lighter';
  ctx.fillStyle='#dcebff';
  for(const st of bgStars){
    ctx.globalAlpha=RM?0.4:(0.10+0.55*(0.5+0.5*Math.sin(amb*st.tw+st.ph)));
    ctx.beginPath();ctx.arc(st.x*W+sdx,st.y*H+sdy,st.r,0,TAU);ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=1;

  ctx.save();
  if(G.shake>0)ctx.translate(rand(-G.shake,G.shake)*0.5,rand(-G.shake,G.shake)*0.5);

  /* orbit rings */
  for(let i=0;i<G.nRings;i++){
    const rr=radiusOf(i),on=(G.hopP>=1&&G.ringI===i);
    /* Each track carries its own colour, cooling from deep blue on the outside
       to a keen cyan-white inside — the same axis the sound moves along, so
       the picture and the arrangement are saying one thing rather than two. */
    const tn=RINGS[Math.min(RINGS.length-1,i)].tint;
    ctx.strokeStyle='rgba('+tn+',0.045)';ctx.lineWidth=13;
    ctx.beginPath();ctx.arc(cx,cy,rr,0,TAU);ctx.stroke();
    ctx.strokeStyle='rgba('+tn+','+(on?0.145:0.065)+')';ctx.lineWidth=4.5;
    ctx.beginPath();ctx.arc(cx,cy,rr,0,TAU);ctx.stroke();
    /* the arena changes colour for the whole section. static, so it is safe
       under reduced motion — and it is the only whole-section signal an RM
       player gets, so they get it too. */
    ctx.strokeStyle=G.pay>0?(on?'rgba(196,160,255,0.46)':'rgba(170,140,240,0.17)')
                           :'rgba('+tn+','+(on?0.46:0.17)+')';
    ctx.lineWidth=1.3;
    ctx.beginPath();ctx.arc(cx,cy,rr,0,TAU);ctx.stroke();
  }
  /* How much of your section is left. One slow monotonic sweep — no flashing,
     no motion beyond the arc itself, so it is drawn for everyone including
     reduced motion, where it is the structural readout. */
  if(G.pay>0){
    ctx.save();ctx.globalAlpha=0.24;ctx.strokeStyle=COL.warp;ctx.lineWidth=2.5;
    ctx.beginPath();
    /* radiusOf(nRings-1) is the INNERMOST ring — this was drawing the section
       readout inside the arena instead of framing it. Ring 0 is the outer. */
    ctx.arc(cx,cy,radiusOf(0)+13*u,-Math.PI/2,-Math.PI/2+TAU*G.pay);
    ctx.stroke();ctx.restore();
  }
  ctx.globalCompositeOperation='lighter';
  ctx.fillStyle='rgba(120,160,255,0.5)';
  ctx.beginPath();ctx.arc(cx,cy,2.6,0,TAU);ctx.fill();
  ctx.fillStyle='rgba(120,160,255,0.10)';
  ctx.beginPath();ctx.arc(cx,cy,8,0,TAU);ctx.fill();
  ctx.globalCompositeOperation='source-over';
  drawRingGlow();

  /* lap progress arc — colour reports how well fed this orbit is */
  if(G.state==='playing'&&G.lapAcc>0.05){
    const lr=curR()+6*u;
    let a0,a1;
    if(G.dir===1){a0=G.angle-G.lapAcc;a1=G.angle;}
    else{a0=G.angle;a1=G.angle+G.lapAcc;}
    ctx.globalAlpha=0.55;
    ctx.strokeStyle=G.lapEmbers>=3?COL.ember:(G.lapEmbers>=1?COL.comet:'rgba(170,195,255,0.55)');
    ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(cx,cy,lr,a0,a1);ctx.stroke();
    ctx.globalAlpha=1;
  }
  /* embers banked this orbit are drawn in the HUD — see drawHUD */
  /* Gesture guide: start dragging and the radial axis appears, so which way
     is "out" is never something you have to work out in your head. */
  if(pd&&pd.far>12&&G.state==='playing'&&G.nRings>1){
    const ca=Math.cos(pd.ang),sa=Math.sin(pd.ang);
    const rIn=Math.max(9*u,radiusOf(G.nRings-1)-17*u),rOut=radiusOf(0)+21*u;
    ctx.save();
    ctx.globalAlpha=0.3;
    ctx.strokeStyle=COL.comet;ctx.lineWidth=1.5;
    ctx.setLineDash([5*u,5*u]);
    ctx.beginPath();
    ctx.moveTo(cx+ca*rIn,cy+sa*rIn);
    ctx.lineTo(cx+ca*rOut,cy+sa*rOut);
    ctx.stroke();
    ctx.setLineDash([]);
    const head=function(rr,facing,al){
      ctx.globalAlpha=al;
      ctx.save();
      ctx.translate(cx+ca*rr,cy+sa*rr);
      ctx.rotate(pd.ang+(facing>0?0:Math.PI));
      ctx.beginPath();
      ctx.moveTo(8*u,0);ctx.lineTo(-4*u,5*u);ctx.lineTo(-4*u,-5*u);ctx.closePath();
      ctx.fillStyle=COL.comet;ctx.fill();
      ctx.restore();
    };
    head(rOut,1,G.ringI>0?0.8:0.18);              /* outward */
    head(rIn,-1,G.ringI<G.nRings-1?0.8:0.18);     /* inward */
    ctx.globalAlpha=1;ctx.restore();
  }
  /* slow-mo timer arc */
  if(G.slow>0){
    ctx.strokeStyle=COL.warp;ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(cx,cy,14*u,-Math.PI/2,-Math.PI/2+TAU*(G.slow/4));ctx.stroke();
  }

  /* embers */
  ctx.globalCompositeOperation='lighter';
  for(const s of G.stars){
    const p=posAt(s.a,radiusOf(s.ring));
    let al=1;
    if(s.t<0.3)al=s.t/0.3;
    else if(s.life-s.t<0.8)al=(s.life-s.t)/0.8;
    blit(SPR.ember,p[0],p[1],1+0.18*Math.sin(s.t*6),s.t*1.5,al);
  }
  ctx.globalCompositeOperation='source-over';
  /* power-ups */
  for(const s of G.pows){
    const p=posAt(s.a,radiusOf(s.ring));
    let al=1;
    if(s.t<0.3)al=s.t/0.3;
    else if(s.life-s.t<0.8)al=(s.life-s.t)/0.8;
    drawPow(p[0],p[1],s,al);
  }
  /* Gate bars: a rung across every ring reads instantly as "you cannot hop
     past". Built as a wide soft pass under a tight core so it registers as
     energy rather than a drawn line, and overhangs both ends of the ring
     stack so it reads as a barrier across the field, not a chord within it. */
  for(const s of G.spikes){
    if(!s.gate||s.ring!==0||s.phase===2)continue;
    const i0=posAt(s.a,radiusOf(0)+11*u);
    const i1=posAt(s.a,Math.max(5*u,radiusOf(G.nRings-1)-11*u));
    const live=s.phase===1&&armed(s);
    const base=live?0.52:0.16+0.14*Math.sin(s.t*12);
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    ctx.strokeStyle=COL.shard;ctx.lineCap='round';
    ctx.globalAlpha=base*0.30;ctx.lineWidth=10*u;
    ctx.beginPath();ctx.moveTo(i0[0],i0[1]);ctx.lineTo(i1[0],i1[1]);ctx.stroke();
    ctx.globalAlpha=base*0.9;ctx.lineWidth=2.2*u;
    ctx.beginPath();ctx.moveTo(i0[0],i0[1]);ctx.lineTo(i1[0],i1[1]);ctx.stroke();
    if(live&&!RM){
      /* rungs crawling along the span sell it as powered rather than painted */
      ctx.globalAlpha=0.45;ctx.lineWidth=2.6*u;
      ctx.setLineDash([5*u,9*u]);
      ctx.lineDashOffset=-(G.t*46*u)%(14*u);
      ctx.beginPath();ctx.moveTo(i0[0],i0[1]);ctx.lineTo(i1[0],i1[1]);ctx.stroke();
    }
    ctx.restore();
  }
  /* shards */
  for(const s of G.spikes){
    const p=posAt(s.a,radiusOf(s.ring));
    /* drifters trail a short arc showing which way they are sliding */
    if(s.va&&s.phase===1){
      const rr=radiusOf(s.ring),back=-Math.sign(s.va)*0.30;
      ctx.globalAlpha=0.3;ctx.strokeStyle=COL.shard;ctx.lineWidth=2.5;
      ctx.beginPath();
      ctx.arc(cx,cy,rr,Math.min(s.a,s.a+back),Math.max(s.a,s.a+back));
      ctx.stroke();ctx.globalAlpha=1;
    }
    if(s.phase===0){
      const k=s.t/(s.warn||WARN);
      const bl=0.5+0.5*Math.sin(s.t*(10+k*30));
      drawShardOutline(p[0],p[1],(8+3*k)*u,0.34+0.6*bl);
    }else if(s.phase===1){
      if(armed(s)){
        blit(SPR.shard,p[0],p[1],1,0,1);
      }else{
        /* dormant blinker: same silhouette, hollow — safe to cross right now */
        const q=1-(blinkPhase(s)-BLINK*0.55)/(BLINK*0.45);
        drawShardOutline(p[0],p[1],10*u,0.5+0.3*q,true);
      }
    }else{
      const k=s.t/FADE;
      blit(SPR.shard,p[0],p[1],1-k*0.4,0,1-k);
    }
  }
  /* NOVA FRONT: a wide soft leading edge with a hard bright rim inside it,
     plus a second rim trailing slightly so it reads as a shell with
     thickness rather than an expanding hoop. */
  ctx.globalCompositeOperation='lighter';
  for(const n of G.novas){
    const lf=Math.max(n.life,0);
    ctx.strokeStyle=COL.nova;
    ctx.globalAlpha=lf*0.30;
    ctx.lineWidth=26*u*lf;
    ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,TAU);ctx.stroke();
    ctx.strokeStyle='#ffffff';
    ctx.globalAlpha=lf*0.85;
    ctx.lineWidth=(1.5+4*lf)*u;
    ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,TAU);ctx.stroke();
    if(n.r>34*u){
      ctx.globalAlpha=lf*0.30;
      ctx.lineWidth=(1+2.5*lf)*u;
      ctx.beginPath();ctx.arc(n.x,n.y,n.r-22*u,0,TAU);ctx.stroke();
    }
  }
  /* ORBIT IGNITION: a head runs the full circumference in the direction you
     were travelling, with the wake burning behind it. Drawn as a body arc
     plus a short bright leading segment, so the eye tracks the head rather
     than a ring that merely brightens. */
  ctx.globalCompositeOperation='lighter';
  for(const L of G.laps){
    const t=1-Math.max(L.life,0);
    const sweep=RM?TAU:Math.min(1,t/0.62)*TAU;
    /* Offset outside the ring. On the ring it lands under the comet's own
       tail and reads as more trail; sitting just proud of it, gold against
       the tail's cyan, it reads as the orbit itself catching light. */
    const rr=radiusOf(L.ring)+9*u,lf=Math.max(L.life,0);
    const a0=L.dir>0?L.a:L.a-sweep, a1=L.dir>0?L.a+sweep:L.a;
    ctx.strokeStyle=COL.ember;
    ctx.globalAlpha=lf*0.30*L.mag;
    ctx.lineWidth=(3+9*lf)*u*L.mag;
    ctx.beginPath();ctx.arc(cx,cy,rr,a0,a1);ctx.stroke();
    ctx.globalAlpha=lf*0.62*L.mag;
    ctx.lineWidth=(1.4+3*lf)*u*L.mag;
    ctx.beginPath();ctx.arc(cx,cy,rr,a0,a1);ctx.stroke();
    if(sweep<TAU){
      const head=L.dir>0?a1:a0,w=0.22;
      ctx.strokeStyle='#fffdf2';
      ctx.globalAlpha=Math.min(1,lf*1.3)*L.mag;
      ctx.lineWidth=(3.5+5*lf)*u*L.mag;
      ctx.beginPath();ctx.arc(cx,cy,rr,head-w*(L.dir>0?1:0),head+w*(L.dir>0?0:1));ctx.stroke();
    }
  }
  for(const a of G.arcs){
    const lf=Math.max(a.life,0),half=0.09+0.5*(1-lf);
    ctx.globalAlpha=lf*lf*0.75;
    ctx.strokeStyle=a.col;ctx.lineWidth=(1+4*lf)*u;
    ctx.beginPath();ctx.arc(cx,cy,radiusOf(a.ring),a.a-half,a.a+half);ctx.stroke();
  }
  /* ripples */
  for(const r of G.rings){
    const lf=Math.max(r.life,0);
    ctx.globalAlpha=lf*0.55;
    ctx.strokeStyle=r.col;ctx.lineWidth=1+2*lf;
    ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,TAU);ctx.stroke();
  }
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=1;
  /* Comet tail: a single tapered ribbon rather than a chain of dots, drawn
     in three additive passes so it falls off like light instead of paint. */
  drawTail();
  if(G.state!=='dead'){
    const p=posPlayer();
    let pal=1;
    if(G.t<G.invuln)pal=0.45+0.35*Math.sin(G.t*30);
    ctx.globalCompositeOperation='lighter';
    blit(SPR.cometGlow,p[0],p[1],1,0,pal);
    ctx.globalCompositeOperation='source-over';
    blit(SPR.comet,p[0],p[1],1,0,pal);
    drawBeat(p);
    for(let k=0;k<G.shields;k++)
      blit(SPR.shieldRing,p[0],p[1],(1.18+k*0.34)*(1+0.07*Math.sin(G.t*6-k*0.7)),0,pal*(0.72-k*0.16));
    if(G.t<G.invuln){
      ctx.globalAlpha=Math.min(1,(G.invuln-G.t)*1.6)*0.55;
      ctx.strokeStyle=COL.shield;ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(p[0],p[1],(19+5*Math.sin(G.t*16))*u,0,TAU);ctx.stroke();
      ctx.globalAlpha=1;
    }
  }
  /* particles */
  ctx.globalCompositeOperation='lighter';
  /* Stretched along travel, so a burst reads as energy thrown outward rather
     than confetti. Velocity damps hard (0.15^dt), so the streak collapses to
     a round spark within a few frames on its own — the shape is the motion. */
  for(const p of G.parts){
    const lf=Math.max(p.life,0),r=p.size*lf+0.5;
    ctx.globalAlpha=lf;ctx.fillStyle=p.col;
    const st=1+Math.min(Math.sqrt(p.vx*p.vx+p.vy*p.vy)/150,2.2);
    if(st>1.15){
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(Math.atan2(p.vy,p.vx));
      ctx.scale(st,1/Math.sqrt(st)); /* thin as it lengthens, area roughly held */
      ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.fill();
      ctx.restore();
    }else{
      ctx.beginPath();ctx.arc(p.x,p.y,r,0,TAU);ctx.fill();
    }
  }
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=1;
  /* Bloom sits inside the shaken transform so it stays registered with the
     world it is blooming, and under the popups so text stays crisp. */
  drawBloom();
  /* score popups */
  ctx.textAlign='center';
  for(const p of G.pops){
    ctx.globalAlpha=Math.max(p.life,0);
    text(p.str,p.x,p.y,14*u*(p.sz||1),'800',p.col,1);
  }
  ctx.globalAlpha=1;
  ctx.restore();

  /* slow-mo tint */
  if(G.tsCur<0.98){
    const k=Math.min(1,(1-G.tsCur)/0.45);
    const vg=ctx.createRadialGradient(cx,cy,Math.min(W,H)*0.2,cx,cy,Math.max(W,H)*0.7);
    vg.addColorStop(0,'rgba(140,90,255,0)');
    vg.addColorStop(1,'rgba(140,90,255,'+(0.16*k)+')');
    ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  }

  /* The world keeps rendering behind the game-over text — rings, embers and
     fading shards all competing with the score. Drop it back before the HUD
     goes on so the numbers you actually came for are legible. */
  if(G.state==='dead'){
    ctx.fillStyle='rgba(6,9,19,'+(Math.min(1,(G.t-G.deadT)/0.35)*0.80).toFixed(3)+')';
    ctx.fillRect(0,0,W,H);
  }
  drawHUD();
  drawMute();
  drawShieldBtn();
  drawShareBtn();
  if(G.flash>0){
    ctx.fillStyle='rgba(255,255,255,'+(G.flash*0.5)+')';
    ctx.fillRect(0,0,W,H);
  }
}

function drawShieldBtn(){
  if(G.state!=='playing')return;
  const r=shieldRect(),midY=r.y+r.h/2,has=G.shields>0;
  const pulse=has?0.55+0.2*Math.sin(G.t*3.2):0.22;
  ctx.save();
  /* No frame any more. It read as a button because it WAS one, and it is now
     a readout — a pill outline invites a press it no longer answers. */
  ctx.globalAlpha=1;
  /* one glyph per shield slot, matching the pickup icon */
  /* slots have to fit the widened bank, so the pitch closes up rather than
     the pips spilling out of the button */
  const mx=shieldMax(),gap=Math.min(30*u,(r.w-30*u)/Math.max(1,mx-1));
  const x0=r.x+r.w/2-(mx-1)*gap/2;
  for(let i=0;i<mx;i++){
    const on=i<G.shields,x=x0+i*gap;
    ctx.globalAlpha=on?pulse+0.35:0.16;
    ctx.strokeStyle=COL.shield;ctx.lineWidth=on?2.2:1.4;
    ctx.beginPath();ctx.arc(x,midY,9*u,0,TAU);ctx.stroke();
    if(on){
      ctx.fillStyle=COL.shield;
      ctx.beginPath();ctx.arc(x,midY,3.4*u,0,TAU);ctx.fill();
    }
  }
  ctx.globalAlpha=1;ctx.restore();
}
function drawShareBtn(){
  if(G.state!=='dead'||G.t-G.deadT<=0.6)return;
  const r=shareRect(),midY=r.y+r.h/2,rad=r.h/2;
  const copied=G.shareFx>G.t;
  ctx.save();
  ctx.globalAlpha=copied?0.85:0.5;
  ctx.strokeStyle=COL.comet;ctx.lineWidth=1.6;
  ctx.beginPath();
  ctx.moveTo(r.x+rad,r.y);ctx.lineTo(r.x+r.w-rad,r.y);
  ctx.arc(r.x+r.w-rad,midY,rad,-Math.PI/2,Math.PI/2);
  ctx.lineTo(r.x+rad,r.y+r.h);
  ctx.arc(r.x+rad,midY,rad,Math.PI/2,-Math.PI/2);
  ctx.closePath();ctx.stroke();
  ctx.globalAlpha=1;
  ctx.textAlign='center';ctx.textBaseline='middle';
  text(copied?'COPIED':'SHARE',cx,midY,14*u,'800',COL.comet,3);
  ctx.restore();
}
function drawMute(){
  const r=muteRect(),x=r.x+r.w/2,y=r.y+r.h/2,s=r.w/2;
  ctx.save();
  ctx.globalAlpha=muted?0.72:0.5;
  ctx.fillStyle='#cfe4ff';ctx.strokeStyle='#cfe4ff';
  ctx.lineWidth=1.8;ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(x-s*0.8,y-s*0.28);ctx.lineTo(x-s*0.42,y-s*0.28);
  ctx.lineTo(x-s*0.02,y-s*0.72);ctx.lineTo(x-s*0.02,y+s*0.72);
  ctx.lineTo(x-s*0.42,y+s*0.28);ctx.lineTo(x-s*0.8,y+s*0.28);
  ctx.closePath();ctx.fill();
  ctx.beginPath();
  if(muted){
    ctx.moveTo(x+s*0.28,y-s*0.36);ctx.lineTo(x+s*0.8,y+s*0.36);
    ctx.moveTo(x+s*0.8,y-s*0.36);ctx.lineTo(x+s*0.28,y+s*0.36);
  }else{
    ctx.arc(x+s*0.14,y,s*0.36,-0.85,0.85);
    ctx.moveTo(x+s*0.14+s*0.68*Math.cos(-0.85),s*0.68*Math.sin(-0.85)+y);
    ctx.arc(x+s*0.14,y,s*0.68,-0.85,0.85);
  }
  ctx.stroke();
  ctx.restore();
}

/* EVERY RUN TEACHES. These used to stop after run six, on the theory that a
   veteran should never see them — but each one clears the instant the player
   does the thing, so a veteran sees each for well under a second and a new
   player gets the whole ladder no matter when they pick the game up. The flags
   they key off are all per-run now, so the sequence replays from the top every
   time without ever standing between anyone and the next input. */
function hintText(){
  if(G.state!=='playing')return null;
  const a=age();
  /* First match wins, so this list IS the curriculum and its order is the
     lesson plan. Each entry either clears when the player does the thing or
     times out, so exactly one idea is ever on screen and nothing can sit there
     blocking the rest of the ladder. */
  if(!G.didReverse)return 'tap anywhere to turn around';
  /* Only once there is somewhere to hop TO. A run opens on a single ring for
     its first 20 seconds, so without this the prompt asks a new player to
     make the one gesture the game will not answer — they swipe, nothing
     happens, and the controls read as broken at the exact moment they are
     being learned.
     IT NOW OUTRANKS THE LAP PROMPT. The hop is the unfamiliar half of the
     control scheme — a radial swipe on a circle, where "away from the middle"
     points a different way at every point of the orbit — and the lap prompt
     used to hold the line until 22s, handing over just as the board filled.
     Whichever lesson is harder should get the quiet part of the run. */
  if(!G.didHop&&G.nRings>1)return 'swipe up or down to switch track';
  /* NAME THE ORB WHILE IT IS STILL ON THE BOARD. Slow-mo and nova were taught
     nowhere at all: you touched a coloured dot and something large happened
     that you had no word for. These sit high in the ladder because a pickup
     lives 7s, and a lesson that waits for the commoner prompts to clear is a
     lesson that arrives after the thing it describes has gone. */
  for(const pw of G.pows){
    if(pw.type==='warp'&&!G.gotWarp)return 'violet slows everything down';
    if(pw.type==='nova'&&!G.gotNova)return 'white turns every shard to sparks';
  }
  if(!G.didLap&&a<22)return 'collect sparks, then finish a lap';
  if(!G.didDodge&&G.spikes.length)return 'red kills \u2014 turn or switch track';
  /* Widened at the front to meet the first shield, which the power-up
     curriculum now places around 10s rather than 17s. */
  if(!G.didShield&&a>9&&a<22)return 'each shield saves you from one hit';
  /* Named after the ring now visibly contracting onto the comet, and phrased
     as an invitation rather than an instruction — a struggling player does not
     need another demand. */
  /* didGroove is the LIFETIME flag behind the one-time IN TIME popup; the
     prompt keys off this run's own chain, so it still reminds someone who
     learned it weeks ago and has not used it today. */
  if(G.bestGroove<2&&a>28&&G.groove<2)return 'tap in time with the beat';
  if(!G.sawDrop&&a>34&&G.build>0.25)return 'fill the bar to earn a drop';
  return null;
}

/* THE LADDER, DRAWN. Ten pips, one per tier, filled up to where this run got
   — the same rotated-square idiom as the lap-ember pips, so the game says
   "progress" one way rather than two. The empty half is the point as much as
   the full half: a player who dies on level 3 can see that seven more exist,
   which is the thing a bare score can never tell them. */
function drawLadder(x,y,tier){
  const pipW=13*u,x0=x-(LEVEL_MAX-1)*pipW/2;
  for(let i=0;i<LEVEL_MAX;i++){
    ctx.save();ctx.translate(x0+i*pipW,y);ctx.rotate(Math.PI/4);
    const on=i<=tier;
    ctx.globalAlpha=on?0.95:0.25;
    if(on){ctx.fillStyle=COL.ember;ctx.fillRect(-3.4*u,-3.4*u,6.8*u,6.8*u);}
    else{ctx.strokeStyle='rgba(200,215,255,0.9)';ctx.lineWidth=1.2;
      ctx.strokeRect(-3.4*u,-3.4*u,6.8*u,6.8*u);}
    ctx.restore();
  }
  ctx.globalAlpha=1;
}
function drawHUD(){
  ctx.textAlign='center';ctx.textBaseline='alphabetic';
  const top=safeTop;
  const bottomY=Math.min(H-24*u-safeBot,cy+R+52*u);
  if(G.state==='playing'){
    const sz=46*u*(1+0.25*G.scorePop);
    text(G.score,cx,top+52*u,sz,'800','#eaf1ff',0);
    /* The level replaces BEST here. The score directly above is already the
       live number, and a second number you cannot affect this second is worth
       less than the one that says where in the game you are. */
    text('LEVEL '+levelNum()+' · '+tierLabel(),cx,top+76*u,13*u,'700',
      'rgba(255,200,87,0.72)',2);
    /* embers banked toward this orbit's payout */
    const pipW=10*u,x0=cx-(LAP_EMB_MAX-1)*pipW/2,py=top+92*u;
    for(let i=0;i<LAP_EMB_MAX;i++){
      ctx.save();ctx.translate(x0+i*pipW,py);ctx.rotate(Math.PI/4);
      const on=i<G.lapEmbers;
      ctx.globalAlpha=on?0.95:0.22;
      if(on){ctx.fillStyle=COL.ember;ctx.fillRect(-2.8*u,-2.8*u,5.6*u,5.6*u);}
      else{ctx.strokeStyle='rgba(200,215,255,0.9)';ctx.lineWidth=1.2;ctx.strokeRect(-2.8*u,-2.8*u,5.6*u,5.6*u);}
      ctx.restore();
    }
    ctx.globalAlpha=1;
    /* THE COUNTER SAYS WHAT IT IS FOR. "GROOVE x5" is a score with no verb in
       it \u2014 it never told anyone what the number counts or what it buys, which
       is why the drop read as something that just happened to you. It now
       names the action and states the target it is climbing towards. */
    /* A short viewport cannot hold the explanatory column without it reaching
       down into the arena, so the sub-lines are earned by having the room. */
    const roomy=(top+186*u)<(cy-R);
    if(G.groove>=1){
      ctx.globalAlpha=Math.min(1,0.45+0.12*G.groove)*(0.8+0.2*G.grooveFx);
      text('IN TIME \u00d7'+G.groove,cx,top+136*u,13*u*(1+0.12*G.grooveFx),'800',COL.warp,2);
      ctx.globalAlpha=1;
    }
    /* The orbit streak lived only inside a popup that showed for under a
       second once per orbit, so the run's longest-commitment behaviour was
       also its least visible. It no longer claims to earn a drop by itself —
       everything feeds one meter now, and that meter is drawn below. */
    if(G.lapStreak>=2&&roomy){
      ctx.globalAlpha=0.5;
      text('LAPS \u00d7'+G.lapStreak,cx,top+154*u,9.5*u,'700',
        'rgba(255,200,120,0.85)',2);
      ctx.globalAlpha=1;
    }
    /* WHY A DROP IS COMING, at the moment it is earned. Named, so the cause
       and the payoff are connected across the bars between them. */
    if(G.armFx){
      const a=Math.min(1,G.armFx.t/0.22)*Math.min(1,(2.6-G.armFx.t)/0.7);
      ctx.globalAlpha=Math.max(0,a);
      const ay=roomy?190:150;
      text(G.armFx.why,cx,top+ay*u,12*u,'800',COL.warp,3);
      /* Earned while the music was busy: say so, rather than swallowing it.
         The player did the thing and the game owes them an answer. */
      text(G.armFx.banked?'DROP BANKED':'DROP INCOMING',cx,top+(ay+18)*u,15*u,'800',
        G.armFx.banked?'rgba(200,175,255,0.95)':'#eaf1ff',4);
      ctx.globalAlpha=1;
    }
    /* THE BUILD, ALWAYS VISIBLE. This is the answer to "I have no idea how
       drops are happening": the bar fills from everything you do well, and
       when it is full you get one. Once armed it switches to showing the
       run-up instead, so the same strip of screen carries the whole story
       from earning it to hearing it. */
    if(MU&&G.pay<=0){
      const armed=MU.armed||MU.rise||MU.pend;
      const w=104*u,x0=cx-w/2,y=top+(roomy?222:180)*u,hgt=3*u;
      const prog=armed?(MU.rise?Math.min(1,((MU.step+STEPS-16)%STEPS)/16)
                               :0.5+0.5*Math.sin(G.t*4))
                     :Math.min(1,G.build);
      ctx.globalAlpha=0.26;ctx.fillStyle='rgba(180,150,255,0.6)';
      ctx.fillRect(x0,y,w,hgt);
      ctx.globalAlpha=armed?0.95:0.35+0.5*G.build;
      ctx.fillStyle=armed?'#eaf1ff':COL.warp;
      ctx.fillRect(x0,y,w*prog,hgt);
      if(!armed&&G.build>0.04&&roomy){
        ctx.globalAlpha=0.4+0.35*G.build;
        text('BUILD',cx,y-6*u,8.5*u,'700','rgba(190,160,255,0.9)',3);
      }
      ctx.globalAlpha=1;
    }
    /* which half of the section you are in, over the arena rather than the HUD
       so it reads as part of the moment instead of another statistic */
    if(G.sayFx){
      const a=Math.min(1,G.sayFx.t/0.18)*Math.min(1,(1.8-G.sayFx.t)/0.6);
      ctx.globalAlpha=Math.max(0,a)*0.9;
      text(G.sayFx.str,cx,cy-R-16*u,17*u,'800',
        G.sayFx.str==='YOUR TURN'?COL.warp:'rgba(210,225,255,0.75)',5);
      ctx.globalAlpha=1;
    }
    if(G.combo>=2&&G.comboT>0){
      ctx.globalAlpha=0.35+0.65*(G.comboT/CW);
      text('\u00d7'+G.combo+' COMBO',cx,top+116*u,14*u,'800',COL.ember,2);
      ctx.globalAlpha=1;
    }
    if(G.banner){
      const b=G.banner;
      const a=Math.min(1,b.t/0.3)*Math.min(1,(3.2-b.t)/0.6);
      ctx.globalAlpha=Math.max(0,a);
      /* The banner sits a fixed 30u above the ring, and the ring top is itself
         pinned just under the HUD — so on a short viewport it was drawn 80px
         UP INTO the score readout. Clamped below the groove line: on a phone
         the arena is wide enough that this never binds, and in landscape the
         banner slides down over the ring rather than through the HUD. */
      const by=Math.max(cy-R-30*u,top+158*u);
      /* GOLD, NOT RED. This drew in COL.shard — the shard fill, the danger
         outline, and the exact colour GAME OVER is printed in. The one moment
         the game announces that you have got somewhere was painted in its
         failure colour, which is a strange thing to do to the only reward the
         ladder ever hands out. Ember gold is what the game already uses for
         everything earned. */
      text('LEVEL '+levelNum(),cx,by-19*u,12*u,'800','rgba(255,200,87,0.75)',3);
      text(b.str,cx,by,20*u,'800',COL.ember,4);
      text(b.sub,cx,by+20*u,12*u,'600','rgba(210,225,255,0.75)',0);
      ctx.globalAlpha=1;
    }
    const hint=hintText();
    if(hint){
      /* DEAD CENTRE. The middle of the arena is the one region nothing ever
         occupies — shards and embers ride the rings and the comet orbits them
         — so guidance can sit where the eye already is without ever hiding a
         threat. It used to sit at the very bottom of the screen at 14u with
         alpha pulsing 0.5+-0.3 against a 0.9 colour, so it spent part of every
         cycle at 18% opacity: not dim, unreadable.
         The shadow is a second fillText offset by a pixel rather than
         shadowBlur, which this file avoids per-frame on purpose. */
      /* Fit it inside the innermost ring. Anything wider crosses the tracks at
         three and nine o'clock, which is exactly where a shard would be — the
         one place centred text can hide a threat.
         WRAPPED, because the guidance now says what to do and what you get
         rather than naming a mechanic, and those sentences do not fit on one
         line at a readable size. The middle of a circle has far more vertical
         room than horizontal, so two lines is the shape that actually fits —
         shrinking a long single line to make it fit was the wrong axis. */
      const budget=Math.min(W*0.82,radiusOf(G.nRings-1)*2*1.02);
      let hs=17*u;
      const wide=t=>{ctx.font='700 '+Math.round(hs)+'px '+F;
                     return ctx.measureText(t).width+1*t.length;};
      let lines=[hint];
      if(wide(hint)>budget){
        /* split at the word boundary closest to the middle, so the two lines
           come out balanced rather than one long and one orphan */
        const w=hint.split(' ');
        let best=1,bd=1e9;
        for(let i=1;i<w.length;i++){
          const d=Math.abs(w.slice(0,i).join(' ').length-w.slice(i).join(' ').length);
          if(d<bd){bd=d;best=i;}
        }
        lines=[w.slice(0,best).join(' '),w.slice(best).join(' ')];
      }
      /* A floor, not a fit-at-any-cost. On a short landscape viewport the
         arena is barely 100px across and nothing readable fits inside it —
         there the block keeps its size and overlaps the rings, because
         guidance you cannot read is worse than guidance sitting over a track.
         Under the rings is not an option: that space belongs to the shields. */
      let over=Math.max(...lines.map(wide))/budget;
      if(over>1)hs=Math.max(13*u,hs/over);
      const lh=hs*1.15, y0=cy+5*u-(lines.length-1)*lh/2;
      ctx.globalAlpha=RM?1:0.88+0.12*Math.sin(G.t*2.6);
      for(let i=0;i<lines.length;i++){
        text(lines[i],cx+1.5,y0+i*lh+1.5,hs,'700','rgba(4,8,20,0.85)',1);
        text(lines[i],cx,y0+i*lh,hs,'700','#eaf3ff',1);
      }
      ctx.globalAlpha=1;
    }
  }else if(G.state==='menu'){
    const ty=Math.max(top+40*u,cy-R-46*u);
    text('COMET LOOP',cx,ty,34*u,'800','#eaf1ff',6);
    text('tap to reverse \u00b7 swipe toward a ring',cx,cy-6*u,15*u,'600','rgba(210,225,255,0.85)',0);
    blit(SPR.ember,cx-84*u,cy+30*u,0.7,0.7,1);
    ctx.textAlign='left';
    text('collect',cx-70*u,cy+35*u,14*u,'600','rgba(210,225,255,0.85)',0);
    ctx.save();ctx.translate(cx+14*u,cy+30*u);ctx.rotate(Math.PI/4);
    ctx.fillStyle=COL.shard;ctx.fillRect(-4.9*u,-4.9*u,9.8*u,9.8*u);ctx.restore();
    text('dodge',cx+28*u,cy+35*u,14*u,'600','rgba(210,225,255,0.85)',0);
    ctx.textAlign='center';
    text('fill an orbit with embers for a big bonus',cx,cy+58*u,12*u,'600','rgba(210,225,255,0.6)',0);
    /* WAS: "start with a shield \u00b7 tap it to phase through". Nothing in the
       input layer has ever handled a tap on the shield \u2014 pointerdown routes
       mute, share, start, retry, reverse and the radial swipe, and that is the
       whole list. So the menu was teaching a control that does not exist, and
       because a tap anywhere reverses, a player who followed the instruction
       got a direction flip they did not ask for, at a moment they had chosen
       to press something. Say what shields actually do instead. */
    text('green saves you \u00b7 violet slows \u00b7 white clears',cx,cy+76*u,12*u,'600','rgba(123,255,200,0.55)',0);
    /* Only once there is a climb to report. A first-time player has no level
       to beat and does not need a scoreboard before they have played. */
    if(G.bestLevel>1){
      text('BEST \u00b7 LEVEL '+G.bestLevel+' of '+LEVEL_MAX,cx,cy+96*u,12*u,'700',
        'rgba(255,200,87,0.7)',2);
    }
    /* Opened from a chat app, iOS presents the page as a modal sheet, and that
       sheet eats downward swipes to dismiss itself — the game's own inward hop.
       Nothing in here can prevent it, so point at the thing that does. */
    if(IN_APP_BROWSER){
      /* pushed to 114u so it clears the best-level line above it */
      text('add to home screen \u2014 swipes close this window',cx,cy+114*u,11*u,'600',
        'rgba(255,190,120,0.75)',0);
    }
    const pulse=RM?1:0.72+0.28*Math.sin(G.t*3);
    ctx.globalAlpha=pulse;
    text('TAP TO START',cx,bottomY,17*u,'800',COL.comet,4);
    ctx.globalAlpha=1;
    /* Shown only when collection is actually switched on. Delete this block
       if you would rather disclose somewhere else — but disclose somewhere. */
    if(POSTHOG_KEY){
      text('anonymous play stats collected',cx,
        Math.min(H-8*u-safeBot,bottomY+20*u),10*u,'600','rgba(200,215,255,0.32)',0);
    }
  }else{
    /* THE LEVEL LEADS. GAME OVER used to be the headline at 26u and the score
       was the only thing you took away. Both are still here, but the ordinal
       goes on top and in ember gold, because it is the part a player repeats
       to somebody else. GAME OVER shrinks to a label — you already know you
       died, the screen behind you just exploded. */
    drawLadder(cx,cy-104*u,G.tier);
    text('LEVEL '+levelNum(),cx,cy-72*u,30*u,'800',COL.ember,5);
    text(tierLabel(),cx,cy-52*u,11*u,'700','rgba(255,200,87,0.6)',3);
    text('GAME OVER',cx,cy-30*u,13*u,'800',COL.shard,3);
    text(G.score,cx,cy+14*u,54*u,'800','#eaf1ff',0);
    if(G.newLevel)text('FURTHEST YET',cx,cy+42*u,13*u,'700',COL.ember,3);
    else if(G.newBest)text('NEW BEST',cx,cy+42*u,13*u,'700',COL.ember,3);
    else text('BEST LEVEL '+G.bestLevel+' · '+G.best,cx,cy+42*u,13*u,'600',
      'rgba(200,215,255,0.5)',2);
    text(G.orbits+' orbits · ×'+G.bestStreak+' streak · '+runTime(),
      cx,cy+62*u,12*u,'600','rgba(200,215,255,0.45)',0);
    if(G.bestGroove>=2)
      text('best groove ×'+G.bestGroove,cx,cy+78*u,11*u,'600','rgba(160,120,255,0.6)',0);
    if(G.t-G.deadT>0.6){
      const pulse=RM?1:0.72+0.28*Math.sin(G.t*3);
      ctx.globalAlpha=pulse;
      text('TAP TO RETRY',cx,bottomY,17*u,'800',COL.comet,4);
      ctx.globalAlpha=1;
    }
  }
}

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
  if(window.innerWidth!==W||window.innerHeight!==H)resize();
  const dt=Math.min((now-last)/1000,0.05);
  last=now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

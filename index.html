       of the loop as a consequence; on a soft gradient band that reads as the
       track leaning away rather than as an error, and it is the only way to
       keep a baked cross-section on an elliptical path. */
    if(SPR.ringCh&&SPR.ringCh[i]){
      const sp=SPR.ringCh[i];
      /* the halo follows the live radius by scaling the bake, so a warping
         arena costs one multiply instead of a gradient rebuild */
      const d=sp.s*(RAD_BAKE[i]?RADII[i]/RAD_BAKE[i]:1);
      ctx.save();
      ctx.globalAlpha=(on?1.0:0.6)*(i===3?Math.min(1,RADII[3]/RAD_BH[3]):1);
      ctx.translate(cx,cy);ctx.scale(1,AY);
      ctx.drawImage(sp.c,-d/2,-d/2,d,d);
      ctx.restore();
    }
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    const mine=effRing()===i;
    ctx.setLineDash([3*u,17*u]);
    /* the current TICKS rather than slides: one step per sixteenth on the
       player's track (direction matching travel), per eighth elsewhere —
       quantised motion is what makes the whole machine visibly on the beat */
    ctx.lineDashOffset=RM?0:-(Math.floor(G.t/(mine?SPB/4:SPB/2))*5*u*(mine?G.dir:1))%(20*u);
    ctx.strokeStyle='rgb('+tn+')';ctx.lineWidth=2*u;
    ctx.globalAlpha=(mine?0.20:0.08)+0.10*G.pay;
    ctx.beginPath();ctx.ellipse(cx,cy,rr,rr*AY,0,0,TAU);ctx.stroke();
    ctx.setLineDash([]);
    if(SPR.pip)for(let k=0;k<8;k++){
      const pp=posAt(k*TAU/8,rr);
      blit(SPR.pip,pp[0],pp[1],1,0,RM?0.14:0.10+(G.groove>0?0.35*G.beat:0));
    }
    ctx.restore();
    /* The arena changes colour for the whole section — static, so it is safe
       under reduced motion. Bright enough to read on a phone now, and
       breathing with the landed beat (the visual half of the pump). */
    if(G.pay>0){
      ctx.globalAlpha=Math.min(1,(on?0.65:0.30)*(RM?1:1+0.35*G.beat));
      ctx.strokeStyle=on?'rgb(196,160,255)':'rgb(170,140,240)';
    }else{
      ctx.strokeStyle='rgba('+tn+','+(on?0.46:0.17)+')';
    }
    ctx.lineWidth=1.3;
    ctx.beginPath();ctx.ellipse(cx,cy,rr,rr*AY,0,0,TAU);ctx.stroke();
    ctx.globalAlpha=1;
  }
  /* THE METER IS INVISIBLE NOW (owner: "get rid of the purple build-up
     timer — just have the beat drop incorporated into ideal moments for
     musical impact"). The build economy still runs underneath — playing
     well still brings the drop sooner, and it still latches on a bar
     line — but the fuel-gauge presentation (the violet arc, its white
     armed state, and the payoff drain sweep at the same radius) is gone.
     The drop announces itself the musical way: the shaker leaning in,
     BEAT DROP COMING…, the rise, and the countdown. */
  /* THE ARENA CORE LAMP — the light source the whole scene answers to. It
     breathes on the landed beat and flares when the drop hits; clamped so
     its glow never reaches the innermost lane even at the small-R floor. */
  ctx.globalCompositeOperation='lighter';
  if(SPR.core){
    const S=Math.min(1,radiusOf(G.nRings-1)/(50*u));
    blit(SPR.core,cx,cy,RM?S:S*(1+0.18*G.beat+0.5*G.dropFx),0,
      RM?0.42:Math.min(1,0.42+0.22*G.beat+0.3*G.pay));
  }
  ctx.globalCompositeOperation='source-over';
  drawRingGlow();

  /* lap progress arc — colour reports how well fed this orbit is */
  if(G.state==='playing'&&G.lapAcc>0.05){
    const lr=curR()+6*u;
    let a0,a1;
    if(G.dir===1){a0=G.angle-G.lapAcc;a1=G.angle;}
    else{a0=G.angle;a1=G.angle+G.lapAcc;}
    ctx.globalAlpha=0.55;
    ctx.strokeStyle=G.lapEmbers>=3?COL.ember:(G.lapEmbers>=1?COL.comet:'rgba(170,195,255,0.55)');
    ctx.lineWidth=3;
    ctx.beginPath();ctx.ellipse(cx,cy,lr,lr*AY,0,a0,a1);ctx.stroke();
    ctx.globalAlpha=1;
  }
  /* THE COST OF TURNING BACK, DRAWN. On a committed reverse the discarded
     lap arc burns off — retracting toward where the comet turned, fading as
     it goes — so the economy's one hidden rule is WATCHED, every time, with
     no words and no sound requirement. Reduced motion gets a plain fade. */
  if(G.state==='playing'&&G.lapFx){
    const f=G.lapFx,k=Math.min(1,f.t/0.45);
    const rr=curR()+6*u,keep=f.acc*(RM?1:1-k);
    let b0,b1;
    if(f.dir===1){b0=f.a-keep;b1=f.a;}
    else{b0=f.a;b1=f.a+keep;}
    ctx.globalAlpha=0.5*(1-k);
    ctx.strokeStyle='rgba(255,205,120,0.9)';
    ctx.lineWidth=3;
    ctx.beginPath();ctx.ellipse(cx,cy,rr,rr*AY,0,b0,b1);ctx.stroke();
    ctx.globalAlpha=1;
  }
  /* embers banked this orbit are drawn in the HUD — see drawHUD */
  /* Gesture guide: start dragging and the radial axis appears, so which way
     is "out" is never something you have to work out in your head. During
     the hop rehearsal it appears PROACTIVELY at the comet's live position,
     rotating with it — the one place the rotating gesture can be shown —
     and brightens on a pulse while the lesson is live. */
  const teachGuide=G.teach>0&&G.teachKind==='hop'&&!(pd&&pd.far>12);
  if(((pd&&pd.far>12)||teachGuide)&&G.state==='playing'&&G.nRings>1){
    const ga=teachGuide?G.angle:pd.ang;
    const ca=Math.cos(ga),sa=Math.sin(ga);
    const rIn=Math.max(9*u,radiusOf(G.nRings-1)-17*u),rOut=radiusOf(0)+21*u;
    ctx.save();
    ctx.globalAlpha=teachGuide?(RM?0.4:0.30+0.16*(0.5+0.5*Math.sin(G.t*3.2))):0.3;
    ctx.strokeStyle=COL.comet;ctx.lineWidth=1.5;
    ctx.setLineDash([5*u,5*u]);
    ctx.beginPath();
    ctx.moveTo(cx+ca*rIn,cy+sa*rIn);
    ctx.lineTo(cx+ca*rOut,cy+sa*rOut);
    ctx.stroke();
    ctx.setLineDash([]);
    const head=function(rr,facing,al){
      ctx.globalAlpha=al;
      ctx.save();
      ctx.translate(cx+ca*rr,cy+sa*rr);
      ctx.rotate(ga+(facing>0?0:Math.PI));
      ctx.beginPath();
      ctx.moveTo(8*u,0);ctx.lineTo(-4*u,5*u);ctx.lineTo(-4*u,-5*u);ctx.closePath();
      ctx.fillStyle=COL.comet;ctx.fill();
      ctx.restore();
    };
    head(rOut,1,G.ringI>0?0.8:0.18);              /* outward */
    head(rIn,-1,G.ringI<G.nRings-1?0.8:0.18);     /* inward */
    ctx.globalAlpha=1;ctx.restore();
  }
  /* slow-mo timer arc */
  if(G.slow>0){
    ctx.strokeStyle=COL.warp;ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(cx,cy,14*u,-Math.PI/2,-Math.PI/2+TAU*(G.slow/(G.slowD||4)));ctx.stroke();
  }

  /* embers */
  ctx.globalCompositeOperation='lighter';
  for(const s of G.stars){
    const p=posAt(s.a,radiusOf(s.ring));
    let al=1;
    if(s.born&&s.t<0.25){
      /* a nova ember condenses from a white-hot point — the transmutation is
         watched, not implied by the generic fade-in */
      const bq=s.t/0.25;
      blit(SPR.ember,p[0],p[1],2-bq,s.t*1.5,1);
      ctx.globalAlpha=(1-bq)*0.9;
      ctx.fillStyle='#ffffff';
      ctx.beginPath();ctx.arc(p[0],p[1],(6-2.5*bq)*u,0,TAU);ctx.fill();
      ctx.globalAlpha=1;
      continue;
    }
    if(!s.born&&s.t<0.3)al=s.t/0.3;
    else if(s.life-s.t<0.8)al=(s.life-s.t)/0.8;
    /* embers pulse on the landed beat — the collectibles keep time too */
    blit(SPR.ember,p[0],p[1],1+(RM?0.10:0.16*G.beat),s.t*1.5,al);
  }
  ctx.globalCompositeOperation='source-over';
  /* power-ups */
  for(const s of G.pows){
    const p=posAt(s.a,radiusOf(s.ring));
    let al=1;
    if(s.t<0.3)al=s.t/0.3;
    else if(s.life-s.t<0.8)al=(s.life-s.t)/0.8;
    drawPow(p[0],p[1],s,al);
  }
  /* Gate bars: a rung across every ring reads instantly as "you cannot hop
     past". Built as a wide soft pass under a tight core so it registers as
     energy rather than a drawn line, and overhangs both ends of the ring
     stack so it reads as a barrier across the field, not a chord within it. */
  for(const s of G.spikes){
    if(!s.gate||s.ring!==0||s.phase===2)continue;
    const i0=posAt(s.a,radiusOf(0)+11*u);
    const i1=posAt(s.a,Math.max(5*u,radiusOf(G.nRings-1)-11*u));
    const live=s.phase===1&&armed(s);
    const base=live?0.52:0.16+0.14*Math.sin(s.t*12);
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    ctx.strokeStyle=COL.shard;ctx.lineCap='round';
    ctx.globalAlpha=base*0.30;ctx.lineWidth=10*u;
    ctx.beginPath();ctx.moveTo(i0[0],i0[1]);ctx.lineTo(i1[0],i1[1]);ctx.stroke();
    ctx.globalAlpha=base*0.9;ctx.lineWidth=2.2*u;
    ctx.beginPath();ctx.moveTo(i0[0],i0[1]);ctx.lineTo(i1[0],i1[1]);ctx.stroke();
    if(live&&!RM){
      /* rungs crawling along the span sell it as powered rather than painted
         — STEPPING once per eighth, so even the wall marches in time */
      ctx.globalAlpha=0.45;ctx.lineWidth=2.6*u;
      ctx.setLineDash([5*u,9*u]);
      ctx.lineDashOffset=-(Math.floor(G.t/(SPB/2))*7*u)%(14*u);
      ctx.beginPath();ctx.moveTo(i0[0],i0[1]);ctx.lineTo(i1[0],i1[1]);ctx.stroke();
    }
    ctx.restore();
  }
  /* shards */
  for(const s of G.spikes){
    const p=posAt(s.a,radiusOf(s.ring));
    /* THE SAUCER. Drawn rather than baked: it is one object on the board at
       most, it changes shape across three states, and buildSprites runs on
       every resize — a sprite sheet entry for a singleton that spends half
       its life animating would cost more than it saves.
       The read has to survive a phone at speed, so the three states are
       separated by SHAPE and not by colour: riding = a flat hull sitting off
       the tail, charging = the hull haloed and swelling on the beat, firing =
       the entire ring drawn hot. Red throughout, because it costs a shield
       like every other red, and "red costs a shield" is one lesson. */
    if(s.saucer){
      const rr=radiusOf(s.ring),chg=s.chg>0?1-s.chg/SAUCER_CHG:0;
      if(s.fire>0){
        const k=s.fire/SAUCER_BEAM;
        ctx.save();
        ctx.globalAlpha=0.25+0.5*k;
        ctx.strokeStyle=COL.shard;ctx.lineWidth=(RM?3:5.5)*u;
        ctx.beginPath();ctx.ellipse(cx,cy,rr,rr*AY,0,0,TAU);ctx.stroke();
        if(!RM){
          ctx.globalAlpha=0.16*k;ctx.lineWidth=14*u;
          ctx.beginPath();ctx.ellipse(cx,cy,rr,rr*AY,0,0,TAU);ctx.stroke();
        }
        ctx.restore();
      }
      ctx.save();
      ctx.translate(p[0],p[1]);
      ctx.rotate(Math.atan2(p[1]-cy,p[0]-cx)+Math.PI/2);
      /* arriving: fade in over the warn, so it pulls into station */
      const arr=s.phase===0?Math.min(1,s.t/(s.warn||WARN)):(s.phase===2?Math.max(0,1-s.t/FADE):1);
      ctx.globalAlpha=0.35+0.65*arr;
      if(chg>0&&!RM){
        ctx.globalAlpha=(0.30+0.45*chg)*arr;
        ctx.fillStyle=COL.shard;
        ctx.beginPath();ctx.arc(0,0,(10+9*chg)*u,0,TAU);ctx.fill();
        ctx.globalAlpha=0.35+0.65*arr;
      }
      const sw=(1+0.22*chg)*u;
      ctx.fillStyle=COL.shard;
      ctx.beginPath();ctx.ellipse(0,0,9.5*sw,3.2*sw,0,0,TAU);ctx.fill();
      ctx.beginPath();ctx.ellipse(0,-2.2*sw,4.4*sw,3.4*sw,0,Math.PI,TAU);ctx.fill();
      /* the three underlights are the charge readout with the sound off */
      if(!RM){
        ctx.globalAlpha=(0.30+0.70*chg)*arr;
        ctx.fillStyle='#ffffff';
        for(let q=-1;q<=1;q++){
          ctx.beginPath();ctx.arc(q*4.6*sw,2.4*sw,(0.9+0.8*chg)*sw,0,TAU);ctx.fill();
        }
      }
      ctx.restore();
      ctx.globalAlpha=1;
      continue;
    }
    /* drifters trail a short arc showing which way they are sliding */
    if(s.va&&s.phase===1){
      const rr=radiusOf(s.ring),back=-Math.sign(s.va)*0.30;
      ctx.globalAlpha=0.3;ctx.strokeStyle=COL.shard;ctx.lineWidth=2.5;
      ctx.beginPath();
      ctx.ellipse(cx,cy,rr,rr*AY,0,Math.min(s.a,s.a+back),Math.max(s.a,s.a+back));
      ctx.stroke();ctx.globalAlpha=1;
    }
    if(s.phase===0){
      const k=s.t/(s.warn||WARN);
      const bl=0.5+0.5*Math.sin(s.t*(10+k*30));
      drawShardOutline(p[0],p[1],(8+3*k)*u,0.34+0.6*bl);
    }else if(s.phase===1){
      if(armed(s)){
        /* three kin, one halo: the silhouette says the behaviour, the shared
           red glow keeps "red costs a shield" a single lesson. Gate segments
           keep the plain crystal — the bar already tells their story. */
        /* rotated to the ring angle, so the baked bright face always looks
           back at the hub — one key light across the whole board */
        if(s.blink&&!s.gate)blit(SPR.shardBlink,p[0],p[1],1,s.a,1);
        else if(s.va&&!s.gate)blit(SPR.shardDrift,p[0],p[1],1,s.a+(s.va>0?Math.PI/2:-Math.PI/2),1);
        else blit(SPR.shard,p[0],p[1],1,s.a,1);
      }else{
        /* Dormant blinker: hollow, with a core that FILLS as re-arm nears —
           q runs 1→0 across the window, and the old alpha followed it, so
           the shard was faintest at the exact moment it was about to become
           lethal. The countdown now runs the right way. */
        const q=1-(blinkPhase(s)-BLINK*duty(s))/(BLINK*(1-duty(s)));
        drawShardOutline(p[0],p[1],10*u,0.45+0.4*(1-q),true,1-q);
      }
    }else{
      const k=s.t/FADE;
      blit(SPR.shard,p[0],p[1],1-k*0.4,s.a,1-k);
    }
  }
  /* NOVA FRONT: a wide soft leading edge with a hard bright rim inside it,
     plus a second rim trailing slightly so it reads as a shell with
     thickness rather than an expanding hoop. */
  ctx.globalCompositeOperation='lighter';
  for(const n of G.novas){
    const lf=Math.max(n.life,0);
    ctx.strokeStyle=COL.nova;
    ctx.globalAlpha=lf*0.30;
    ctx.lineWidth=26*u*lf;
    ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,TAU);ctx.stroke();
    ctx.strokeStyle='#ffffff';
    ctx.globalAlpha=lf*0.85;
    ctx.lineWidth=(1.5+4*lf)*u;
    ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,TAU);ctx.stroke();
    if(n.r>34*u){
      ctx.globalAlpha=lf*0.30;
      ctx.lineWidth=(1+2.5*lf)*u;
      ctx.beginPath();ctx.arc(n.x,n.y,n.r-22*u,0,TAU);ctx.stroke();
    }
  }
  /* ORBIT IGNITION: a head runs the full circumference in the direction you
     were travelling, with the wake burning behind it. Drawn as a body arc
     plus a short bright leading segment, so the eye tracks the head rather
     than a ring that merely brightens. */
  ctx.globalCompositeOperation='lighter';
  for(const L of G.laps){
    const t=1-Math.max(L.life,0);
    /* the ignition head runs the circumference in exactly ONE BEAT */
    const sweep=RM?TAU:Math.min(1,t/SPB)*TAU;
    /* Offset outside the ring. On the ring it lands under the comet's own
       tail and reads as more trail; sitting just proud of it, gold against
       the tail's cyan, it reads as the orbit itself catching light. */
    const rr=radiusOf(L.ring)+9*u,lf=Math.max(L.life,0);
    const a0=L.dir>0?L.a:L.a-sweep, a1=L.dir>0?L.a+sweep:L.a;
    ctx.strokeStyle=COL.ember;
    ctx.globalAlpha=lf*0.30*L.mag;
    ctx.lineWidth=(3+9*lf)*u*L.mag;
    ctx.beginPath();ctx.ellipse(cx,cy,rr,rr*AY,0,a0,a1);ctx.stroke();
    ctx.globalAlpha=lf*0.62*L.mag;
    ctx.lineWidth=(1.4+3*lf)*u*L.mag;
    ctx.beginPath();ctx.ellipse(cx,cy,rr,rr*AY,0,a0,a1);ctx.stroke();
    if(sweep<TAU){
      const head=L.dir>0?a1:a0,w=0.22;
      ctx.strokeStyle='#fffdf2';
      ctx.globalAlpha=Math.min(1,lf*1.3)*L.mag;
      ctx.lineWidth=(3.5+5*lf)*u*L.mag;
      ctx.beginPath();ctx.ellipse(cx,cy,rr,rr*AY,0,head-w*(L.dir>0?1:0),head+w*(L.dir>0?0:1));ctx.stroke();
    }
  }
  for(const a of G.arcs){
    const lf=Math.max(a.life,0),half=0.09+0.5*(1-lf);
    ctx.globalAlpha=lf*lf*0.75;
    ctx.strokeStyle=a.col;ctx.lineWidth=(1+4*lf)*u;
    ctx.beginPath();ctx.ellipse(cx,cy,radiusOf(a.ring),radiusOf(a.ring)*AY,0,a.a-half,a.a+half);ctx.stroke();
  }
  /* ripples — the big earned moments carry a fat baked annulus instead of a
     hairline stroke */
  for(const r of G.rings){
    const lf=Math.max(r.life,0);
    if(r.fat&&SPR.shock){
      blit(SPR.shock,r.x,r.y,r.r/48,0,lf*0.8);
      continue;
    }
    ctx.globalAlpha=lf*0.55;
    ctx.strokeStyle=r.col;ctx.lineWidth=1+2*lf;
    ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,TAU);ctx.stroke();
  }
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=1;
  /* Comet tail: a single tapered ribbon rather than a chain of dots, drawn
     in three additive passes so it falls off like light instead of paint. */
  drawTail();
  if(G.state!=='dead'){
    const p=posPlayer();
    let pal=1;
    if(G.t<G.invuln)pal=0.45+0.35*Math.sin(G.t*30);
    ctx.globalCompositeOperation='lighter';
    blit(SPR.cometGlow,p[0],p[1],1,0,pal);
    ctx.globalCompositeOperation='source-over';
    /* THE COMET READS AS TRAVELLING. The teardrop is rotated to its heading;
       a committed reverse sweeps the nose end-for-end through the radial
       over 90ms (never on the speculative flip — only reverseFX starts it,
       so a rollback can never show a turn that did not happen); a hop
       stretches it along the radial and thins it, settling on arrival. RM
       keeps the static orientation and skips the animation. */
    let dv=G.dir;
    if(!RM&&G.revFlip>G.t)dv=G.dir*(1-2*(G.revFlip-G.t)/0.09);
    const hopping=G.hopP<1,hs=(!RM&&hopping)?Math.sin(Math.PI*G.hopP):0;
    ctx.save();
    ctx.translate(p[0],p[1]);
    ctx.rotate(G.angle+Math.PI/2*dv);
    if(hs>0)ctx.scale(1-0.12*hs,1+0.26*hs);  /* local y is the radial */
    ctx.globalAlpha=pal;
    const cd=SPR.comet.s;
    ctx.drawImage(SPR.comet.c,-cd/2,-cd/2,cd,cd);
    /* the furnace: a white-hot core flickering at 24Hz over the teardrop —
       the comet reads as a genuinely hot object, not a lit shape */
    if(SPR.cometHot){
      ctx.globalCompositeOperation='lighter';
      const f=RM?0.6:FLK[(G.t*24|0)&15];
      const hs=SPR.cometHot.s*(RM?1:1+0.07*f);
      ctx.globalAlpha=pal*(RM?0.7:0.55+0.35*f);
      ctx.drawImage(SPR.cometHot.c,-hs/2,-hs/2,hs,hs);
      ctx.globalCompositeOperation='source-over';
    }
    ctx.globalAlpha=1;
    ctx.restore();
    drawBeat(p);
    for(let k=0;k<G.shields;k++)
      blit(SPR.shieldRing,p[0],p[1],
        (1.18+k*0.34)*(1+0.04*Math.sin(G.t*6-k*0.7)+(RM?0:0.05*G.beat)),0,pal*(0.72-k*0.16));
    /* the EMPTY slots too (playtest: "is there a bonus if you max out the
       4 shields?" — the cap was invisible, so "full" had no denominator).
       Faint, static rings mark how many the bank holds; overcharge's
       trigger becomes a goal you can watch approaching, and the cap
       growing late-game appears as a new dim ring instead of silent rule
       drift. */
    if(G.state==='playing')
      for(let k=G.shields;k<shieldMax();k++)
        blit(SPR.shieldRing,p[0],p[1],1.18+k*0.34,0,pal*0.10);
    if(G.hyperGlow>0.01){
      /* the comet burns white in a magenta corona while the star lasts */
      ctx.save();ctx.globalCompositeOperation='lighter';
      ctx.globalAlpha=0.65*G.hyperGlow;
      ctx.strokeStyle=COL.hyper;ctx.lineWidth=2.4*u;
      ctx.beginPath();ctx.arc(p[0],p[1],(15+(RM?0:4*G.beat))*u,0,TAU);ctx.stroke();
      ctx.globalAlpha=(RM?0.5:0.35+0.4*FLK[(G.t*24|0)&15])*G.hyperGlow;
      ctx.fillStyle='#ffffff';
      ctx.beginPath();ctx.arc(p[0],p[1],4.5*u,0,TAU);ctx.fill();
      ctx.restore();ctx.globalAlpha=1;
    }
    /* HOW MUCH STAR IS LEFT. The speed already eased out over the final 1.4s,
       but nothing SAID so: the run just quietly stopped being invincible, and
       every playtester reported the same thing — you cannot tell when it is
       ending. A ring that empties clockwise reads at a glance without asking
       for a number, and it BLINKS through the last 1.5s, which is exactly the
       window where the speed is bleeding off and a lane that was safe to plow
       through stops being one. */
    if(G.hyper>0&&G.hyperD>0){
      const frac=Math.max(0,Math.min(1,G.hyper/G.hyperD)),ending=G.hyper<1.5;
      /* Sits at 30u, outside the corona (15u) and the empty shield rings, or
         it just disappears into the furniture already orbiting the comet.
         Drawn WHITE with a magenta shadow rather than in the hypernova colour:
         the room is flooded magenta while this is on screen, so a magenta ring
         has nothing to contrast against. */
      ctx.save();
      ctx.lineCap='round';
      ctx.shadowColor=COL.hyper;ctx.shadowBlur=10;
      ctx.strokeStyle='rgba(255,120,224,0.55)';
      ctx.lineWidth=(ending?5.2:4.2)*u;
      ctx.beginPath();
      ctx.arc(p[0],p[1],30*u,-Math.PI/2,-Math.PI/2+TAU*frac);
      ctx.stroke();
      ctx.shadowBlur=0;
      ctx.strokeStyle='#ffffff';
      ctx.lineWidth=(ending?3.2:2.2)*u;
      ctx.globalAlpha=ending?(RM?0.95:0.35+0.65*FLK[(G.t*26|0)&15]):0.95;
      ctx.beginPath();
      ctx.arc(p[0],p[1],30*u,-Math.PI/2,-Math.PI/2+TAU*frac);
      ctx.stroke();
      ctx.restore();ctx.globalAlpha=1;
    }
    if(G.t<G.invuln){
      ctx.globalAlpha=Math.min(1,(G.invuln-G.t)*1.6)*0.55;
      ctx.strokeStyle=COL.shield;ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(p[0],p[1],(19+5*Math.sin(G.t*16))*u,0,TAU);ctx.stroke();
      ctx.globalAlpha=1;
    }
  }
  /* particles */
  ctx.globalCompositeOperation='lighter';
  /* Stretched along travel, so a burst reads as energy thrown outward rather
     than confetti. Velocity damps hard (0.15^dt), so the streak collapses to
     a round spark within a few frames on its own — the shape is the motion. */
  for(const p of G.parts){
    const lf=Math.max(p.life,0),r=p.size*lf+0.5;
    ctx.globalAlpha=lf;ctx.fillStyle=p.col;
    const st=1+Math.min(Math.sqrt(p.vx*p.vx+p.vy*p.vy)/150,2.2);
    if(st>1.15){
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(Math.atan2(p.vy,p.vx));
      ctx.scale(st,1/Math.sqrt(st)); /* thin as it lengthens, area roughly held */
      ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.fill();
      ctx.restore();
    }else{
      ctx.beginPath();ctx.arc(p.x,p.y,r,0,TAU);ctx.fill();
    }
  }
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=1;
  /* Bloom sits inside the shaken transform so it stays registered with the
     world it is blooming, and under the popups so text stays crisp. */
  drawBloom();
  /* score popups: punch in over the first ~110ms, hold readable, snap out —
     a linear fade is the least alive curve there is. Big lines get the same
     one-pixel dark offset the hint text uses, so they stay crisp over bloom. */
  ctx.textAlign='center';
  for(const p of G.pops){
    const lf=Math.max(p.life,0);
    ctx.globalAlpha=Math.min(1,lf*3);
    const fs=14*u*(p.sz||1)*(RM?1:1+0.4*Math.max(0,lf-0.88)/0.12);
    if((p.sz||1)>1.2)text(p.str,p.x+1.5,p.y+1.5,fs,'800','rgba(4,8,20,0.85)',1);
    text(p.str,p.x,p.y,fs,'800',p.col,1);
  }
  ctx.globalAlpha=1;
  ctx.restore();

  /* THE GRADE: one quarter-res blit of baked photographic finish — corner
     falloff that tames stray bloom, a horizon lift, a band-axis bias. Above
     the game, below the scrim and HUD. */
  if(BG&&SPR.grade)ctx.drawImage(SPR.grade.c,0,0,W,H);
  /* slow-mo tint — baked; this was the file's last per-frame gradient */
  if(G.tsCur<0.98&&SPR.slowTint){
    ctx.globalAlpha=Math.min(1,(1-G.tsCur)/0.45);
    ctx.drawImage(SPR.slowTint.c,0,0,W,H);
    ctx.globalAlpha=1;
  }

  /* The world keeps rendering behind the game-over text — rings, embers and
     fading shards all competing with the score. Drop it back before the HUD
     goes on so the numbers you actually came for are legible. */
  if(G.state==='dead'){
    /* Held back 0.45s so the explosion and shockwave play in the open — the
       scrim used to reach 80% black while the death was still happening. */
    ctx.fillStyle='rgba(6,9,19,'+(Math.min(1,Math.max(0,G.t-G.deadT-0.45)/0.35)*0.80).toFixed(3)+')';
    ctx.fillRect(0,0,W,H);
  }
  drawHUD();
  drawMute();
  drawShieldBtn();
  drawShareBtn();
  if(G.flash>0){
    ctx.fillStyle='rgba(255,255,255,'+(G.flash*0.5)+')';
    ctx.fillRect(0,0,W,H);
  }
  /* THE IMPACT FRAME. Two or three frames of flat white with the collision
     silhouetted dark inside it, before anything else about dying is shown. */
  if(G.impactT>0&&G.killer){
    ctx.fillStyle='rgba(240,247,255,'+(0.92*Math.min(1,G.impactT/0.10)).toFixed(3)+')';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#0a1226';
    ctx.beginPath();ctx.arc(G.killer.x,G.killer.y,9*u,0,TAU);ctx.fill();
    ctx.save();ctx.translate(G.killer.x,G.killer.y);ctx.rotate(Math.PI/4);
    ctx.fillRect(-8*u,-8*u,16*u,16*u);ctx.restore();
  }
}

function drawShieldBtn(){
  if(G.state!=='playing')return;
  const r=shieldRect(),midY=r.y+r.h/2,has=G.shields>0;
  const pulse=has?0.55+0.2*Math.sin(G.t*3.2):0.22;
  ctx.save();
  /* No frame any more. It read as a button because it WAS one, and it is now
     a readout — a pill outline invites a press it no longer answers. */
  ctx.globalAlpha=1;
  /* one glyph per shield slot, matching the pickup icon */
  /* slots have to fit the widened bank, so the pitch closes up rather than
     the pips spilling out of the button */
  const mx=shieldMax(),gap=Math.min(30*u,(r.w-30*u)/Math.max(1,mx-1));
  const x0=r.x+r.w/2-(mx-1)*gap/2;
  const full=G.shields>=mx;
  for(let i=0;i<mx;i++){
    const on=i<G.shields,x=x0+i*gap;
    ctx.globalAlpha=on?pulse+0.35:0.16;
    /* a FULL bank runs gold: the overcharge multiplier, visible at a glance */
    ctx.strokeStyle=full?COL.ember:COL.shield;ctx.lineWidth=on?2.2:1.4;
    ctx.beginPath();ctx.arc(x,midY,9*u,0,TAU);ctx.stroke();
    if(on){
      ctx.fillStyle=full?COL.ember:COL.shield;
      ctx.beginPath();ctx.arc(x,midY,3.4*u,0,TAU);ctx.fill();
    }
  }
  ctx.globalAlpha=1;ctx.restore();
}
function drawShareBtn(){
  if(G.state!=='dead'||G.t-G.deadT<=0.6||!deadSeqDone())return;
  const r=shareRect(),midY=r.y+r.h/2,rad=r.h/2;
  const copied=G.shareFx>G.t;
  ctx.save();
  ctx.globalAlpha=copied?0.85:0.5;
  ctx.strokeStyle=COL.comet;ctx.lineWidth=1.6;
  ctx.beginPath();
  ctx.moveTo(r.x+rad,r.y);ctx.lineTo(r.x+r.w-rad,r.y);
  ctx.arc(r.x+r.w-rad,midY,rad,-Math.PI/2,Math.PI/2);
  ctx.lineTo(r.x+rad,r.y+r.h);
  ctx.arc(r.x+rad,midY,rad,Math.PI/2,-Math.PI/2);
  ctx.closePath();ctx.stroke();
  ctx.globalAlpha=1;
  ctx.textAlign='center';ctx.textBaseline='middle';
  text(copied?'COPIED':'SHARE',cx,midY,14*u,'800',COL.comet,3);
  ctx.restore();
}
function drawMute(){
  const r=muteRect(),x=r.x+r.w/2,y=r.y+r.h/2,s=r.w/2;
  ctx.save();
  ctx.globalAlpha=muted?0.72:0.5;
  ctx.fillStyle='#cfe4ff';ctx.strokeStyle='#cfe4ff';
  ctx.lineWidth=1.8;ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(x-s*0.8,y-s*0.28);ctx.lineTo(x-s*0.42,y-s*0.28);
  ctx.lineTo(x-s*0.02,y-s*0.72);ctx.lineTo(x-s*0.02,y+s*0.72);
  ctx.lineTo(x-s*0.42,y+s*0.28);ctx.lineTo(x-s*0.8,y+s*0.28);
  ctx.closePath();ctx.fill();
  ctx.beginPath();
  if(muted){
    ctx.moveTo(x+s*0.28,y-s*0.36);ctx.lineTo(x+s*0.8,y+s*0.36);
    ctx.moveTo(x+s*0.8,y-s*0.36);ctx.lineTo(x+s*0.28,y+s*0.36);
  }else{
    ctx.arc(x+s*0.14,y,s*0.36,-0.85,0.85);
    ctx.moveTo(x+s*0.14+s*0.68*Math.cos(-0.85),s*0.68*Math.sin(-0.85)+y);
    ctx.arc(x+s*0.14,y,s*0.68,-0.85,0.85);
  }
  ctx.stroke();
  ctx.restore();
}

/* EVERY RUN TEACHES. These used to stop after run six, on the theory that a
   veteran should never see them — but each one clears the instant the player
   does the thing, so a veteran sees each for well under a second and a new
   player gets the whole ladder no matter when they pick the game up. The flags
   they key off are all per-run now, so the sequence replays from the top every
   time without ever standing between anyone and the next input. */
/* SHOW THE GESTURE, DO NOT DESCRIBE IT. Every rung of this ladder used to be
   a sentence, read while dodging, in vocabulary the game had invented —
   "sparks", "track", "the bar". A sentence is the slowest possible way to
   teach a thumb movement. Each rung now carries a small animated diagram of
   the thing itself, drawn beside the words, and the words use only nouns that
   are visible on screen: rings, stars, shields. */
function hintGlyph(kind,x,y,s){
  const ph=RM?0.45:(G.t*0.85)%1;
  /* THE GLYPH FADES WITH ITS SENTENCE. Every alpha below used to be an
     absolute assignment, so a diagram ignored the globalAlpha its caller had
     just set and punched in at full brightness while the words beside it were
     still at zero. On the death screen that meant ~2.5 seconds of a lone red
     diamond floating over the ladder explaining nothing, and on every level
     card the row icons arrived before their own text. `ga` folds the caller's
     alpha into all of them; nothing draws brighter than the line it labels. */
  const ga=ctx.globalAlpha;
  ctx.save();
  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.strokeStyle='#eaf3ff';ctx.fillStyle='#eaf3ff';ctx.lineWidth=1.9*u;
  if(kind==='tap'){
    /* a thumb press, and the reversal it causes */
    ctx.globalAlpha=ga*(0.45*(1-ph)+0.15);ctx.lineWidth=2.4*u;
    ctx.beginPath();ctx.arc(x,y,s*(0.26+0.5*ph),0,TAU);ctx.stroke();
    ctx.globalAlpha=ga*(0.95);
    ctx.beginPath();ctx.arc(x,y,s*0.23,0,TAU);ctx.fill();
    ctx.globalAlpha=ga*(0.85);ctx.lineWidth=2.2*u;
    for(const d of [-1,1]){
      ctx.beginPath();ctx.arc(x,y,s*0.62,d>0?-0.5:Math.PI-0.5,d>0?0.5:Math.PI+0.5);ctx.stroke();
      const a2=d>0?0.5:Math.PI+0.5, ax=x+Math.cos(a2)*s*0.62, ay=y+Math.sin(a2)*s*0.62;
      ctx.beginPath();ctx.moveTo(ax,ay);
      ctx.lineTo(ax-d*s*0.13,ay-s*0.13);ctx.moveTo(ax,ay);
      ctx.lineTo(ax+d*s*0.05,ay-s*0.18);ctx.stroke();
    }
  }else if(kind==='swipe'){
    /* two rings seen edge on, and a thumb crossing from one to the other */
    ctx.globalAlpha=ga*(0.6);ctx.lineWidth=2.6*u;
    ctx.strokeStyle='rgba(150,190,255,1)';
    ctx.beginPath();ctx.moveTo(x-s*0.52,y-s*0.46);ctx.lineTo(x+s*0.52,y-s*0.46);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x-s*0.52,y+s*0.46);ctx.lineTo(x+s*0.52,y+s*0.46);ctx.stroke();
    const ty=y-s*0.46+s*0.92*ph;
    ctx.strokeStyle='#eaf3ff';ctx.fillStyle='#eaf3ff';
    ctx.globalAlpha=ga*(0.25);ctx.lineWidth=2.4*u;      /* the path already travelled */
    ctx.beginPath();ctx.moveTo(x,y-s*0.46);ctx.lineTo(x,ty);ctx.stroke();
    ctx.globalAlpha=ga*(1);
    ctx.beginPath();ctx.arc(x,ty,s*0.2,0,TAU);ctx.fill();
    ctx.lineWidth=2.4*u;
    ctx.beginPath();ctx.moveTo(x-s*0.19,ty+s*0.16);ctx.lineTo(x,ty+s*0.36);
    ctx.lineTo(x+s*0.19,ty+s*0.16);ctx.stroke();
  }else if(kind==='star'){
    blit(SPR.ember,x,y,s/26,0,ga*0.95);   /* blit sets alpha absolutely too */
  }else if(kind==='shard'){
    ctx.globalAlpha=ga*(0.95);ctx.fillStyle=COL.shard;
    ctx.save();ctx.translate(x,y);ctx.rotate(Math.PI/4);
    ctx.fillRect(-s*0.27,-s*0.27,s*0.54,s*0.54);ctx.restore();
  }else if(kind==='shield'){
    ctx.globalAlpha=ga*(0.95);ctx.strokeStyle=COL.shield;ctx.fillStyle=COL.shield;
    ctx.lineWidth=2.2*u;
    ctx.beginPath();ctx.arc(x,y,s*0.34,0,TAU);ctx.stroke();
    ctx.beginPath();ctx.arc(x,y,s*0.13,0,TAU);ctx.fill();
  }else if(kind==='beat'){
    /* the same contracting ring the comet wears, so the prompt names it */
    ctx.globalAlpha=ga*(0.95);ctx.beginPath();ctx.arc(x,y,s*0.18,0,TAU);ctx.fill();
    ctx.globalAlpha=ga*(0.25+0.55*ph);ctx.lineWidth=(1.3+1.6*ph)*u;
    ctx.beginPath();ctx.arc(x,y,s*(0.62-0.34*ph),0,TAU);ctx.stroke();
  }else if(kind==='build'){
    ctx.globalAlpha=ga*(0.28);ctx.fillStyle=COL.warp;
    ctx.fillRect(x-s*0.5,y-s*0.1,s,s*0.2);
    ctx.globalAlpha=ga*(0.95);
    ctx.fillRect(x-s*0.5,y-s*0.1,s*(0.25+0.7*ph),s*0.2);
  }else if(kind==='warp'){
    /* the counter-rotating squares of the slow-mo orb, at the pace it gives
       you rather than the pace it spins at — the diagram should feel slow */
    ctx.globalAlpha=ga*(0.95);ctx.strokeStyle=COL.warp;ctx.lineWidth=2.2*u;
    ctx.save();ctx.translate(x,y);ctx.rotate(ph*Math.PI/2);
    ctx.strokeRect(-s*0.31,-s*0.31,s*0.62,s*0.62);ctx.restore();
    ctx.save();ctx.translate(x,y);ctx.rotate(-ph*Math.PI/2+Math.PI/4);
    ctx.strokeRect(-s*0.18,-s*0.18,s*0.36,s*0.36);ctx.restore();
  }else if(kind==='nova'){
    /* the eight-point star of the nova orb, with one red square already
       turning: the sentence says what happens, this says it faster */
    ctx.globalAlpha=ga*(0.95);ctx.strokeStyle=COL.nova;ctx.lineWidth=1.9*u;
    ctx.save();ctx.translate(x,y);ctx.rotate(ph*Math.PI/4);
    ctx.beginPath();
    for(let i=0;i<16;i++){
      const sr=(i%2===0)?s*0.46:s*0.17, aa=i*Math.PI/8;
      if(i===0)ctx.moveTo(Math.cos(aa)*sr,Math.sin(aa)*sr);
      else ctx.lineTo(Math.cos(aa)*sr,Math.sin(aa)*sr);
    }
    ctx.closePath();ctx.stroke();ctx.restore();
    ctx.globalAlpha=ga*(0.95);ctx.fillStyle=COL.nova;
    ctx.beginPath();ctx.arc(x,y,s*0.1,0,TAU);ctx.fill();
  }
  ctx.restore();
}
function hintText(){
  if(G.state!=='playing')return null;
  const a=age();
  /* First match wins, so this list IS the curriculum and its order is the
     lesson plan. Two escape valves keep it honest: the orb-naming loop sits
     ABOVE the hop hint (an orb lives 7s; a lesson queued behind an unanswered
     gesture arrives after the thing it names has gone), and the hop hint
     itself times out into alternation after ten unanswered seconds — it used
     to hold the slot forever, so the player who could not hop was also never
     told that red kills or that shields save. */
  /* a first-encounter lesson owns the slot while its dilation runs */
  if(G.teachHint&&G.teach>0)return G.teachHint;
  /* The countdown numerals replaced every count-in hint this feature ever
     had — playtesting proved no sentence about "the drop" survives contact
     with a first-time player, and 3…2…1…NOW! needs no sentence. */
  if(!G.didReverse)return {t:'tap anywhere to turn around',g:'tap'};
  for(const pw of G.pows){
    /* the shield joins the naming loop it was supposed to anchor: its old
       fixed 9-22s window sat below two rows that both match on run 1, so
       the curriculum's FIRST placement (shield, ~10s, chosen because "the
       hint ladder already explains it") was the one the ladder never
       actually explained */
    if(pw.type==='shield'&&!G.gotShield&&!G.didShield)return {t:'a shield takes one hit for you',g:'shield'};
    if(pw.type==='warp'&&!G.gotWarp)return {t:'this one slows everything down',g:'warp'};
    if(pw.type==='nova'&&!G.gotNova)return {t:'this one turns every red into a star',g:'nova'};
  }
  /* Only once there is somewhere to hop TO. A run opens on a single ring for
     its first 20 seconds, so without this the prompt asks a new player to
     make the one gesture the game will not answer — they swipe, nothing
     happens, and the controls read as broken at the exact moment they are
     being learned.
     IT OUTRANKS THE LAP PROMPT — the hop is the unfamiliar half of the
     control scheme, and whichever lesson is harder should get the quiet part
     of the run — but only for ten seconds at a stretch; then it alternates
     with the survival lessons below and returns again at the bottom.
     The orb-naming rows sit above this one now: an orb lives 7s, and a
     lesson that queues behind an unanswered gesture arrives after the thing
     it names has gone. Each draws the orb itself rather than naming its
     colour, so a player who cannot separate violet from white on a phone in
     sunlight still has the shape to go on. */
  if(!G.didHop&&G.nRings>1){
    if(!G.hopHintT)G.hopHintT=a;
    if(a-G.hopHintT<10||Math.floor(a/6)%2===0)
      return {t:swipeWords(),g:'swipe'};
  }
  if(!G.didLap&&a<22)return {t:'collect stars, then finish a lap',g:'star'};
  /* the same sentence MEET.single uses, because it is the same rule */
  if(!G.didDodge&&G.spikes.length)return {t:'red costs a shield \u2014 get out of its way',g:'shard'};
  /* Named after the ring now visibly contracting onto the comet, and phrased
     as an invitation rather than an instruction — a struggling player does not
     need another demand. */
  /* didGroove is the LIFETIME flag behind the one-time IN TIME popup; the
     prompt keys off this run's own chain, so it still reminds someone who
     learned it weeks ago and has not used it today. */
  /* three rings up and camped on the outside: name what they are missing */
  if(G.nRings>=3&&G.campT>25)
    return {t:'inside is tighter \u2014 the music runs hotter',g:'swipe'};
  if(G.bestGroove<2&&a>28&&G.groove<2)return {t:'tap in time with the beat',g:'beat'};
  /* Named at the ARC, where the answer actually is, and earlier — waiting
     until 34s meant most players never saw why a drop happened. */
  if(!G.sawDrop&&G.build>0.15)return {t:'play well \u2014 you\u2019re building toward a beat drop',g:'beat'};
  return null;
}

/* THE LADDER, DRAWN. One pip per LEVEL, filled up to the one this run reached
   — the same rotated-square idiom as the lap-ember pips, so the game says
   "progress" one way rather than two. It counts the same ladder as the LEVEL
   printed under it; it used to count the ten tiers instead, which put two
   different ordinals in the same eyeline. The empty pips are the point as much
   as the filled ones: a player who dies on level 1 can see that two more
   exist, which is the thing a bare score can never tell them.
   `shown` caps how many filled pips have appeared yet — the death screen
   fills them one at a time. Callers that want them all pass G.level. */
function drawLadder(x,y,level,shown){
  const pipW=20*u,x0=x-(LEVEL_MAX-1)*pipW/2;
  for(let i=0;i<LEVEL_MAX;i++){
    ctx.save();ctx.translate(x0+i*pipW,y);ctx.rotate(Math.PI/4);
    const on=i<level&&i<(shown===undefined?level:shown);
    ctx.globalAlpha=on?0.95:0.25;
    if(on){ctx.fillStyle=COL.ember;ctx.fillRect(-3.4*u,-3.4*u,6.8*u,6.8*u);}
    else{ctx.strokeStyle='rgba(200,215,255,0.9)';ctx.lineWidth=1.2;
      ctx.strokeRect(-3.4*u,-3.4*u,6.8*u,6.8*u);}
    ctx.restore();
  }
  ctx.globalAlpha=1;
}
function drawHUD(){
  /* THE LESSON VEIL. While a hard first-encounter lesson holds the world
     near-frozen, the whole board dims and the specimen being explained
     wears a breathing gold ring — one thing lit, one sentence, nothing
     else asking for the eye. Drawn under the HUD so the lesson text and
     glyph sit on top of the veil at full brightness. */
  if(G.state==='playing'&&G.teach>0&&!G.teachSoft&&G.teachKind==='see'){
    const ease=Math.min(1,(2.8-G.teach)*4,G.teach*1.6);
    ctx.fillStyle='rgba(4,8,20,'+(0.48*Math.max(0,ease)).toFixed(3)+')';
    ctx.fillRect(0,0,W,H);
    for(const sp of G.spikes){
      if(!sp.spot||sp.phase>=2)continue;   /* never ring a fading corpse */
      const pp=posAt(sp.a,radiusOf(sp.ring));
      const pr2=(16+(RM?0:3.5*Math.sin(G.t*5)))*u;
      ctx.globalAlpha=0.85*ease;
      ctx.strokeStyle=COL.ember;ctx.lineWidth=2.2*u;
      ctx.beginPath();ctx.arc(pp[0],pp[1],pr2,0,TAU);ctx.stroke();
      ctx.globalAlpha=1;
    }
  }
  ctx.textAlign='center';ctx.textBaseline='alphabetic';
  const top=safeTop;
  const bottomY=Math.min(H-24*u-safeBot,cy+R+52*u);
  if(G.state==='playing'){
    const sz=46*u*(1+0.25*G.scorePop);
    textFx(G.score,cx,top+52*u,sz,'800','#ffffff','#c2d8ff',null,0);
    /* The level replaces BEST here. The score directly above is already the
       live number, and a second number you cannot affect this second is worth
       less than the one that says where in the game you are. */
    text('LEVEL '+G.level+' \u00b7 '+tierLabel(),cx,top+76*u,13*u,'700',
      'rgba(255,200,87,0.72)',2);
    /* THE BAND METER (playtest: nobody could tell there was more band to
       unlock). One dot per layer, lit as it joins the record: five violet
       for the arrangement, gold appended as the score buys layers. The
       newest pulses; overdrive runs the whole row gold. */
    if(MU){
      const mk=Math.min(1,dl()/150),ht=PLAY.heat,gvd=Math.max(0,G.groove-4);
      const odd=G.od>0,glw=AC&&MU.glow&&AC.currentTime<MU.glow;
      const lit=[true,
        odd||glw||mk>0.18||ht>0.30,
        odd||glw||mk>0.45||ht>0.35||gvd>0,
        odd||glw||mk>0.62||ht>0.55,
        odd||glw||mk>0.72||ht>0.65];
      for(let li=0;li<LAYER_AT.length;li++)lit.push(G.score>=LAYER_AT[li]);
      let bn=0;for(let li=0;li<lit.length;li++)if(lit[li])bn++;
      if(bn>G.bandN)G.bandFx=1;
      G.bandN=bn;
      const bsp=8*u,bx=cx-(lit.length-1)*bsp/2,by2=top+84*u;
      for(let li=0;li<lit.length;li++){
        const rr=1.8*u*((li===bn-1&&G.bandFx>0)?(1+0.5*G.bandFx):1);
        ctx.beginPath();ctx.arc(bx+li*bsp,by2,rr,0,TAU);
        if(lit[li]){ctx.globalAlpha=0.8;
          ctx.fillStyle=(odd||li>=5)?COL.ember:COL.warp;ctx.fill();}
        else{ctx.globalAlpha=0.2;ctx.strokeStyle='rgba(200,215,255,0.9)';
          ctx.lineWidth=1;ctx.stroke();}
      }
      /* the player's own loop is a band member too: while the recorder is
         playing a captured phrase back, a cyan dot joins the row and
         blinks exactly when the ghost sings — the player's recorded
         rhythm, visible, muted play included */
      if(LOOP.pat&&AC&&AC.currentTime<LOOP.until){
        ctx.beginPath();ctx.arc(bx+lit.length*bsp,by2,1.8*u*(1+0.7*G.loopFx),0,TAU);
        ctx.globalAlpha=0.45+0.5*G.loopFx;
        ctx.fillStyle=COL.comet;ctx.fill();
      }
      ctx.globalAlpha=1;
      /* the meter's one-time caption, the first time a BOUGHT layer joins:
         the dots finally say what they are */
      if(G.bandCapT&&G.t-G.bandCapT<3){
        ctx.globalAlpha=Math.min(1,(3-(G.t-G.bandCapT))/0.8)*0.8;
        /* below the lap pips, so the caption never sits on another row */
        text('THE BAND — score adds layers',cx,top+103*u,9*u,'600',
          'rgba(255,220,140,0.9)',1);
        ctx.globalAlpha=1;
      }
    }
    /* embers banked toward this orbit's payout */
    const pipW=10*u,x0=cx-(LAP_EMB_MAX-1)*pipW/2,py=top+92*u;
    for(let i=0;i<LAP_EMB_MAX;i++){
      ctx.save();ctx.translate(x0+i*pipW,py);ctx.rotate(Math.PI/4);
      const on=i<G.lapEmbers;
      ctx.globalAlpha=on?0.95:0.22;
      if(on){ctx.fillStyle=COL.ember;ctx.fillRect(-2.8*u,-2.8*u,5.6*u,5.6*u);}
      else{ctx.strokeStyle='rgba(200,215,255,0.9)';ctx.lineWidth=1.2;ctx.strokeRect(-2.8*u,-2.8*u,5.6*u,5.6*u);}
      ctx.restore();
    }
    ctx.globalAlpha=1;
    /* THE COUNTER SAYS WHAT IT IS FOR. "GROOVE x5" is a score with no verb in
       it \u2014 it never told anyone what the number counts or what it buys, which
       is why the drop read as something that just happened to you. It now
       names the action and states the target it is climbing towards. */
    /* A short viewport cannot hold the explanatory column without it reaching
       down into the arena, so the sub-lines are earned by having the room. */
    const roomy=(top+186*u)<(cy-R);
    /* THE CENTRE IS ONE SLOT. Since the beat-target moved in, the middle of
       the arena is no longer "the one region nothing ever occupies" — so
       exactly one thing may claim it per frame: the drop payoff, then the
       target, then a banner or armFx or sayFx that a vertically-bound
       viewport has squeezed out of the HUD band, then the tutorial hint.
       Landscape used to overprint all of them through the IN TIME counter. */
    const bannerCentred=G.banner&&(cy-R-30*u)<top+177*u;
    const sayCentred=G.sayFx&&(cy-R-16*u)<top+152*u;
    const counting=MU&&MU.landT&&!MU.landDone&&AC&&
      MU.landT-(AC.currentTime-PLAY.bias)<=SPB*3;
    const centreBusy=counting||G.landFx||G.secFx||bannerCentred||(!roomy&&G.armFx)||sayCentred;
    if(G.groove>=1){
      ctx.globalAlpha=Math.min(1,0.45+0.12*G.groove)*(0.8+0.2*G.grooveFx);
      text('ON BEAT \u00d7'+G.groove,cx,top+136*u,13*u*(1+0.12*G.grooveFx),'800',COL.warp,2);
      ctx.globalAlpha=1;
    }
    /* The orbit streak lived only inside a popup that showed for under a
       second once per orbit, so the run's longest-commitment behaviour was
       also its least visible. It no longer claims to earn a drop by itself —
       everything feeds one meter now, and that meter is drawn below. */
    /* ONE LINE OWNS top+154u. Four draws wrote to this exact y: the three
       timed states, correctly chained with else-if, and then LAPS on its own
       `if`, guarded against G.od alone. So a lap streak printed straight
       through HYPERNOVA and through SPOTLIGHT ×2 — two of the three moments
       the player most needs to read the state they are in, and both of them
       moments a streak is likely to be running. The streak is the least urgent
       of the four (it is ambient; the others are on a clock), so it yields to
       all three rather than the guard growing one condition at a time. */
    const timed=G.hyper>0?['HYPERNOVA','rgba(255,220,130,0.98)']:
                G.od>0   ?['OVERDRIVE ×2','rgba(255,200,87,0.95)']:
                G.spot>0 ?['SPOTLIGHT ×2','rgba(234,241,255,0.95)']:null;
    if(timed&&roomy){
      ctx.globalAlpha=0.7+0.3*G.beat;
      text(timed[0],cx,top+154*u,11*u,'800',timed[1],3);
      ctx.globalAlpha=1;
    }else if(G.lapStreak>=2&&roomy){
      ctx.globalAlpha=0.5;
      /* NOT "xN". lapStreak is not a multiplier: the orbit pays
         base+min(7*(streak-1),28), saturated at five laps, so x5, x7 and x20
         all pay the same +28 while the number climbs on in the same slot and
         the same idiom as OVERDRIVE x2, which is a real multiplier. */
      text('LAPS '+G.lapStreak+' IN A ROW',cx,top+154*u,9*u,'700',
        'rgba(255,200,120,0.85)',2);
      ctx.globalAlpha=1;
    }
    /* WHY A DROP IS COMING, at the moment it is earned. Named, so the cause
       and the payoff are connected across the bars between them. */
    if(G.armFx&&!(bannerCentred&&!roomy)){
      const a=Math.min(1,G.armFx.t/0.22)*Math.min(1,(2.6-G.armFx.t)/0.7);
      ctx.globalAlpha=Math.max(0,a);
      /* With no HUD room the announcement takes the centre slot (hints
         yield) instead of printing over the outer ring's 12-o'clock track. */
      /* One plain line. "banked" and the earning attribution were internal
         bookkeeping the player kept being asked to understand — the only
         thing they need to know is that it is on its way. */
      text('BEAT DROP COMING…',cx,roomy?top+198*u:cy-8*u,15*u,'800',
        'rgba(220,200,255,0.95)',4);
      ctx.globalAlpha=1;
    }
    /* which half of the section you are in, over the arena rather than the HUD
       so it reads as part of the moment instead of another statistic */
    if(G.sayFx&&!FIN.on&&!(sayCentred&&(G.banner||G.armFx))){
      const a=Math.min(1,G.sayFx.t/0.18)*Math.min(1,(1.8-G.sayFx.t)/0.6);
      ctx.globalAlpha=Math.max(0,a)*0.9;
      /* squeezed viewports hand it the centre instead of the IN TIME line */
      const sgold=G.sayFx.str.indexOf('NEW ')===0||G.sayFx.str.indexOf('OVERDRIVE')===0;
      textFx(G.sayFx.str,cx,sayCentred?cy-8*u:cy-R-16*u,
        fitSz(G.sayFx.str,17*u,'800',W-16*u,5),'800',
        sgold?'#ffe9b0':'#f4f8ff',
        G.sayFx.str==='YOUR TURN'?COL.warp:sgold?COL.ember:'#b9cdf2',
        sgold?'rgba(255,200,87,0.45)':'rgba(140,180,255,0.4)',5);
      ctx.globalAlpha=1;
    }
    if(G.combo>=2&&G.comboT>0){
      ctx.globalAlpha=0.35+0.65*(G.comboT/CW);
      text('\u00d7'+G.combo+' COMBO',cx,top+116*u,14*u,'800',COL.ember,2);
      ctx.globalAlpha=1;
    }
    if(G.banner){
      const b=G.banner;
      const a=Math.min(1,b.t/0.3)*Math.min(1,(3.2-b.t)/0.6);
      ctx.globalAlpha=Math.max(0,a);
      /* The banner sits a fixed 30u above the ring — except on a vertically
         bound viewport (landscape, iPad), where cy-R collapses onto the HUD
         band and the old clamp printed the gold LEVEL header straight
         through IN TIME. There it takes the centre slot instead, which the
         hint system yields for exactly this. */
      const by=bannerCentred?cy-8*u:cy-R-30*u;
      /* GOLD, NOT RED. This drew in COL.shard — the shard fill, the danger
         outline, and the exact colour GAME OVER is printed in. The one moment
         the game announces that you have got somewhere was painted in its
         failure colour, which is a strange thing to do to the only reward the
         ladder ever hands out. Ember gold is what the game already uses for
         everything earned. */
      text(b.eyebrow||'UNLOCKED',cx,by-19*u,12*u,'800','rgba(255,200,87,0.75)',3);
      textFx(b.str,cx,by,fitSz(b.str,20*u,'800',W-20*u,4),'800','#ffe9b0',COL.ember,'rgba(255,200,87,0.5)',4);
      text(b.sub,cx,by+20*u,fitSz(b.sub,12*u,'600',W-16*u),'600','rgba(210,225,255,0.75)',0);
      ctx.globalAlpha=1;
    }
    /* THE STAR DIVE (the owner's framing: "almost like a reward, a
       beautiful new melody heard before the next track"). The trail needs
       no caption: a golden path threads the remaining stars, a guide line
       runs from the comet to the next one, and the CORE visibly wakes —
       warming and swelling as the melody is gathered — so the destination
       glows brighter the closer the song gets to home. */
    if(FIN.on&&FIN.trail.length){
      let nxt=null;
      for(const st3 of FIN.trail)if(!st3.got){nxt=st3;break;}
      /* ONE STAR BURNS AT A TIME (playtester Buch: "are you supposed to
         be getting the stars in a certain order at that part?" — he could
         not tell, because eleven equally-bright stars answer nothing).
         The full constellation waits as dim seeds; only the NEXT star
         burns full-size inside its ring, the guide line runs to it, and a
         second fainter segment shows the one after, so the eye reads
         chase-this-then-that with no caption. Any star still collects —
         the order is the melody's, never a rule that punishes. */
      ctx.save();ctx.strokeStyle=COL.ember;ctx.lineWidth=1.2*u;
      ctx.globalAlpha=0.09;
      ctx.beginPath();
      let started=false,nxt2=null;
      for(const st3 of FIN.trail){
        if(st3.got)continue;
        if(st3!==nxt&&!nxt2)nxt2=st3;
        const p3=posAt(st3.a,radiusOf(st3.ring));
        if(!started){ctx.moveTo(p3[0],p3[1]);started=true;}
        else ctx.lineTo(p3[0],p3[1]);
      }
      ctx.stroke();
      if(nxt){
        const pp=posPlayer(),pn=posAt(nxt.a,radiusOf(nxt.ring));
        ctx.globalAlpha=0.30+(RM?0:0.16*G.beat);
        ctx.beginPath();ctx.moveTo(pp[0],pp[1]);ctx.lineTo(pn[0],pn[1]);ctx.stroke();
        if(nxt2){
          const p4=posAt(nxt2.a,radiusOf(nxt2.ring));
          ctx.globalAlpha=0.16;
          ctx.beginPath();ctx.moveTo(pn[0],pn[1]);ctx.lineTo(p4[0],p4[1]);ctx.stroke();
        }
      }
      ctx.restore();ctx.globalAlpha=1;
      for(const st3 of FIN.trail){
        if(st3.got)continue;
        const p3=posAt(st3.a,radiusOf(st3.ring));
        const big=st3===nxt?1.6+(RM?0:0.28*G.beat):0.85;
        blit(SPR.ember,p3[0],p3[1],big,st3===nxt?G.t*1.2:0,st3===nxt?1:0.30);
        if(st3===nxt){
          ctx.save();ctx.strokeStyle=COL.ember;
          ctx.globalAlpha=0.55+(RM?0:0.3*G.beat);
          ctx.lineWidth=1.6*u;
          ctx.beginPath();ctx.arc(p3[0],p3[1],10*u,0,TAU);ctx.stroke();
          ctx.restore();ctx.globalAlpha=1;
        }
      }
      /* the core answers */
      ctx.save();ctx.globalCompositeOperation='lighter';
      ctx.globalAlpha=0.10+0.25*(FIN.got/11)+(RM?0:0.08*G.beat);
      ctx.fillStyle=COL.ember;
      ctx.beginPath();ctx.arc(cx,cy,(6+9*(FIN.got/11))*u,0,TAU);ctx.fill();
      ctx.restore();ctx.globalAlpha=1;
      /* THE FINISH SUN: a dim seed until the melody is nearly home, then a
         blooming white-gold sun you cannot mistake for a trail star — the
         level ends only when you choose to dive into it */
      if(FIN.sun&&!FIN.sun.got){
        const ps=posAt(FIN.sun.a,radiusOf(FIN.sun.ring));
        if(!FIN.bloomed){
          ctx.save();ctx.globalAlpha=0.35;ctx.fillStyle='#cfe0ff';
          ctx.beginPath();ctx.arc(ps[0],ps[1],2.6*u,0,TAU);ctx.fill();
          ctx.restore();ctx.globalAlpha=1;
        }else{
          const sp3=1.9+(RM?0.1:0.35*G.beat);
          blit(SPR.ember,ps[0],ps[1],sp3,G.t*0.8,1);
          ctx.save();ctx.globalCompositeOperation='lighter';
          ctx.globalAlpha=0.75;ctx.fillStyle='#ffffff';
          ctx.beginPath();ctx.arc(ps[0],ps[1],4.2*u,0,TAU);ctx.fill();
          ctx.strokeStyle=COL.ember;ctx.lineWidth=2*u;
          ctx.globalAlpha=0.5+(RM?0:0.3*G.beat);
          ctx.beginPath();ctx.arc(ps[0],ps[1],(13+(RM?0:3*G.beat))*u,0,TAU);ctx.stroke();
          ctx.restore();ctx.globalAlpha=1;
        }
      }
    }
    /* THE COUNTDOWN. Three beats out the centre counts 3… 2… 1…, then NOW!
       through the landing window. A countdown is the one timing device that
       has never needed an instruction manual — every hint this feature used
       to carry is gone, replaced by numbers. */
    if(MU&&MU.landT&&!MU.landDone&&AC&&G.state==='playing'){
      const cdt=MU.landT-(AC.currentTime-PLAY.bias);
      if(cdt<=SPB*3&&cdt>-LAND_WIN){
        ctx.save();
        if(cdt>0.02){
          const n=Math.ceil(cdt/SPB);
          const f=1-((cdt/SPB)%1||1);          /* 0 at beat start, 1 at next */
          ctx.globalAlpha=0.55+0.4*f;
          textFx(n,cx,cy+16*u,(46+14*f)*u,'800','#ffffff','#b9c8ff','rgba(180,150,255,0.5)',0);
        }else{
          ctx.globalAlpha=1;
          textFx('NOW!',cx,cy+14*u,50*u,'800','#f4edff',COL.warp,'rgba(180,150,255,0.65)',2);
        }
        ctx.restore();ctx.globalAlpha=1;
      }
    }
    /* THE LANDING RESULT — and the bonus tally when the payoff runs out. */
    if(G.landFx){
      const f=G.landFx,a=Math.min(1,f.t/0.12)*Math.min(1,(1.9-f.t)/0.7);
      ctx.globalAlpha=Math.max(0,a);
      const pop=1+0.35*Math.max(0,1-f.t*4);
      if(f.perfect){
        text('PERFECT!',cx,cy-14*u,26*u*pop,'800',COL.warp,6);
        text('+'+f.gain,cx,cy+24*u,34*u*pop,'800','#ffffff',3);
      }else if(f.good){
        text('GOOD!',cx,cy-8*u,20*u*pop,'800',COL.warp,4);
        text('+'+f.gain,cx,cy+18*u,22*u*pop,'800','#eaf3ff',2);
      }
      ctx.globalAlpha=1;
    }
    if(G.secFx){
      const f=G.secFx,a=Math.min(1,f.t/0.14)*Math.min(1,(2.2-f.t)/0.7);
      ctx.globalAlpha=Math.max(0,a);
      const pop=1+0.3*Math.max(0,1-f.t*4);
      textFx('BONUS',cx,cy-10*u,18*u*pop,'800','#f4edff',COL.warp,'rgba(180,150,255,0.55)',4);
      textFx('+'+f.total,cx,cy+20*u,26*u*pop,'800','#ffffff','#c9b9ff','rgba(180,150,255,0.4)',2);
      ctx.globalAlpha=1;
    }
    const hintO=centreBusy?null:hintText();
    const hint=hintO&&hintO.t;
    if(hint){
      /* DEAD CENTRE. Shards and embers ride the rings and the comet orbits
         them, so guidance sits where the eye already is without hiding a
         threat — but the centre is a SHARED slot now (the beat-target and
         payoff text live here too), which is why hintO is nulled whenever
         centreBusy is set above. The shadow is a second fillText offset by a
         pixel rather than shadowBlur, which this file avoids per-frame. */
      /* Fit it inside the innermost ring. Anything wider crosses the tracks at
         three and nine o'clock, which is exactly where a shard would be — the
         one place centred text can hide a threat.
         WRAPPED, because the guidance now says what to do and what you get
         rather than naming a mechanic, and those sentences do not fit on one
         line at a readable size. The middle of a circle has far more vertical
         room than horizontal, so two lines is the shape that actually fits —
         shrinking a long single line to make it fit was the wrong axis. */
      const budget=Math.min(W*0.82,radiusOf(G.nRings-1)*2*1.02);
      let hs=17*u;
      const wide=t=>{ctx.font='700 '+Math.round(hs)+'px '+F;
                     return ctx.measureText(t).width+1*t.length;};
      let lines=[hint];
      if(wide(hint)>budget){
        /* split at the word boundary closest to the middle, so the two lines
           come out balanced rather than one long and one orphan */
        const w=hint.split(' ');
        let best=1,bd=1e9;
        for(let i=1;i<w.length;i++){
          const d=Math.abs(w.slice(0,i).join(' ').length-w.slice(i).join(' ').length);
          if(d<bd){bd=d;best=i;}
        }
        lines=[w.slice(0,best).join(' '),w.slice(best).join(' ')];
      }
      /* A floor, not a fit-at-any-cost. On a short landscape viewport the
         arena is barely 100px across and nothing readable fits inside it —
         there the block keeps its size and overlaps the rings, because
         guidance you cannot read is worse than guidance sitting over a track.
         Under the rings is not an option: that space belongs to the shields. */
      let over=Math.max(...lines.map(wide))/budget;
      if(over>1)hs=Math.max(13*u,hs/over);
      /* diagram above, words below — the picture is the instruction and the
         sentence only names it */
      const lh=hs*1.15, gs=30*u;
      const y0=cy+5*u-(lines.length-1)*lh/2+gs*0.42;
      ctx.globalAlpha=RM?1:0.88+0.12*Math.sin(G.t*2.6);
      hintGlyph(hintO.g,cx,y0-(lines.length-1)*lh/2-hs-gs*0.62,gs);
      for(let i=0;i<lines.length;i++)
        textFx(lines[i],cx,y0+i*lh,hs,'700','#ffffff','#a8d4ff',
          'rgba(120,200,255,0.42)',1);
      ctx.globalAlpha=1;
    }
  }else if(G.state==='lvend'){
    const c2=G.lvCard||{done:false,next:1};
    const L=LV[Math.min(LEVEL_MAX-1,c2.next-1)];
    const a2=Math.min(1,(G.t-G.lvT)/0.35);
    ctx.globalAlpha=a2;
    let y2=cy-150*u;
    if(c2.done){
      textFx('LEVEL '+(c2.next-1)+' COMPLETE',cx,y2,24*u,'800','#ffe9b0',COL.ember,'rgba(255,200,87,0.5)',4);
      text('score so far \u00b7 '+G.carryScore,cx,y2+22*u,12*u,'600',
        'rgba(210,225,255,0.7)',1);
      y2+=58*u;
    }
    text('LEVEL '+Math.min(LEVEL_MAX,c2.next),cx,y2,14*u,'800','rgba(255,200,87,0.8)',3);
    textFx(L.name,cx,y2+26*u,22*u,'800','#ffffff','#9fd8ff','rgba(125,228,255,0.45)',4);
    let my=y2+62*u;
    for(const m of L.mech){
      const mt=m[1]||swipeWords();
      hintGlyph(m[0],cx-112*u,my-5*u,16*u);
      ctx.textAlign='left';
      text(mt,cx-94*u,my,fitSz(mt,11.5*u,'600',W/2+82*u),'600','rgba(214,228,255,0.85)',0);
      ctx.textAlign='center';
      my+=26*u;
    }
    /* THE DRAFT. Three tiles on the card that already exists, and the tap
       that picks one IS the tap that starts the level — no extra screen, no
       extra step, and the choice lands on the one calm moment the player is
       already reading. */
    /* SIZED FROM THE ROOM ON THE SCREEN, NOT FROM A CONSTANT. Playtest,
       verbatim: "the selection of power ups between levels — i had to
       screenshot so i can zoom in and read. i'm old." He was right: the tile
       was a hardcoded 76u wide with its description set at 8u, which is 8
       PHYSICAL PIXELS on a phone. Three of those tiles used 248u of a 390u
       screen and left 142u of margin doing nothing.
       The row now claims the width it has and the type scales with the tile,
       so the same layout reads on a 360-wide phone and a tablet. Height is
       derived from the gap between the last mechanic row and CHOOSE ONE, and
       the tile is whichever of the two constraints binds first — so a short
       viewport shrinks the tiles instead of sliding them up through the text
       above, which is what the old upward clamp did. */
    G.offerRects=[];
    if(G.offer&&G.offer.length){
      const n=G.offer.length,gap=9*u;
      const availW=Math.min(W-24*u,430*u);
      const availH=Math.max(74*u,bottomY-28*u-(my+10*u));
      const tw=Math.min((availW-(n-1)*gap)/n,availH/1.18);
      const th=tw*1.18;
      const x0=cx-(n*tw+(n-1)*gap)/2;
      const ty0=Math.min(my+14*u,bottomY-th-30*u);
      for(let i=0;i<G.offer.length;i++){
        const o=G.offer[i],bx=x0+i*(tw+gap);
        G.offerRects.push({x:bx,y:ty0,w:tw,h:th,id:o.id});
        ctx.save();
        ctx.globalAlpha=a2;
        const bg=ctx.createLinearGradient(0,ty0,0,ty0+th);
        bg.addColorStop(0,'rgba(20,27,46,0.96)');bg.addColorStop(1,'rgba(10,15,28,0.96)');
        ctx.fillStyle=bg;
        const rr=Math.min(13*u,tw*0.12);
        ctx.beginPath();ctx.roundRect(bx,ty0,tw,th,rr);ctx.fill();
        ctx.strokeStyle=o.c;ctx.globalAlpha=a2*(RM?0.7:0.5+0.3*Math.sin(G.t*3+i));
        ctx.lineWidth=1.6;
        ctx.beginPath();ctx.roundRect(bx+0.8,ty0+0.8,tw-1.6,th-1.6,rr);ctx.stroke();
        ctx.globalAlpha=a2;
        /* every measurement below is a fraction of the tile, so the artwork
           and the type keep their proportions at whatever size it came out */
        ctx.save();
        ctx.translate(bx+tw/2,ty0+th*0.335);
        const isc=(tw/(76*u))*u*0.82;
        ctx.scale(isc,isc);
        ctx.shadowColor=o.c;ctx.shadowBlur=12;
        o.ic(ctx,o.c);
        ctx.restore();
        ctx.textAlign='center';
        /* floors as well as ceilings: a landscape phone binds on height and
           makes the tile small, and without a floor the type would come out
           SMALLER than the fixed sizes this replaced — the opposite of the
           point. 9.5/8 are exactly what the old hardcoded layout used, so no
           viewport can regress. */
        const nsz=Math.max(9.5*u,Math.min(13.5*u,tw*0.125));
        text(o.n,bx+tw/2,ty0+th*0.645,fitSz(o.n,nsz,'800',tw-10*u),'800','#eaf1ff',0);
        /* WRAPPED ON MEASURED WIDTH, NOT A CHARACTER COUNT. The old rule broke
           at 16 characters regardless of the glyphs, then hard-capped at two
           lines, so a description that needed a third was silently truncated:
           the longest tile description in the table at the time shipped with
           its last two words missing. Two lines is still the budget, but now
           the type shrinks until the sentence FITS in two rather than losing
           its ending. */
        let dsz=Math.max(8*u,Math.min(11*u,tw*0.098)),lines;
        const wrap=function(sz){
          ctx.font='600 '+Math.round(sz)+'px '+F;
          const out=[];let ln='';
          for(const w of o.d.split(' ')){const t2=ln?ln+' '+w:w;
            if(ln&&ctx.measureText(t2).width>tw-12*u){out.push(ln);ln=w;}else ln=t2;}
          if(ln)out.push(ln);
          return out;
        };
        lines=wrap(dsz);
        while(lines.length>2&&dsz>7*u){dsz-=0.5*u;lines=wrap(dsz);}
        for(let k=0;k<Math.min(2,lines.length);k++)
          text(lines[k],bx+tw/2,ty0+th*0.79+k*dsz*1.18,dsz,'600','rgba(206,220,255,0.82)',0);
        ctx.restore();
      }
    }
    const pulse2=RM?1:0.72+0.28*Math.sin(G.t*3);
    ctx.globalAlpha=a2*pulse2;
    textFx(G.offer&&G.offer.length?'CHOOSE ONE'
      :(c2.done?'TAP FOR LEVEL '+Math.min(LEVEL_MAX,c2.next):'TAP TO START'),
      cx,bottomY,17*u,'800','#eaffff',COL.comet,'rgba(93,240,255,0.5)',4);
    ctx.globalAlpha=1;
  }else if(G.state==='swipesel'){
    /* WHICH WAY IS OUT. Two rules, and they only disagree at the top and
       bottom of the loop — at the sides they are the same gesture, which is
       precisely why a written description of the difference does not land.
       So the screen is the real arena with the real hop(): the arrow at the
       comet shows where THIS rule says "out" is, right now, and under the
       radial rule it visibly rotates as the comet travels while under the
       screen rule it stays pinned upward. Swipe, watch, switch, swipe again. */
    const selA=Math.min(1,(G.t-G.lvT)/0.35);
    ctx.globalAlpha=selA;
    const sTop=top+46*u;
    textFx('WHICH WAY IS OUT?',cx,sTop,fitSz('WHICH WAY IS OUT?',24*u,'800',W-30*u),'800',
      '#ffffff','#9fd8ff','rgba(125,228,255,0.45)',4);
    text('swipe the rings to try it \u2014 both work',cx,sTop+22*u,
      fitSz('swipe the rings to try it \u2014 both work',11.5*u,'600',W-30*u),'600',
      'rgba(210,225,255,0.72)',0);

    /* the arrow, drawn AT the comet, pointing wherever this rule says out is */
    const pp=posPlayer();
    let ax,ay;
    if(SWIPE_MODE==='screen'){ax=0;ay=-1;}
    else{const nx=Math.cos(G.angle),ny=Math.sin(G.angle)*AY,nl=Math.hypot(nx,ny)||1;ax=nx/nl;ay=ny/nl;}
    ctx.save();
    ctx.globalAlpha=selA*(RM?0.9:0.62+0.3*Math.sin(G.t*3));
    ctx.strokeStyle=COL.comet;ctx.fillStyle=COL.comet;
    ctx.lineWidth=2.6*u;ctx.lineCap='round';ctx.lineJoin='round';
    const a0=22*u,a1=46*u;
    ctx.beginPath();
    ctx.moveTo(pp[0]+ax*a0,pp[1]+ay*a0);
    ctx.lineTo(pp[0]+ax*a1,pp[1]+ay*a1);ctx.stroke();
    const px=-ay,py=ax;   /* perpendicular, for the head */
    ctx.beginPath();
    ctx.moveTo(pp[0]+ax*a1,pp[1]+ay*a1);
    ctx.lineTo(pp[0]+ax*(a1-9*u)+px*6.5*u,pp[1]+ay*(a1-9*u)+py*6.5*u);
    ctx.lineTo(pp[0]+ax*(a1-9*u)-px*6.5*u,pp[1]+ay*(a1-9*u)-py*6.5*u);
    ctx.closePath();ctx.fill();
    ctx.restore();
    ctx.globalAlpha=selA;

    /* the two rules, as tappable rows */
    G.selRects=[];
    const rows=[['screen','UP IS OUT','up = outer ring, always'],
                ['radial','AWAY IS OUT','away from the middle = outer']];
    const rw=Math.min(W-40*u,236*u),rh=50*u,rgap=8*u;
    const pBtnH=42*u;
    /* centred in the hollow of the ring system, so the comet orbits AROUND
       the controls rather than behind them */
    let ry=cy-(rows.length*rh+(rows.length-1)*rgap+pBtnH+14*u)/2;
    for(const rw2 of rows){
      const on=SWIPE_MODE===rw2[0];
      const rx=cx-rw/2;
      G.selRects.push({x:rx,y:ry,w:rw,h:rh,id:rw2[0]});
      ctx.save();ctx.globalAlpha=selA;
      ctx.fillStyle=on?'rgba(30,54,84,0.96)':'rgba(16,22,38,0.92)';
      ctx.beginPath();ctx.roundRect(rx,ry,rw,rh,12*u);ctx.fill();
      ctx.strokeStyle=on?COL.comet:'rgba(140,170,220,0.30)';
      ctx.lineWidth=on?2:1.2;
      ctx.beginPath();ctx.roundRect(rx+1,ry+1,rw-2,rh-2,12*u);ctx.stroke();
      /* the selected row carries the same arrow idiom as the comet, so the
         row and the thing it controls are visibly the same statement */
      const gx=rx+22*u,gy=ry+rh/2;
      ctx.strokeStyle=on?COL.comet:'rgba(170,196,235,0.55)';
      ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=2.4*u;
      if(rw2[0]==='screen'){
        ctx.beginPath();ctx.moveTo(gx,gy+10*u);ctx.lineTo(gx,gy-9*u);ctx.stroke();
        ctx.beginPath();ctx.moveTo(gx,gy-13*u);ctx.lineTo(gx-5.5*u,gy-5*u);
        ctx.lineTo(gx+5.5*u,gy-5*u);ctx.closePath();ctx.fill();
      }else{
        ctx.beginPath();ctx.arc(gx,gy,5*u,0,TAU);ctx.stroke();
        for(const aa of [-0.9,0.9]){
          const ux=Math.cos(aa),uy=Math.sin(aa);
          ctx.beginPath();ctx.moveTo(gx+ux*8*u,gy+uy*8*u);
          ctx.lineTo(gx+ux*15*u,gy+uy*15*u);ctx.stroke();
        }
      }
      ctx.textAlign='left';
      text(rw2[1],rx+42*u,gy-3*u,fitSz(rw2[1],13.5*u,'800',rw-50*u),'800',
        on?'#eaf1ff':'rgba(214,228,255,0.75)',0);
      text(rw2[2],rx+42*u,gy+14*u,fitSz(rw2[2],10*u,'600',rw-50*u),'600',
        on?'rgba(200,220,255,0.85)':'rgba(190,206,235,0.5)',0);
      ctx.textAlign='center';
      ctx.restore();
      ry+=rh+rgap;
    }
    /* PLAY */
    const pw=Math.min(150*u,W-60*u),pxb=cx-pw/2,pyb=ry+14*u;
    G.selRects.push({x:pxb,y:pyb,w:pw,h:pBtnH,id:'play'});
    ctx.save();
    ctx.globalAlpha=selA*(RM?1:0.78+0.22*Math.sin(G.t*3));
    ctx.strokeStyle=COL.comet;ctx.lineWidth=1.8;
    ctx.beginPath();ctx.roundRect(pxb,pyb,pw,pBtnH,pBtnH/2);ctx.stroke();
    ctx.restore();
    ctx.globalAlpha=selA;
    ctx.textBaseline='middle';
    textFx('PLAY',cx,pyb+pBtnH/2,17*u,'800','#eaffff',COL.comet,'rgba(93,240,255,0.5)',4);
    ctx.textBaseline='alphabetic';
    ctx.globalAlpha=1;
  }else if(G.state==='menu'){
    const ty=Math.max(top+40*u,cy-R-46*u);
    textFx('COSMO',cx,ty,40*u,'800','#ffffff','#7de4ff','rgba(93,240,255,0.55)',12);
    /* A KEY, NOT A PARAGRAPH. Each row is the diagram the game will use again
       mid-run, so the picture is learned here and only recognised later. The
       old copy still told players to "tap it to phase through" — a control
       that was removed two releases ago, which is the worst thing an
       instruction can do. */
    /* Only once there is a climb to report. A first-time player has no level
       to beat and does not need a scoreboard before they have played. It rides
       directly under the title because it is identity, not a control \u2014 the key
       below is one uninterrupted list of things you can do. */
    if(G.best>0){
      text('best \u00b7 '+G.best,cx,ty+20*u,12*u,'700',
        'rgba(255,200,87,0.7)',2);
    }
    /* FOUR ROWS, NOT NINE. This is the densest block of text in the game and
       the first thing anybody reads \u2014 the playtester who counted "like eight
       rules" was counting this screen and the level 1 card together. Five rows
       went and not one of them went untaught: the shield, the slow-mo orb and
       the nova each get a hint-ladder rung the first time one is actually on
       screen (see hintText), the inner ring gets the THIRD RING banner and the
       camp hint, and the beat drop gets the build prompt and a 3\u20112\u20111 countdown.
       Every one of those teaches beside the thing itself, which a row read
       before the thing exists cannot do \u2014 and curriculum.mjs is what proves
       this screen was not the last explanation any of them had.
       What survives is what you need BEFORE you touch anything: the two
       gestures, the thing that pays, and the thing that hurts. Each still
       draws its own diagram, which is what made the colour-word line
       ("green saves you \u00b7 violet slows \u00b7 white clears") unnecessary. */
    const rows=[['tap','tap anywhere to turn around'],
                ['swipe',swipeWords()],
                ['star','collect stars \u2014 a full orbit pays big'],
                ['shard','red costs a shield \u2014 then it kills']];
    /* LAID OUT FROM THE ROOM AVAILABLE, not from a constant. The key was eight
       rows at a hardcoded y0 away from running off the bottom of a short
       phone; it now takes the gap between the title and TAP TO START and
       divides it, so adding a row shrinks the leading instead of overflowing. */
    G.swipeRect=null;
    const kTop=ty+(G.best>0?34*u:22*u), kBot=bottomY-24*u;
    const rh=Math.min(24*u,Math.max(15*u,(kBot-kTop)/rows.length));
    const fs=Math.min(13*u,rh*0.56), gs=Math.min(20*u,rh*0.84);
    /* centred in the gap rather than pinned to the top of it: on a tall phone
       the rows shrink to 24u and leave the rest as one dead band, and a block
       floating above a void reads as a layout accident. */
    const y0=(kTop+kBot)/2-(rows.length-1)*rh/2, gx=cx-118*u;
    /* The swipe row is the one tappable line on this screen — it reopens the
       chooser, so the rule stays changeable after the once-per-device question.
       Its label is measured at the size it will DRAW at (an earlier version
       measured under the row font and then drew smaller, so the reserve was
       wrong and 'change' printed straight through the sentence), and the
       sentence is fitted into what is left rather than the full width. */
    const chSz=fs*0.82;
    ctx.font='700 '+Math.round(chSz)+'px '+F;
    const chW=ctx.measureText('change').width+10*u;
    for(let i=0;i<rows.length;i++){
      const ry=y0+i*rh, isSw=rows[i][0]==='swipe';
      const avail=W-gx-28*u-(isSw?chW:0);
      hintGlyph(rows[i][0],gx,ry-fs*0.35,gs);
      ctx.textAlign='left';
      text(rows[i][1],gx+20*u,ry,fitSz(rows[i][1],fs,'600',avail),'600','rgba(214,228,255,0.88)',0);
      if(isSw){
        G.swipeRect={x:gx-14*u,y:ry-rh*0.62,w:W-gx-4*u,h:rh};
        ctx.globalAlpha=0.55;
        text('change',W-16*u-chW+10*u,ry,chSz,'700','rgba(93,240,255,0.9)',0);
        ctx.globalAlpha=1;
      }
    }
    ctx.textAlign='center';
    /* Opened from a chat app, iOS presents the page as a modal sheet, and that
       sheet eats downward swipes to dismiss itself — the game's own inward hop.
       Nothing in here can prevent it, so point at the thing that does. */
    if(IN_APP_BROWSER){
      text('add to home screen \u2014 swipes close this window',cx,
        Math.min(bottomY-11*u,y0+rows.length*rh+4*u),
        11*u,'600','rgba(255,190,120,0.75)',0);
    }
    /* THE DEMO'S CAPTIONS. The comet behind the key is playing a 12-second
       scripted loop (see menuDemo): as it reverses, the tap glyph appears
       beside it; as it hops, the swipe glyph. The player watches the verbs
       answered by the actual object before ever touching the screen. */
    if(!RM){
      const dc=G.t%12,dp=posPlayer();
      if(dc>=1.6&&dc<4.2)hintGlyph('tap',dp[0],dp[1]-30*u,26*u);
      else if(dc>=5.2&&dc<10.6)hintGlyph('swipe',dp[0],dp[1]-30*u,26*u);
    }
    ctx.globalAlpha=0.5;
    text('best with sound on \u2014 never required',cx,bottomY-24*u,10*u,'600',
      'rgba(200,215,255,0.8)',1);
    ctx.globalAlpha=1;
    const pulse=RM?1:0.72+0.28*Math.sin(G.t*3);
    ctx.globalAlpha=pulse;
    textFx('TAP TO START',cx,bottomY,17*u,'800','#eaffff',COL.comet,'rgba(93,240,255,0.5)',4);
    ctx.globalAlpha=1;
    /* Shown only when collection is actually switched on. Delete this block
       if you would rather disclose somewhere else — but disclose somewhere. */
    if(POSTHOG_KEY){
      text('anonymous play stats collected',cx,
        Math.min(H-8*u-safeBot,bottomY+20*u),10*u,'600','rgba(200,215,255,0.32)',0);
    }
  }else{
    /* THE LEVEL LEADS, AND THE SCREEN ASSEMBLES ITSELF. GAME OVER shrinks to
       a label — you already know you died — and instead of one static frame
       the most-replayed screen in the game has an order: shockwave in the
       open, pips filling one at a time with their ticks, LEVEL punching in,
       the score counting up, the stats last. Any tap past the lockout
       fast-forwards it; reduced motion renders the finished screen at once.
       Sequenced off G.t-G.deadT, which keeps running while dead. */
    const td=G.t-G.deadT,skip=RM||G.deadSkip;
    const el=function(at,dur){return skip?1:Math.max(0,Math.min(1,(td-at)/(dur||0.18)));};
    const pipsShown=skip?G.level:Math.max(0,Math.floor((td-0.55)/PIPDT));
    if(pipsShown>G.deadPips&&pipsShown<=G.level){
      G.deadPips=pipsShown;
      /* the ladder reveal walks the pentatonic — even the death screen is
         in the game's key */
      beep(PENT[Math.min(13,3+pipsShown)],0.06,'sine',0.03,undefined,0,0,0.2);
    }
    const lvAt=0.55+PIPDT*G.level;   /* the moment the last pip lands */
    if(el(0.45))drawLadder(cx,cy-104*u,G.level,pipsShown);
    const la=el(lvAt,0.15);
    if(la>0){
      ctx.globalAlpha=la;
      textFx('LEVEL '+G.level,cx,cy-72*u,30*u*(skip?1:1+0.35*(1-la)),'800','#ffe9b0',COL.ember,'rgba(255,200,87,0.5)',5);
      text(tierLabel(),cx,cy-52*u,11*u,'700','rgba(255,200,87,0.6)',3);
      ctx.globalAlpha=1;
    }
    ctx.globalAlpha=el(0.15);
    text('GAME OVER',cx,cy-30*u,13*u,'800',COL.shard,3);
    /* the score counts up under an ease-out, landing with the level */
    const sq=skip?1:Math.max(0,Math.min(1,(td-0.2)/0.5));
    text(Math.round(G.score*(1-(1-sq)*(1-sq))),cx,cy+14*u,54*u,'800','#eaf1ff',0);
    ctx.globalAlpha=el(lvAt+0.35);
    if(G.newLevel)text('FURTHEST YET',cx,cy+42*u,13*u,'700',COL.ember,3);
    else if(G.newBest)text('NEW BEST',cx,cy+42*u,13*u,'700',COL.ember,3);
    else text('BEST \u00b7 LEVEL '+G.lvlMax+' \u00b7 '+G.best,cx,cy+42*u,13*u,'600',
      'rgba(200,215,255,0.5)',2);
    ctx.globalAlpha=el(lvAt+0.5);
    text(G.orbits+' orbits · ×'+G.bestStreak+' streak · '+runTime(),
      cx,cy+62*u,12*u,'600','rgba(200,215,255,0.45)',0);
    /* Landed drops are the rarest thing a run can contain, so they get the
       line — sharing it with the groove rather than adding a row, because
       this screen has run out of vertical space twice already. */
    const brag=[];
    if(G.bestGroove>=2)brag.push('on beat ×'+G.bestGroove);
    if(G.lands>0)brag.push(G.lands+(G.lands===1?' drop landed':' drops landed'));
    if(brag.length)
      text(brag.join('  ·  '),cx,cy+78*u,11*u,'600','rgba(170,135,255,0.7)',0);
    /* the retention hook: name the sound the ladder is still holding.
       IT YIELDS RATHER THAN STACKING. Moving the share pill below this line
       fixed portrait but not landscape, where cy and bottomY are barely 140u
       apart: there the pill's clamp lifts it straight back onto this line and
       the collision returns. This is the most droppable row on the screen —
       the score, the level, the coach and RETRY are all load-bearing — so on a
       viewport with no room for both, it is the one that goes. */
    if(G.tier<10&&cy+94*u<shareRect().y-9*u){
      /* 4, 7 and 10 were one-based TIER rungs printed with the word "level",
         two lines below "LEVEL n" on a four-level ladder — the last surviving
         breach of the two-ladders invariant, and the exact failure the retired
         cometloop:level key exists because of. The correct numbers (1, 2, 4)
         are non-monotonic against the player's own progress and would read as
         a bug, so the ordinal goes; the ladder is drawn on this same screen. */
      const nx=G.tier>=6?'electric guitar':G.tier>=3?'synth lead':'twin synths';
      ctx.globalAlpha=el(lvAt+0.6)*0.9;
      text('next sound: '+nx+' \u2014 keep climbing',cx,cy+94*u,10.5*u,'600',
        'rgba(200,215,255,0.42)',0);
      ctx.globalAlpha=1;
    }
    /* ONE COACHING LINE, from what the game already measured — the death it
       just watched. Above the ladder, where the eye starts. */
    if(G.coach){
      ctx.globalAlpha=el(lvAt+0.5)*0.9;
      hintGlyph(G.coach.g,cx,cy-152*u,22*u);
      text(G.coach.t,cx,cy-128*u,fitSz(G.coach.t,12*u,'600',W-20*u),'600','rgba(214,228,255,0.85)',0);
    }
    ctx.globalAlpha=1;
    if(G.t-G.deadT>0.6&&deadSeqDone()){
      const pulse=RM?1:0.72+0.28*Math.sin(G.t*3);
      ctx.globalAlpha=pulse;
      textFx('TAP TO RETRY',cx,bottomY,17*u,'800','#eaffff',COL.comet,'rgba(93,240,255,0.5)',4);
      ctx.globalAlpha=1;
    }
  }
}

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
  if(window.innerWidth!==W||window.innerHeight!==H||sprBand!==skyI)resize();
  const dt=Math.min((now-last)/1000,0.05);
  last=now;
  update(dt);
  /* THE LOOP NEVER DIES. requestAnimationFrame is only scheduled after
     draw(), so a single throwing frame — one bad radius, one transient
     state — would otherwise freeze the run forever with no error the
     player can see. One dropped frame is invisible; a dead game is not.
     The first error is kept for inspection instead of being re-thrown.
     THE CANVAS STATE IS RESTORED on error. draw() nests ctx.save() and
     ctx.translate() for the camera dolly and screen shake; if anything
     between the save and the matching restore throws, the translate is
     never popped and every subsequent frame starts from a shifted origin
     that accumulates until the page is resized. The catch now resets the
     transform to the DPR identity, so a dropped frame cannot corrupt
     every frame that follows it. This was the "screen shifted and broke
     the game" report: a BH activation's burst of new draw work hit a
     transient error, the translate stuck, and the world stayed offset. */
  try{draw();}catch(e){
    if(!window.__drawErr)window.__drawErr=e;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.globalAlpha=1;
    ctx.globalCompositeOperation='source-over';
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>

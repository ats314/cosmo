        if(!RM)G.stop=Math.max(G.stop,0.075);
        if(!RM)G.flash=Math.max(G.flash,0.16+0.10*k);
        beep(1568,0.18,'triangle',0.05,2093,0.3);
        try{if(navigator.vibrate)navigator.vibrate(18);}catch(e){}
      }
    }else{
      popup(lp[0],lp[1]-26*u,label,'rgba(200,215,255,0.7)');
      beep(392,0.1,'triangle',0.04,440);
    }
    G.lapEmbers=0;G.didLap=true;
    checkMile();
  }
  G.comboT=Math.max(0,G.comboT-sdt);
  if(G.comboT<=0)G.combo=0;

  G.starT-=sdt;
  if(G.starT<=0&&G.stars.length<emberCap()){spawnStar();G.starT=emberGap()*rand(0.75,1.4);}
  G.spikeT-=sdt;
  if(G.teach<=0&&G.spikeT<=0&&age()>=firstShardAt()&&G.spikes.length<shardCap()){
    spawnSpike();
    G.spikeT=spawnGap()*rand(0.85,1.15);
  }
  G.powT-=sdt;
  if(G.powT<=0&&G.pows.length===0&&dl()>=6){
    G.powT=spawnPow()?Math.max(6,rand(10,15)-dl()*0.02):0.5;
  }

  const er=effRing();
  /* embers */
  for(let i=G.stars.length-1;i>=0;i--){
    const s=G.stars[i];s.t+=sdt;
    if(s.t>s.life){G.stars.splice(i,1);continue;}
    if(s.ring===er&&sweptHit(s.a,(22*u)/radiusOf(er))){
      G.stars.splice(i,1);
      G.combo=Math.min(G.combo+1,6);G.comboT=CW;
      G.score+=G.combo;G.diff+=1;G.scorePop=1;
      G.lapEmbers++;G.embers++;
      const p=posAt(s.a,radiusOf(s.ring));
      burst(p[0],p[1],COL.ember,14,150);
      ripple(p[0],p[1],COL.ember);
      arcFlash(s.a,s.ring,COL.ember);
      popup(p[0],p[1]-20*u,'+'+G.combo,COL.ember);
      /* THE EMBER RUN. Was 700Hz gliding to 1400 — the most repeated sound in
         the game, 104 cents sharp of E5 and smeared across an octave by the
         slide. Now the chain walks the pentatonic and RESOLVES on the octave:
         G5 A5 C6 D6 E6 G6. The thing the player was already doing for score
         produces a phrase with a cadence, at no timing cost whatsoever. */
      beep(PENT[Math.min(9,3+G.combo)],0.09,'sine',0.06,0,0,panAt(p[0]),0.35);
      beep(PENT[Math.min(13,5+G.combo)],0.10,'sine',0.05,0,0.045,panAt(p[0]),0.35);
      build(0.016,'ember');
      checkMile();
    }
  }
  /* power-ups */
  for(let i=G.pows.length-1;i>=0;i--){
    const s=G.pows[i];s.t+=sdt;
    if(s.t>s.life){G.pows.splice(i,1);continue;}
    if(s.ring===er&&sweptHit(s.a,(22*u)/radiusOf(er))){
      const p=posAt(s.a,radiusOf(s.ring));
      G.pows.splice(i,1);
      arcFlash(s.a,s.ring,s.type==='shield'?COL.shield:(s.type==='warp'?COL.warp:COL.nova));
      if(s.type==='shield'){
        if(G.shields>=shieldMax()){G.score+=2;popup(p[0],p[1]-20*u,'+2',COL.shield);
          beep(659,0.09,'sine',0.04,880,0,panAt(p[0]),0.3);}
        else{G.shields++;popup(p[0],p[1]-20*u,'SHIELD \u00d7'+G.shields,COL.shield);}
        burst(p[0],p[1],COL.shield,14,150);
        ripple(p[0],p[1],COL.shield);
        beep(520,0.12,'triangle',0.06,780);
      }else if(s.type==='warp'){
        G.slow=4;G.gotWarp=true;
        popup(p[0],p[1]-20*u,'SLOW-MO',COL.warp);
        burst(p[0],p[1],COL.warp,14,150);
        ripple(p[0],p[1],COL.warp);
        beep(400,0.3,'sine',0.07,150);
      }else{
        /* The front does the converting — see novaBlast/novaConvert. */
        G.gotNova=true;
        novaBlast(p[0],p[1]);
        /* You are standing inside your own blast, so nothing may kill you
           while it sweeps. Dying mid-nova was always the wrong ending.
           Sized to the sweep: 0.7 covered the old 0.22s front with room to
           spare, but the front now takes ~0.65s to reach the far side of the
           ring system and the guarantee has to outlast it. */
        G.invuln=Math.max(G.invuln,G.t+0.95);
        popup(p[0],p[1]-24*u,'NOVA!',COL.nova,1.7);
        ripple(p[0],p[1],COL.nova);
        burst(p[0],p[1],COL.nova,34,320);
        burst(p[0],p[1],'#ffffff',14,190);
        if(!RM){
          /* longer than the orbit's 75ms — this is the rarest thing here and
             should outrank the routine celebration, not sit beneath it */
          G.stop=Math.max(G.stop,0.11);
          G.flash=Math.max(G.flash,0.55);
          G.shake=Math.max(G.shake,11);
        }
        duckBed(0.10,0.6);
        beep(180,0.5,'sawtooth',0.07,1500);
        beep(90,0.55,'sine',0.06,45);
        beep(1250,0.15,'sine',0.05,1900,0.13);
        try{if(navigator.vibrate)navigator.vibrate([26,40,60]);}catch(e){}
      }
    }
  }
  updateSpikes(sdt,true);
}

/* ---------- draw helpers ---------- */
function drawShardOutline(x,y,r,al,dash,core){
  ctx.save();ctx.translate(x,y);ctx.rotate(Math.PI/4);
  ctx.globalAlpha=al;
  ctx.strokeStyle=COL.shard;ctx.lineWidth=2.5;
  if(dash)ctx.setLineDash([4*u,3.5*u]);
  ctx.strokeRect(-r*0.7,-r*0.7,r*1.4,r*1.4);
  ctx.setLineDash([]);
  /* core grows with `core` (0..1): a dormant blinker is a watchable countdown */
  if(dash){const cs=(1.6+3.6*(core||0))*u;
    ctx.fillStyle=COL.shard;ctx.fillRect(-cs,-cs,cs*2,cs*2);}
  ctx.globalAlpha=1;ctx.restore();
}
/* The orbs blit their baked sprites — the glow was paid for in buildSprites,
   so this is the same layered finish the embers and shards get, at a fraction
   of what the live shadowBlur cost. Pulse and rotation ride blit()'s args;
   the cores are plain fills, kept out of the pulse so the centre holds still. */
function drawPow(x,y,s,al){
  const pulse=1+0.15*Math.sin(s.t*5);
  if(s.type==='shield'){
    blit(SPR.powShield,x,y,pulse,0,al);
    ctx.save();ctx.globalAlpha=al;ctx.fillStyle=COL.shield;
    ctx.beginPath();ctx.arc(x,y,3.5*u,0,TAU);ctx.fill();ctx.restore();
  }else if(s.type==='warp'){
    blit(SPR.powWarpO,x,y,pulse,s.t*2,al);
    blit(SPR.powWarpI,x,y,1,-s.t*2+Math.PI/4,al);
  }else{
    blit(SPR.powNova,x,y,1+0.10*Math.sin(s.t*5),s.t*1.2,al);
    ctx.save();ctx.globalAlpha=al;ctx.fillStyle=COL.nova;
    ctx.beginPath();ctx.arc(x,y,2.5*u,0,TAU);ctx.fill();ctx.restore();
  }
}
/* The old stack led with -apple-system, so on the device this actually ships
   to every word was San Francisco: the system UI face, which reads as a
   settings screen rather than a game. This leads with geometric sans instead —
   Avenir Next on iOS and macOS, Century Gothic or Trebuchet on Windows,
   Roboto on Android. Circular bowls and a high x-height suit a game made
   entirely of circles, and it costs nothing: every one of these ships with the
   OS, so there is still no font to download and no network call. */
const F='"Avenir Next","Avenir",Futura,"Century Gothic","Trebuchet MS",'+
        '"Segoe UI",Roboto,system-ui,sans-serif';
function text(str,x,y,size,weight,col,ls){
  ctx.fillStyle=col;
  ctx.font=weight+' '+Math.round(size)+'px '+F;
  try{ctx.letterSpacing=(ls||0)+'px';}catch(e){}
  ctx.fillText(str,x,y);
  try{ctx.letterSpacing='0px';}catch(e){}
}

/* ---------- bloom ----------
   Screen-space bloom without ever reading back the main canvas. The obvious
   route — drawImage(cv) into a small buffer — measures ~16ms a frame, because
   pulling 1.3M pixels back out stalls the pipeline; having budget spare does
   not help when the single operation eats all of it.
   So the bright objects are re-drawn as crude blobs into a quarter-size
   buffer instead. Precision is pointless there: the upscale blurs it past
   recognition, and bilinear filtering on the way back up IS the blur. */
const BLOOM_DIV=4,BLOOM_ALPHA=0.34;
let bloomC=null,bloomG=null;
function bloomDot(g,x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,TAU);g.fill();}
function drawBloom(){
  if(!bloomC){bloomC=document.createElement('canvas');bloomG=bloomC.getContext('2d');}
  const bw=Math.max(1,Math.ceil(W/BLOOM_DIV)),bh=Math.max(1,Math.ceil(H/BLOOM_DIV));
  if(bloomC.width!==bw||bloomC.height!==bh){bloomC.width=bw;bloomC.height=bh;}
  const g=bloomG,s=1/BLOOM_DIV;
  g.setTransform(1,0,0,1,0,0);
  g.clearRect(0,0,bw,bh);
  g.setTransform(s,0,0,s,0,0);
  g.globalCompositeOperation='lighter';
  for(const st of G.stars){
    const p=posAt(st.a,radiusOf(st.ring));
    bloomDot(g,p[0],p[1],10*u,COL.ember);
  }
  for(const sp of G.spikes){
    if(sp.phase!==1||!armed(sp))continue;
    const p=posAt(sp.a,radiusOf(sp.ring));
    bloomDot(g,p[0],p[1],11*u,COL.shard);
  }
  for(const pw of G.pows){
    const p=posAt(pw.a,radiusOf(pw.ring));
    bloomDot(g,p[0],p[1],10*u,pw.type==='shield'?COL.shield:(pw.type==='warp'?COL.warp:COL.nova));
  }
  for(const pt of G.parts){
    if(pt.life<=0)continue;
    bloomDot(g,pt.x,pt.y,pt.size*pt.life*1.6,pt.col);
  }
  if(G.state!=='dead'){
    const p=posPlayer();
    bloomDot(g,p[0],p[1],17*u,'#7ce9ff');
    bloomDot(g,p[0],p[1],8*u,'#ffffff');
  }
  /* the hub lamp blooms too, harder while the drop is landing */
  bloomDot(g,cx,cy,(9+9*G.dropFx)*u,'#9db9ff');
  g.setTransform(1,0,0,1,0,0);
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  /* the bloom breathes with the payoff kick — the visual half of the pump */
  ctx.globalAlpha=BLOOM_ALPHA*(1+((G.pay>0&&!RM)?0.45*G.beat:0));
  ctx.drawImage(bloomC,0,0,W,H);
  ctx.restore();
}

/* The comet lights the track it is riding: a short arc centred on it, falling
   off both ways. Decorative, but it also makes "which ring am I on" readable
   at a glance without looking away from the comet. */
const RING_LIT=[[0.62,0.030,7],[0.40,0.048,4.5],[0.22,0.078,2.6],[0.10,0.105,1.6]];
function drawRingGlow(){
  const rr=curR();
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  /* the lit track takes its own colour, so the light under the comet says
     which ring you are on as plainly as the arrangement does */
  ctx.strokeStyle='rgb('+RINGS[Math.min(RINGS.length-1,effRing())].tint+')';
  for(const L of RING_LIT){
    ctx.globalAlpha=L[1];
    ctx.lineWidth=L[2]*u;
    ctx.beginPath();ctx.arc(cx,cy,rr,G.angle-L[0],G.angle+L[0]);ctx.stroke();
  }
  ctx.restore();
}
function drawTail(){
  const n=G.trail.length;
  if(n<4)return;
  const nx=new Array(n),ny=new Array(n),bw=new Array(n);
  for(let i=0;i<n;i++){
    const p=G.trail[i];
    const a=G.trail[i+1<n?i+1:n-1],b=G.trail[i>0?i-1:0];
    let tx=a.x-b.x,ty=a.y-b.y;
    const L=Math.sqrt(tx*tx+ty*ty);
    if(L<1e-4){tx=1;ty=0;}else{tx/=L;ty/=L;}
    nx[i]=-ty;ny[i]=tx;
    /* width tapers by both age and position, so the head stays fat */
    bw[i]=8*u*Math.pow(Math.max(p.life,0),0.7)*(0.16+0.84*i/(n-1));
  }
  /* Width, alpha, colour. The narrow pass runs near-white so the ribbon goes
     hot at its centre and cools outward, the way anything incandescent does —
     one flat cyan read as paint rather than as burning. */
  const passes=[[2.5,0.075,COL.comet],[1.35,0.16,'#8ef2ff'],[0.6,0.34,'#e6fdff']];
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  for(let k=0;k<passes.length;k++){
    const m=passes[k][0];
    ctx.globalAlpha=passes[k][1];
    ctx.fillStyle=passes[k][2];
    ctx.beginPath();
    for(let i=0;i<n;i++){
      const p=G.trail[i],w=bw[i]*m;
      const X=p.x+nx[i]*w,Y=p.y+ny[i]*w;
      if(i===0)ctx.moveTo(X,Y);else ctx.lineTo(X,Y);
    }
    for(let i=n-1;i>=0;i--){
      const p=G.trail[i],w=bw[i]*m;
      ctx.lineTo(p.x-nx[i]*w,p.y-ny[i]*w);
    }
    ctx.closePath();ctx.fill();
  }
  ctx.restore();
}

/* ---------- the visible beat ----------
   The old pulse breathed the RINGS, at peak alpha 0.05 against static strokes
   on the same path summing to ~0.265 — and it PEAKED ON THE BEAT. You cannot
   synchronise to a flash that arrives at the same moment as the thing it is
   announcing; human reaction is ~250ms and an eighth here is 288ms. It was also
   4.5x brighter at groove x8 than at x0, so the game showed you the beat most
   clearly exactly when you least needed it and dimmest while you were trying
   to find it.

   What people actually synchronise to is continuous motion with a predictable
   arrival, and it has to land where the eye already is. So: a ring that
   contracts onto the comet over the half-beat BEFORE each beat, and lands. */
function beatPhase(){
  if(!AC||!MU||!MU.next||AC.state!=='running'||G.state!=='playing')return -1;
  /* MU.next is the next UNSCHEDULED eighth and sits ahead of now by the
     lookahead, so the quarter boundary is derived from it, not subtracted. */
  const q=MU.next+((MU.step%2)?SPB/2:0);
  let d=(q-AC.currentTime)%SPB;if(d<0)d+=SPB;
  return 1-d/SPB;
}
function drawBeat(p){
  const ph=beatPhase();if(ph<0)return;
  /* fades back for a veteran who has clearly found it, and stays for everyone
     else. It is a teaching aid first and an ornament second. */
  const vis=(G.runs>6&&G.bestGroove>=5)?0.45:1;
  ctx.save();ctx.globalCompositeOperation='lighter';
  ctx.strokeStyle=(G.groove>=3||G.pay>0)?COL.warp:'rgba(200,225,255,1)';
  if(RM){
    /* one opacity step per beat is 1.73Hz — far below any flash threshold,
       and it still carries the anticipation */
    ctx.globalAlpha=(ph>0.62?0.28:0.09)*vis;ctx.lineWidth=2*u;
    ctx.beginPath();ctx.arc(p[0],p[1],32*u,0,TAU);ctx.stroke();
  }else{
    const a=Math.max(0,(ph-0.5)*2);        /* 288ms of visible approach */
    if(a>0){
      ctx.globalAlpha=(0.05+0.24*a*a)*vis;ctx.lineWidth=(1.2+1.3*a)*u;
      ctx.beginPath();ctx.arc(p[0],p[1],(32+18*(1-a))*u,0,TAU);ctx.stroke();
    }
    if(G.beat>0.02){                       /* the landing, at a level you see */
      ctx.globalAlpha=G.beat*(0.30+0.045*G.groove+0.10*G.payOpen)*vis;
      ctx.lineWidth=(1.6+3.2*G.beat)*u;
      ctx.beginPath();ctx.arc(p[0],p[1],(32+6*(1-G.beat))*u,0,TAU);ctx.stroke();
    }
  }
  ctx.restore();
}
/* ---------- draw ---------- */
function draw(){
  const amb=RM?0:G.t;
  if(SPR.bg)ctx.drawImage(SPR.bg.c,0,0,W,H);
  /* a band change fades from the outgoing sky over 2.5s (RM hard-cuts) */
  if(G.bgFade>0&&SPR.bgOld){
    ctx.globalAlpha=G.bgFade;
    ctx.drawImage(SPR.bgOld.c,0,0,W,H);
    ctx.globalAlpha=1;
  }else if(SPR.bgOld&&G.bgFade<=0)SPR.bgOld=null;
  /* THE DROP OWNS THE SKY. The downbeat crossfades the whole backdrop into
     the warp palette (G.dropFx is the entry envelope), it HOLDS for the
     section, and ebbs out over the final bar as G.pay drains. Under reduced
     motion it is a static palette swap for the same span — the same class of
     whole-section signal the ring recolour already grants RM players. */
  let dropA=0;
  if(G.pay>0)dropA=RM?0.9:Math.min(1,(1-G.dropFx)*1.6)*Math.min(1,G.pay*8);
  if(dropA>0&&SPR.bg2){
    ctx.globalAlpha=dropA;
    ctx.drawImage(SPR.bg2.c,0,0,W,H);
    ctx.globalAlpha=1;
  }
  const sdx=RM?0:Math.sin(amb*0.030)*17,sdy=RM?0:Math.cos(amb*0.023)*17;
  /* the camera dolly: the world drifts a few pixels on a long sine so no
     frame is ever static; each plane rides it by its depth */
  const camX=RM?0:Math.sin(amb*0.16)*3*u,camY=RM?0:Math.cos(amb*0.127)*3*u;
  /* THE GALACTIC BAND — deepest light in the scene, and it answers the drop */
  if(SPR.galaxy){
    ctx.drawImage(SPR.galaxy.c,-28+sdx*0.2+camX*0.2,-28+sdy*0.2+camY*0.2,SPR.galaxy.w,SPR.galaxy.h);
    if(!RM&&dropA>0){
      ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=0.25*dropA;
      ctx.drawImage(SPR.galaxy.c,-28+sdx*0.2+camX*0.2,-28+sdy*0.2+camY*0.2,SPR.galaxy.w,SPR.galaxy.h);
      ctx.restore();
    }
  }
  /* the landmark: half the short side now, textured, lit by the arena */
  if(SPR.planet){
    const ps=SPR.planet.w;
    ctx.drawImage(SPR.planet.c,-ps*0.42+sdx*0.15+camX*0.15,H-ps*0.55+sdy*0.15+camY*0.15,ps,ps);
  }
  if(SPR.neb)for(let i=0;i<nebulas.length;i++){
    const n=nebulas[i];
    /* the nebulae swell when the drop lands — the dangling hook, wired */
    const nr=n.r*Math.max(W,H)*0.5*(1+(RM?0:0.18*G.dropFx));
    const nx=(n.x+0.02*Math.sin(amb*0.07+n.ph))*W;
    const ny=(n.y+0.02*Math.cos(amb*0.05+n.ph))*H;
    ctx.drawImage(SPR.neb[i].c,nx-nr,ny-nr,nr*2,nr*2);
    if(dropA>0&&SPR.neb2){
      ctx.globalAlpha=dropA;
      ctx.drawImage(SPR.neb2[i].c,nx-nr,ny-nr,nr*2,nr*2);
      ctx.globalAlpha=1;
    }
  }
  /* the warp wash behind the arena: blooms with the landing, sustains at low
     alpha while the section runs, drains with it. Suppressed under slow-mo
     so it never fights that vignette. */
  const wash=Math.min(0.85,((RM?0:0.45*G.dropFx)+0.30*G.pay)*(G.tsCur<0.98?0.4:1));
  if(wash>0.01&&SPR.nebDrop){
    ctx.globalAlpha=wash;
    const wr=R*2.2;
    ctx.drawImage(SPR.nebDrop.c,cx-wr,cy-wr,wr*2,wr*2);
    ctx.globalAlpha=1;
  }
  /* GOD RAYS. Two counter-rotated passes of the baked fan shimmer against
     each other; the drop throws them wide. Born outside the ring stack —
     the baked inner hole keeps the play annulus clean. */
  if(SPR.rays){
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    ctx.translate(cx,cy);
    const rs=SPR.rays.w;
    if(RM){
      ctx.globalAlpha=0.10;
      ctx.drawImage(SPR.rays.c,-rs/2,-rs/2,rs,rs);
    }else{
      ctx.rotate(amb*0.011);
      ctx.globalAlpha=Math.min(0.7,0.16+0.5*G.dropFx+0.15*G.pay);
      const s1=1+0.25*G.dropFx;
      ctx.drawImage(SPR.rays.c,-rs/2*s1,-rs/2*s1,rs*s1,rs*s1);
      ctx.rotate(-amb*0.018+1.3);
      ctx.globalAlpha=Math.min(0.7,0.10+0.3*G.dropFx);
      const s2=1.06+0.3*G.dropFx;
      ctx.drawImage(SPR.rays.c,-rs/2*s2,-rs/2*s2,rs*s2,rs*s2);
    }
    ctx.restore();
  }
  /* DEPTH PLANES, interleaved with the fog banks. The dim stars are baked
     soft (out of focus); the burn carved out of each fog bank keeps the air
     visibly cleared around the arena. */
  const pcx=RM?0:-Math.cos(G.angle)*7*u,pcy=RM?0:-Math.sin(G.angle)*7*u;
  const fogAl=0.5*(1-0.5*Math.min(1,G.dropFx+0.6*G.pay))*(G.tsCur<0.98?0.6:1);
  if(SPR.starsFar)ctx.drawImage(SPR.starsFar.c,-8+sdx*0.3+camX*0.3,-8+sdy*0.3+camY*0.3,SPR.starsFar.w,SPR.starsFar.h);
  if(SPR.fogA){
    ctx.globalAlpha=RM?0.4:fogAl;
    ctx.drawImage(SPR.fogA.c,-40+sdx*0.6+camX*0.6,-40+sdy*0.6+camY*0.6,SPR.fogA.w,SPR.fogA.h);
    ctx.globalAlpha=1;
  }
  if(SPR.starsNear)ctx.drawImage(SPR.starsNear.c,-28+sdx+pcx+camX,-28+sdy+pcy+camY,SPR.starsNear.w,SPR.starsNear.h);
  if(SPR.fogB&&!RM){
    ctx.globalAlpha=fogAl*0.8;
    ctx.drawImage(SPR.fogB.c,-40+sdx*1.4+pcx*1.6+camX*1.4,-40+sdy*1.4+pcy*1.6+camY*1.4,SPR.fogB.w,SPR.fogB.h);
    ctx.globalAlpha=1;
  }
  ctx.globalCompositeOperation='lighter';
  ctx.fillStyle='#dcebff';
  for(const st of bgStars){
    /* the bright twinklers glint on the LANDED beat — the only continuously
       animated background element finally agrees with the 104bpm grid the
       rest of the game obeys. Gated on groove so a player who has not found
       the beat is not shown a pulsing sky, and strongest in the payoff. */
    let al=RM?0.4:(0.10+0.55*(0.5+0.5*Math.sin(amb*st.tw+st.ph)));
    if(!RM&&st.r>1.2&&G.groove>0)al*=(1+0.30*G.beat*(0.5+0.5*G.pay));
    ctx.globalAlpha=Math.min(1,al);
    ctx.beginPath();ctx.arc(st.x*W+sdx+pcx+camX,st.y*H+sdy+pcy+camY,st.r,0,TAU);ctx.fill();
  }
  /* DUST MOTES in the lit shell around the arena: each drifts on its own
     orbit outside the outer ring, brightens inside the lamp's shell and
     under the sweep of light that leads the comet, and nods on the landed
     beat during the payoff. 44 tiny blits. */
  if(SPR.mote){
    const R0=radiusOf(0);
    for(const m of MOTES){
      const a=m.ang+amb*m.sp*0.03;
      const r=Math.max(1.08*R0+16*u,m.rr*R0+6*u*Math.sin(amb*0.4+m.ph));
      const shell=Math.max(0,1-Math.abs(r/R0-1.22)/0.5);
      let al=RM?0.10+0.18*shell
             :(0.05+0.30*shell)*(1+1.6*Math.pow(Math.max(0,Math.cos(a-G.angle)),4));
      if(!RM&&G.pay>0)al*=(1+0.8*G.beat);
      blit(SPR.mote,cx+Math.cos(a)*r+camX*1.1,cy+Math.sin(a)*r+camY*1.1,
        m.sz,0,Math.min(0.55,al));
    }
  }
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=1;

  ctx.save();
  ctx.translate(camX,camY);   /* the world rides the dolly; HUD stays pinned */
  if(G.shake>0)ctx.translate(rand(-G.shake,G.shake)*0.5,rand(-G.shake,G.shake)*0.5);

  /* ORBIT RINGS AS CONDUITS: the baked cross-section (dark channel walls, a
     hot core, a halo) replaces the two wide strokes; current visibly flows
     along each track, fastest and brightest under the player; node pips
     breathe on the landed beat. The crisp 1.3px stroke and the payoff
     recolour still draw over the top. */
  for(let i=0;i<G.nRings;i++){
    const rr=radiusOf(i),on=(G.hopP>=1&&G.ringI===i);
    const tn=RINGS[Math.min(RINGS.length-1,i)].tint;
    if(SPR.ringCh&&SPR.ringCh[i])blit(SPR.ringCh[i],cx,cy,1,0,on?1.0:0.6);
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    const mine=effRing()===i;
    ctx.setLineDash([3*u,17*u]);
    ctx.lineDashOffset=RM?0:-(G.t*(mine?90*u*G.dir:40*u))%(20*u);
    ctx.strokeStyle='rgb('+tn+')';ctx.lineWidth=2*u;
    ctx.globalAlpha=(mine?0.20:0.08)+0.10*G.pay;
    ctx.beginPath();ctx.arc(cx,cy,rr,0,TAU);ctx.stroke();
    ctx.setLineDash([]);
    if(SPR.pip)for(let k=0;k<8;k++){
      const pp=posAt(k*TAU/8,rr);
      blit(SPR.pip,pp[0],pp[1],1,0,RM?0.14:0.10+(G.groove>0?0.35*G.beat:0));
    }
    ctx.restore();
    /* The arena changes colour for the whole section — static, so it is safe
       under reduced motion. Bright enough to read on a phone now, and
       breathing with the landed beat (the visual half of the pump). */
    if(G.pay>0){
      ctx.globalAlpha=Math.min(1,(on?0.65:0.30)*(RM?1:1+0.35*G.beat));
      ctx.strokeStyle=on?'rgb(196,160,255)':'rgb(170,140,240)';
    }else{
      ctx.strokeStyle='rgba('+tn+','+(on?0.46:0.17)+')';
    }
    ctx.lineWidth=1.3;
    ctx.beginPath();ctx.arc(cx,cy,rr,0,TAU);ctx.stroke();
    ctx.globalAlpha=1;
  }
  /* How much of your section is left. One slow monotonic sweep — no flashing,
     no motion beyond the arc itself, so it is drawn for everyone including
     reduced motion, where it is the structural readout. */
  if(G.pay>0){
    ctx.save();ctx.globalAlpha=0.30;ctx.strokeStyle=COL.warp;ctx.lineWidth=3.5;
    ctx.beginPath();
    /* radiusOf(nRings-1) is the INNERMOST ring — this was drawing the section
       readout inside the arena instead of framing it. Ring 0 is the outer. */
    ctx.arc(cx,cy,radiusOf(0)+13*u,-Math.PI/2,-Math.PI/2+TAU*G.pay);
    ctx.stroke();ctx.restore();
  }
  /* THE BUILD IS THE SAME CIRCLE THE PAYOFF EMPTIES. Earn and spend now share
     one gauge at one radius: the arc fills as you play, blinks as each
     contribution lands, pulses white while a drop is pending, and the sweep
     above drains it. Never co-draws with the sweep — build only fills
     outside sections. Kept subordinate to the lap arc (0.55 at +6u). */
  else if(G.state==='playing'&&MU&&(G.build>0.01||MU.armed||MU.rise||MU.pend)){
    const pending=MU.armed||MU.rise||MU.pend;
    ctx.save();
    ctx.globalAlpha=pending?(RM?0.40:0.28+0.18*(0.5+0.5*Math.sin(G.t*4)))
                           :Math.min(0.42,0.10+0.26*G.build+0.25*G.buildFx);
    ctx.strokeStyle=pending?'#eaf1ff':COL.warp;
    ctx.lineWidth=3+(RM?0:2.5*G.buildFx);
    ctx.beginPath();
    ctx.arc(cx,cy,radiusOf(0)+13*u,-Math.PI/2,-Math.PI/2+TAU*(pending?1:Math.min(1,G.build)));
    ctx.stroke();ctx.restore();
  }
  /* THE ARENA CORE LAMP — the light source the whole scene answers to. It
     breathes on the landed beat and flares when the drop hits; clamped so
     its glow never reaches the innermost lane even at the small-R floor. */
  ctx.globalCompositeOperation='lighter';
  if(SPR.core){
    const S=Math.min(1,radiusOf(G.nRings-1)/(50*u));
    blit(SPR.core,cx,cy,RM?S:S*(1+0.18*G.beat+0.5*G.dropFx),0,
      RM?0.55:Math.min(1,0.55+0.25*G.beat+0.3*G.pay));
  }
  ctx.globalCompositeOperation='source-over';
  drawRingGlow();

  /* lap progress arc — colour reports how well fed this orbit is */
  if(G.state==='playing'&&G.lapAcc>0.05){
    const lr=curR()+6*u;
    let a0,a1;
    if(G.dir===1){a0=G.angle-G.lapAcc;a1=G.angle;}
    else{a0=G.angle;a1=G.angle+G.lapAcc;}
    ctx.globalAlpha=0.55;
    ctx.strokeStyle=G.lapEmbers>=3?COL.ember:(G.lapEmbers>=1?COL.comet:'rgba(170,195,255,0.55)');
    ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(cx,cy,lr,a0,a1);ctx.stroke();
    ctx.globalAlpha=1;
  }
  /* embers banked this orbit are drawn in the HUD — see drawHUD */
  /* Gesture guide: start dragging and the radial axis appears, so which way
     is "out" is never something you have to work out in your head. During
     the hop rehearsal it appears PROACTIVELY at the comet's live position,
     rotating with it — the one place the rotating gesture can be shown —
     and brightens on a pulse while the lesson is live. */
  const teachGuide=G.teach>0&&G.teachKind==='hop'&&!(pd&&pd.far>12);
  if(((pd&&pd.far>12)||teachGuide)&&G.state==='playing'&&G.nRings>1){
    const ga=teachGuide?G.angle:pd.ang;
    const ca=Math.cos(ga),sa=Math.sin(ga);
    const rIn=Math.max(9*u,radiusOf(G.nRings-1)-17*u),rOut=radiusOf(0)+21*u;
    ctx.save();
    ctx.globalAlpha=teachGuide?(RM?0.4:0.30+0.16*(0.5+0.5*Math.sin(G.t*3.2))):0.3;
    ctx.strokeStyle=COL.comet;ctx.lineWidth=1.5;
    ctx.setLineDash([5*u,5*u]);
    ctx.beginPath();
    ctx.moveTo(cx+ca*rIn,cy+sa*rIn);
    ctx.lineTo(cx+ca*rOut,cy+sa*rOut);
    ctx.stroke();
    ctx.setLineDash([]);
    const head=function(rr,facing,al){
      ctx.globalAlpha=al;
      ctx.save();
      ctx.translate(cx+ca*rr,cy+sa*rr);
      ctx.rotate(ga+(facing>0?0:Math.PI));
      ctx.beginPath();
      ctx.moveTo(8*u,0);ctx.lineTo(-4*u,5*u);ctx.lineTo(-4*u,-5*u);ctx.closePath();
      ctx.fillStyle=COL.comet;ctx.fill();
      ctx.restore();
    };
    head(rOut,1,G.ringI>0?0.8:0.18);              /* outward */
    head(rIn,-1,G.ringI<G.nRings-1?0.8:0.18);     /* inward */
    ctx.globalAlpha=1;ctx.restore();
  }
  /* slow-mo timer arc */
  if(G.slow>0){
    ctx.strokeStyle=COL.warp;ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(cx,cy,14*u,-Math.PI/2,-Math.PI/2+TAU*(G.slow/4));ctx.stroke();
  }

  /* embers */
  ctx.globalCompositeOperation='lighter';
  for(const s of G.stars){
    const p=posAt(s.a,radiusOf(s.ring));
    let al=1;
    if(s.born&&s.t<0.25){
      /* a nova ember condenses from a white-hot point — the transmutation is
         watched, not implied by the generic fade-in */
      const bq=s.t/0.25;
      blit(SPR.ember,p[0],p[1],2-bq,s.t*1.5,1);
      ctx.globalAlpha=(1-bq)*0.9;
      ctx.fillStyle='#ffffff';
      ctx.beginPath();ctx.arc(p[0],p[1],(6-2.5*bq)*u,0,TAU);ctx.fill();
      ctx.globalAlpha=1;
      continue;
    }
    if(!s.born&&s.t<0.3)al=s.t/0.3;
    else if(s.life-s.t<0.8)al=(s.life-s.t)/0.8;
    blit(SPR.ember,p[0],p[1],1+0.18*Math.sin(s.t*6),s.t*1.5,al);
  }
  ctx.globalCompositeOperation='source-over';
  /* power-ups */
  for(const s of G.pows){
    const p=posAt(s.a,radiusOf(s.ring));
    let al=1;
    if(s.t<0.3)al=s.t/0.3;
    else if(s.life-s.t<0.8)al=(s.life-s.t)/0.8;
    drawPow(p[0],p[1],s,al);
  }
  /* Gate bars: a rung across every ring reads instantly as "you cannot hop
     past". Built as a wide soft pass under a tight core so it registers as
     energy rather than a drawn line, and overhangs both ends of the ring
     stack so it reads as a barrier across the field, not a chord within it. */
  for(const s of G.spikes){
    if(!s.gate||s.ring!==0||s.phase===2)continue;
    const i0=posAt(s.a,radiusOf(0)+11*u);
    const i1=posAt(s.a,Math.max(5*u,radiusOf(G.nRings-1)-11*u));
    const live=s.phase===1&&armed(s);
    const base=live?0.52:0.16+0.14*Math.sin(s.t*12);
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    ctx.strokeStyle=COL.shard;ctx.lineCap='round';
    ctx.globalAlpha=base*0.30;ctx.lineWidth=10*u;
    ctx.beginPath();ctx.moveTo(i0[0],i0[1]);ctx.lineTo(i1[0],i1[1]);ctx.stroke();
    ctx.globalAlpha=base*0.9;ctx.lineWidth=2.2*u;
    ctx.beginPath();ctx.moveTo(i0[0],i0[1]);ctx.lineTo(i1[0],i1[1]);ctx.stroke();
    if(live&&!RM){
      /* rungs crawling along the span sell it as powered rather than painted */
      ctx.globalAlpha=0.45;ctx.lineWidth=2.6*u;
      ctx.setLineDash([5*u,9*u]);
      ctx.lineDashOffset=-(G.t*46*u)%(14*u);
      ctx.beginPath();ctx.moveTo(i0[0],i0[1]);ctx.lineTo(i1[0],i1[1]);ctx.stroke();
    }
    ctx.restore();
  }
  /* shards */
  for(const s of G.spikes){
    const p=posAt(s.a,radiusOf(s.ring));
    /* drifters trail a short arc showing which way they are sliding */
    if(s.va&&s.phase===1){
      const rr=radiusOf(s.ring),back=-Math.sign(s.va)*0.30;
      ctx.globalAlpha=0.3;ctx.strokeStyle=COL.shard;ctx.lineWidth=2.5;
      ctx.beginPath();
      ctx.arc(cx,cy,rr,Math.min(s.a,s.a+back),Math.max(s.a,s.a+back));
      ctx.stroke();ctx.globalAlpha=1;
    }
    if(s.phase===0){
      const k=s.t/(s.warn||WARN);
      const bl=0.5+0.5*Math.sin(s.t*(10+k*30));
      drawShardOutline(p[0],p[1],(8+3*k)*u,0.34+0.6*bl);
    }else if(s.phase===1){
      if(armed(s)){
        /* three kin, one halo: the silhouette says the behaviour, the shared
           red glow keeps "red kills you" a single lesson. Gate segments keep
           the plain crystal — the bar already tells their story. */
        /* rotated to the ring angle, so the baked bright face always looks
           back at the hub — one key light across the whole board */
        if(s.blink&&!s.gate)blit(SPR.shardBlink,p[0],p[1],1,s.a,1);
        else if(s.va&&!s.gate)blit(SPR.shardDrift,p[0],p[1],1,s.a+(s.va>0?Math.PI/2:-Math.PI/2),1);
        else blit(SPR.shard,p[0],p[1],1,s.a,1);
      }else{
        /* Dormant blinker: hollow, with a core that FILLS as re-arm nears —
           q runs 1→0 across the window, and the old alpha followed it, so
           the shard was faintest at the exact moment it was about to become
           lethal. The countdown now runs the right way. */
        const q=1-(blinkPhase(s)-BLINK*0.55)/(BLINK*0.45);
        drawShardOutline(p[0],p[1],10*u,0.45+0.4*(1-q),true,1-q);
      }
    }else{
      const k=s.t/FADE;
      blit(SPR.shard,p[0],p[1],1-k*0.4,s.a,1-k);
    }
  }
  /* NOVA FRONT: a wide soft leading edge with a hard bright rim inside it,
     plus a second rim trailing slightly so it reads as a shell with
     thickness rather than an expanding hoop. */
  ctx.globalCompositeOperation='lighter';
  for(const n of G.novas){
    const lf=Math.max(n.life,0);
    ctx.strokeStyle=COL.nova;
    ctx.globalAlpha=lf*0.30;
    ctx.lineWidth=26*u*lf;
    ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,TAU);ctx.stroke();
    ctx.strokeStyle='#ffffff';
    ctx.globalAlpha=lf*0.85;
    ctx.lineWidth=(1.5+4*lf)*u;
    ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,TAU);ctx.stroke();
    if(n.r>34*u){
      ctx.globalAlpha=lf*0.30;
      ctx.lineWidth=(1+2.5*lf)*u;
      ctx.beginPath();ctx.arc(n.x,n.y,n.r-22*u,0,TAU);ctx.stroke();
    }
  }
  /* ORBIT IGNITION: a head runs the full circumference in the direction you
     were travelling, with the wake burning behind it. Drawn as a body arc
     plus a short bright leading segment, so the eye tracks the head rather
     than a ring that merely brightens. */
  ctx.globalCompositeOperation='lighter';
  for(const L of G.laps){
    const t=1-Math.max(L.life,0);
    const sweep=RM?TAU:Math.min(1,t/0.62)*TAU;
    /* Offset outside the ring. On the ring it lands under the comet's own
       tail and reads as more trail; sitting just proud of it, gold against
       the tail's cyan, it reads as the orbit itself catching light. */
    const rr=radiusOf(L.ring)+9*u,lf=Math.max(L.life,0);
    const a0=L.dir>0?L.a:L.a-sweep, a1=L.dir>0?L.a+sweep:L.a;
    ctx.strokeStyle=COL.ember;
    ctx.globalAlpha=lf*0.30*L.mag;
    ctx.lineWidth=(3+9*lf)*u*L.mag;
    ctx.beginPath();ctx.arc(cx,cy,rr,a0,a1);ctx.stroke();
    ctx.globalAlpha=lf*0.62*L.mag;
    ctx.lineWidth=(1.4+3*lf)*u*L.mag;
    ctx.beginPath();ctx.arc(cx,cy,rr,a0,a1);ctx.stroke();
    if(sweep<TAU){
      const head=L.dir>0?a1:a0,w=0.22;
      ctx.strokeStyle='#fffdf2';
      ctx.globalAlpha=Math.min(1,lf*1.3)*L.mag;
      ctx.lineWidth=(3.5+5*lf)*u*L.mag;
      ctx.beginPath();ctx.arc(cx,cy,rr,head-w*(L.dir>0?1:0),head+w*(L.dir>0?0:1));ctx.stroke();
    }
  }
  for(const a of G.arcs){
    const lf=Math.max(a.life,0),half=0.09+0.5*(1-lf);
    ctx.globalAlpha=lf*lf*0.75;
    ctx.strokeStyle=a.col;ctx.lineWidth=(1+4*lf)*u;
    ctx.beginPath();ctx.arc(cx,cy,radiusOf(a.ring),a.a-half,a.a+half);ctx.stroke();
  }
  /* ripples — the big earned moments carry a fat baked annulus instead of a
     hairline stroke */
  for(const r of G.rings){
    const lf=Math.max(r.life,0);
    if(r.fat&&SPR.shock){
      blit(SPR.shock,r.x,r.y,r.r/48,0,lf*0.8);
      continue;
    }
    ctx.globalAlpha=lf*0.55;
    ctx.strokeStyle=r.col;ctx.lineWidth=1+2*lf;
    ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,TAU);ctx.stroke();
  }
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=1;
  /* Comet tail: a single tapered ribbon rather than a chain of dots, drawn
     in three additive passes so it falls off like light instead of paint. */
  drawTail();
  if(G.state!=='dead'){
    const p=posPlayer();
    let pal=1;
    if(G.t<G.invuln)pal=0.45+0.35*Math.sin(G.t*30);
    ctx.globalCompositeOperation='lighter';
    blit(SPR.cometGlow,p[0],p[1],1,0,pal);
    ctx.globalCompositeOperation='source-over';
    /* THE COMET READS AS TRAVELLING. The teardrop is rotated to its heading;
       a committed reverse sweeps the nose end-for-end through the radial
       over 90ms (never on the speculative flip — only reverseFX starts it,
       so a rollback can never show a turn that did not happen); a hop
       stretches it along the radial and thins it, settling on arrival. RM
       keeps the static orientation and skips the animation. */
    let dv=G.dir;
    if(!RM&&G.revFlip>G.t)dv=G.dir*(1-2*(G.revFlip-G.t)/0.09);
    const hopping=G.hopP<1,hs=(!RM&&hopping)?Math.sin(Math.PI*G.hopP):0;
    ctx.save();
    ctx.translate(p[0],p[1]);
    ctx.rotate(G.angle+Math.PI/2*dv);
    if(hs>0)ctx.scale(1-0.12*hs,1+0.26*hs);  /* local y is the radial */
    ctx.globalAlpha=pal;
    const cd=SPR.comet.s;
    ctx.drawImage(SPR.comet.c,-cd/2,-cd/2,cd,cd);
    /* the furnace: a white-hot core flickering at 24Hz over the teardrop —
       the comet reads as a genuinely hot object, not a lit shape */
    if(SPR.cometHot){
      ctx.globalCompositeOperation='lighter';
      const f=RM?0.6:FLK[(G.t*24|0)&15];
      const hs=SPR.cometHot.s*(RM?1:1+0.07*f);
      ctx.globalAlpha=pal*(RM?0.7:0.55+0.35*f);
      ctx.drawImage(SPR.cometHot.c,-hs/2,-hs/2,hs,hs);
      ctx.globalCompositeOperation='source-over';
    }
    ctx.globalAlpha=1;
    ctx.restore();
    drawBeat(p);
    for(let k=0;k<G.shields;k++)
      blit(SPR.shieldRing,p[0],p[1],(1.18+k*0.34)*(1+0.07*Math.sin(G.t*6-k*0.7)),0,pal*(0.72-k*0.16));
    if(G.t<G.invuln){
      ctx.globalAlpha=Math.min(1,(G.invuln-G.t)*1.6)*0.55;
      ctx.strokeStyle=COL.shield;ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(p[0],p[1],(19+5*Math.sin(G.t*16))*u,0,TAU);ctx.stroke();
      ctx.globalAlpha=1;
    }
  }
  /* particles */
  ctx.globalCompositeOperation='lighter';
  /* Stretched along travel, so a burst reads as energy thrown outward rather
     than confetti. Velocity damps hard (0.15^dt), so the streak collapses to
     a round spark within a few frames on its own — the shape is the motion. */
  for(const p of G.parts){
    const lf=Math.max(p.life,0),r=p.size*lf+0.5;
    ctx.globalAlpha=lf;ctx.fillStyle=p.col;
    const st=1+Math.min(Math.sqrt(p.vx*p.vx+p.vy*p.vy)/150,2.2);
    if(st>1.15){
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(Math.atan2(p.vy,p.vx));
      ctx.scale(st,1/Math.sqrt(st)); /* thin as it lengthens, area roughly held */
      ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.fill();
      ctx.restore();
    }else{
      ctx.beginPath();ctx.arc(p.x,p.y,r,0,TAU);ctx.fill();
    }
  }
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=1;
  /* Bloom sits inside the shaken transform so it stays registered with the
     world it is blooming, and under the popups so text stays crisp. */
  drawBloom();
  /* score popups: punch in over the first ~110ms, hold readable, snap out —
     a linear fade is the least alive curve there is. Big lines get the same
     one-pixel dark offset the hint text uses, so they stay crisp over bloom. */
  ctx.textAlign='center';
  for(const p of G.pops){
    const lf=Math.max(p.life,0);
    ctx.globalAlpha=Math.min(1,lf*3);
    const fs=14*u*(p.sz||1)*(RM?1:1+0.4*Math.max(0,lf-0.88)/0.12);
    if((p.sz||1)>1.2)text(p.str,p.x+1.5,p.y+1.5,fs,'800','rgba(4,8,20,0.85)',1);
    text(p.str,p.x,p.y,fs,'800',p.col,1);
  }
  ctx.globalAlpha=1;
  ctx.restore();

  /* THE GRADE: one quarter-res blit of baked photographic finish — corner
     falloff that tames stray bloom, a horizon lift, a band-axis bias. Above
     the game, below the scrim and HUD. */
  if(SPR.grade)ctx.drawImage(SPR.grade.c,0,0,W,H);
  /* slow-mo tint — baked; this was the file's last per-frame gradient */
  if(G.tsCur<0.98&&SPR.slowTint){
    ctx.globalAlpha=Math.min(1,(1-G.tsCur)/0.45);
    ctx.drawImage(SPR.slowTint.c,0,0,W,H);
    ctx.globalAlpha=1;
  }

  /* The world keeps rendering behind the game-over text — rings, embers and
     fading shards all competing with the score. Drop it back before the HUD
     goes on so the numbers you actually came for are legible. */
  if(G.state==='dead'){
    /* Held back 0.45s so the explosion and shockwave play in the open — the
       scrim used to reach 80% black while the death was still happening. */
    ctx.fillStyle='rgba(6,9,19,'+(Math.min(1,Math.max(0,G.t-G.deadT-0.45)/0.35)*0.80).toFixed(3)+')';
    ctx.fillRect(0,0,W,H);
  }
  drawHUD();
  drawMute();
  drawShieldBtn();
  drawShareBtn();
  if(G.flash>0){
    ctx.fillStyle='rgba(255,255,255,'+(G.flash*0.5)+')';
    ctx.fillRect(0,0,W,H);
  }
  /* THE IMPACT FRAME. Two or three frames of flat white with the collision
     silhouetted dark inside it, before anything else about dying is shown. */
  if(G.impactT>0&&G.killer){
    ctx.fillStyle='rgba(240,247,255,'+(0.92*Math.min(1,G.impactT/0.10)).toFixed(3)+')';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#0a1226';
    ctx.beginPath();ctx.arc(G.killer.x,G.killer.y,9*u,0,TAU);ctx.fill();
    ctx.save();ctx.translate(G.killer.x,G.killer.y);ctx.rotate(Math.PI/4);
    ctx.fillRect(-8*u,-8*u,16*u,16*u);ctx.restore();
  }
}

function drawShieldBtn(){
  if(G.state!=='playing')return;
  const r=shieldRect(),midY=r.y+r.h/2,has=G.shields>0;
  const pulse=has?0.55+0.2*Math.sin(G.t*3.2):0.22;
  ctx.save();
  /* No frame any more. It read as a button because it WAS one, and it is now
     a readout — a pill outline invites a press it no longer answers. */
  ctx.globalAlpha=1;
  /* one glyph per shield slot, matching the pickup icon */
  /* slots have to fit the widened bank, so the pitch closes up rather than
     the pips spilling out of the button */
  const mx=shieldMax(),gap=Math.min(30*u,(r.w-30*u)/Math.max(1,mx-1));
  const x0=r.x+r.w/2-(mx-1)*gap/2;
  for(let i=0;i<mx;i++){
    const on=i<G.shields,x=x0+i*gap;
    ctx.globalAlpha=on?pulse+0.35:0.16;
    ctx.strokeStyle=COL.shield;ctx.lineWidth=on?2.2:1.4;
    ctx.beginPath();ctx.arc(x,midY,9*u,0,TAU);ctx.stroke();
    if(on){
      ctx.fillStyle=COL.shield;
      ctx.beginPath();ctx.arc(x,midY,3.4*u,0,TAU);ctx.fill();
    }
  }
  ctx.globalAlpha=1;ctx.restore();
}
function drawShareBtn(){
  if(G.state!=='dead'||G.t-G.deadT<=0.6||!deadSeqDone())return;
  const r=shareRect(),midY=r.y+r.h/2,rad=r.h/2;
  const copied=G.shareFx>G.t;
  ctx.save();
  ctx.globalAlpha=copied?0.85:0.5;
  ctx.strokeStyle=COL.comet;ctx.lineWidth=1.6;
  ctx.beginPath();
  ctx.moveTo(r.x+rad,r.y);ctx.lineTo(r.x+r.w-rad,r.y);
  ctx.arc(r.x+r.w-rad,midY,rad,-Math.PI/2,Math.PI/2);
  ctx.lineTo(r.x+rad,r.y+r.h);
  ctx.arc(r.x+rad,midY,rad,Math.PI/2,-Math.PI/2);
  ctx.closePath();ctx.stroke();
  ctx.globalAlpha=1;
  ctx.textAlign='center';ctx.textBaseline='middle';
  text(copied?'COPIED':'SHARE',cx,midY,14*u,'800',COL.comet,3);
  ctx.restore();
}
function drawMute(){
  const r=muteRect(),x=r.x+r.w/2,y=r.y+r.h/2,s=r.w/2;
  ctx.save();
  ctx.globalAlpha=muted?0.72:0.5;
  ctx.fillStyle='#cfe4ff';ctx.strokeStyle='#cfe4ff';
  ctx.lineWidth=1.8;ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(x-s*0.8,y-s*0.28);ctx.lineTo(x-s*0.42,y-s*0.28);
  ctx.lineTo(x-s*0.02,y-s*0.72);ctx.lineTo(x-s*0.02,y+s*0.72);
  ctx.lineTo(x-s*0.42,y+s*0.28);ctx.lineTo(x-s*0.8,y+s*0.28);
  ctx.closePath();ctx.fill();
  ctx.beginPath();
  if(muted){
    ctx.moveTo(x+s*0.28,y-s*0.36);ctx.lineTo(x+s*0.8,y+s*0.36);
    ctx.moveTo(x+s*0.8,y-s*0.36);ctx.lineTo(x+s*0.28,y+s*0.36);
  }else{
    ctx.arc(x+s*0.14,y,s*0.36,-0.85,0.85);
    ctx.moveTo(x+s*0.14+s*0.68*Math.cos(-0.85),s*0.68*Math.sin(-0.85)+y);
    ctx.arc(x+s*0.14,y,s*0.68,-0.85,0.85);
  }
  ctx.stroke();
  ctx.restore();
}

/* EVERY RUN TEACHES. These used to stop after run six, on the theory that a
   veteran should never see them — but each one clears the instant the player
   does the thing, so a veteran sees each for well under a second and a new
   player gets the whole ladder no matter when they pick the game up. The flags
   they key off are all per-run now, so the sequence replays from the top every
   time without ever standing between anyone and the next input. */
/* SHOW THE GESTURE, DO NOT DESCRIBE IT. Every rung of this ladder used to be
   a sentence, read while dodging, in vocabulary the game had invented —
   "sparks", "track", "the bar". A sentence is the slowest possible way to
   teach a thumb movement. Each rung now carries a small animated diagram of
   the thing itself, drawn beside the words, and the words use only nouns that
   are visible on screen: rings, stars, shields. */
function hintGlyph(kind,x,y,s){
  const ph=RM?0.45:(G.t*0.85)%1;
  ctx.save();
  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.strokeStyle='#eaf3ff';ctx.fillStyle='#eaf3ff';ctx.lineWidth=1.9*u;
  if(kind==='tap'){
    /* a thumb press, and the reversal it causes */
    ctx.globalAlpha=0.45*(1-ph)+0.15;ctx.lineWidth=2.4*u;
    ctx.beginPath();ctx.arc(x,y,s*(0.26+0.5*ph),0,TAU);ctx.stroke();
    ctx.globalAlpha=0.95;
    ctx.beginPath();ctx.arc(x,y,s*0.23,0,TAU);ctx.fill();
    ctx.globalAlpha=0.85;ctx.lineWidth=2.2*u;
    for(const d of [-1,1]){
      ctx.beginPath();ctx.arc(x,y,s*0.62,d>0?-0.5:Math.PI-0.5,d>0?0.5:Math.PI+0.5);ctx.stroke();
      const a2=d>0?0.5:Math.PI+0.5, ax=x+Math.cos(a2)*s*0.62, ay=y+Math.sin(a2)*s*0.62;
      ctx.beginPath();ctx.moveTo(ax,ay);
      ctx.lineTo(ax-d*s*0.13,ay-s*0.13);ctx.moveTo(ax,ay);
      ctx.lineTo(ax+d*s*0.05,ay-s*0.18);ctx.stroke();
    }
  }else if(kind==='swipe'){
    /* two rings seen edge on, and a thumb crossing from one to the other */
    ctx.globalAlpha=0.6;ctx.lineWidth=2.6*u;
    ctx.strokeStyle='rgba(150,190,255,1)';
    ctx.beginPath();ctx.moveTo(x-s*0.52,y-s*0.46);ctx.lineTo(x+s*0.52,y-s*0.46);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x-s*0.52,y+s*0.46);ctx.lineTo(x+s*0.52,y+s*0.46);ctx.stroke();
    const ty=y-s*0.46+s*0.92*ph;
    ctx.strokeStyle='#eaf3ff';ctx.fillStyle='#eaf3ff';
    ctx.globalAlpha=0.25;ctx.lineWidth=2.4*u;      /* the path already travelled */
    ctx.beginPath();ctx.moveTo(x,y-s*0.46);ctx.lineTo(x,ty);ctx.stroke();
    ctx.globalAlpha=1;
    ctx.beginPath();ctx.arc(x,ty,s*0.2,0,TAU);ctx.fill();
    ctx.lineWidth=2.4*u;
    ctx.beginPath();ctx.moveTo(x-s*0.19,ty+s*0.16);ctx.lineTo(x,ty+s*0.36);
    ctx.lineTo(x+s*0.19,ty+s*0.16);ctx.stroke();
  }else if(kind==='star'){
    blit(SPR.ember,x,y,s/26,0,0.95);
  }else if(kind==='shard'){
    ctx.globalAlpha=0.95;ctx.fillStyle=COL.shard;
    ctx.save();ctx.translate(x,y);ctx.rotate(Math.PI/4);
    ctx.fillRect(-s*0.27,-s*0.27,s*0.54,s*0.54);ctx.restore();
  }else if(kind==='shield'){
    ctx.globalAlpha=0.95;ctx.strokeStyle=COL.shield;ctx.fillStyle=COL.shield;
    ctx.lineWidth=2.2*u;
    ctx.beginPath();ctx.arc(x,y,s*0.34,0,TAU);ctx.stroke();
    ctx.beginPath();ctx.arc(x,y,s*0.13,0,TAU);ctx.fill();
  }else if(kind==='beat'){
    /* the same contracting ring the comet wears, so the prompt names it */
    ctx.globalAlpha=0.95;ctx.beginPath();ctx.arc(x,y,s*0.18,0,TAU);ctx.fill();
    ctx.globalAlpha=0.25+0.55*ph;ctx.lineWidth=(1.3+1.6*ph)*u;
    ctx.beginPath();ctx.arc(x,y,s*(0.62-0.34*ph),0,TAU);ctx.stroke();
  }else if(kind==='build'){
    ctx.globalAlpha=0.28;ctx.fillStyle=COL.warp;
    ctx.fillRect(x-s*0.5,y-s*0.1,s,s*0.2);
    ctx.globalAlpha=0.95;
    ctx.fillRect(x-s*0.5,y-s*0.1,s*(0.25+0.7*ph),s*0.2);
  }else if(kind==='warp'){
    /* the counter-rotating squares of the slow-mo orb, at the pace it gives
       you rather than the pace it spins at — the diagram should feel slow */
    ctx.globalAlpha=0.95;ctx.strokeStyle=COL.warp;ctx.lineWidth=2.2*u;
    ctx.save();ctx.translate(x,y);ctx.rotate(ph*Math.PI/2);
    ctx.strokeRect(-s*0.31,-s*0.31,s*0.62,s*0.62);ctx.restore();
    ctx.save();ctx.translate(x,y);ctx.rotate(-ph*Math.PI/2+Math.PI/4);
    ctx.strokeRect(-s*0.18,-s*0.18,s*0.36,s*0.36);ctx.restore();
  }else if(kind==='nova'){
    /* the eight-point star of the nova orb, with one red square already
       turning: the sentence says what happens, this says it faster */
    ctx.globalAlpha=0.95;ctx.strokeStyle=COL.nova;ctx.lineWidth=1.9*u;
    ctx.save();ctx.translate(x,y);ctx.rotate(ph*Math.PI/4);
    ctx.beginPath();
    for(let i=0;i<16;i++){
      const sr=(i%2===0)?s*0.46:s*0.17, aa=i*Math.PI/8;
      if(i===0)ctx.moveTo(Math.cos(aa)*sr,Math.sin(aa)*sr);
      else ctx.lineTo(Math.cos(aa)*sr,Math.sin(aa)*sr);
    }
    ctx.closePath();ctx.stroke();ctx.restore();
    ctx.globalAlpha=0.95;ctx.fillStyle=COL.nova;
    ctx.beginPath();ctx.arc(x,y,s*0.1,0,TAU);ctx.fill();
  }
  ctx.restore();
}
function hintText(){
  if(G.state!=='playing')return null;
  const a=age();
  /* First match wins, so this list IS the curriculum and its order is the
     lesson plan. Two escape valves keep it honest: the orb-naming loop sits
     ABOVE the hop hint (an orb lives 7s; a lesson queued behind an unanswered
     gesture arrives after the thing it names has gone), and the hop hint
     itself times out into alternation after ten unanswered seconds — it used
     to hold the slot forever, so the player who could not hop was also never
     told that red kills or that shields save. */
  /* a first-encounter lesson owns the slot while its dilation runs */
  if(G.teachHint&&G.teach>0)return G.teachHint;
  if(!G.didReverse)return {t:'tap anywhere to turn around',g:'tap'};
  for(const pw of G.pows){
    if(pw.type==='warp'&&!G.gotWarp)return {t:'this one slows everything down',g:'warp'};
    if(pw.type==='nova'&&!G.gotNova)return {t:'this one turns every red into a star',g:'nova'};
  }
  /* Only once there is somewhere to hop TO. A run opens on a single ring for
     its first 20 seconds, so without this the prompt asks a new player to
     make the one gesture the game will not answer — they swipe, nothing
     happens, and the controls read as broken at the exact moment they are
     being learned.
     IT OUTRANKS THE LAP PROMPT — the hop is the unfamiliar half of the
     control scheme, and whichever lesson is harder should get the quiet part
     of the run — but only for ten seconds at a stretch; then it alternates
     with the survival lessons below and returns again at the bottom.
     The orb-naming rows sit above this one now: an orb lives 7s, and a
     lesson that queues behind an unanswered gesture arrives after the thing
     it names has gone. Each draws the orb itself rather than naming its
     colour, so a player who cannot separate violet from white on a phone in
     sunlight still has the shape to go on. */
  if(!G.didHop&&G.nRings>1){
    if(!G.hopHintT)G.hopHintT=a;
    if(a-G.hopHintT<10||Math.floor(a/6)%2===0)
      return {t:'swipe up or down to change ring',g:'swipe'};
  }
  if(!G.didLap&&a<22)return {t:'collect stars, then finish a lap',g:'star'};
  if(!G.didDodge&&G.spikes.length)return {t:'red kills you \u2014 get out of its way',g:'shard'};
  /* Widened at the front to meet the first shield, which the power-up
     curriculum now places around 10s rather than 17s. */
  if(!G.didShield&&a>9&&a<22)return {t:'a shield takes one hit for you',g:'shield'};
  /* Named after the ring now visibly contracting onto the comet, and phrased
     as an invitation rather than an instruction — a struggling player does not
     need another demand. */
  /* didGroove is the LIFETIME flag behind the one-time IN TIME popup; the
     prompt keys off this run's own chain, so it still reminds someone who
     learned it weeks ago and has not used it today. */
  if(G.bestGroove<2&&a>28&&G.groove<2)return {t:'tap in time with the beat',g:'beat'};
  /* Named at the ARC, where the answer actually is, and earlier — waiting
     until 34s meant most players never saw why a drop happened. */
  if(!G.sawDrop&&G.build>0.15)return {t:'the violet ring is charging your drop',g:'build'};
  return null;
}

/* THE LADDER, DRAWN. Ten pips, one per tier, filled up to where this run got
   — the same rotated-square idiom as the lap-ember pips, so the game says
   "progress" one way rather than two. The empty half is the point as much as
   the full half: a player who dies on level 3 can see that seven more exist,
   which is the thing a bare score can never tell them. */
/* `shown` caps how many filled pips have appeared yet — the death screen
   fills them one at a time. Callers that want them all pass tier+1. */
function drawLadder(x,y,tier,shown){
  const pipW=13*u,x0=x-(LEVEL_MAX-1)*pipW/2;
  for(let i=0;i<LEVEL_MAX;i++){
    ctx.save();ctx.translate(x0+i*pipW,y);ctx.rotate(Math.PI/4);
    const on=i<=tier&&i<(shown===undefined?tier+1:shown);
    ctx.globalAlpha=on?0.95:0.25;
    if(on){ctx.fillStyle=COL.ember;ctx.fillRect(-3.4*u,-3.4*u,6.8*u,6.8*u);}
    else{ctx.strokeStyle='rgba(200,215,255,0.9)';ctx.lineWidth=1.2;
      ctx.strokeRect(-3.4*u,-3.4*u,6.8*u,6.8*u);}
    ctx.restore();
  }
  ctx.globalAlpha=1;
}
function drawHUD(){
  ctx.textAlign='center';ctx.textBaseline='alphabetic';
  const top=safeTop;
  const bottomY=Math.min(H-24*u-safeBot,cy+R+52*u);
  if(G.state==='playing'){
    const sz=46*u*(1+0.25*G.scorePop);
    text(G.score,cx,top+52*u,sz,'800','#eaf1ff',0);
    /* The level replaces BEST here. The score directly above is already the
       live number, and a second number you cannot affect this second is worth
       less than the one that says where in the game you are. */
    text('LEVEL '+levelNum()+' · '+tierLabel(),cx,top+76*u,13*u,'700',
      'rgba(255,200,87,0.72)',2);
    /* embers banked toward this orbit's payout */
    const pipW=10*u,x0=cx-(LAP_EMB_MAX-1)*pipW/2,py=top+92*u;
    for(let i=0;i<LAP_EMB_MAX;i++){
      ctx.save();ctx.translate(x0+i*pipW,py);ctx.rotate(Math.PI/4);
      const on=i<G.lapEmbers;
      ctx.globalAlpha=on?0.95:0.22;
      if(on){ctx.fillStyle=COL.ember;ctx.fillRect(-2.8*u,-2.8*u,5.6*u,5.6*u);}
      else{ctx.strokeStyle='rgba(200,215,255,0.9)';ctx.lineWidth=1.2;ctx.strokeRect(-2.8*u,-2.8*u,5.6*u,5.6*u);}
      ctx.restore();
    }
    ctx.globalAlpha=1;
    /* THE COUNTER SAYS WHAT IT IS FOR. "GROOVE x5" is a score with no verb in
       it \u2014 it never told anyone what the number counts or what it buys, which
       is why the drop read as something that just happened to you. It now
       names the action and states the target it is climbing towards. */
    /* A short viewport cannot hold the explanatory column without it reaching
       down into the arena, so the sub-lines are earned by having the room. */
    const roomy=(top+186*u)<(cy-R);
    /* THE CENTRE IS ONE SLOT. Since the beat-target moved in, the middle of
       the arena is no longer "the one region nothing ever occupies" — so
       exactly one thing may claim it per frame: the drop payoff, then the
       target, then a banner or armFx or sayFx that a vertically-bound
       viewport has squeezed out of the HUD band, then the tutorial hint.
       Landscape used to overprint all of them through the IN TIME counter. */
    const bannerCentred=G.banner&&(cy-R-30*u)<top+177*u;
    const sayCentred=G.sayFx&&(cy-R-16*u)<top+152*u;
    const centreBusy=landOpen()||G.landFx||bannerCentred||(!roomy&&G.armFx)||sayCentred;
    if(G.groove>=1){
      ctx.globalAlpha=Math.min(1,0.45+0.12*G.groove)*(0.8+0.2*G.grooveFx);
      text('IN TIME \u00d7'+G.groove,cx,top+136*u,13*u*(1+0.12*G.grooveFx),'800',COL.warp,2);
      ctx.globalAlpha=1;
    }
    /* The orbit streak lived only inside a popup that showed for under a
       second once per orbit, so the run's longest-commitment behaviour was
       also its least visible. It no longer claims to earn a drop by itself —
       everything feeds one meter now, and that meter is drawn below. */
    if(G.lapStreak>=2&&roomy){
      ctx.globalAlpha=0.5;
      text('LAPS \u00d7'+G.lapStreak,cx,top+154*u,9.5*u,'700',
        'rgba(255,200,120,0.85)',2);
      ctx.globalAlpha=1;
    }
    /* WHY A DROP IS COMING, at the moment it is earned. Named, so the cause
       and the payoff are connected across the bars between them. */
    if(G.armFx&&!(bannerCentred&&!roomy)){
      const a=Math.min(1,G.armFx.t/0.22)*Math.min(1,(2.6-G.armFx.t)/0.7);
      ctx.globalAlpha=Math.max(0,a);
      /* With no HUD room the announcement takes the centre slot (hints
         yield) instead of printing over the outer ring's 12-o'clock track. */
      const ax=roomy?top+190*u:cy-10*u,ax2=roomy?top+208*u:cy+10*u;
      text(G.armFx.why,cx,ax,12*u,'800',COL.warp,3);
      /* Earned while the music was busy: say so, rather than swallowing it.
         The player did the thing and the game owes them an answer. */
      text(G.armFx.banked?'DROP BANKED':'DROP INCOMING',cx,ax2,15*u,'800',
        G.armFx.banked?'rgba(200,175,255,0.95)':'#eaf1ff',4);
      ctx.globalAlpha=1;
    }
    /* THE BUILD STRIP is the label carrier now — the always-visible gauge is
       the arc around the arena, at the exact radius the payoff sweep drains
       (see draw). The strip only appears where there is room for it; on a
       short viewport the arc carries the whole story and this band of screen
       goes back to the arena. */
    if(MU&&G.pay<=0&&roomy){
      const armed=MU.armed||MU.rise||MU.pend;
      const w=104*u,x0=cx-w/2,y=top+(roomy?222:180)*u,hgt=3*u;
      const prog=armed?(MU.rise?Math.min(1,((MU.step+STEPS-16)%STEPS)/16)
                               :0.5+0.5*Math.sin(G.t*4))
                     :Math.min(1,G.build);
      ctx.globalAlpha=0.26;ctx.fillStyle='rgba(180,150,255,0.6)';
      ctx.fillRect(x0,y,w,hgt);
      ctx.globalAlpha=armed?0.95:0.35+0.5*G.build;
      ctx.fillStyle=armed?'#eaf1ff':COL.warp;
      ctx.fillRect(x0,y,w*prog,hgt);
      if(!armed&&G.build>0.04&&roomy){
        ctx.globalAlpha=0.4+0.35*G.build;
        text('BUILD',cx,y-6*u,8.5*u,'700','rgba(190,160,255,0.9)',3);
      }
      ctx.globalAlpha=1;
    }
    /* which half of the section you are in, over the arena rather than the HUD
       so it reads as part of the moment instead of another statistic */
    if(G.sayFx&&!(sayCentred&&(G.banner||G.armFx))){
      const a=Math.min(1,G.sayFx.t/0.18)*Math.min(1,(1.8-G.sayFx.t)/0.6);
      ctx.globalAlpha=Math.max(0,a)*0.9;
      /* squeezed viewports hand it the centre instead of the IN TIME line */
      text(G.sayFx.str,cx,sayCentred?cy-8*u:cy-R-16*u,17*u,'800',
        G.sayFx.str==='YOUR TURN'?COL.warp:'rgba(210,225,255,0.75)',5);
      ctx.globalAlpha=1;
    }
    if(G.combo>=2&&G.comboT>0){
      ctx.globalAlpha=0.35+0.65*(G.comboT/CW);
      text('\u00d7'+G.combo+' COMBO',cx,top+116*u,14*u,'800',COL.ember,2);
      ctx.globalAlpha=1;
    }
    if(G.banner){
      const b=G.banner;
      const a=Math.min(1,b.t/0.3)*Math.min(1,(3.2-b.t)/0.6);
      ctx.globalAlpha=Math.max(0,a);
      /* The banner sits a fixed 30u above the ring — except on a vertically
         bound viewport (landscape, iPad), where cy-R collapses onto the HUD
         band and the old clamp printed the gold LEVEL header straight
         through IN TIME. There it takes the centre slot instead, which the
         hint system yields for exactly this. */
      const by=bannerCentred?cy-8*u:cy-R-30*u;
      /* GOLD, NOT RED. This drew in COL.shard — the shard fill, the danger
         outline, and the exact colour GAME OVER is printed in. The one moment
         the game announces that you have got somewhere was painted in its
         failure colour, which is a strange thing to do to the only reward the
         ladder ever hands out. Ember gold is what the game already uses for
         everything earned. */
      text('LEVEL '+levelNum(),cx,by-19*u,12*u,'800','rgba(255,200,87,0.75)',3);
      text(b.str,cx,by,20*u,'800',COL.ember,4);
      text(b.sub,cx,by+20*u,12*u,'600','rgba(210,225,255,0.75)',0);
      ctx.globalAlpha=1;
    }
    /* THE TARGET. A ring converges on the rim and touches it exactly as the
       drop lands, so the timing is something you watch rather than guess —
       the same language as the beat ring around the comet. */
    if(landOpen()){
      const lr=landRect(),d=MU.landT-AC.currentTime;
      const app=Math.max(0,Math.min(1,1-d/(SPB*4)));      /* 0 far out, 1 on the beat */
      ctx.save();
      ctx.globalCompositeOperation='lighter';
      /* the rim */
      ctx.globalAlpha=0.30+0.45*app;
      ctx.strokeStyle=COL.warp;ctx.lineWidth=(1.8+2.2*app)*u;
      ctx.beginPath();ctx.arc(lr.x,lr.y,lr.r,0,TAU);ctx.stroke();
      /* the incoming ring */
      if(d>0){
        ctx.globalAlpha=0.25+0.6*app;
        ctx.strokeStyle='#ffffff';ctx.lineWidth=(1.4+2.6*app)*u;
        ctx.beginPath();ctx.arc(lr.x,lr.y,lr.r+(1-app)*72*u,0,TAU);ctx.stroke();
      }
      /* the word, only while it is still reachable */
      ctx.globalCompositeOperation='source-over';
      ctx.globalAlpha=0.55+0.45*app;
      text(d>0?'TAP ON THE DROP':'NOW',lr.x,lr.y+4*u,
        (d>0?10.5:14)*u,'800','#eaf3ff',2);
      ctx.restore();ctx.globalAlpha=1;
    }
    /* THE PAYOFF. Its own moment, at a size nothing else in the game uses. */
    if(G.landFx){
      const f=G.landFx,a=Math.min(1,f.t/0.12)*Math.min(1,(1.9-f.t)/0.7);
      ctx.globalAlpha=Math.max(0,a);
      const pop=1+0.35*Math.max(0,1-f.t*4);
      if(f.perfect){
        text('PERFECT DROP',cx,cy-14*u,26*u*pop,'800',COL.warp,6);
        text('+'+f.gain,cx,cy+22*u,34*u*pop,'800','#ffffff',3);
      }else if(f.good){
        text('ON THE DROP',cx,cy-8*u,20*u*pop,'800',COL.warp,4);
        text('+'+f.gain,cx,cy+18*u,22*u*pop,'800','#eaf3ff',2);
      }else{
        text('MISSED IT',cx,cy,16*u,'800','rgba(210,225,255,0.55)',3);
      }
      ctx.globalAlpha=1;
    }
    const hintO=centreBusy?null:hintText();
    const hint=hintO&&hintO.t;
    if(hint){
      /* DEAD CENTRE. Shards and embers ride the rings and the comet orbits
         them, so guidance sits where the eye already is without hiding a
         threat — but the centre is a SHARED slot now (the beat-target and
         payoff text live here too), which is why hintO is nulled whenever
         centreBusy is set above. The shadow is a second fillText offset by a
         pixel rather than shadowBlur, which this file avoids per-frame. */
      /* Fit it inside the innermost ring. Anything wider crosses the tracks at
         three and nine o'clock, which is exactly where a shard would be — the
         one place centred text can hide a threat.
         WRAPPED, because the guidance now says what to do and what you get
         rather than naming a mechanic, and those sentences do not fit on one
         line at a readable size. The middle of a circle has far more vertical
         room than horizontal, so two lines is the shape that actually fits —
         shrinking a long single line to make it fit was the wrong axis. */
      const budget=Math.min(W*0.82,radiusOf(G.nRings-1)*2*1.02);
      let hs=17*u;
      const wide=t=>{ctx.font='700 '+Math.round(hs)+'px '+F;
                     return ctx.measureText(t).width+1*t.length;};
      let lines=[hint];
      if(wide(hint)>budget){
        /* split at the word boundary closest to the middle, so the two lines
           come out balanced rather than one long and one orphan */
        const w=hint.split(' ');
        let best=1,bd=1e9;
        for(let i=1;i<w.length;i++){
          const d=Math.abs(w.slice(0,i).join(' ').length-w.slice(i).join(' ').length);
          if(d<bd){bd=d;best=i;}
        }
        lines=[w.slice(0,best).join(' '),w.slice(best).join(' ')];
      }
      /* A floor, not a fit-at-any-cost. On a short landscape viewport the
         arena is barely 100px across and nothing readable fits inside it —
         there the block keeps its size and overlaps the rings, because
         guidance you cannot read is worse than guidance sitting over a track.
         Under the rings is not an option: that space belongs to the shields. */
      let over=Math.max(...lines.map(wide))/budget;
      if(over>1)hs=Math.max(13*u,hs/over);
      /* diagram above, words below — the picture is the instruction and the
         sentence only names it */
      const lh=hs*1.15, gs=30*u;
      const y0=cy+5*u-(lines.length-1)*lh/2+gs*0.42;
      ctx.globalAlpha=RM?1:0.88+0.12*Math.sin(G.t*2.6);
      hintGlyph(hintO.g,cx,y0-(lines.length-1)*lh/2-hs-gs*0.62,gs);
      for(let i=0;i<lines.length;i++){
        text(lines[i],cx+1.5,y0+i*lh+1.5,hs,'700','rgba(4,8,20,0.85)',1);
        text(lines[i],cx,y0+i*lh,hs,'700','#eaf3ff',1);
      }
      ctx.globalAlpha=1;
    }
  }else if(G.state==='menu'){
    const ty=Math.max(top+40*u,cy-R-46*u);
    text('COMET LOOP',cx,ty,34*u,'800','#eaf1ff',6);
    /* A KEY, NOT A PARAGRAPH. Each row is the diagram the game will use again
       mid-run, so the picture is learned here and only recognised later. The
       old copy still told players to "tap it to phase through" — a control
       that was removed two releases ago, which is the worst thing an
       instruction can do. */
    /* Only once there is a climb to report. A first-time player has no level
       to beat and does not need a scoreboard before they have played. It rides
       directly under the title because it is identity, not a control \u2014 the key
       below is one uninterrupted list of things you can do. */
    if(G.bestLevel>1){
      text('BEST \u00b7 LEVEL '+G.bestLevel+' of '+LEVEL_MAX,cx,ty+20*u,12*u,'700',
        'rgba(255,200,87,0.7)',2);
    }
    /* The three orbs are rows now rather than the line "green saves you \u00b7
       violet slows \u00b7 white clears", which asked a player to hold three colour
       words in their head and match them to dots they had not seen yet. A row
       draws the orb, so the match is made for them \u2014 and it still works for
       anyone who cannot separate violet from white on a phone in sunlight. */
    const rows=[['tap','tap anywhere to turn around'],
                ['swipe','swipe up or down to change ring'],
                ['star','collect stars \u2014 a full orbit pays big'],
                ['shard','red kills you'],
                ['shield','a shield takes one hit for you'],
                ['warp','this orb slows everything down'],
                ['nova','this orb turns every red into a star'],
                ['beat','tap in time to build a drop']];
    /* LAID OUT FROM THE ROOM AVAILABLE, not from a constant. The key was eight
       rows at a hardcoded y0 away from running off the bottom of a short
       phone; it now takes the gap between the title and TAP TO START and
       divides it, so adding a row shrinks the leading instead of overflowing. */
    const kTop=ty+(G.bestLevel>1?34*u:22*u), kBot=bottomY-24*u;
    const rh=Math.min(24*u,Math.max(15*u,(kBot-kTop)/rows.length));
    const fs=Math.min(13*u,rh*0.56), gs=Math.min(20*u,rh*0.84);
    /* centred in the gap rather than pinned to the top of it: on a tall phone
       the rows shrink to 24u and leave the rest as one dead band, and a block
       floating above a void reads as a layout accident. */
    const y0=(kTop+kBot)/2-(rows.length-1)*rh/2, gx=cx-118*u;
    for(let i=0;i<rows.length;i++){
      const ry=y0+i*rh;
      hintGlyph(rows[i][0],gx,ry-fs*0.35,gs);
      ctx.textAlign='left';
      text(rows[i][1],gx+20*u,ry,fs,'600','rgba(214,228,255,0.88)',0);
    }
    ctx.textAlign='center';
    /* Opened from a chat app, iOS presents the page as a modal sheet, and that
       sheet eats downward swipes to dismiss itself — the game's own inward hop.
       Nothing in here can prevent it, so point at the thing that does. */
    if(IN_APP_BROWSER){
      text('add to home screen \u2014 swipes close this window',cx,
        Math.min(bottomY-11*u,y0+rows.length*rh+4*u),
        11*u,'600','rgba(255,190,120,0.75)',0);
    }
    /* THE DEMO'S CAPTIONS. The comet behind the key is playing a 12-second
       scripted loop (see menuDemo): as it reverses, the tap glyph appears
       beside it; as it hops, the swipe glyph. The player watches the verbs
       answered by the actual object before ever touching the screen. */
    if(!RM){
      const dc=G.t%12,dp=posPlayer();
      if(dc>=1.6&&dc<4.2)hintGlyph('tap',dp[0],dp[1]-30*u,26*u);
      else if(dc>=5.2&&dc<10.6)hintGlyph('swipe',dp[0],dp[1]-30*u,26*u);
    }
    const pulse=RM?1:0.72+0.28*Math.sin(G.t*3);
    ctx.globalAlpha=pulse;
    text('TAP TO START',cx,bottomY,17*u,'800',COL.comet,4);
    ctx.globalAlpha=1;
    /* Shown only when collection is actually switched on. Delete this block
       if you would rather disclose somewhere else — but disclose somewhere. */
    if(POSTHOG_KEY){
      text('anonymous play stats collected',cx,
        Math.min(H-8*u-safeBot,bottomY+20*u),10*u,'600','rgba(200,215,255,0.32)',0);
    }
  }else{
    /* THE LEVEL LEADS, AND THE SCREEN ASSEMBLES ITSELF. GAME OVER shrinks to
       a label — you already know you died — and instead of one static frame
       the most-replayed screen in the game has an order: shockwave in the
       open, pips filling one at a time with their ticks, LEVEL punching in,
       the score counting up, the stats last. Any tap past the lockout
       fast-forwards it; reduced motion renders the finished screen at once.
       Sequenced off G.t-G.deadT, which keeps running while dead. */
    const td=G.t-G.deadT,skip=RM||G.deadSkip;
    const el=function(at,dur){return skip?1:Math.max(0,Math.min(1,(td-at)/(dur||0.18)));};
    const pipsShown=skip?G.tier+1:Math.max(0,Math.floor((td-0.55)/0.07));
    if(pipsShown>G.deadPips&&pipsShown<=G.tier+1){
      G.deadPips=pipsShown;
      beep(620+44*pipsShown,0.05,'sine',0.028,undefined,0,0,0.2);
    }
    const lvAt=0.55+0.07*(G.tier+1);   /* the moment the last pip lands */
    if(el(0.45))drawLadder(cx,cy-104*u,G.tier,pipsShown);
    const la=el(lvAt,0.15);
    if(la>0){
      ctx.globalAlpha=la;
      text('LEVEL '+levelNum(),cx,cy-72*u,30*u*(skip?1:1+0.35*(1-la)),'800',COL.ember,5);
      text(tierLabel(),cx,cy-52*u,11*u,'700','rgba(255,200,87,0.6)',3);
      ctx.globalAlpha=1;
    }
    ctx.globalAlpha=el(0.15);
    text('GAME OVER',cx,cy-30*u,13*u,'800',COL.shard,3);
    /* the score counts up under an ease-out, landing with the level */
    const sq=skip?1:Math.max(0,Math.min(1,(td-0.2)/0.5));
    text(Math.round(G.score*(1-(1-sq)*(1-sq))),cx,cy+14*u,54*u,'800','#eaf1ff',0);
    ctx.globalAlpha=el(lvAt+0.35);
    if(G.newLevel)text('FURTHEST YET',cx,cy+42*u,13*u,'700',COL.ember,3);
    else if(G.newBest)text('NEW BEST',cx,cy+42*u,13*u,'700',COL.ember,3);
    else text('BEST LEVEL '+G.bestLevel+' · '+G.best,cx,cy+42*u,13*u,'600',
      'rgba(200,215,255,0.5)',2);
    ctx.globalAlpha=el(lvAt+0.5);
    text(G.orbits+' orbits · ×'+G.bestStreak+' streak · '+runTime(),
      cx,cy+62*u,12*u,'600','rgba(200,215,255,0.45)',0);
    /* Landed drops are the rarest thing a run can contain, so they get the
       line — sharing it with the groove rather than adding a row, because
       this screen has run out of vertical space twice already. */
    const brag=[];
    if(G.bestGroove>=2)brag.push('groove ×'+G.bestGroove);
    if(G.lands>0)brag.push(G.lands+(G.lands===1?' drop landed':' drops landed'));
    if(brag.length)
      text(brag.join('  ·  '),cx,cy+78*u,11*u,'600','rgba(170,135,255,0.7)',0);
    /* ONE COACHING LINE, from what the game already measured — the death it
       just watched. Above the ladder, where the eye starts. */
    if(G.coach){
      ctx.globalAlpha=el(lvAt+0.5)*0.9;
      hintGlyph(G.coach.g,cx,cy-152*u,22*u);
      text(G.coach.t,cx,cy-128*u,12*u,'600','rgba(214,228,255,0.85)',0);
    }
    ctx.globalAlpha=1;
    if(G.t-G.deadT>0.6&&deadSeqDone()){
      const pulse=RM?1:0.72+0.28*Math.sin(G.t*3);
      ctx.globalAlpha=pulse;
      text('TAP TO RETRY',cx,bottomY,17*u,'800',COL.comet,4);
      ctx.globalAlpha=1;
    }
  }
}

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
  if(window.innerWidth!==W||window.innerHeight!==H||sprBand!==skyI)resize();
  const dt=Math.min((now-last)/1000,0.05);
  last=now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

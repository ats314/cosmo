         arena is barely 100px across and nothing readable fits inside it —
         there the block keeps its size and overlaps the rings, because
         guidance you cannot read is worse than guidance sitting over a track.
         Under the rings is not an option: that space belongs to the shields. */
      let over=Math.max(...lines.map(wide))/budget;
      if(over>1)hs=Math.max(13*u,hs/over);
      /* diagram above, words below — the picture is the instruction and the
         sentence only names it */
      const lh=hs*1.15, gs=30*u;
      const y0=cy+5*u-(lines.length-1)*lh/2+gs*0.42;
      ctx.globalAlpha=RM?1:0.88+0.12*Math.sin(G.t*2.6);
      hintGlyph(hintO.g,cx,y0-(lines.length-1)*lh/2-hs-gs*0.62,gs);
      for(let i=0;i<lines.length;i++)
        textFx(lines[i],cx,y0+i*lh,hs,'700','#ffffff','#a8d4ff',
          'rgba(120,200,255,0.42)',1);
      ctx.globalAlpha=1;
    }
  }else if(G.state==='lvend'){
    const c2=G.lvCard||{done:false,next:1};
    const L=LV[Math.min(LEVEL_MAX-1,c2.next-1)];
    const a2=Math.min(1,(G.t-G.lvT)/0.35);
    ctx.globalAlpha=a2;
    let y2=cy-150*u;
    if(c2.done){
      textFx('LEVEL '+(c2.next-1)+' COMPLETE',cx,y2,24*u,'800','#ffe9b0',COL.ember,'rgba(255,200,87,0.5)',4);
      text('score so far \u00b7 '+G.carryScore,cx,y2+22*u,12*u,'600',
        'rgba(210,225,255,0.7)',1);
      y2+=58*u;
    }
    text('LEVEL '+Math.min(LEVEL_MAX,c2.next),cx,y2,14*u,'800','rgba(255,200,87,0.8)',3);
    textFx(L.name,cx,y2+26*u,22*u,'800','#ffffff','#9fd8ff','rgba(125,228,255,0.45)',4);
    let my=y2+62*u;
    for(const m of L.mech){
      const mt=m[1]||swipeWords();
      hintGlyph(m[0],cx-112*u,my-5*u,16*u);
      ctx.textAlign='left';
      text(mt,cx-94*u,my,fitSz(mt,11.5*u,'600',W/2+82*u),'600','rgba(214,228,255,0.85)',0);
      ctx.textAlign='center';
      my+=26*u;
    }
    /* THE DRAFT. Three tiles on the card that already exists, and the tap
       that picks one IS the tap that starts the level — no extra screen, no
       extra step, and the choice lands on the one calm moment the player is
       already reading. */
    /* SIZED FROM THE ROOM ON THE SCREEN, NOT FROM A CONSTANT. Playtest,
       verbatim: "the selection of power ups between levels — i had to
       screenshot so i can zoom in and read. i'm old." He was right: the tile
       was a hardcoded 76u wide with its description set at 8u, which is 8
       PHYSICAL PIXELS on a phone. Three of those tiles used 248u of a 390u
       screen and left 142u of margin doing nothing.
       The row now claims the width it has and the type scales with the tile,
       so the same layout reads on a 360-wide phone and a tablet. Height is
       derived from the gap between the last mechanic row and CHOOSE ONE, and
       the tile is whichever of the two constraints binds first — so a short
       viewport shrinks the tiles instead of sliding them up through the text
       above, which is what the old upward clamp did. */
    G.offerRects=[];
    if(G.offer&&G.offer.length){
      const n=G.offer.length,gap=9*u;
      const availW=Math.min(W-24*u,430*u);
      const availH=Math.max(74*u,bottomY-28*u-(my+10*u));
      const tw=Math.min((availW-(n-1)*gap)/n,availH/1.18);
      const th=tw*1.18;
      const x0=cx-(n*tw+(n-1)*gap)/2;
      const ty0=Math.min(my+14*u,bottomY-th-30*u);
      for(let i=0;i<G.offer.length;i++){
        const o=G.offer[i],bx=x0+i*(tw+gap);
        G.offerRects.push({x:bx,y:ty0,w:tw,h:th,id:o.id});
        ctx.save();
        ctx.globalAlpha=a2;
        const bg=ctx.createLinearGradient(0,ty0,0,ty0+th);
        bg.addColorStop(0,'rgba(20,27,46,0.96)');bg.addColorStop(1,'rgba(10,15,28,0.96)');
        ctx.fillStyle=bg;
        const rr=Math.min(13*u,tw*0.12);
        ctx.beginPath();ctx.roundRect(bx,ty0,tw,th,rr);ctx.fill();
        ctx.strokeStyle=o.c;ctx.globalAlpha=a2*(RM?0.7:0.5+0.3*Math.sin(G.t*3+i));
        ctx.lineWidth=1.6;
        ctx.beginPath();ctx.roundRect(bx+0.8,ty0+0.8,tw-1.6,th-1.6,rr);ctx.stroke();
        ctx.globalAlpha=a2;
        /* every measurement below is a fraction of the tile, so the artwork
           and the type keep their proportions at whatever size it came out */
        ctx.save();
        ctx.translate(bx+tw/2,ty0+th*0.335);
        const isc=(tw/(76*u))*u*0.82;
        ctx.scale(isc,isc);
        ctx.shadowColor=o.c;ctx.shadowBlur=12;
        o.ic(ctx,o.c);
        ctx.restore();
        ctx.textAlign='center';
        /* floors as well as ceilings: a landscape phone binds on height and
           makes the tile small, and without a floor the type would come out
           SMALLER than the fixed sizes this replaced — the opposite of the
           point. 9.5/8 are exactly what the old hardcoded layout used, so no
           viewport can regress. */
        const nsz=Math.max(9.5*u,Math.min(13.5*u,tw*0.125));
        text(o.n,bx+tw/2,ty0+th*0.645,fitSz(o.n,nsz,'800',tw-10*u),'800','#eaf1ff',0);
        /* WRAPPED ON MEASURED WIDTH, NOT A CHARACTER COUNT. The old rule broke
           at 16 characters regardless of the glyphs, then hard-capped at two
           lines, so a description that needed a third was silently truncated:
           the longest tile description in the table at the time shipped with
           its last two words missing. Two lines is still the budget, but now
           the type shrinks until the sentence FITS in two rather than losing
           its ending. */
        let dsz=Math.max(8*u,Math.min(11*u,tw*0.098)),lines;
        const wrap=function(sz){
          ctx.font='600 '+Math.round(sz)+'px '+F;
          const out=[];let ln='';

      ctx.save();
      ctx.globalAlpha=lsA;
      ctx.fillStyle=on?'rgba(30,54,84,0.96)':'rgba(16,22,38,0.90)';
      ctx.beginPath();ctx.roundRect(lx,ly,lw,lh,11*u);ctx.fill();
      ctx.strokeStyle=on?MD().c:'rgba(140,170,220,0.28)';
      ctx.lineWidth=on?2:1.2;
      ctx.globalAlpha=lsA*(on?(RM?1:0.62+0.38*Math.sin(G.t*3))+G.lvSelFx*0.35:1);
      ctx.globalAlpha=Math.min(1,ctx.globalAlpha);
      ctx.beginPath();ctx.roundRect(lx+1,ly+1,lw-2,lh-2,11*u);ctx.stroke();
      ctx.globalAlpha=lsA;
      /* the ordinal as the same diamond the death screen's ladder uses: one
         pip per level with this one filled, so the row says WHERE in the run
         it sits and not merely which number it is */
      const dx=lx+20*u,dy=ly+lh/2;
      ctx.save();ctx.translate(dx,dy);ctx.rotate(Math.PI/4);
      if(on){ctx.fillStyle=COL.ember;ctx.fillRect(-4.4*u,-4.4*u,8.8*u,8.8*u);}
      else{ctx.strokeStyle=reached?'rgba(255,200,87,0.7)':'rgba(200,215,255,0.5)';
        ctx.lineWidth=1.3;ctx.strokeRect(-4.4*u,-4.4*u,8.8*u,8.8*u);}
      ctx.restore();
      ctx.textAlign='left';
      const nm=L.name;
      text('LEVEL '+n,lx+38*u,dy-3*u,fitSz('LEVEL '+n,10*u,'700',lw-60*u),'700',
        on?'rgba(255,200,87,0.9)':'rgba(255,200,87,0.45)',2);
      text(nm,lx+38*u,dy+13*u,fitSz(nm,14*u,'800',lw-58*u),'800',
        on?'#eaf1ff':'rgba(214,228,255,0.66)',0);
      /* the mark, right-aligned: what this device has actually reached */
      if(reached&&n>1){
        ctx.textAlign='right';
        ctx.globalAlpha=lsA*(on?0.85:0.45);
        text('reached',lx+lw-14*u,dy+5*u,9.5*u,'700','rgba(123,255,200,0.9)',1);
        ctx.globalAlpha=lsA;
      }
      ctx.textAlign='center';
      ctx.restore();
      ly+=lh+lgap;
    }
    /* START, and a way back to the title screen. The back control is a word
       rather than a row: it is the one thing on this screen you reach for by
       mistake, and it must not look like a fifth level. */
    const pw2=Math.min(150*u,W-60*u),px2=cx-pw2/2;
    G.lvSelRects.push({x:px2,y:py2,w:pw2,h:pH,id:'start'});
    ctx.save();
    ctx.globalAlpha=lsA*(RM?1:0.78+0.22*Math.sin(G.t*3));
    ctx.strokeStyle=MD().c;ctx.lineWidth=1.8;
    ctx.beginPath();ctx.roundRect(px2,py2,pw2,pH,pH/2);ctx.stroke();
    ctx.restore();
    ctx.globalAlpha=lsA;
    ctx.textBaseline='middle';
    textFx('START',cx,py2+pH/2,17*u,'800','#eaffff',MD().c,'rgba(93,240,255,0.5)',4);
    ctx.textBaseline='alphabetic';
    const bkW=64*u,bkY=py2+pH+7*u;
    G.lvSelRects.push({x:cx-bkW/2,y:bkY,w:bkW,h:bkH,id:'back'});
    ctx.globalAlpha=lsA*0.6;
    text('back',cx,bkY+bkH*0.68,11*u,'700','rgba(200,215,255,0.85)',1);
    ctx.globalAlpha=1;
  }else if(G.state==='powersel'){
    /* WHICH POWERUP. The level picker's screen, one list deeper: heading,
       rows, a pill, a way back — deliberately the same idiom rather than a new
       one, because this is the same kind of question asked on the same live
       arena, and a second layout for it would be a second thing to learn.
       Each row carries the ORB ITSELF, drawn by drawPow — the same call the
       arena makes, so the picture on the row is the object on the board and
       cannot drift from it. Seven rows is nearly twice the level picker's
       four, so the row height is derived from what is actually left after the
       toggle, the pill and the back word are reserved, with a low floor: on a
       short landscape phone the list compresses and the controls do not move,
       which is the rule that screen already follows. */
    const psA=Math.min(1,(G.t-G.lvT)/0.35);
    ctx.globalAlpha=psA;
    const psTop=Math.max(top+34*u,cy-R-44*u);
    textFx('WHICH POWERUP?',cx,psTop,fitSz('WHICH POWERUP?',22*u,'800',W-30*u,2),'800',
      '#ffffff','#c4a8ff','rgba(160,135,255,0.45)',2);
    const psub='powerup testing · it appears over and over';
    text(psub,cx,psTop+19*u,fitSz(psub,10.5*u,'600',W-24*u),'600',
      'rgba(214,205,245,0.7)',1);
    G.powSelRects=[];
    const gH=26*u,ppH=38*u,pbkH=26*u;
    const ppy=bottomY-ppH-10*u-pbkH-4*u;
    const gy2=ppy-gH-8*u;
    const psBot=gy2-8*u;
    const pgap=4*u,N=LAB_ORBS.length;
    const listTop=psTop+30*u,availH=psBot-listTop;
    /* SEVEN ROWS IS NEARLY TWICE THE LEVEL PICKER'S FOUR, and on a landscape
       phone the column simply does not fit: measured across eight viewports,
       844x390 and 740x360 both drove the rows onto their floor and then ran the
       last one straight through the ghost toggle. The floor was the bug — a
       minimum height that the box cannot honour is not a minimum, it is an
       overflow with a comment. So the list folds to TWO COLUMNS exactly when
       one will not fit at a tappable height, which is the same viewport that
       has width to spare: the block widens to 620u there, and each cell still
       carries the orb, its name and its sentence at full size. The decision is
       made from the measured box, not from an orientation test — a short
       window on a desktop gets the same treatment as a phone on its side. */
    const cols=(availH<N*24*u)?2:1;
    const rowsN=Math.ceil(N/cols);
    const pw3=Math.min(W-30*u,cols===2?620*u:320*u),plx=cx-pw3/2;
    const colGap=8*u,cellW=(pw3-(cols-1)*colGap)/cols;
    const plh=Math.max(20*u,Math.min(38*u,(availH-(rowsN-1)*pgap)/rowsN));
    const listH=rowsN*plh+(rowsN-1)*pgap;
    let py3=Math.max(listTop,(listTop+psBot)/2-listH/2);
    for(let i=0;i<N;i++){
      const o=LAB_ORBS[i],on=LAB.sel===i;
      const cxx=plx+(i%cols)*(cellW+colGap),cyy=py3+Math.floor(i/cols)*(plh+pgap);
      G.powSelRects.push({x:cxx,y:cyy,w:cellW,h:plh,id:'orb',i:i,orb:o.id});
      ctx.save();
      ctx.globalAlpha=psA;
      ctx.fillStyle=on?'rgba(38,30,72,0.96)':'rgba(16,22,38,0.90)';
      ctx.beginPath();ctx.roundRect(cxx,cyy,cellW,plh,11*u);ctx.fill();
      ctx.strokeStyle=on?COL.warp:'rgba(140,170,220,0.28)';
      ctx.lineWidth=on?2:1.2;
      ctx.globalAlpha=psA*(on?Math.min(1,(RM?1:0.62+0.38*Math.sin(G.t*3))+G.powSelFx*0.35):1);
      ctx.beginPath();ctx.roundRect(cxx+1,cyy+1,cellW-2,plh-2,11*u);ctx.stroke();
      ctx.globalAlpha=psA;
      drawPow(cxx+plh*0.62,cyy+plh/2,{type:o.id,t:G.t},on?1:0.55);
      ctx.textAlign='left';
      const tx=cxx+plh*1.14,tw=cellW-plh*1.14-12*u;
      const nz=Math.min(13*u,plh*0.40),dz=Math.min(10*u,plh*0.30);
      text(o.n,tx,cyy+plh*0.44,fitSz(o.n,nz,'800',tw),'800',
        on?'#eaf1ff':'rgba(214,228,255,0.62)',1);
      text(o.d,tx,cyy+plh*0.80,fitSz(o.d,dz,'600',tw),'600',
        on?'rgba(206,220,255,0.85)':'rgba(180,198,230,0.42)',0);
      ctx.textAlign='center';
      ctx.restore();
    }
    /* THE GHOST SWITCH, stated as what it does and not as a difficulty. Red is
       still on the board and still armed; it simply cannot land. Off, the lab
       is the real game with one orb in it — which is the only way to find out
       what taking that orb is worth. */
    G.powSelRects.push({x:plx,y:gy2,w:pw3,h:gH,id:'ghost'});
    ctx.save();
    ctx.globalAlpha=psA;
    ctx.fillStyle='rgba(16,22,38,0.86)';
    ctx.beginPath();ctx.roundRect(plx,gy2,pw3,gH,gH*0.32);ctx.fill();
    ctx.strokeStyle=LAB.invuln?'rgba(123,255,200,0.55)':'rgba(140,170,220,0.24)';
    ctx.lineWidth=1.2;
    ctx.beginPath();ctx.roundRect(plx+1,gy2+1,pw3-2,gH-2,gH*0.32);ctx.stroke();
    /* a filled box for on, an empty one for off — the same mark the level
       picker's ordinal uses, so "set" reads the same way on both screens */
    const bxs=Math.min(11*u,gH*0.44),bxx=plx+14*u,bxy=gy2+gH/2;
    if(LAB.invuln){ctx.fillStyle=COL.shield;ctx.fillRect(bxx-bxs/2,bxy-bxs/2,bxs,bxs);}
    else{ctx.strokeStyle='rgba(200,215,255,0.5)';ctx.lineWidth=1.3;
      ctx.strokeRect(bxx-bxs/2,bxy-bxs/2,bxs,bxs);}
    ctx.textAlign='left';
    const gtx='red cannot touch you';
    text(gtx,plx+30*u,bxy+3.5*u,fitSz(gtx,Math.min(11*u,gH*0.42),'700',pw3-44*u),'700',
      LAB.invuln?'rgba(123,255,200,0.9)':'rgba(190,206,235,0.55)',1);
    ctx.textAlign='center';
    ctx.restore();
    const ppw=Math.min(150*u,W-60*u),ppx=cx-ppw/2;
    G.powSelRects.push({x:ppx,y:ppy,w:ppw,h:ppH,id:'start'});
    ctx.save();
    ctx.globalAlpha=psA*(RM?1:0.78+0.22*Math.sin(G.t*3));
    ctx.strokeStyle=COL.warp;ctx.lineWidth=1.8;
    ctx.beginPath();ctx.roundRect(ppx,ppy,ppw,ppH,ppH/2);ctx.stroke();
    ctx.restore();
    ctx.globalAlpha=psA;
    ctx.textBaseline='middle';
    textFx('START',cx,ppy+ppH/2,17*u,'800','#f2eaff',COL.warp,'rgba(160,135,255,0.5)',4);
    ctx.textBaseline='alphabetic';
    const pbW=64*u,pbY=ppy+ppH+5*u;
    G.powSelRects.push({x:cx-pbW/2,y:pbY,w:pbW,h:pbkH,id:'back'});
    ctx.globalAlpha=psA*0.6;
    text('back',cx,pbY+pbkH*0.68,11*u,'700','rgba(200,215,255,0.85)',1);
    ctx.globalAlpha=1;
  }else{
    /* THE LEVEL LEADS, AND THE SCREEN ASSEMBLES ITSELF. GAME OVER shrinks to
       a label — you already know you died — and instead of one static frame
       the most-replayed screen in the game has an order: shockwave in the
       open, pips filling one at a time with their ticks, LEVEL punching in,
       the score counting up, the stats last. Any tap past the lockout
       fast-forwards it; reduced motion renders the finished screen at once.
       Sequenced off G.t-G.deadT, which keeps running while dead. */
    const td=G.t-G.deadT,skip=RM||G.deadSkip;
    const el=function(at,dur){return skip?1:Math.max(0,Math.min(1,(td-at)/(dur||0.18)));};
    const pipsShown=skip?G.level:Math.max(0,Math.floor((td-0.55)/PIPDT));
    if(pipsShown>G.deadPips&&pipsShown<=G.level){
      G.deadPips=pipsShown;
      /* the ladder reveal walks the pentatonic — even the death screen is
         in the game's key */
      beep(PENT[Math.min(13,3+pipsShown)],0.06,'sine',0.03,undefined,0,0,0.2);
    }
    const lvAt=0.55+PIPDT*G.level;   /* the moment the last pip lands */
    if(el(0.45))drawLadder(cx,cy-104*u,G.level,pipsShown);
    const la=el(lvAt,0.15);
    if(la>0){
      ctx.globalAlpha=la;
      textFx('LEVEL '+G.level,cx,cy-72*u,30*u*(skip?1:1+0.35*(1-la)),'800','#ffe9b0',COL.ember,'rgba(255,200,87,0.5)',5);
      /* the level's own name, matching the header and the card — the tier
         name here was the same collision the header had, one screen later */
      text(levelName(),cx,cy-52*u,fitSz(levelName(),11*u,'700',W-40*u,3),'700','rgba(255,200,87,0.6)',3);
      ctx.globalAlpha=1;
    }
    ctx.globalAlpha=el(0.15);
    text('GAME OVER',cx,cy-30*u,13*u,'800',COL.shard,3);
    /* the score counts up under an ease-out, landing with the level */
    const sq=skip?1:Math.max(0,Math.min(1,(td-0.2)/0.5));
    text(Math.round(G.score*(1-(1-sq)*(1-sq))),cx,cy+14*u,54*u,'800','#eaf1ff',0);
    ctx.globalAlpha=el(lvAt+0.35);
    if(G.newLevel)text('FURTHEST YET',cx,cy+42*u,13*u,'700',COL.ember,3);
    else if(G.newBest)text('NEW BEST',cx,cy+42*u,13*u,'700',COL.ember,3);
    else if(LAB.on){
      /* THE ONE LINE THAT HAS TO BE HERE. This screen prints a score in
         54u type, and a lab score is not a score: pinned clock, one orb on
         repeat, and red switched off unless you turned it back on. Without a
         mark, a screenshot of it is indistinguishable from a real run's — and
         the line under it would otherwise be the device's genuine BEST, which
         is the pairing most likely to be read as a comparison. Say what the
         number is and what happened to it. */
      const ll='POWERUP TESTING · not recorded';
      text(ll,cx,cy+42*u,fitSz(ll,12*u,'700',W-24*u,2),'700','rgba(190,178,235,0.75)',2);
    }
    else{
      /* One record, so the line needs no qualifier — this is the line that
         shipped before chill existed, restored exactly. */
      const bl2='BEST \u00b7 LEVEL '+G.lvlMax+' \u00b7 '+G.best;
      text(bl2,cx,cy+42*u,fitSz(bl2,13*u,'600',W-24*u,2),'600',
        'rgba(200,215,255,0.5)',2);
    }
    ctx.globalAlpha=el(lvAt+0.5);
    text(G.orbits+' orbits · '+G.bestStreak+' clean orbits · '+runTime(),
      cx,cy+62*u,12*u,'600','rgba(200,215,255,0.45)',0);
    /* Landed drops are the rarest thing a run can contain, so they get the
       line — sharing it with the groove rather than adding a row, because
       this screen has run out of vertical space twice already. */
    const brag=[];
    if(G.bestGroove>=2)brag.push('on beat ×'+G.bestGroove);
    if(G.lands>0)brag.push(G.lands+(G.lands===1?' drop landed':' drops landed'));
    if(brag.length)
      text(brag.join('  ·  '),cx,cy+78*u,11*u,'600','rgba(170,135,255,0.7)',0);
    /* the retention hook: name the sound the ladder is still holding.
       IT YIELDS RATHER THAN STACKING. Moving the share pill below this line
       fixed portrait but not landscape, where cy and bottomY are barely 140u
       apart: there the pill's clamp lifts it straight back onto this line and
       the collision returns. This is the most droppable row on the screen —
       the score, the level, the coach and RETRY are all load-bearing — so on a
       viewport with no room for both, it is the one that goes. */
    if(G.tier<T_VOICE[3]&&cy+94*u<shareRect().y-9*u){
      /* 4, 7 and 10 were one-based TIER rungs printed with the word "level",
         two lines below "LEVEL n" on a four-level ladder — the last surviving
         breach of the two-ladders invariant, and the exact failure the retired
         cometloop:level key exists because of. The correct numbers (1, 2, 4)
         are non-monotonic against the player's own progress and would read as
         a bug, so the ordinal goes; the ladder is drawn on this same screen. */
      const nx=G.tier>=T_VOICE[2]?'electric guitar':G.tier>=T_VOICE[1]?'synth lead':'twin synths';
      ctx.globalAlpha=el(lvAt+0.6)*0.9;
      text('next sound: '+nx+' \u2014 keep climbing',cx,cy+94*u,10.5*u,'600',
        'rgba(200,215,255,0.42)',0);
      ctx.globalAlpha=1;
    }
    /* ONE COACHING LINE, from what the game already measured — the death it
       just watched. Above the ladder, where the eye starts. */
    if(G.coach){
      ctx.globalAlpha=el(lvAt+0.5)*0.9;
      hintGlyph(G.coach.g,cx,cy-152*u,22*u);
      text(G.coach.t,cx,cy-128*u,fitSz(G.coach.t,12*u,'600',W-20*u),'600','rgba(214,228,255,0.85)',0);
    }
    ctx.globalAlpha=1;
    if(G.t-G.deadT>0.6&&deadSeqDone()){
      const pulse=RM?1:0.72+0.28*Math.sin(G.t*3);
      ctx.globalAlpha=pulse;
      textFx('TAP TO RETRY',cx,bottomY,17*u,'800','#eaffff',COL.comet,'rgba(93,240,255,0.5)',4);
      ctx.globalAlpha=1;
    }
  }
}

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
  if(window.innerWidth!==W||window.innerHeight!==H||sprBand!==skyI)resize();
  const dt=Math.min((now-last)/1000,0.05);
  last=now;
  update(dt);
  /* THE LOOP NEVER DIES. requestAnimationFrame is only scheduled after
     draw(), so a single throwing frame — one bad radius, one transient
     state — would otherwise freeze the run forever with no error the
     player can see. One dropped frame is invisible; a dead game is not.
     The first error is kept for inspection instead of being re-thrown.
     THE CANVAS STATE IS RESTORED on error. draw() nests ctx.save() and
     ctx.translate() for the camera dolly and screen shake; if anything
     between the save and the matching restore throws, the translate is
     never popped and every subsequent frame starts from a shifted origin
     that accumulates until the page is resized. The catch now resets the
     transform to the DPR identity, so a dropped frame cannot corrupt
     every frame that follows it. This was the "screen shifted and broke
     the game" report: a BH activation's burst of new draw work hit a
     transient error, the translate stuck, and the world stayed offset. */
  try{draw();}catch(e){
    if(!window.__drawErr)window.__drawErr=e;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.globalAlpha=1;
    ctx.globalCompositeOperation='source-over';
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
freshCheck();
</script>

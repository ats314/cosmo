        note(PENT[4]*1.007,tt,0.18,'sawtooth',0.018,2200,0.2);
        note(PENT[6],tt+2*S16,0.20,'square',0.026,2600,0.2);
        note(PENT[6]*1.007,tt+2*S16,0.20,'sawtooth',0.018,2400,-0.2);}
    });
  }
  if(G.teach<=0&&G.teachHint)flushLesson(false);
  /* Effects run on dt, gameplay on sdt — so during hitstop the comet holds
     still while the ignition keeps playing. That contrast is the impact.
     The hop rehearsal dilates the same way slow-mo does: the comet at a
     third speed, the music untouched, and spawns held — see the rings
     branch of the tier ratchet. */
  /* A HARD LESSON IS A HELD BREATH NOW, not a mumble. 0.35x meant the new
     threat was explained over a board still visibly in motion — the
     playtest's "poor job of introducing cleanly" in one number. 'see'
     lessons run near-frozen (0.06x) under a dim veil with the specimen
     spotlit; the hop rehearsal keeps 0.35x because it needs a world moving
     enough to practice against. The music never stops either way. */
  const sdt=dt*G.tsCur*(G.stop>0?0.10:1)*
    ((G.teach>0&&!G.teachSoft)?(G.teachKind==='see'?0.06:0.35):1);
  /* a slow floor ramp so the game can never be stalled by refusing to score */
  /* HYPERNOVA speed: +90% at full burn — eased in over a third of a second
     so the lurch reads as ignition, and eased OUT over the last 1.4s so the
     star never dumps you at double speed into an armed lane */
  const hv=G.hyper>0?Math.min(1,(G.hyperD-G.hyper)/0.35,G.hyper/1.4):0;
  G.speed=speedAt()*(FIN.on?1+0.06*FIN.got:1)*(1+0.9*hv);   /* the dive is a rush */
  /* Announce each new mechanic so it registers as something to learn. One
     crossing at a time, spaced by the banner: when the verb gate releases,
     the held tiers arrive as a readable sequence instead of a pile-up that
     skips every banner but the last. */
  /* Never during the finale: with STORM sitting exactly on level 3's floor,
     dl crosses it while a level-2 star dive is still playing out — the exam
     must not be announced over the graduation ceremony. startGame's silent
     pre-climb owns the crossing instead, and the level card announces it.
     And a live banner now keeps the screen for its FULL display: replacing
     at 1.2s was below reading speed for the 40-char subs, and the pile-up
     case (the hop-hold releasing TWIN + THIRD RING together) is by
     construction the player reading slowest. */
  const ti=tierIndex();
  if(ti>G.tier&&!FIN.on&&!FIN.pend&&!G.banner&&
     !(lvEnd<1e9&&dl()>=lvEnd-10)){
    /* ...and never in a level's ENDGAME window either: a beat-drop payoff
       defers the finale latch while dl keeps running, so without this a
       long payoff at the end of level 2 crossed dl 190 and announced THE
       STORM over its own graduation. The next level's silent pre-climb
       owns any crossing the window swallows. */
    G.tier++;G.featT=G.t;      /* the featuring grace clock — see pickType */
    skyI=Math.max(G.level-1,G.tier>=9?3:G.tier>=7?2:G.tier>=4?1:0);  /* the sky deepens; each level floors it */
    const T=TIERS[G.tier];
    if(T.rings&&T.rings>G.nRings){
      G.nRings=T.rings;
      const nr=radiusOf(G.nRings-1);
      G.rings.push({x:cx,y:cy,r:nr*0.3,life:1,col:COL.comet});
      G.rings.push({x:cx,y:cy,r:nr,life:1,col:COL.comet});
      beep(330,0.2,'sine',0.05,660);
      beep(660,0.25,'sine',0.05,990,0.16);
      /* THE HARD GESTURE GETS A REHEARSAL. When the second ring lands for
         someone who has never once hopped, time dilates, spawns hold, and
         the radial guide draws at the comet — the one place the rotating
         gesture can actually be shown. First landed hop ends it instantly;
         the cap means it can never stall a run. */
      if(G.nRings===2&&!G.didHop&&!G.everHopped){
        /* a live lesson must not survive into the rehearsal: teach state is
           one slot, and inheriting a soft lesson's flags ran the rehearsal
           at FULL speed under a stale sentence */
        flushLesson(true);
        G.teach=8;G.teachKind='hop';G.teachSoft=false;
      }
    }
    if(T.name){
      G.banner={str:T.name,sub:T.sub,t:0};
      fireLift();      /* ceremony, not a chorus — see fireLift */
      ripple(cx,cy,COL.ember);   /* earned, so gold — see the banner draw */
      /* the unlock call, reserved for banners alone — the generic triangle
         pair it replaces sounded like three other events */
      cueUnlock();
    }
    /* the star voice steps up at levels 4, 7 and 10 — announced after the
       level banner has had the screen (see update), as its own moment */
    if(G.tier===3||G.tier===6||G.tier===9){
      SND_SEEN[G.tier]=1;   /* a later level start must not repeat it */
      G.sndAt=G.t+3.8;
      G.sndStr=G.tier>=9?'NEW SOUND: ELECTRIC GUITAR':
               G.tier>=6?'NEW SOUND: SYNTH LEAD':'NEW SOUND: TWIN SYNTHS';
    }
  }
  if(G.banner){G.banner.t+=dt;if(G.banner.t>3.2)G.banner=null;}
  if(G.lapFx){G.lapFx.t+=dt;if(G.lapFx.t>0.45)G.lapFx=null;}
  G.prevAngle=G.angle;
  G.sweep=G.speed*sdt;
  G.angle=(G.angle+G.dir*G.speed*sdt)%TAU;
  pushTrail();
  /* the furnace sheds: a stream of sparks off the comet's tail, denser
     during the payoff, one in four ember-gold */
  if(!RM){
    G.sparkT-=dt;
    if(G.sparkT<=0){
      G.sparkT=rand(0.07,0.14)*(G.pay>0?0.5:1);
      G.sparkN=(G.sparkN||0)+1;
      const hx=Math.cos(G.angle+Math.PI/2*G.dir),hy=Math.sin(G.angle+Math.PI/2*G.dir);
      const sp2=posPlayer();
      G.parts.push({x:sp2[0]-hx*7*u,y:sp2[1]-hy*7*u,
        vx:-hx*rand(40,95)+rand(-30,30),vy:-hy*rand(40,95)+rand(-30,30),
        life:1,dec:rand(2.6,4.0),col:G.sparkN%4===3?COL.ember:'#bef4ff',
        size:rand(1,1.9)*u});
    }
  }

  /* full orbit: 360 degrees of travel without reversing (hops allowed).
     Payout scales with the embers gathered during it, so a bare orbit is
     worth almost nothing and the two scoring systems feed each other. */
  G.lapAcc+=G.speed*sdt;
  if(G.lapAcc>=TAU){
    G.lapAcc-=TAU;
    const fed=G.lapEmbers>0;
    if(fed)G.lapStreak++;else G.lapStreak=0;
    G.orbits++;G.bestStreak=Math.max(G.bestStreak,G.lapStreak);
    const base=6+13*Math.min(G.lapEmbers,LAP_EMB_MAX);
    const streakBonus=fed?Math.min(7*(G.lapStreak-1),28):0;
    const bonus=base+streakBonus;
    G.score+=bonus;G.scorePop=1;
    G.diff+=1;
    const lp=posPlayer();
    const label=(G.lapStreak>1?'ORBIT \u00d7'+G.lapStreak+' +':'ORBIT +')+bonus;
    if(fed){
      const st=G.lapStreak;
      /* everything below scales with the streak, so the payoff grows with
         the difficulty of having earned it */
      const k=Math.min(1,(st-1)/4);
      /* once laps take under ~2.4s the every-lap popup is wallpaper: at
         speed it only prints when it is NEWS (a streak building) */
      if(G.speed<2.6||st>=2)popup(lp[0],lp[1]-28*u,label,COL.ember,1+0.45*k);
      ignite(G.ringI,G.angle,G.dir,st);
      ripple(lp[0],lp[1],COL.ember);
      /* a wide slow front off the ring itself, not just off the comet */
      G.rings.push(RM?{x:cx,y:cy,r:radiusOf(G.ringI),life:1,col:COL.ember}
        :{x:cx,y:cy,r:radiusOf(G.ringI),life:1,col:COL.ember,sp:150+120*k,dec:1.6});
      burst(lp[0],lp[1],COL.ember,18+Math.round(14*k),190+90*k);
      duckBed(0.45,0.35);
      /* the payout arpeggio walks up on sixteenths from the next grid point
         — the game's biggest scoring phrase finally plays in time */
      beep(262,0.05,'triangle',0.05,330);
      cueTone(function(w){
        beep(262,0.12,'triangle',0.07,392,w);
        beep(392,0.12,'triangle',0.07,523,w+S16);
        beep(523,0.16,'triangle',0.07,784,w+2*S16);
        if(st>=3)beep(784,0.18,'triangle',0.05,1046,w+3*S16);
      });
      /* thresholds, not a floor: `st>=5` fired on every fed orbit past the
         fifth, which at mid-run speed is roughly every three seconds */
      /* was `st===5||st===9||st===14` — exact values, so past 14 it could
         never fire again; a player on a streak of 99 earned nothing from
         orbits after the first minute. The requirement now ESCALATES instead:
         5 laps, then 15, then 25. Laps are the passive route — you get them
         by not dying — so making each one dearer is what keeps the section
         special now that the cooldown no longer throws earnings away. */
      /* The gap GROWS each time. A fed orbit lands about every nine seconds,
         so a flat step meant a drop roughly every fourth orbit for the whole
         run and half the run turned into payoff. Growing the requirement is
         what keeps the section rare without the cooldown throwing earnings
         away: 4 orbits, then 9, then 16, then 25. */
      build(0.085,'orbit');
      if(st>=3){
        /* Earned tier: the comet stops dead for a beat while the ring burns
           round. Short enough not to break the rhythm of a 2.5s orbit. */
        if(!RM)G.stop=Math.max(G.stop,0.075);
        if(!RM)flashHit(0.16+0.10*k);
        /* the streak topper rides the same scheduled arpeggio above */
        try{if(navigator.vibrate)navigator.vibrate(18);}catch(e){}
      }
    }else if(G.speed<2.6){
      popup(lp[0],lp[1]-26*u,label,'rgba(200,215,255,0.7)');
      cueTone(function(w){beep(392,0.1,'triangle',0.04,440,w);});
    }
    G.lapEmbers=0;G.didLap=true;
    checkMile();
  }
  G.comboT=Math.max(0,G.comboT-sdt);
  if(G.comboT<=0)G.combo=0;

  G.starT-=sdt;
  if(G.starT<=0&&!FIN.on&&G.stars.length<emberCap()){spawnStar();G.starT=emberGap()*rand(0.75,1.4);}
  G.spikeT-=sdt;
  if(G.teach<=0&&!FIN.on&&G.spikeT<=0&&age()>=firstShardAt()&&G.spikes.length<shardCap()){
    spawnSpike();
    G.spikeT=spawnGap()*rand(0.85,1.15);
  }
  G.powT-=sdt;
  if(G.powT<=0&&!FIN.on&&G.pows.length===0&&dl()>=6){
    G.powT=spawnPow()?Math.max(6,rand(10,15)-dl()*0.02):0.5;
  }

  const er=effRing();
  /* embers */
  for(let i=G.stars.length-1;i>=0;i--){
    const s=G.stars[i];s.t+=sdt;
    if(s.t>s.life){G.stars.splice(i,1);continue;}
    if(s.ring===er&&sweptHit(s.a,(22*u)/radiusOf(er))){
      G.stars.splice(i,1);
      G.combo=Math.min(G.combo+1,6);G.comboT=CW;
      if(G.combo>G.bestCombo)G.bestCombo=G.combo;
      if(G.combo>=3)firstMeet('combo');   /* the multiplier names itself once */
      G.score+=G.combo;G.diff+=1;G.scorePop=1;
      /* embers ride the section too: doubled (×2 more on a perfect landing) */
      if(MU&&MU.pay>0){
        const ex=G.combo*(G.secMult||1);
        G.score+=ex;G.secScore+=ex;
      }else if(G.od>0||G.hyper>0||G.shields>=shieldMax())G.score+=G.combo; /* overdrive, hypernova — and a FULL shield bank — double the pickup */
      G.lapEmbers++;G.embers++;
      const p=posAt(s.a,radiusOf(s.ring));
      burst(p[0],p[1],COL.ember,14,150);
      ripple(p[0],p[1],COL.ember);
      arcFlash(s.a,s.ring,COL.ember);
      popup(p[0],p[1]-20*u,'+'+G.combo,COL.ember);
      /* THE EMBER IS THE ARP'S NOTE NOW. It used to be a sine ding over the
         music; it plays the band's own square, chord-aware, through the bed
         bus — so it ducks, pans and mixes as part of the record, and a
         pickup is the arrangement gaining a note rather than a bell hitting
         it. The instant touch is a shaker grain; the tone lands on the
         sixteenth grid, so a chain of embers IS a fill run. */
      hat(AC?AC.currentTime:0,0.005,4800,0.03,0,0,7600);
      if(G.combo>=3)try{if(navigator.vibrate)navigator.vibrate(6);}catch(e){}
      const cb=G.combo,cpan=panAt(p[0]);
      const eco=[0,-1,1,0][MU?((MU.step/8)|0)%4:0];
      cueTone(function(w){
        /* THE PICKUP GIVES NOW (playtest: "way too twinkly"). The old voice
           pitched UP with the combo — thinner the better you played. This
           one stays low and gets HEAVIER: a fat detuned pluck with a sub
           octave underneath and a kick thump from x2, riding the dub delay.
           Weight, not sparkle, is the reward. */
        /* the pickup climbs the CHORD with the combo — root to fifth to the
           octave voicing — so a chain of stars is an arpeggio of the bar */
        const tt=AC.currentTime+w,f=chTone(1+Math.min(4,(cb>>1)+(eco>0?1:0)));
        if(cb>=2)kick(tt,0.020);
        if(MU&&MU.pay>0){
          /* THE PAYOFF MAKES YOU THE SOLOIST. During the section a pickup
             fires a three-note run up the scale on the player's own bus —
             collecting IS soloing, which is the biggest "music is the key"
             payoff in the game for the smallest rule. */
          const d0=Math.max(0,Math.min(7,3+(cb>>1)));
          note(PENT[d0],tt,0.14,'square',0.030,2200,cpan,A.perf);
          note(PENT[Math.min(9,d0+2)],tt+S16,0.13,'square',0.026,2400,cpan*0.5,A.perf);
          note(PENT[Math.min(9,d0+4)],tt+2*S16,0.16,'square',0.030,2600,-cpan,A.perf);
        }else if(G.tier>=9){
          /* level ten: the stars are an electric guitar */
          gtr(f,tt,0.20,0.040+0.004*cb,cpan);
          note(f*0.5,tt,0.18,'sine',0.032+0.004*cb,520,cpan);
          if(cb>=3)gtr(f*2,tt+S16,0.14,0.020,-cpan);
        }else if(G.tier>=6){
          /* levels 7-9: the sawtooth lead, now with the sub underneath */
          note(f,tt,0.20,'sawtooth',0.036+0.005*cb,1500+260*cb,cpan,undefined,0.5);
          note(f*0.5,tt,0.18,'sine',0.032+0.004*cb,520,cpan);
          beep(f*0.94,0.05,'sawtooth',0.012,f,w,cpan,0.2);
        }else if(G.tier>=3){
          /* levels 4-6: the detuned pair, grown a floor */
          note(f,tt,0.20,'square',0.038+0.005*cb,1300+240*cb,cpan,undefined,0.5);
          note(f*1.007,tt,0.20,'sawtooth',0.024,1100+240*cb,-cpan*0.5,undefined,0.4);
          note(f*0.5,tt,0.18,'sine',0.032+0.004*cb,520,cpan);
        }else{
          note(f,tt,0.20,'square',0.040+0.005*cb,1200+220*cb,cpan,undefined,0.5);
          note(f*1.005,tt,0.20,'sawtooth',0.017,900,cpan*0.5,undefined,0.4);
          note(f*0.5,tt,0.18,'sine',0.032+0.004*cb,500,cpan);
        }
        /* the chain's crown: a high answer only when the combo is maxing */
        if(cb>=4&&!(MU&&MU.pay>0))
          note(chTone(5),tt+S16,0.12,'square',0.022,1500,cpan);
      });
      build(0.016,'ember');
      checkMile();
    }
  }
  /* power-ups */
  for(let i=G.pows.length-1;i>=0;i--){
    const s=G.pows[i];s.t+=sdt;
    if(s.t>s.life){
      /* an unseen musical orb that expires unlessoned comes back: the
         level-2 guarantee is of the INTRODUCTION, not of one spawn roll —
         a 7s life can fall entirely inside another lesson's spacing */
      if(s.type==='bass'&&!G.seen.bass)G.bassPlaced=false;
      else if(s.type==='spot'&&!G.seen.spot)G.spotPlaced=false;
      else if(s.type==='hyper'&&!G.seen.hyper)G.hyperPlaced=false;
      G.pows.splice(i,1);continue;
    }
    /* a musical orb's lesson keeps knocking while the orb exists: the one
       call at placement could hit a busy moment, defer, and the orb —
       guaranteed once per level-2 run — leave unexplained. firstMeet's own
       guards (seen, calm, spacing) make the retry free. */
    if(!G.seen[s.type]&&(s.type==='bass'||s.type==='spot'||s.type==='hyper'))firstMeet(s.type);
    if(s.ring===er&&sweptHit(s.a,(22*u)/radiusOf(er))){
      const p=posAt(s.a,radiusOf(s.ring));
      G.pows.splice(i,1);
      /* using an orb IS the introduction — better than any sentence about
         it, and it stops a redundant lesson firing after the experience */
      if((s.type==='bass'||s.type==='spot'||s.type==='hyper')&&!G.seen[s.type]){
        G.seen[s.type]=1;savePref('cometloop:seen',Object.keys(G.seen).join(','));
      }
      arcFlash(s.a,s.ring,
        s.type==='shield'?COL.shield:
        s.type==='warp'||s.type==='spot'?COL.warp:
        s.type==='bass'?COL.comet:
        s.type==='hyper'?COL.ember:COL.nova);
      if(s.type==='shield'){
        const span=panAt(p[0]);
        G.gotShield=true;   /* the naming hint retires on first pickup */
        /* OVERCHARGE (playtester Buch, near-verbatim: "if you're at full
           shields... every next shield picked up is a big point bonus").
           A full bank means you have been playing CLEAN — that streak now
           pays: an overflow shield is worth +50, and while the bank stays
           full, embers and on-beat taps pay double (see those sites). */
        if(G.shields>=shieldMax()){
          G.score+=50;G.scorePop=Math.max(G.scorePop,0.7);
          popup(p[0],p[1]-20*u,'OVERCHARGED +50',COL.shield,1.2);
          cueTone(function(w){
            note(chTone(2),AC.currentTime+w,0.22,'triangle',0.030,2000,span);
            note(chTone(4),AC.currentTime+w+S16,0.24,'sine',0.020,2200,-span);
          });
        }else{
          G.shields++;popup(p[0],p[1]-20*u,'SHIELD \u00d7'+G.shields,COL.shield);
          if(G.shields>=shieldMax()){
            say('SHIELDS FULL \u2014 everything pays double',2,7);
            cueState(true);   /* overcharge opens \u2014 the rising shimmer */
          }
        }
        burst(p[0],p[1],COL.shield,14,150);
        ripple(p[0],p[1],COL.shield);
        cueTone(function(w){beep(520,0.12,'triangle',0.06,780,w);});
      }else if(s.type==='warp'){
        G.slow=4;G.gotWarp=true;
        popup(p[0],p[1]-20*u,'SLOW-MO',COL.warp);
        burst(p[0],p[1],COL.warp,14,150);
        ripple(p[0],p[1],COL.warp);
        beep(400,0.3,'sine',0.07,150);
      }else if(s.type==='bass'){
        G.gotBass=true;
        /* BASS BOMB: every shard in the neighbourhood converts, and the low
           end drops — a pitch-fall boom into a one-bar heavy kick figure.
           The clear reuses novaConvert, so the shards pay like a nova's. */
        for(let j=G.spikes.length-1;j>=0;j--)
          if(angDist(G.spikes[j].a,G.angle)<1.05)novaConvert(G.spikes.splice(j,1)[0]);
        popup(p[0],p[1]-24*u,'BASS BOMB!',COL.comet,1.5);
        burst(p[0],p[1],COL.comet,24,260);
        ripple(p[0],p[1],COL.comet);
        if(!RM){G.shake=Math.max(G.shake,8);flashHit(0.22);
          G.rings.push({x:p[0],y:p[1],r:10*u,life:1,col:COL.comet,sp:520,dec:1.2,fat:1});}
        duckBed(0.25,0.5);
        beep(160,0.6,'sine',0.10,40);
        cueTone(function(w){
          const t0=AC.currentTime+w;
          note(CH[0][0]/2,t0,0.5,'sine',0.055,300);
          kick(t0,0.085);kick(t0+SPB,0.070);
          kick(t0+SPB*1.5,0.055);kick(t0+SPB*2,0.080);
          note(CH[0][0]/2,t0+SPB*2,0.5,'sine',0.045,280);
        });
        try{if(navigator.vibrate)navigator.vibrate([30,30,60]);}catch(e){}
      }else if(s.type==='spot'){
        /* SPOTLIGHT: four bars where YOU are the lead — your instrument
           doubles and brightens, the band steps back a notch, and every
           tight tap pays double. A performance, not a transaction. */
        G.spot=16*SPB;G.gotSpot=true;
        cueState(true);
        popup(p[0],p[1]-24*u,'SPOTLIGHT!',COL.warp,1.5);
        burst(p[0],p[1],'#eaf1ff',20,220);
        ripple(p[0],p[1],COL.warp);
        say('SPOTLIGHT \u00d72',3,5);
        cueTone(function(w){
          note(PENT[9],AC.currentTime+w,0.22,'sawtooth',0.028,3200,0.2,A.perf);
          note(PENT[11],AC.currentTime+w+S16,0.24,'sawtooth',0.026,3600,-0.2,A.perf);
        });
        try{if(navigator.vibrate)navigator.vibrate(14);}catch(e){}
      }else if(s.type==='hyper'){
        /* HYPERNOVA (Hunter: "temporary invincibility... speed cranks up
           significantly... making beautiful music in the zone at hyper
           speed — that's the moment you're chasing"). Sixteen beats where
           nothing can touch you, the comet runs at nearly double speed,
           the kit rides sixteenths, and every red you plow through turns
           into a paying ember right on your lane. */
        G.hyperD=SPB*16;G.hyper=G.hyperD;G.gotHyper=true;
        popup(p[0],p[1]-24*u,'HYPERNOVA!',COL.ember,1.7);
        say('HYPERNOVA \u2014 nothing can touch you',3,5);
        burst(p[0],p[1],'#ffffff',22,280);
        burst(p[0],p[1],COL.ember,16,200);
        ripple(p[0],p[1],COL.ember);
        if(!RM){G.stop=Math.max(G.stop,0.09);flashHit(0.5);G.shake=Math.max(G.shake,9);}
        braam(0.06);
        cueTone(function(w){
          const t0=AC.currentTime+w;
          for(let k2=0;k2<6;k2++)
            note(PENT[4+k2],t0+k2*S16,0.14,'sawtooth',0.020,2400+300*k2,0,A.perf);
        });
        try{if(navigator.vibrate)navigator.vibrate([20,30,20,30,80]);}catch(e){}
      }else{
        /* The front does the converting — see novaBlast/novaConvert. */
        G.gotNova=true;
        novaBlast(p[0],p[1]);
        /* You are standing inside your own blast, so nothing may kill you
           while it sweeps. Dying mid-nova was always the wrong ending.
           Sized to the sweep: 0.7 covered the old 0.22s front with room to
           spare, but the front now takes ~0.65s to reach the far side of the
           ring system and the guarantee has to outlast it. */
        G.invuln=Math.max(G.invuln,G.t+0.95);
        popup(p[0],p[1]-24*u,'NOVA!',COL.nova,1.7);
        ripple(p[0],p[1],COL.nova);
        burst(p[0],p[1],COL.nova,34,320);
        burst(p[0],p[1],'#ffffff',14,190);
        if(!RM){
          /* longer than the orbit's 75ms — this is the rarest thing here and
             should outrank the routine celebration, not sit beneath it */
          G.stop=Math.max(G.stop,0.11);
          flashHit(0.55);
          G.shake=Math.max(G.shake,11);
        }
        duckBed(0.10,0.6);
        beep(180,0.5,'sawtooth',0.07,1500);
        beep(90,0.55,'sine',0.06,45);
        braam(0.05);
        beep(1250,0.15,'sine',0.05,1900,0.13);
        try{if(navigator.vibrate)navigator.vibrate([26,40,60]);}catch(e){}
      }
    }
  }
  updateSpikes(sdt,true);
}

/* ---------- draw helpers ---------- */
function drawShardOutline(x,y,r,al,dash,core){
  ctx.save();ctx.translate(x,y);ctx.rotate(Math.PI/4);
  ctx.globalAlpha=al;
  ctx.strokeStyle=COL.shard;ctx.lineWidth=2.5;
  if(dash)ctx.setLineDash([4*u,3.5*u]);
  ctx.strokeRect(-r*0.7,-r*0.7,r*1.4,r*1.4);
  ctx.setLineDash([]);
  /* core grows with `core` (0..1): a dormant blinker is a watchable countdown */
  if(dash){const cs=(1.6+3.6*(core||0))*u;
    ctx.fillStyle=COL.shard;ctx.fillRect(-cs,-cs,cs*2,cs*2);}
  ctx.globalAlpha=1;ctx.restore();
}
/* The orbs blit their baked sprites — the glow was paid for in buildSprites,
   so this is the same layered finish the embers and shards get, at a fraction
   of what the live shadowBlur cost. Pulse and rotation ride blit()'s args;
   the cores are plain fills, kept out of the pulse so the centre holds still. */
function drawPow(x,y,s,al){
  /* orbs breathe on the LANDED beat, not their own clock */
  const pulse=1+(RM?0.10:0.15*G.beat);
  if(s.type==='shield'){
    blit(SPR.powShield,x,y,pulse,0,al);
    ctx.save();ctx.globalAlpha=al;ctx.fillStyle=COL.shield;
    ctx.beginPath();ctx.arc(x,y,3.5*u,0,TAU);ctx.fill();ctx.restore();
  }else if(s.type==='warp'){
    blit(SPR.powWarpO,x,y,pulse,s.t*2,al);
    blit(SPR.powWarpI,x,y,1,-s.t*2+Math.PI/4,al);
  }else if(s.type==='bass'){
    /* a subwoofer: the cone slams on the landed beat and the rings jump
       with it — you can see the low end before you take it */
    const th=1+(RM?0.10:0.42*G.beat);
    ctx.save();ctx.strokeStyle=COL.comet;ctx.lineWidth=2.0*u;
    for(let ri=0;ri<3;ri++){
      ctx.globalAlpha=al*(1-ri*0.24);
      ctx.beginPath();ctx.arc(x,y,(3.6+ri*3.4)*u*th,0,TAU);ctx.stroke();
    }
    ctx.globalAlpha=al*0.9;ctx.fillStyle='#04263a';
    ctx.beginPath();ctx.arc(x,y,3.2*u*th,0,TAU);ctx.fill();
    ctx.fillStyle=COL.comet;
    ctx.beginPath();ctx.arc(x,y,(1.6+0.9*(th-1)*3)*u,0,TAU);ctx.fill();
    ctx.restore();
  }else if(s.type==='spot'){
    /* a stage light: four rays sweeping round a bright bulb */
    ctx.save();ctx.strokeStyle='#eaf1ff';ctx.lineWidth=1.8*u;
    const ra=RM?0.6:s.t*1.6;
    for(let ri=0;ri<4;ri++){
      const aa2=ra+ri*Math.PI/2;
      ctx.globalAlpha=al*0.7;
      ctx.beginPath();
      ctx.moveTo(x+Math.cos(aa2)*3.4*u,y+Math.sin(aa2)*3.4*u);
      ctx.lineTo(x+Math.cos(aa2)*(7.5*pulse)*u,y+Math.sin(aa2)*(7.5*pulse)*u);
      ctx.stroke();
    }
    ctx.globalAlpha=al;ctx.fillStyle='#eaf1ff';
    ctx.beginPath();ctx.arc(x,y,2.9*u*pulse,0,TAU);ctx.fill();
    ctx.fillStyle=COL.warp;
    ctx.beginPath();ctx.arc(x,y,1.6*u,0,TAU);ctx.fill();
    ctx.restore();
  }else if(s.type==='hyper'){
    /* upright with a wobble — a star that spins reads as a shard of light,
       a star that stands reads as THE star */
    blit(SPR.powHyper,x,y,pulse*(1+0.06*Math.sin(s.t*6)),Math.sin(s.t*2.2)*0.28,al);
  }else{
    blit(SPR.powNova,x,y,1+0.10*Math.sin(s.t*5),s.t*1.2,al);
    ctx.save();ctx.globalAlpha=al;ctx.fillStyle=COL.nova;
    ctx.beginPath();ctx.arc(x,y,2.5*u,0,TAU);ctx.fill();ctx.restore();
  }
}
/* The old stack led with -apple-system, so on the device this actually ships
   to every word was San Francisco: the system UI face, which reads as a
   settings screen rather than a game. This leads with geometric sans instead —
   Avenir Next on iOS and macOS, Century Gothic or Trebuchet on Windows,
   Roboto on Android. Circular bowls and a high x-height suit a game made
   entirely of circles, and it costs nothing: every one of these ships with the
   OS, so there is still no font to download and no network call. */
const F='"Avenir Next","Avenir",Futura,"Century Gothic","Trebuchet MS",'+
        '"Segoe UI",Roboto,system-ui,sans-serif';
function text(str,x,y,size,weight,col,ls){
  ctx.fillStyle=col;
  ctx.font=weight+' '+Math.round(size)+'px '+F;
  try{ctx.letterSpacing=(ls||0)+'px';}catch(e){}
  ctx.fillText(str,x,y);
  try{ctx.letterSpacing='0px';}catch(e){}
}
/* NO LINE EVER RUNS OFF THE SCREEN (playtest: it did). Measure at the
   intended size and shrink to fit the given width — announcements, banner
   subs and card rows all pass through here, so a long sentence on a narrow
   phone gets smaller instead of getting cut. */
function fitSz(str,size,weight,maxW,ls){
  ctx.font=weight+' '+Math.round(size)+'px '+F;
  /* letterSpacing is a fixed per-character amount the draw adds AFTER this
     measurement (measureText sees none of it) — reserve it, and shrink only
     the glyph width, or a tracked line still overflows exactly as before */
  const sp=(ls||0)*str.length;
  const w=ctx.measureText(str).width+sp;
  if(w<=maxW)return size;
  return Math.max(8*u,size*Math.max(20,maxW-sp)/Math.max(1,w-sp));
}
/* THE GAME'S OWN VOICE (playtest: "plain and boring — make the text fit the
   theme"). Headline and guidance text draws in starlight now: a soft glow
   underlay made of four offset passes (shadowBlur stays banned per-frame;
   offsets are free) under a vertical two-colour gradient, cached per
   style+size so no gradient is built twice. Persistent HUD lines stay
   lean — this voice is for the moments, not the furniture. */
const TFX={};
function textFx(str,x,y,size,weight,c1,c2,glow,ls){
  const ga=ctx.globalAlpha;
  ctx.font=weight+' '+Math.round(size)+'px '+F;
  try{ctx.letterSpacing=(ls||0)+'px';}catch(e){}
  ctx.save();ctx.translate(x,y);
  if(glow){
    const o=Math.max(1.3,size*0.055);
    ctx.globalAlpha=ga*0.30;ctx.fillStyle=glow;
    ctx.fillText(str,-o,0);ctx.fillText(str,o,0);
    ctx.fillText(str,0,-o);ctx.fillText(str,0,o);
    ctx.globalAlpha=ga*0.55;
    ctx.fillText(str,0,1.2);
  }
  const key=c1+'|'+c2+'|'+(size|0);
  let g=TFX[key];
  if(!g){
    g=ctx.createLinearGradient(0,-size*0.9,0,size*0.18);
    g.addColorStop(0,c1);g.addColorStop(1,c2);
    TFX[key]=g;
  }
  ctx.globalAlpha=ga;ctx.fillStyle=g;
  ctx.fillText(str,0,0);
  ctx.restore();
  try{ctx.letterSpacing='0px';}catch(e){}
}

/* ---------- bloom ----------
   Screen-space bloom without ever reading back the main canvas. The obvious
   route — drawImage(cv) into a small buffer — measures ~16ms a frame, because
   pulling 1.3M pixels back out stalls the pipeline; having budget spare does
   not help when the single operation eats all of it.
   So the bright objects are re-drawn as crude blobs into a quarter-size
   buffer instead. Precision is pointless there: the upscale blurs it past
   recognition, and bilinear filtering on the way back up IS the blur. */
const BLOOM_DIV=4,BLOOM_ALPHA=0.34;
let bloomC=null,bloomG=null;
function bloomDot(g,x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,TAU);g.fill();}
function drawBloom(){
  if(!bloomC){bloomC=document.createElement('canvas');bloomG=bloomC.getContext('2d');}
  const bw=Math.max(1,Math.ceil(W/BLOOM_DIV)),bh=Math.max(1,Math.ceil(H/BLOOM_DIV));
  if(bloomC.width!==bw||bloomC.height!==bh){bloomC.width=bw;bloomC.height=bh;}
  const g=bloomG,s=1/BLOOM_DIV;
  g.setTransform(1,0,0,1,0,0);
  g.clearRect(0,0,bw,bh);
  g.setTransform(s,0,0,s,0,0);
  g.globalCompositeOperation='lighter';
  for(const st of G.stars){
    const p=posAt(st.a,radiusOf(st.ring));
    bloomDot(g,p[0],p[1],10*u,COL.ember);
  }
  for(const sp of G.spikes){
    if(sp.phase!==1||!armed(sp))continue;
    const p=posAt(sp.a,radiusOf(sp.ring));
    bloomDot(g,p[0],p[1],11*u,COL.shard);
  }
  if(FIN.on)for(const ts of FIN.trail){
    if(ts.got)continue;
    const p=posAt(ts.a,radiusOf(ts.ring));
    bloomDot(g,p[0],p[1],12*u,COL.ember);
  }
  for(const pw of G.pows){
    const p=posAt(pw.a,radiusOf(pw.ring));
    bloomDot(g,p[0],p[1],10*u,
      pw.type==='shield'?COL.shield:
      pw.type==='warp'||pw.type==='spot'?COL.warp:
      pw.type==='bass'?COL.comet:COL.nova);
  }
  for(const pt of G.parts){
    if(pt.life<=0)continue;
    bloomDot(g,pt.x,pt.y,pt.size*pt.life*1.6,pt.col);
  }
  if(G.state!=='dead'){
    const p=posPlayer();
    bloomDot(g,p[0],p[1],17*u,'#7ce9ff');
    bloomDot(g,p[0],p[1],8*u,'#ffffff');
  }
  /* the hub lamp blooms too, harder while the drop is landing */
  bloomDot(g,cx,cy,(9+9*G.dropFx)*u,'#9db9ff');
  g.setTransform(1,0,0,1,0,0);
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  /* the bloom breathes with the payoff kick — the visual half of the pump */
  ctx.globalAlpha=BLOOM_ALPHA*(1+((G.pay>0&&!RM)?0.45*G.beat:0));
  ctx.drawImage(bloomC,0,0,W,H);
  ctx.restore();
}

/* The comet lights the track it is riding: a short arc centred on it, falling
   off both ways. Decorative, but it also makes "which ring am I on" readable
   at a glance without looking away from the comet. */
const RING_LIT=[[0.62,0.030,7],[0.40,0.048,4.5],[0.22,0.078,2.6],[0.10,0.105,1.6]];
function drawRingGlow(){
  const rr=curR();
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  /* the lit track takes its own colour, so the light under the comet says
     which ring you are on as plainly as the arrangement does */
  ctx.strokeStyle='rgb('+RINGS[Math.min(RINGS.length-1,effRing())].tint+')';
  for(const L of RING_LIT){
    /* the light under the comet breathes with the landed beat */
    ctx.globalAlpha=L[1]*(RM?1:1+0.30*G.beat);
    ctx.lineWidth=L[2]*u;
    ctx.beginPath();ctx.arc(cx,cy,rr,G.angle-L[0],G.angle+L[0]);ctx.stroke();
  }
  ctx.restore();
}
function drawTail(){
  const n=G.trail.length;
  if(n<4)return;
  const nx=new Array(n),ny=new Array(n),bw=new Array(n);
  for(let i=0;i<n;i++){
    const p=G.trail[i];
    const a=G.trail[i+1<n?i+1:n-1],b=G.trail[i>0?i-1:0];
    let tx=a.x-b.x,ty=a.y-b.y;
    const L=Math.sqrt(tx*tx+ty*ty);
    if(L<1e-4){tx=1;ty=0;}else{tx/=L;ty/=L;}
    nx[i]=-ty;ny[i]=tx;
    /* width tapers by both age and position, so the head stays fat */
    bw[i]=8*u*Math.pow(Math.max(p.life,0),0.7)*(0.16+0.84*i/(n-1));
  }
  /* Width, alpha, colour. The narrow pass runs near-white so the ribbon goes
     hot at its centre and cools outward, the way anything incandescent does.
     THE TRAIL IS THE GROOVE'S SCOREBOARD: as the chain climbs, the ribbon
     tints from comet-cyan toward warp-violet, and during the payoff it runs
     white-hot — the player's own wake reports how in-time they are. */
  const gm=G.pay>0?1:Math.min(1,G.groove/8)*0.7;
  const mix=function(a,b){
    return 'rgb('+Math.round(a[0]+(b[0]-a[0])*gm)+','+
      Math.round(a[1]+(b[1]-a[1])*gm)+','+Math.round(a[2]+(b[2]-a[2])*gm)+')';
  };
  const passes=[
    [2.5,0.075,mix([93,240,255],[180,139,255])],
    [1.35,0.16,mix([142,242,255],[214,190,255])],
    [0.6,0.34,G.pay>0?'#ffffff':'#e6fdff']];
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  for(let k=0;k<passes.length;k++){
    const m=passes[k][0];
    ctx.globalAlpha=passes[k][1];
    ctx.fillStyle=passes[k][2];
    ctx.beginPath();
    for(let i=0;i<n;i++){
      const p=G.trail[i],w=bw[i]*m;
      const X=p.x+nx[i]*w,Y=p.y+ny[i]*w;
      if(i===0)ctx.moveTo(X,Y);else ctx.lineTo(X,Y);
    }
    for(let i=n-1;i>=0;i--){
      const p=G.trail[i],w=bw[i]*m;
      ctx.lineTo(p.x-nx[i]*w,p.y-ny[i]*w);
    }
    ctx.closePath();ctx.fill();
  }
  ctx.restore();
}

/* ---------- the visible beat ----------
   The old pulse breathed the RINGS, at peak alpha 0.05 against static strokes
   on the same path summing to ~0.265 — and it PEAKED ON THE BEAT. You cannot
   synchronise to a flash that arrives at the same moment as the thing it is
   announcing; human reaction is ~250ms and an eighth here is 288ms. It was also
   4.5x brighter at groove x8 than at x0, so the game showed you the beat most
   clearly exactly when you least needed it and dimmest while you were trying
   to find it.

   What people actually synchronise to is continuous motion with a predictable
   arrival, and it has to land where the eye already is. So: a ring that
   contracts onto the comet over the half-beat BEFORE each beat, and lands. */
function beatPhase(){
  if(!AC||!MU||!MU.next||AC.state!=='running'||G.state!=='playing')return -1;
  /* MU.next is the next UNSCHEDULED eighth and sits ahead of now by the
     lookahead, so the quarter boundary is derived from it, not subtracted. */
  const q=MU.next+((MU.step%2)?SPB/2:0);
  let d=(q-AC.currentTime)%SPB;if(d<0)d+=SPB;
  return 1-d/SPB;
}
function drawBeat(p){
  const ph=beatPhase();if(ph<0)return;
  /* fades back for a veteran who has clearly found it, and stays for everyone
     else. It is a teaching aid first and an ornament second. */
  let vis=(G.runs>6&&G.bestGroove>=5)?0.45:1;
  /* THE COUNT-IN. Through the final bar before the drop lands, this same
     ring — at the comet, where the eyes already are — turns white-hot and
     swells beat by beat. The landing is read where you play, never at a
     target. */
  let cd=-1;
  if(MU&&MU.landT&&!MU.landDone&&AC)cd=MU.landT-(AC.currentTime-PLAY.bias);
  const cin=(cd>-LAND_WIN&&cd<SPB*4)?1-Math.max(0,cd)/(SPB*4):0;
  if(cin>0)vis=1+1.4*cin;
  ctx.save();ctx.globalCompositeOperation='lighter';
  ctx.strokeStyle=cin>0?'#ffffff':
    ((G.groove>=3||G.pay>0)?COL.warp:'rgba(200,225,255,1)');
  if(RM){
    /* one opacity step per beat is 1.73Hz — far below any flash threshold,
       and it still carries the anticipation */
    ctx.globalAlpha=(ph>0.62?0.28:0.09)*vis;ctx.lineWidth=2*u;
    ctx.beginPath();ctx.arc(p[0],p[1],32*u,0,TAU);ctx.stroke();
  }else{
    const a=Math.max(0,(ph-0.5)*2);        /* 288ms of visible approach */
    if(a>0){
      ctx.globalAlpha=(0.05+0.24*a*a)*vis;ctx.lineWidth=(1.2+1.3*a)*u;
      ctx.beginPath();ctx.arc(p[0],p[1],(32+18*(1-a))*u,0,TAU);ctx.stroke();
    }
    if(G.beat>0.02){                       /* the landing, at a level you see */
      ctx.globalAlpha=G.beat*(0.30+0.045*G.groove+0.10*G.payOpen)*vis;
      ctx.lineWidth=(1.6+3.2*G.beat)*u;
      ctx.beginPath();ctx.arc(p[0],p[1],(32+6*(1-G.beat))*u,0,TAU);ctx.stroke();
    }
  }
  ctx.restore();
}
/* ---------- draw ---------- */
/* WHERE THE MUSIC IS, CONTINUOUSLY. Returns the position inside the four-bar
   phrase in eighths (0..STEPS) as a float that advances smoothly, so the sky
   can be driven by musical PHASE instead of by beat impulses.
   The audio clock schedules ahead of the speaker, so MU.step is the next step
   to be queued and MU.next is when it fires: the sound a player is hearing
   right now is that far behind. Subtracting the lead-in gives the audible
   position, and it stays continuous across a step boundary because MU.step
   gains 1 at the same instant the lead-in does.
   With no audio clock — muted tab, no WebAudio, the menu — it free-runs on
   wall time at the same tempo. That is deliberate and load-bearing: a large
   share of web players play with the sound off, and they should still see a
   world that breathes in time rather than a dead one. */
function musPos(){
  const sd=SPB/2;
  if(A&&AC&&MU&&MU.next&&AC.state==='running'&&G.state==='playing'){
    const lead=(MU.next-AC.currentTime)/sd;
    return ((MU.step-lead)%STEPS+STEPS)%STEPS;
  }
  return (G.t/sd)%STEPS;
}

/* ================= THE BACKDROP RUNS ON THE GPU =================
   A second canvas under the game canvas, running one fragment shader. The 2D
   backdrop (baked gradients, galaxy, planet, nebulae, rays, fog, grade) is a
   COMPLETE fallback: if WebGL is missing, refused, or fails to compile, GL.on
   stays false and every one of those layers paints exactly as before. Nothing
   about the simulation changes either way.
   Why a shader at all: the old sky was radial-gradient sprites, which cannot
   express filaments, dust lanes or flow no matter how they are animated. This
   is two-level domain-warped fBm — the structure IS the maths. */
const GL_SCALE=0.60;   /* render scale. THE perf dial: the field is smooth, so
                          upscaling costs almost nothing visually. Drop toward
                          0.4 if a phone struggles, raise to 1.0 on desktop. */
const GL_COV=0.36, GL_EXP=1.45;   /* void threshold and exposure — see notes */
const GL={on:false,g:null,pr:null,u:{},cv:null,vw:0,vh:0,
  r:[[0,0,-1],[0,0,-1]],slot:0,shear:0,
  scale:GL_SCALE,acc:0,n:0,slow:0};
const GL_FS=`
precision highp float;
uniform vec2 uRes; uniform float uTime,uEnergy,uPal,uCov,uExp,uCombo,uBeat,uShr;
uniform vec3 uR1,uR2;
float hash21(vec2 p){ p=fract(p*vec2(123.34,345.45)); p+=dot(p,p+34.345); return fract(p.x*p.y); }
float vnoise(vec2 p){ vec2 i=floor(p),f=fract(p); vec2 u=f*f*(3.0-2.0*f);
  return mix(mix(hash21(i),hash21(i+vec2(1,0)),u.x),mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),u.x),u.y); }
const mat2 M=mat2(1.62,1.18,-1.18,1.62);
float fbm(vec2 p){ float v=0.,a=.5; for(int i=0;i<6;i++){ v+=a*vnoise(p); p=M*p; a*=.5;} return v; }
float fbm4(vec2 p){ float v=0.,a=.5; for(int i=0;i<4;i++){ v+=a*vnoise(p); p=M*p; a*=.5;} return v; }
float ridged(vec2 p){ float v=0.,a=.5; for(int i=0;i<5;i++){ float n=1.-abs(vnoise(p)*2.-1.); v+=a*n*n; p=M*p; a*=.5;} return v; }
vec3 pcos(float t,vec3 a,vec3 b,vec3 c,vec3 d){ return a+b*cos(6.28318*(c*t+d)); }
vec3 palette(float t){
  if(uPal<0.5) return pcos(t,vec3(.30,.14,.42),vec3(.46,.24,.44),vec3(1.,1.,1.),vec3(.52,.62,.78));
  if(uPal<1.5) return pcos(t,vec3(.16,.32,.35),vec3(.42,.40,.36),vec3(1.,.96,.88),vec3(.18,.42,.70));
  return pcos(t,vec3(.34,.18,.20),vec3(.50,.34,.26),vec3(1.,.92,.76),vec3(.02,.16,.44));
}
vec3 starLayer(vec2 frag,float dens,float thr,float t,float sizek,float spikek){
  vec2 su=frag/uRes.y*dens; vec2 sc=floor(su),sf=fract(su)-0.5;
  float sh=hash21(sc+vec2(dens*3.1,dens*7.7));
  if(sh<thr) return vec3(0.0);
  float br=(sh-thr)/(1.0-thr);
  vec2 off=vec2(hash21(sc+1.7),hash21(sc+4.3))-0.5; vec2 d=sf-off*0.78;
  float tw=0.62+0.38*sin(t*(1.2+br*2.8)+sh*44.0);
  float core=exp(-dot(d,d)*sizek)*tw*(0.35+br);
  float sp=(exp(-abs(d.x)*110.0-abs(d.y)*1250.0)+exp(-abs(d.y)*110.0-abs(d.x)*1250.0))*spikek*br*br*tw;
  return vec3(0.82,0.89,1.0)*(core+sp);

void main(){
  vec2 frag=gl_FragCoord.xy; vec2 uv=(frag-0.5*uRes)/uRes.y; float t=uTime;
  uv += vec2(uv.y,uv.x)*uShr*0.35;                       /* swipe shear */
  vec2 disp=vec2(0.0);                                   /* two sources -> they interfere */
  for(int i=0;i<2;i++){
    vec3 R=(i==0)?uR1:uR2; if(R.z<0.0) continue;
    vec2 dv=uv-R.xy; float d=length(dv)+1e-5;
    disp += (dv/d)*sin(d*26.0-R.z*9.0)*exp(-d*2.4)*exp(-R.z*1.6)*0.055;
  }
  uv+=disp; float rd=length(uv);
  vec2 p=uv*1.35; vec2 dr=vec2(t*0.013,t*0.009);
  vec2 q=vec2(fbm(p+dr),fbm(p+vec2(5.2,1.3)-dr));
  vec2 r=vec2(fbm(p+3.2*q+vec2(1.7,9.2)+dr*1.7),fbm(p+3.2*q+vec2(8.3,2.8)-dr*1.3));
  float f=fbm(p+3.0*r+dr*0.6);
  vec2 p2=uv*0.62+vec2(3.7,1.1);
  vec2 q2=vec2(fbm4(p2-dr*0.5),fbm4(p2+vec2(2.1,7.4)+dr*0.4));
  float f2=fbm4(p2+2.4*q2);
  float dust=pow(ridged(p*1.6+r*1.2+dr),2.2);
  float band=smoothstep(0.32,0.68,f)*0.82+smoothstep(0.26,0.97,f)*0.18;
  band=mix(band,band*0.52+smoothstep(0.36,0.76,f2)*0.48,0.44);
  band*=(1.0-0.66*dust);
  float covA=fbm4(uv*0.75+vec2(9.1,4.4)+dr*0.35);
  float covB=fbm4(uv*1.9+vec2(2.7,8.8)-dr*0.5);
  band*=smoothstep(uCov,uCov+0.20,covA-0.18*(covB-0.5));
  float m=clamp(band,0.0,1.0);
  float ph=dot(r,vec2(0.9,0.7))+f*0.55+f2*0.30+t*0.010+uCombo*0.42;
  m=pow(m,mix(1.0,0.72,uCombo));
  float ca=0.022+0.05*rd;
  vec3 col=vec3(palette(ph-ca).r,palette(ph).g,palette(ph+ca).b);
  col*=pow(m,uExp);
  col+=pow(m,3.2)*vec3(0.92,0.86,1.00)*0.62;
  col+=pow(m,7.5)*vec3(1.0,0.97,0.92)*0.85;
  col*=(0.74+0.52*uEnergy)*(1.0+0.30*uCombo);
  col*=(1.0+0.16*uBeat);
  col+=starLayer(frag,7.0,0.880,t,520.0,0.55);
  col+=starLayer(frag,17.0,0.905,t,1500.0,0.14);
  col+=starLayer(frag,38.0,0.930,t,5200.0,0.0);
  col*=clamp(1.0-0.62*pow(length(uv*vec2(0.88,0.66)),1.9),0.0,1.0);
  col+=vec3(0.010,0.013,0.032);
  col+=(hash21(frag+t)-0.5)*0.018;
  gl_FragColor=vec4(max(col,0.0),1.0);
}`;
function glInit(){
  try{
    const cv=document.getElementById('bg');
    if(!cv||typeof cv.getContext!=='function')return false;
    const g=cv.getContext('webgl',{antialias:false,alpha:false,depth:false,stencil:false})
          ||cv.getContext('experimental-webgl');
    /* the stubbed canvas in the test harness answers every property with a
       function, so feature-detection has to check RESULTS, not existence */
    if(!g||typeof g.createShader!=='function')return false;
    const mk=function(ty,src){
      const o=g.createShader(ty); if(!o)return null;
      g.shaderSource(o,src); g.compileShader(o);
      return g.getShaderParameter(o,g.COMPILE_STATUS)?o:null;
    };
    const vs=mk(g.VERTEX_SHADER,'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}');
    const fs=mk(g.FRAGMENT_SHADER,GL_FS);
    if(!vs||!fs)return false;
    const pr=g.createProgram(); if(!pr)return false;
    g.attachShader(pr,vs);g.attachShader(pr,fs);g.linkProgram(pr);
    if(!g.getProgramParameter(pr,g.LINK_STATUS))return false;
    g.useProgram(pr);
    const b=g.createBuffer();g.bindBuffer(g.ARRAY_BUFFER,b);
    g.bufferData(g.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),g.STATIC_DRAW);
    const loc=g.getAttribLocation(pr,'p');
    g.enableVertexAttribArray(loc);g.vertexAttribPointer(loc,2,g.FLOAT,false,0,0);
    for(const n of ['uRes','uTime','uEnergy','uPal','uCov','uExp','uCombo','uBeat','uShr','uR1','uR2'])
      GL.u[n]=g.getUniformLocation(pr,n);
    GL.g=g;GL.cv=cv;GL.pr=pr;GL.on=true;
    return true;
  }catch(e){return false;}
}
function glResize(){
  if(!GL.on)return;
  try{
    const s=Math.min(DPR,2)*GL.scale;
    const w=Math.max(1,Math.round(W*s)),h=Math.max(1,Math.round(H*s));
    if(w===GL.vw&&h===GL.vh)return;
    GL.vw=w;GL.vh=h;GL.cv.width=w;GL.cv.height=h;GL.g.viewport(0,0,w,h);
  }catch(e){GL.on=false;}
}
/* A ripple is seeded at the COMET, never at the touch point: this game has no
   aimed input, and blooming a wave where the thumb landed would quietly teach
   players that where they tap matters. Two slots, used round-robin, so two
   ripples close together overlap and interfere on their own. */
function glRipple(){
  if(!GL.on||RM)return;
  try{
    const pp=posPlayer();
    GL.r[GL.slot]=[(pp[0]-W*0.5)/H, ((H-pp[1])-H*0.5)/H, 0];
    GL.slot=(GL.slot+1)%2;
  }catch(e){}
}
function glShear(dir){ if(GL.on&&!RM)GL.shear=0.55*(dir<0?-1:1); }
/* THE BACKDROP MUST NEVER COST THE GAME ITS FRAME RATE. This shader is the
   most expensive thing in the file and it is running on hardware nobody can
   enumerate. So it watches itself: sustained slow frames drop the render
   scale (the field is smooth, so a smaller buffer upscales almost invisibly),
   and if the cheapest scale is still slow it hands the backdrop back to the
   baked 2D path and never tries again this run. Degrade, never stutter. */
function glWatch(dt){
  if(dt<=0||dt>0.5)return;                 /* ignore tab-switch spikes */
  GL.acc+=dt;GL.n++;

    g.uniform2f(GL.u.uRes,GL.vw,GL.vh);
    g.uniform1f(GL.u.uTime,RM?12:G.t);
    g.uniform1f(GL.u.uEnergy,Math.min(1,PLAY.heat+0.6*G.pay+G.odGlow));
    g.uniform1f(GL.u.uCombo,Math.min(1,G.combo/6*0.55+G.groove/8*0.45));
    g.uniform1f(GL.u.uBeat,RM?0:G.beat);

/* Boot the GPU path here, not at the first resize(): GL is a const declared

function draw(){
  const amb=RM?0:G.t;

     every baked layer below draws exactly as it always did. */

  if(!BG){glRender(Math.min(0.05,Math.max(0,G.t-(GL.last||G.t))));GL.last=G.t;ctx.clearRect(0,0,W,H);}
  if(BG&&SPR.bg)ctx.drawImage(SPR.bg.c,0,0,W,H);
  /* a band change fades from the outgoing sky over 2.5s (RM hard-cuts) */
  if(BG&&G.bgFade>0&&SPR.bgOld){
    ctx.globalAlpha=G.bgFade;
    ctx.drawImage(SPR.bgOld.c,0,0,W,H);
    ctx.globalAlpha=1;
  }else if(SPR.bgOld&&G.bgFade<=0)SPR.bgOld=null;
  /* THE DROP OWNS THE SKY. The downbeat crossfades the whole backdrop into
     the warp palette (G.dropFx is the entry envelope), it HOLDS for the
     section, and ebbs out over the final bar as G.pay drains. Under reduced
     motion it is a static palette swap for the same span — the same class of
     whole-section signal the ring recolour already grants RM players. */
  let dropA=0;
  if(G.pay>0)dropA=RM?0.9:Math.min(1,(1-G.dropFx)*1.6)*Math.min(1,G.pay*8);
  if(BG&&dropA>0&&SPR.bg2){
    ctx.globalAlpha=dropA;
    ctx.drawImage(SPR.bg2.c,0,0,W,H);
    ctx.globalAlpha=1;
  }
  const sdx=RM?0:Math.sin(amb*0.030)*17,sdy=RM?0:Math.cos(amb*0.023)*17;
  /* the camera dolly: the world drifts a few pixels on a long sine so no
     frame is ever static; each plane rides it by its depth */
  const camX=RM?0:Math.sin(amb*0.16)*3*u,camY=RM?0:Math.cos(amb*0.127)*3*u;
  /* THE SKY KEEPS THE BEAT (playtest: "match large visual impact to large
     audio impact"). One pulse scalar drives the whole backdrop: quiet on an
     idle board, breathing when the player runs hot, doubled through the
     payoff, gold through overdrive — and the drum break drops the room dark
     (drawn after the motes). RM keeps every layer static, as always. */
  /* THE SKY BREATHES, IT DOES NOT TWITCH. This was G.beat — an impulse that
     spikes to 1 and decays in a fifth of a second, so every backdrop layer
     flinched on the beat and then sat dead for the rest of it. It is a
     continuous musical phase now: a smooth swell across the bar riding a
     slower swell across the four-bar phrase, both cosines, so nothing in the
     sky ever snaps. The peak is lower than the old impulse and the mean is
     about the same — the backdrop reads calmer while never being still.
     G.beat still drives the comet, the rings, the embers and the HUD. The
     punch belongs in the arena; the groove belongs in the sky. */
  /* Both swells PEAK on their downbeat (+cos, not -cos). Two reasons, and the
     second is the one that matters: light arriving with the beat is what the
     old impulse did and what "grooving" looks like — but also, phased this way
     the two minima can never coincide. The bar troughs at mid-bar, where the
     phrase is near its top; the phrase troughs at mid-phrase, where the bar is
     exactly at its top. Inverted, both bottomed out together on the first beat
     of every phrase and the sky went flat at the very moment the music landed. */
  const mp=musPos();
  const swBar=0.5+0.5*Math.cos(TAU*((mp%8)/8));       /* one bar   ~2.3s */
  const swPhrase=0.5+0.5*Math.cos(TAU*(mp/STEPS));    /* four bars ~9.2s */
  const energy=Math.min(1,PLAY.heat+0.6*G.pay+G.odGlow);
  const mpulse=RM?0:SKY_SWELL*(0.60*swBar+0.40*swPhrase)*(0.40+0.60*energy);
  /* THE GALACTIC BAND — deepest light in the scene, and it answers the drop */
  if(BG&&SPR.galaxy){
    ctx.globalAlpha=0.6*(1+0.30*mpulse);
    ctx.drawImage(SPR.galaxy.c,-28+sdx*0.2+camX*0.2,-28+sdy*0.2+camY*0.2,SPR.galaxy.w,SPR.galaxy.h);
    ctx.globalAlpha=1;
    if(!RM&&(dropA>0||G.odGlow>0.01)){
      ctx.save();ctx.globalCompositeOperation='lighter';
      ctx.globalAlpha=Math.min(0.35,0.25*dropA+0.18*G.odGlow);
      ctx.drawImage(SPR.galaxy.c,-28+sdx*0.2+camX*0.2,-28+sdy*0.2+camY*0.2,SPR.galaxy.w,SPR.galaxy.h);
      ctx.restore();
    }
  }
  /* the landmark: half the short side now, textured, lit by the arena */
  if(BG&&SPR.planet){
    const ps=SPR.planet.w;
    ctx.drawImage(SPR.planet.c,-ps*0.55+sdx*0.15+camX*0.15,H-ps*0.42+sdy*0.15+camY*0.15,ps,ps);
  }
  /* THE CLOUD FIELD FLOWS. Each cloud wandered a fixed 2%-of-screen circle on
     one sine before, which the eye reads as an oscillation returning to where
     it started — a loop, not weather. Each now rides a slow Lissajous whose
     DIRECTION is itself rotating, so the path never closes; with six clouds on
     incommensurate rates the field never resolves into a pattern.
     Size breathes on the four-bar phrase rather than the beat, so the sky
     swells with the arrangement instead of ticking with it. */
  if(BG&&SPR.neb)for(let i=0;i<nebulas.length;i++){
    const n=nebulas[i];
    const sp=SPR.neb[i%SPR.neb.length];
    const dr=amb*0.011*SKY_RATE*n.sp*n.dir+n.ph;   /* the turning drift basis */
    const w1=Math.sin(amb*0.037*SKY_RATE*n.sp+n.ph);
    const w2=Math.cos(amb*0.026*SKY_RATE*n.sp+n.ph*1.7);
    const wob=RM?0:SKY_FLOW;
    const nx=(n.x+wob*(w1*Math.cos(dr)-w2*Math.sin(dr)))*W;
    const ny=(n.y+wob*(w1*Math.sin(dr)+w2*Math.cos(dr)))*H;
    /* the nebulae swell when the drop lands — the dangling hook, wired */
    const nr=n.r*Math.max(W,H)*0.5*
      (1+(RM?0:0.18*G.dropFx+0.13*swPhrase+0.05*swBar));
    ctx.globalAlpha=n.a;
    ctx.drawImage(sp.c,nx-nr,ny-nr,nr*2,nr*2);
    if(dropA>0&&SPR.neb2){
      ctx.globalAlpha=dropA*n.a;
      ctx.drawImage(SPR.neb2[i%SPR.neb2.length].c,nx-nr,ny-nr,nr*2,nr*2);
    }
    ctx.globalAlpha=1;
  }
  /* the warp wash behind the arena: blooms with the landing, sustains at low
     alpha while the section runs, drains with it. Suppressed under slow-mo
     so it never fights that vignette. */
  const wash=Math.min(0.85,((RM?0:0.45*G.dropFx)+0.30*G.pay)*(G.tsCur<0.98?0.4:1));
  if(BG&&wash>0.01&&SPR.nebDrop){
    ctx.globalAlpha=wash;
    const wr=R*2.2;
    ctx.drawImage(SPR.nebDrop.c,cx-wr,cy-wr,wr*2,wr*2);
    ctx.globalAlpha=1;
  }
  /* GOD RAYS. Two counter-rotated passes of the baked fan shimmer against
     each other; the drop throws them wide. Born outside the ring stack —
     the baked inner hole keeps the play annulus clean. */
  if(BG&&SPR.rays){
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    ctx.translate(cx,cy);
    const rs=SPR.rays.w;
    if(RM){
      ctx.globalAlpha=0.05;
      ctx.drawImage(SPR.rays.c,-rs/2,-rs/2,rs,rs);
    }else{
      ctx.rotate(amb*0.011);
      ctx.globalAlpha=Math.min(0.7,0.06+0.55*G.dropFx+0.15*G.pay+0.12*mpulse+0.18*G.odGlow);
      const s1=1+0.25*G.dropFx;
      ctx.drawImage(SPR.rays.c,-rs/2*s1,-rs/2*s1,rs*s1,rs*s1);
      ctx.rotate(-amb*0.018+1.3);
      ctx.globalAlpha=Math.min(0.7,0.04+0.32*G.dropFx+0.08*mpulse+0.12*G.odGlow);
      const s2=1.06+0.3*G.dropFx;
      ctx.drawImage(SPR.rays.c,-rs/2*s2,-rs/2*s2,rs*s2,rs*s2);
    }
    ctx.restore();
  }
  /* DEPTH PLANES, interleaved with the fog banks. The dim stars are baked
     soft (out of focus); the burn carved out of each fog bank keeps the air
     visibly cleared around the arena. */
  const pcx=RM?0:-Math.cos(G.angle)*7*u,pcy=RM?0:-Math.sin(G.angle)*7*u;
  const fogAl=0.36*(1-0.5*Math.min(1,G.dropFx+0.6*G.pay))*(G.tsCur<0.98?0.6:1);
  if(BG&&SPR.starsFar)ctx.drawImage(SPR.starsFar.c,-8+sdx*0.3+camX*0.3,-8+sdy*0.3+camY*0.3,SPR.starsFar.w,SPR.starsFar.h);
  if(BG&&SPR.fogA){
    ctx.globalAlpha=RM?0.4:fogAl;
    ctx.drawImage(SPR.fogA.c,-40+sdx*0.6+camX*0.6,-40+sdy*0.6+camY*0.6,SPR.fogA.w,SPR.fogA.h);
    ctx.globalAlpha=1;
  }
  if(BG&&SPR.starsNear)ctx.drawImage(SPR.starsNear.c,-28+sdx+pcx+camX,-28+sdy+pcy+camY,SPR.starsNear.w,SPR.starsNear.h);
  if(BG&&SPR.fogB&&!RM){
    ctx.globalAlpha=fogAl*0.8;
    ctx.drawImage(SPR.fogB.c,-40+sdx*1.4+pcx*1.6+camX*1.4,-40+sdy*1.4+pcy*1.6+camY*1.4,SPR.fogB.w,SPR.fogB.h);
    ctx.globalAlpha=1;
  }
  ctx.globalCompositeOperation='lighter';
  ctx.fillStyle='#dcebff';
  for(const st of (BG?bgStars:[])){
    /* the bright twinklers glint on the LANDED beat — the only continuously
       animated background element finally agrees with the 104bpm grid the
       rest of the game obeys. Gated on groove so a player who has not found
       the beat is not shown a pulsing sky, and strongest in the payoff. */
    let al=RM?0.4:(0.10+0.55*(0.5+0.5*Math.sin(amb*st.tw+st.ph)));
    /* the glint stays — it is the one background element that agrees with the
       grid — but most of the weight moved to the continuous swell, so the
       field now rises and falls rather than blinking */

    ctx.beginPath();ctx.arc(st.x*W+sdx+pcx+camX,st.y*H+sdy+pcy+camY,st.r,0,TAU);ctx.fill();
  }
  /* DUST MOTES in the lit shell around the arena: each drifts on its own
     orbit outside the outer ring, brightens inside the lamp's shell and
     under the sweep of light that leads the comet, and nods on the landed
     beat during the payoff. 44 tiny blits. */
  if(BG&&SPR.mote){
    const R0=radiusOf(0);
    for(const m of MOTES){
      const a=m.ang+amb*m.sp*0.03;
      const r=Math.max(1.08*R0+16*u,m.rr*R0+6*u*Math.sin(amb*0.4+m.ph));
      const shell=Math.max(0,1-Math.abs(r/R0-1.22)/0.5);
      let al=RM?0.10+0.18*shell
             :(0.05+0.30*shell)*(1+1.6*Math.pow(Math.max(0,Math.cos(a-G.angle)),4));

    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }
  /* hypernova floods the room gold-white — the biggest wash in the game,
     because nothing bigger ever happens to you */
  if(G.hyperGlow>0.01){
    ctx.save();ctx.globalCompositeOperation='lighter';
    ctx.fillStyle='rgba(255,214,122,'+

    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }
  /* overdrive runs the room warm, throbbing on the landed beat */
  if(G.odGlow>0.01){
    ctx.save();ctx.globalCompositeOperation='lighter';
    ctx.fillStyle='rgba(255,170,60,'+
      (RM?0.030*G.odGlow:(0.028+0.045*G.beat)*G.odGlow).toFixed(3)+')';
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }
  ctx.globalAlpha=1;
  /* THE CALM POOL. The whole sky stack dims under the play space — a baked
     feathered darkening behind the ring stack, so the arena sits on a quiet
     near-black stage and every gameplay object wins its contrast back. The
     atmosphere lives in the corners, where eyes rest between moments. */
  if(SPR.pool){
    const pw=SPR.pool.w;
    ctx.drawImage(SPR.pool.c,cx-pw/2,cy-pw/2,pw,pw);
  }

  ctx.save();
  ctx.translate(camX,camY);   /* the world rides the dolly; HUD stays pinned */
  if(G.shake>0)ctx.translate(rand(-G.shake,G.shake)*0.5,rand(-G.shake,G.shake)*0.5);

  /* ORBIT RINGS AS CONDUITS: the baked cross-section (dark channel walls, a
     hot core, a halo) replaces the two wide strokes; current visibly flows
     along each track, fastest and brightest under the player; node pips
     breathe on the landed beat. The crisp 1.3px stroke and the payoff
     recolour still draw over the top. */
  for(let i=0;i<G.nRings;i++){
    const rr=radiusOf(i),on=(G.hopP>=1&&G.ringI===i);
    const tn=RINGS[Math.min(RINGS.length-1,i)].tint;
    if(SPR.ringCh&&SPR.ringCh[i])blit(SPR.ringCh[i],cx,cy,1,0,on?1.0:0.6);
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    const mine=effRing()===i;
    ctx.setLineDash([3*u,17*u]);
    /* the current TICKS rather than slides: one step per sixteenth on the
       player's track (direction matching travel), per eighth elsewhere —
       quantised motion is what makes the whole machine visibly on the beat */
    ctx.lineDashOffset=RM?0:-(Math.floor(G.t/(mine?SPB/4:SPB/2))*5*u*(mine?G.dir:1))%(20*u);
    ctx.strokeStyle='rgb('+tn+')';ctx.lineWidth=2*u;
    ctx.globalAlpha=(mine?0.20:0.08)+0.10*G.pay;
    ctx.beginPath();ctx.arc(cx,cy,rr,0,TAU);ctx.stroke();
    ctx.setLineDash([]);
    if(SPR.pip)for(let k=0;k<8;k++){
      const pp=posAt(k*TAU/8,rr);
      blit(SPR.pip,pp[0],pp[1],1,0,RM?0.14:0.10+(G.groove>0?0.35*G.beat:0));
    }
    ctx.restore();
    /* The arena changes colour for the whole section — static, so it is safe
       under reduced motion. Bright enough to read on a phone now, and
       breathing with the landed beat (the visual half of the pump). */
    if(G.pay>0){
      ctx.globalAlpha=Math.min(1,(on?0.65:0.30)*(RM?1:1+0.35*G.beat));
      ctx.strokeStyle=on?'rgb(196,160,255)':'rgb(170,140,240)';
    }else{
      ctx.strokeStyle='rgba('+tn+','+(on?0.46:0.17)+')';
    }
    ctx.lineWidth=1.3;
    ctx.beginPath();ctx.arc(cx,cy,rr,0,TAU);ctx.stroke();
    ctx.globalAlpha=1;
  }
  /* THE METER IS INVISIBLE NOW (owner: "get rid of the purple build-up
     timer — just have the beat drop incorporated into ideal moments for
     musical impact"). The build economy still runs underneath — playing
     well still brings the drop sooner, and it still latches on a bar
     line — but the fuel-gauge presentation (the violet arc, its white
     armed state, and the payoff drain sweep at the same radius) is gone.
     The drop announces itself the musical way: the shaker leaning in,
     BEAT DROP COMING…, the rise, and the countdown. */
  /* THE ARENA CORE LAMP — the light source the whole scene answers to. It
     breathes on the landed beat and flares when the drop hits; clamped so
     its glow never reaches the innermost lane even at the small-R floor. */
  ctx.globalCompositeOperation='lighter';
  if(SPR.core){
    const S=Math.min(1,radiusOf(G.nRings-1)/(50*u));
    blit(SPR.core,cx,cy,RM?S:S*(1+0.18*G.beat+0.5*G.dropFx),0,
